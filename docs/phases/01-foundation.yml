phase:
  id: "01-foundation"
  title: "Foundation"
  description: "Defines the normative base of the project: why it exists, what problem it addresses, who it serves, what principles guide it, what boundaries constrain it, and how success is understood."
  purpose: "Answer: 'Why does this project exist, for whom, under what principles, with what limits, and with what definition of success?'"
  documents:
    - id: "01-thesis"
      title: "Thesis"
      file: "01-foundation/01-foundation/01-thesis.yml"
      purpose: "The core proposition justifying the project's existence."
    - id: "02-problem"
      title: "Problem"
      file: "01-foundation/01-foundation/02-problem.yml"
      purpose: "The real problem before any solution."
    - id: "03-audience"
      title: "Audience"
      file: "01-foundation/01-foundation/03-audience.yml"
      purpose: "Who the project exists for."
    - id: "04-principles"
      title: "Principles"
      file: "01-foundation/01-foundation/04-principles.yml"
      purpose: "Normative rules that guide future decisions."
    - id: "05-boundaries"
      title: "Boundaries"
      file: "01-foundation/01-foundation/05-boundaries.yml"
      purpose: "What the project is not and does not promise."
    - id: "06-success-definition"
      title: "Success Definition"
      file: "01-foundation/01-foundation/06-success-definition.yml"
      purpose: "How we know if the project is working."
    - id: "07-glossary"
      title: "Glossary"
      file: "01-foundation/01-foundation/07-glossary.yml"
      purpose: "Canonical semantic control for key terms."
