document:
  id: "02-operating-model"
  title: "Operating Model"
  phase: "06-operations"
  status: "not_started"
  purpose: "Define how the project functions day to day, including manual and automated operations."
  centralQuestion: "How does the project function day to day?"
  sections:
    - id: "operating-principles"
      title: "Operating Principles"
      questions:
        - "What principles guide day-to-day operational decisions?"
        - "How are tradeoffs between speed, cost, and quality resolved?"
    - id: "core-operational-functions"
      title: "Core Operational Functions"
      questions:
        - "Which functions must be performed daily, weekly, and monthly?"
        - "Who is accountable for each function?"
    - id: "manual-operations"
      title: "Manual Operations"
      questions:
        - "Which operations require human intervention?"
        - "How are manual steps documented and executed?"
    - id: "automated-operations"
      title: "Automated Operations"
      questions:
        - "Which operations are automated or should be automated?"
        - "What tools, scripts, or platforms run automated operations?"
    - id: "third-party-dependencies"
      title: "Third-Party Dependencies"
      questions:
        - "Which third-party services are critical to daily operations?"
        - "What happens when each dependency is unavailable?"
    - id: "operational-workflows"
      title: "Operational Workflows"
      questions:
        - "What are the standard workflows for recurring operational tasks?"
        - "How are workflows triggered, tracked, and reviewed?"
    - id: "decision-points"
      title: "Decision Points"
      questions:
        - "Which operational decisions require approval?"
        - "Who has the authority to make each category of decision?"
    - id: "escalation-paths"
      title: "Escalation Paths"
      questions:
        - "How do operational issues escalate?"
        - "What is the chain of communication for each escalation level?"
    - id: "operating-constraints"
      title: "Operating Constraints"
      questions:
        - "What budget, tooling, or staffing constraints limit operations?"
        - "What compliance or contractual constraints apply?"
    - id: "operating-model-risks"
      title: "Operating Model Risks"
      questions:
        - "What could cause the operating model to fail?"
        - "How are operating model risks detected and mitigated?"
