document:
  id: "04-research-plan"
  title: "Research Plan"
  phase: "02-validation"
  status: "not_started"
  purpose: "Plan qualitative and contextual evidence gathering through listening and observation."
  centralQuestion: "How will we listen and observe?"
  sections:
    - id: "research-goals"
      title: "Research Goals"
      questions:
        - "What specific questions is this research trying to answer?"
        - "What decisions will this research inform?"
        - "How will research findings be used?"
    - id: "participant-profile"
      title: "Participant Profile"
      questions:
        - "Who will be interviewed or observed?"
        - "What are the inclusion and exclusion criteria for participants?"
        - "How many participants are needed and why?"
    - id: "recruitment-criteria"
      title: "Recruitment Criteria"
      questions:
        - "How will participants be recruited?"
        - "What screening process will be used?"
        - "How will diversity of perspective be ensured?"
    - id: "interview-guide"
      title: "Interview Guide"
      questions:
        - "What questions will be asked?"
        - "What is the interview structure and flow?"
        - "How will follow-up questions be handled?"
        - "What topics must be covered in every interview?"
    - id: "observation-criteria"
      title: "Observation Criteria"
      questions:
        - "What behaviors will be observed?"
        - "What signals indicate success or failure?"
        - "What contextual factors should be noted?"
    - id: "bias-risks"
      title: "Bias Risks"
      questions:
        - "What biases need to be avoided?"
        - "How to avoid only confirming what we already want to believe?"
        - "What techniques will be used to mitigate interviewer bias?"
        - "How will leading questions be identified and removed?"
        - "How will selection bias be addressed?"
    - id: "data-capture-format"
      title: "Data Capture Format"
      questions:
        - "How will data be recorded?"
        - "What format will interview notes use?"
        - "What tools will be used for data capture?"
        - "How will audio, video, or screen recordings be handled?"
    - id: "synthesis-method"
      title: "Synthesis Method"
      questions:
        - "How will data be synthesized into findings?"
        - "What signals should be captured during synthesis?"
        - "How will patterns be identified across participants?"
        - "How will contradictory evidence be handled?"
