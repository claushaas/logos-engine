document:
  id: "01-validation-strategy"
  title: "Validation Strategy"
  phase: "02-validation"
  status: "not_started"
  purpose: "Define what needs to be validated, in what order, and to what standard of evidence."
  centralQuestion: "What needs to be validated, in what order, to what standard?"
  sections:
    - id: "validation-objective"
      title: "Validation Objective"
      questions:
        - "What is the outcome we are trying to validate?"
        - "What does success look like for this validation phase?"
    - id: "validation-scope"
      title: "Validation Scope"
      questions:
        - "What needs to be validated?"
        - "What does not need to be validated now?"
        - "What is explicitly out of scope for this phase?"
    - id: "validation-priorities"
      title: "Validation Priorities"
      questions:
        - "Which risk comes first: problem, audience, solution, willingness to use, willingness to pay?"
        - "What is the priority order for testing assumptions?"
        - "Which validations are prerequisites for others?"
    - id: "evidence-standards"
      title: "Evidence Standards"
      questions:
        - "What level of evidence is sufficient for each type of claim?"
        - "What distinguishes strong evidence from weak evidence?"
        - "When is qualitative evidence enough vs. needing quantitative evidence?"
    - id: "validation-sequence"
      title: "Validation Sequence"
      questions:
        - "In what order will validations be executed?"
        - "What is the dependency chain between validation activities?"
        - "What can be parallelized vs. what must be sequential?"
    - id: "invalidating-conditions"
      title: "Invalidating Conditions"
      questions:
        - "What would prevent the project from advancing?"
        - "What specific results would kill the project?"
        - "What results would trigger a significant pivot?"
    - id: "decision-gates"
      title: "Decision Gates"
      questions:
        - "At what points are go/no-go decisions made?"
        - "Who makes each decision and with what criteria?"
        - "What evidence must be available at each gate?"
