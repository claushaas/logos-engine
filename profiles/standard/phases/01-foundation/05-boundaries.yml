        evaluationHint: "Look for concrete answers addressing: What feature requests would be seductive but misaligned?; What
          growth paths would dilute the core thesis?; What monetization paths would distort the project?."
        sourceQuestions: *a7
        targetSections: &a14
          - "Future Temptations to Resist"
    sufficiency:
      requiredTopicsMustBeCovered: true
      requiredCoverageRatio: 0.8
      maxFollowUps: 3
      allowPartialGeneration: true
    followUpPolicy:
