        sourceQuestions: *a2
        targetSections: &a9
          - "Out of Scope"
      - id: "anti-patterns"
        label: "Anti-Patterns"
        required: true
        description: "Identify solution patterns that would undermine the project's intent, principles, or trust model."
        evaluationHint: "Look for concrete answers addressing: What solution patterns should be actively avoided?; What
          approaches would undermine the project's intent?; Which principles would each anti-pattern violate?."
        sourceQuestions: *a3
        targetSections: &a10
          - "Anti-Patterns"
      - id: "ethical-boundaries"
        label: "Ethical Boundaries"
        required: true
        description: "Define prohibited uses, manipulative behaviors, data patterns, surveillance patterns, and user harms the
          project must not enable."
        evaluationHint: "Look for concrete answers addressing: What uses of the project would be unethical?; What data or
          surveillance patterns are prohibited?; What forms of manipulation, coercion, overreach, or misplaced authority
          must be avoided?."
        sourceQuestions: *a4
        targetSections: &a11
          - "Ethical Boundaries"
      - id: "product-boundaries"
        label: "Product Boundaries"
        required: true
        description: "Specify adjacent products, market segments, product surfaces, and capability expansions that should not be
          pursued without explicit validation."
        evaluationHint: "Look for concrete answers addressing: What market segments are not targeted?; What adjacent products
          should not be built from this codebase?; What product expansions would dilute the core thesis?."
        sourceQuestions: *a5
        targetSections: &a12
          - "Product Boundaries"
      - id: "user-responsibility-boundaries"
        label: "User Responsibility Boundaries"
