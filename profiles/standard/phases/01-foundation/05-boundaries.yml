        evaluationHint: "Look for concrete answers addressing: What decisions remain the user's responsibility?; What will the
          project never automate or decide on behalf of the user?; What may the system suggest but not decide?."
        sourceQuestions: *a6
        targetSections: &a13
          - "User Responsibility Boundaries"
      - id: "future-temptations-to-resist"
        label: "Future Temptations to Resist"
        required: true
