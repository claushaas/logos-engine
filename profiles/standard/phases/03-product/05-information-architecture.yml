        evaluationHint: "Look for concrete answers addressing: What should UI Model inherit from the IA?; What should
          Interaction Model inherit?; What should Content Model inherit?."
        sourceQuestions: *a11
        targetSections: &a22
          - "Downstream Handoff"
    sufficiency:
      requiredTopicsMustBeCovered: true
      requiredCoverageRatio: 0.8
      maxFollowUps: 3
      allowPartialGeneration: true
    followUpPolicy:
      askOnlyAboutMissingTopics: true
      maxMissingTopicsPerFollowUp: 3
      groupRelatedTopics: true
      allowPartialGenerationAfterMaxFollowUps: true
    generationMapping:
      ia-thesis:
        targetSections: *a12
      core-objects:
        targetSections: *a13
      object-relationships:
        targetSections: *a14
      navigation-structure:
        targetSections: *a15
      content-hierarchy:
        targetSections: *a16
      naming-rules:
        targetSections: *a17
      search-and-retrieval:
        targetSections: *a18
      empty-states:
        targetSections: *a19
      information-density-rules:
        targetSections: *a20
      ia-risks:
