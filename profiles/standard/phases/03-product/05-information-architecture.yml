document:
  id: "05-information-architecture"
  title: "Information Architecture"
  phase: "03-product"
  status: "not_started"
  order: 5
  type: "information_architecture"
  purpose: "Define the product's object model, navigation structure, content hierarchy, retrieval model, terminology,
    empty states, density rules, and IA risks so users can understand where they are, what exists, and what they can do
    next."
  centralQuestion: "What objects exist in the product, how do they relate, and how does the user find, understand, and
    move through them?"
  outputs:
    canonical:
      format: "markdown"
      path: "docs/03-product/05-information-architecture.md"
      purpose: "Store the canonical information architecture as a Markdown document."
    artifacts:
      - id: "product.information_architecture_map"
        format: "html"
        path: "outcomes/html/03-product/information-architecture-map.html"
        purpose: "Provide a navigable IA map covering objects, relationships, navigation, hierarchy, naming, search, empty
          states, density rules, risks, and downstream handoff."
        audience: "founder"
        includes:
          - "IA thesis"
          - "core objects"
          - "object relationships"
          - "navigation structure"
          - "content hierarchy"
          - "naming rules"
          - "search and retrieval"
          - "empty states"
          - "information density rules"
          - "IA risks"
          - "downstream handoff"
        generationMode: "regenerate_from_canonical"
    agentPacks:
      - id: "product.information_architecture_review_prompt"
        format: "markdown"
        path: "outcomes/agents/03-product/information-architecture-review-prompt.md"
        purpose: "Provide compact context for agents reviewing whether the information architecture is coherent, navigable,
          scalable, terminologically consistent, and aligned with product scope, journeys, and UX model."
        agentRole: "reviewer"
        includes:
          - "canonical information architecture"
          - "product brief dependency"
          - "product scope dependency"
          - "user journeys dependency"
          - "UX model dependency"
          - "IA formats"
          - "completion criteria"
          - "quality checks"
          - "review rules"
  dependsOn:
    - "01-foundation/03-audience"
    - "01-foundation/05-boundaries"
    - "01-foundation/07-glossary"
    - "02-validation/08-evidence-log"
    - "02-validation/10-validation-report"
    - "03-product/01-product-brief"
    - "03-product/02-scope"
    - "03-product/03-user-journeys"
    - "03-product/04-ux-model"
  feeds:
    - "03-product/06-ui-model"
    - "03-product/07-interaction-model"
    - "03-product/08-content-model"
    - "03-product/09-state-model"
    - "03-product/10-permission-model"
    - "03-product/11-feature-specification"
    - "03-product/13-acceptance-criteria"
    - "04-engineering/01-engineering-brief"
    - "04-engineering/03-data-model"
  inputs:
    - id: "product-brief"
      type: "context"
      required: false
      description: "Product definition, target user, core promise, primary use case, product constraints, and success criteria."
    - id: "product-scope"
      type: "context"
      required: false
      description: "In-scope, out-of-scope, MVP, post-MVP, non-goals, scope boundaries, deferred decisions, and scope governance."
    - id: "user-journeys"
      type: "context"
      required: false
      description: "Primary, secondary, onboarding, first-value, repeat-use, failure, recovery, exit, and re-entry journeys
        that IA must support."
    - id: "ux-model"
      type: "context"
      required: false
      description: "UX thesis, mental model, cognitive load rules, guidance, feedback, trust, and recovery models that shape
        IA decisions."
    - id: "glossary"
      type: "context"
      required: false
      description: "Canonical terminology, aliases, discouraged terms, semantic distinctions, and unresolved terminology issues."
    - id: "ia-notes"
      type: "manual_note"
      required: false
      description: "Candidate objects, relationships, views, navigation ideas, naming issues, search needs, empty state ideas,
        and IA concerns."
  completionCriteria:
    - "The central question is answered through an explicit object model, relationship model, navigation structure,
      content hierarchy, naming system, retrieval model, empty state model, density model, and IA risk assessment."
    - "Every core object includes purpose, user-facing meaning, properties, lifecycle, ownership, visibility,
      permissions relevance, and downstream implications."
    - "Object relationships include cardinality, visibility, lifecycle behavior, deletion/archive behavior, and whether
      the relationship is user-facing or implementation-only."
    - "Navigation structure supports the primary journey, first-value journey, repeat-use journey, recovery, and
      re-entry without relying on hidden knowledge."
    - "Content hierarchy distinguishes primary, secondary, contextual, advanced, hidden, and risk-critical information."
    - "Naming rules align with the Foundation Glossary and avoid overloaded or misleading terminology."
    - "Search and retrieval define browsing, filtering, sorting, lookup, zero-results handling, and result relevance
      expectations."
    - "Empty states distinguish new-user empty, zero-results, permission-empty, error-empty, loading-empty, and
      filtered-empty states where relevant."
    - "Information density rules are specific enough to guide UI Model, Interaction Model, and Feature Specification."
    - "IA risks are concrete enough to become review checks or acceptance criteria."
  qualityChecks:
    - "Avoid vague claims."
    - "Avoid IA theater: elegant object maps that do not support real journeys or decisions."
    - "Avoid naming objects after implementation details when users need conceptual clarity."
    - "Avoid introducing objects, views, or navigation paths outside product scope unless marked deferred or post-MVP."
    - "Avoid hiding critical risk, uncertainty, permissions, ownership, or destructive consequences in low-visibility
      places."
    - "Prefer decision-useful statements."
    - "Make assumptions explicit."
    - "Do not invent user behavior, validated evidence, platform capabilities, data model constraints, or permissions."
    - "Do not move detailed database schema, API design, visual UI, or implementation architecture into this document."
    - "IA must preserve user mental model, product boundaries, and user responsibility boundaries."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
    - "Separate conceptual IA from implementation data model."
    - "Tie IA decisions to Product Brief, Product Scope, User Journeys, UX Model, Glossary, or validation evidence where
      possible."
    - "Classify objects and views as MVP, post-MVP, deferred, excluded, user-facing, system-facing, or
      implementation-only where useful."
    - "State lifecycle and visibility rules for core objects before deriving views or navigation."
    - "Keep this document at IA level; detailed UI components belong in UI Model, interaction mechanics in Interaction
      Model, and storage schema in Engineering Data Model."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with Product Brief, Product Scope, User Journeys, UX Model, Foundation Glossary, or
      Foundation Boundaries."
    - "Flag objects or views not supported by scope, journeys, or explicit assumptions."
    - "Flag relationship rules missing cardinality, lifecycle behavior, or visibility."
    - "Flag navigation structures that break primary, onboarding, first-value, repeat-use, failure, recovery, or
      re-entry journeys."
    - "Flag terminology that conflicts with the Glossary or introduces ambiguous aliases."
    - "Verify that search, empty states, and density rules are sufficient for UI, Interaction, Feature Spec, State
      Model, Permissions, and Acceptance Criteria."
    - "Flag content that belongs better in UI Model, Interaction Model, Content Model, State Model, Permission Model,
      Feature Specification, Engineering Data Model, or Operations."
  specializedFormats:
    objectFormat:
      description: "Recommended format for each core object."
      fields:
        - "id"
        - "name"
        - "userFacingDefinition"
        - "purpose"
        - "classification"
        - "keyProperties"
        - "lifecycleStates"
        - "ownership"
        - "visibility"
        - "permissionsRelevance"
        - "createdBy"
        - "modifiedBy"
        - "archivedOrDeletedBy"
        - "relatedObjects"
        - "evidenceBasis"
        - "downstreamImplications"
        - "openQuestions"
    relationshipFormat:
      description: "Recommended format for object relationships."
      fields:
        - "id"
        - "sourceObject"
        - "targetObject"
        - "relationshipName"
        - "cardinality"
        - "userVisible"
        - "implementationOnly"
        - "lifecycleBehavior"
        - "deletionBehavior"
        - "archiveBehavior"
        - "permissionImplications"
        - "ambiguity"
        - "notes"
    navigationItemFormat:
      description: "Recommended format for navigation items and views."
      fields:
        - "id"
        - "label"
        - "purpose"
        - "entryPoints"
        - "destination"
        - "userGoal"
        - "associatedObjects"
        - "visibleWhen"
        - "hiddenWhen"
        - "emptyState"
        - "risks"
    iaRiskFormat:
      description: "Recommended format for IA risks."
      fields:
        - "risk"
        - "affectedObjectOrView"
        - "riskType"
        - "userImpact"
        - "earlySignal"
        - "mitigation"
        - "targetDocument"
  sections:
    - id: "ia-thesis"
      title: "IA Thesis"
      intent: "State the organizing logic of the product's information architecture and the mental model it reinforces."
      required: true
      outputGuidance:
        - "Open with the core organizing principle of the product's information architecture."
        - "Explain what the IA helps users understand, find, relate, resume, and trust."
        - "Name what the IA must avoid becoming."
      qualityChecks:
        - "The thesis is specific to the product's objects and journeys."
        - "The thesis aligns with the UX mental model."
        - "The thesis guides actual IA decisions rather than sounding like generic structure language."
      questions: &a1
        - "What is the organizing logic of the product's information architecture?"
        - "What mental model does the IA reinforce?"
        - "What should users always be able to understand about where they are and what exists?"
        - "What should the IA make easy to find, resume, compare, or relate?"
        - "What should the IA avoid becoming?"
    - id: "core-objects"
      title: "Core Objects"
      intent: "Identify and describe all primary and supporting objects users create, view, manage, resume, relate, archive,
        or act on."
      required: true
      outputGuidance:
        - "Define objects from the user's conceptual model before implementation details."
        - "Distinguish primary, secondary, system, generated, configuration, and implementation-only objects."
        - "Include lifecycle, ownership, visibility, and downstream implications for each core object."
      qualityChecks:
        - "Each core object has a user-facing meaning and purpose."
        - "Objects are not introduced merely because they are convenient for implementation."
        - "Object lifecycle and visibility are explicit enough to feed State Model and Permission Model."
      questions: &a2
        - "What are the primary objects users create, view, manage, resume, archive, or act on?"
        - "What are the secondary or supporting objects?"
        - "Which objects are user-facing, system-facing, generated, configuration, or implementation-only?"
        - "What is the purpose and user-facing definition of each core object?"
        - "What are the key properties of each core object?"
        - "What is the lifecycle of each core object?"
        - "Who owns, sees, creates, modifies, archives, or deletes each object?"
        - "Which object assumptions remain unresolved?"
    - id: "object-relationships"
      title: "Object Relationships"
      intent: "Define how objects relate, including cardinality, visibility, hierarchy, dependency, containment, references,
        and lifecycle behavior."
      required: true
      outputGuidance:
        - "Describe relationships in user-facing language before implementation relationships."
        - "State cardinality, lifecycle, deletion, archive, and permission implications."
        - "Separate visible relationships from implementation-only relationships."
      qualityChecks:
        - "Relationships are clear enough to guide navigation, state, permissions, and data model work."
        - "Parent-child relationships define deletion and archive behavior."
        - "Implementation-only relationships are not exposed as user concepts without need."
      questions: &a3
        - "How do core objects relate to each other?"
        - "What are the cardinality rules for each relationship?"
        - "Which relationships are hierarchical, referential, contextual, temporal, generated, or dependency-based?"
        - "What happens to related objects when a parent is deleted or archived?"
        - "What relationships are visible to the user versus implementation-only?"
        - "What permission or ownership implications do relationships create?"
        - "What relationship ambiguities need resolution?"
    - id: "navigation-structure"
      title: "Navigation Structure"
      intent: "Define the product's top-level navigation model, movement patterns, orientation cues, entry points, and return
        paths."
      required: true
      outputGuidance:
        - "Design navigation around user goals and journeys, not internal modules alone."
        - "Explain how users enter, move, branch, return, recover, and resume."
        - "Clarify how location, hierarchy, context, and state are communicated."
      qualityChecks:
        - "Navigation supports primary, onboarding, first-value, repeat-use, failure, recovery, and re-entry journeys."
        - "Users can understand where they are and what they can do next."
        - "Navigation does not expose post-MVP or out-of-scope complexity."
      questions: &a4
        - "What is the top-level navigation model?"
        - "How does the user move between objects and views?"
        - "What are the primary entry points into the product?"
        - "What navigation patterns are used: hierarchy, search, recents, related links, tabs, drill-down, command,
          conversation, or another pattern?"
        - "How is the user's current location communicated?"
        - "How does the user return to previous context or resume unfinished work?"
        - "What navigation paths are intentionally blocked, deferred, or hidden?"
    - id: "content-hierarchy"
      title: "Content Hierarchy"
      intent: "Define how content is organized, prioritized, grouped, revealed, hidden, summarized, and escalated within each
        view or object context."
      required: true
      outputGuidance:
        - "Separate primary, secondary, contextual, advanced, hidden, and risk-critical content."
        - "Explain how hierarchy changes by user state, journey state, object state, and content volume."
        - "Identify information that must never be hidden."
      qualityChecks:
        - "Hierarchy supports user decisions and reduces cognitive load."
        - "Critical state, risk, uncertainty, permission, and destructive consequences remain visible when needed."
        - "The hierarchy can handle empty, small, normal, large, and overloaded content volumes."
      questions: &a5
        - "How is content organized within each view or object context?"
        - "What is primary, secondary, contextual, advanced, hidden, or risk-critical content?"
        - "How is content prioritized when space is limited?"
        - "What information must never be hidden?"
        - "How does hierarchy adapt to different content volumes?"
        - "How does hierarchy adapt to user expertise, journey state, or object state?"
        - "What hierarchy decisions should UI Model inherit?"
    - id: "naming-rules"
      title: "Naming Rules"
      intent: "Establish consistent product terminology for objects, actions, states, navigation, errors, permissions, and
        generated content."
      required: true
      outputGuidance:
        - "Use Foundation Glossary terms as the default source of truth."
        - "Define naming patterns for objects, actions, states, permissions, empty states, and generated outputs."
        - "List banned, discouraged, overloaded, or ambiguous terms with replacements."
      qualityChecks:
        - "Naming rules reduce ambiguity rather than adding conceptual ornament."
        - "Product terms do not conflict with Foundation Glossary."
        - "Terms are user-facing unless explicitly marked internal."
      questions: &a6
        - "What consistent terminology is used across the product?"
        - "How are objects, actions, states, permissions, errors, and generated outputs named?"
        - "Which terms come directly from the Foundation Glossary?"
        - "What terms are banned, discouraged, overloaded, or avoided?"
        - "What canonical replacements should be used for discouraged terms?"
        - "How are naming conflicts or ambiguities resolved?"
        - "Which terms remain provisional?"
    - id: "search-and-retrieval"
      title: "Search and Retrieval"
      intent: "Define how users find, filter, sort, browse, recover, resume, and retrieve objects or content."
      required: true
      outputGuidance:
        - "Separate search, browse, filter, sort, recents, saved items, related items, and contextual retrieval."
        - "Define zero-results behavior and recovery options."
        - "Clarify relevance expectations without overpromising search intelligence."
      qualityChecks:
        - "Retrieval supports primary and repeat-use journeys."
        - "Search results are understandable, actionable, and scoped."
        - "Zero-results and no-access states are not confused."
      questions: &a7
        - "How does the user find objects and content?"
        - "What search capabilities are provided?"
        - "What browsing, filtering, sorting, recents, saved, or related-item options exist?"
        - "What is searchable and what is not searchable?"
        - "How are search results ranked, grouped, or presented?"
        - "How are zero-results, no-access, filtered-empty, and error states handled?"
        - "What retrieval assumptions require validation or engineering review?"
    - id: "empty-states"
      title: "Empty States"
      intent: "Define how the product behaves when content, access, results, permissions, data, or state are absent."
      required: true
      outputGuidance:
        - "Distinguish new-user empty states from zero-results, filtered-empty, permission-empty, loading-empty,
          error-empty, and intentionally-empty states."
        - "Connect each empty state to a useful next action or explanation."
        - "Avoid fake positivity when absence indicates risk, error, or missing permission."
      qualityChecks:
        - "Each empty state explains what is absent and what the user can do next."
        - "Empty states do not misrepresent error, loading, or permission problems as normal emptiness."
        - "Tone and action match the user's context and journey state."
      questions: &a8
        - "What does each view look like when there is no content?"
        - "How does the product prompt useful first action in empty states?"
        - "How do new-user empty states differ from zero-results states?"
        - "How do filtered-empty, permission-empty, loading-empty, error-empty, and intentionally-empty states differ?"
        - "What tone is used in each empty state type?"
        - "What should empty states never imply?"
        - "Which empty states should become acceptance criteria?"
    - id: "information-density-rules"
      title: "Information Density Rules"
      intent: "Define how much information is shown at each level, when detail is inline or separate, and how density adapts
        to expertise, device, state, and volume."
      required: true
      outputGuidance:
        - "Define density by hierarchy level, user expertise, journey state, device constraints, and risk."
        - "Use ranges or principles instead of arbitrary item limits unless a hard limit is justified."
        - "Explain when to summarize, collapse, paginate, split, or create a separate view."
      qualityChecks:
        - "Density rules support cognitive load principles from UX Model."
        - "Important risk, state, and permission information is not hidden for density alone."
        - "Hard numeric limits are justified or marked provisional."
      questions: &a9
        - "How much information is shown at each level of the hierarchy?"
        - "When is detail shown inline versus on a separate view?"
        - "When should information be summarized, collapsed, paginated, grouped, or split into a new view?"
        - "How does information density adapt to user expertise?"
        - "How does information density adapt to device, state, or content volume?"
        - "What hard limits, if any, exist per list, view, page, group, or object?"
        - "Which density assumptions are provisional?"
    - id: "ia-risks"
      title: "IA Risks"
      intent: "Identify high-risk IA decisions, including object ambiguity, naming conflicts, scale failures, navigation
        traps, hidden state, permission confusion, and retrieval failure."
      required: true
      outputGuidance:
        - "List risks as concrete failure modes tied to objects, views, navigation, naming, or retrieval."
        - "Include early signals, mitigation, and downstream target documents."
        - "Preserve unresolved IA questions explicitly."
      qualityChecks:
        - "Risks are specific enough to review or test."
        - "Scale, ambiguity, naming, navigation, state, permission, and retrieval risks are considered."
        - "Mitigations are actionable or routed downstream."
      questions: &a10
        - "What information architecture decisions carry the most risk?"
        - "Where is the IA most likely to fail with scale?"
        - "What naming or organizational choices could confuse users?"
        - "Where could hidden state, permission ambiguity, or object ownership confuse users?"
        - "Where could search, retrieval, or navigation fail?"
        - "How will IA decisions be validated?"
        - "Which IA risks should become acceptance criteria or engineering constraints?"
    - id: "downstream-handoff"
      title: "Downstream Handoff"
      intent: "Define what downstream Product and Engineering documents must inherit from the IA and what they must not
        assume."
      required: true
      outputGuidance:
        - "Route IA outputs to the correct downstream documents."
        - "Separate UI, interaction, content, state, permission, feature, acceptance, and engineering data-model
          implications."
        - "Preserve unresolved IA questions and risky assumptions."
      qualityChecks:
        - "Handoff items are concrete and document-targeted."
        - "Downstream documents are not allowed to invent missing IA rules silently."
        - "Object, relationship, lifecycle, naming, retrieval, empty state, and density implications are included."
      questions: &a11
        - "What should UI Model inherit from the IA?"
        - "What should Interaction Model inherit?"
        - "What should Content Model inherit?"
        - "What should State Model and Permission Model inherit?"
        - "What should Feature Specification and Acceptance Criteria inherit?"
        - "What should Engineering Data Model inherit?"
        - "What unresolved IA questions must be carried forward?"
  interview:
    mode: "canonical_question_with_coverage"
    canonicalQuestion: "Explain information architecture. What objects exist in the product, how do they relate, and how
      does the user find, understand, and move through them?"
    expectedAnswerShape:
      style: "freeform_structured"
      allowBullets: true
      allowNarrative: true
      preferredDepth: "medium"
    coverageTopics:
      - id: "ia-thesis"
        label: "IA Thesis"
        required: true
        description: "State the organizing logic of the product's information architecture and the mental model it reinforces."
        evaluationHint: "Look for concrete answers addressing: What is the organizing logic of the product's information
          architecture?; What mental model does the IA reinforce?; What should users always be able to understand about
          where they are and what exists?."
        sourceQuestions: *a1
        targetSections: &a12
          - "IA Thesis"
      - id: "core-objects"
        label: "Core Objects"
        required: true
        description: "Identify and describe all primary and supporting objects users create, view, manage, resume, relate,
          archive, or act on."
        evaluationHint: "Look for concrete answers addressing: What are the primary objects users create, view, manage, resume,
          archive, or act on?; What are the secondary or supporting objects?; Which objects are user-facing,
          system-facing, generated, configuration, or implementation-only?."
        sourceQuestions: *a2
        targetSections: &a13
          - "Core Objects"
      - id: "object-relationships"
        label: "Object Relationships"
        required: true
        description: "Define how objects relate, including cardinality, visibility, hierarchy, dependency, containment,
          references, and lifecycle behavior."
        evaluationHint: "Look for concrete answers addressing: How do core objects relate to each other?; What are the
          cardinality rules for each relationship?; Which relationships are hierarchical, referential, contextual,
          temporal, generated, or dependency-based?."
        sourceQuestions: *a3
        targetSections: &a14
          - "Object Relationships"
      - id: "navigation-structure"
        label: "Navigation Structure"
        required: true
        description: "Define the product's top-level navigation model, movement patterns, orientation cues, entry points, and
          return paths."
        evaluationHint: "Look for concrete answers addressing: What is the top-level navigation model?; How does the user move
          between objects and views?; What are the primary entry points into the product?."
        sourceQuestions: *a4
        targetSections: &a15
          - "Navigation Structure"
      - id: "content-hierarchy"
        label: "Content Hierarchy"
        required: true
        description: "Define how content is organized, prioritized, grouped, revealed, hidden, summarized, and escalated within
          each view or object context."
        evaluationHint: "Look for concrete answers addressing: How is content organized within each view or object context?;
          What is primary, secondary, contextual, advanced, hidden, or risk-critical content?; How is content
          prioritized when space is limited?."
        sourceQuestions: *a5
        targetSections: &a16
          - "Content Hierarchy"
      - id: "naming-rules"
        label: "Naming Rules"
        required: true
        description: "Establish consistent product terminology for objects, actions, states, navigation, errors, permissions,
          and generated content."
        evaluationHint: "Look for concrete answers addressing: What consistent terminology is used across the product?; How are
          objects, actions, states, permissions, errors, and generated outputs named?; Which terms come directly from
          the Foundation Glossary?."
        sourceQuestions: *a6
        targetSections: &a17
          - "Naming Rules"
      - id: "search-and-retrieval"
        label: "Search and Retrieval"
        required: true
        description: "Define how users find, filter, sort, browse, recover, resume, and retrieve objects or content."
        evaluationHint: "Look for concrete answers addressing: How does the user find objects and content?; What search
          capabilities are provided?; What browsing, filtering, sorting, recents, saved, or related-item options
          exist?."
        sourceQuestions: *a7
        targetSections: &a18
          - "Search and Retrieval"
      - id: "empty-states"
        label: "Empty States"
        required: true
        description: "Define how the product behaves when content, access, results, permissions, data, or state are absent."
        evaluationHint: "Look for concrete answers addressing: What does each view look like when there is no content?; How does
          the product prompt useful first action in empty states?; How do new-user empty states differ from zero-results
          states?."
        sourceQuestions: *a8
        targetSections: &a19
          - "Empty States"
      - id: "information-density-rules"
        label: "Information Density Rules"
        required: true
        description: "Define how much information is shown at each level, when detail is inline or separate, and how density
          adapts to expertise, device, state, and volume."
        evaluationHint: "Look for concrete answers addressing: How much information is shown at each level of the hierarchy?;
          When is detail shown inline versus on a separate view?; When should information be summarized, collapsed,
          paginated, grouped, or split into a new view?."
        sourceQuestions: *a9
        targetSections: &a20
          - "Information Density Rules"
      - id: "ia-risks"
        label: "IA Risks"
        required: true
        description: "Identify high-risk IA decisions, including object ambiguity, naming conflicts, scale failures, navigation
          traps, hidden state, permission confusion, and retrieval failure."
        evaluationHint: "Look for concrete answers addressing: What information architecture decisions carry the most risk?;
          Where is the IA most likely to fail with scale?; What naming or organizational choices could confuse users?."
        sourceQuestions: *a10
        targetSections: &a21
          - "IA Risks"
      - id: "downstream-handoff"
        label: "Downstream Handoff"
        required: true
        description: "Define what downstream Product and Engineering documents must inherit from the IA and what they must not
