document:
  id: "04-messaging"
  title: "Messaging"
  phase: "05-go-to-market"
  status: "not_started"
  order: 4
  type: "messaging"
  purpose: "Translate positioning into precise, reusable, channel-aware, audience-aware, proof-aware, and claim-safe messages without distorting the product, overstating evidence, or creating false expectations."
  centralQuestion: "What should we say, to whom, in what context, with what proof, and under what claim boundaries?"
  outputs:
    canonical:
      format: "markdown"
      path: "docs/05-go-to-market/04-messaging.md"
      purpose: "Store the canonical messaging document as a Markdown document."
    artifacts:
      - id: "gtm.messaging_reference"
        format: "html"
        path: "outcomes/html/05-go-to-market/messaging-reference.html"
        purpose: "Provide a founder-facing messaging reference covering core message, message house, one-liners, descriptions, pain/outcome messages, audience variants, channel variants, proof, objections, tone, forbidden claims, examples, and downstream handoff."
        audience: "founder"
        includes:
          - "messaging objective"
          - "message house"
          - "core message"
          - "one-liner"
          - "short description"
          - "long description"
          - "audience message variants"
          - "channel message variants"
          - "pain messages"
          - "outcome messages"
          - "objection responses"
          - "proof points"
          - "claim boundaries"
          - "tone and voice"
          - "message examples"
          - "forbidden claims"
          - "messaging risks"
          - "downstream handoff"
        generationMode: "regenerate_from_canonical"
    agentPacks:
      - id: "gtm.messaging_review_prompt"
        format: "markdown"
        path: "outcomes/agents/05-go-to-market/messaging-review-prompt.md"
        purpose: "Provide compact context for agents reviewing whether messaging is specific, proof-aware, claim-safe, audience-aware, channel-ready, consistent with positioning, and not misleading."
        agentRole: "reviewer"
        includes:
          - "canonical messaging"
          - "positioning dependency"
          - "market definition dependency"
          - "GTM brief dependency"
          - "product dependency"
          - "technical risk dependency"
          - "messaging formats"
          - "completion criteria"
          - "quality checks"
          - "review rules"
  dependsOn:
    - "01-foundation/01-thesis"
    - "01-foundation/02-problem"
    - "01-foundation/03-audience"
    - "01-foundation/04-principles"
    - "01-foundation/05-boundaries"
    - "02-validation/08-evidence-log"
    - "02-validation/05-experiments"
    - "02-validation/10-validation-report"
    - "03-product/01-product-brief"
    - "03-product/03-user-journeys"
    - "03-product/02-scope"
    - "03-product/13-acceptance-criteria"
    - "04-engineering/12-deployment-and-environments"
    - "04-engineering/14-technical-risks"
    - "05-go-to-market/01-go-to-market-brief"
    - "05-go-to-market/02-market-definition"
    - "05-go-to-market/03-positioning"
  feeds:
    - "05-go-to-market/05-channel-strategy"
    - "05-go-to-market/06-launch-plan"
    - "05-go-to-market/07-pricing-and-packaging"
    - "05-go-to-market/08-content-strategy"
    - "05-go-to-market/09-sales-motion"
    - "05-go-to-market/10-partnerships-and-distribution"
    - "05-go-to-market/11-growth-experiments"
    - "05-go-to-market/12-gtm-analytics"
    - "05-go-to-market/13-gtm-risks"
    - "06-operations/07-support-model"
    - "06-operations/10-risk-management"
  inputs:
    - id: "positioning"
      type: "context"
      required: false
      description: "Positioning statement, category frame, target customer context, primary pain, alternatives, differentiated value, proof hierarchy, claim boundaries, messaging pillars, narrative frame, anti-positioning, and positioning risks."
    - id: "market-definition"
      type: "context"
      required: false
      description: "Market category, market boundaries, alternatives, substitute behaviors, comparison lens, maturity, timing, constraints, evidence quality, and market risks."
    - id: "go-to-market-brief"
      type: "context"
      required: false
      description: "GTM objective, market-entry thesis, beachhead segment, primary customer, primary use case, launch strategy, revenue motion, constraints, and GTM risks."
    - id: "product-context"
      type: "context"
      required: false
      description: "Product brief, value proposition, personas, user journeys, product scope, acceptance criteria, current readiness, and unsupported claims."
    - id: "technical-risk-context"
      type: "context"
      required: false
      description: "Deployment readiness, technical limitations, operational constraints, support constraints, known risks, and claims that must not be made."
    - id: "messaging-notes"
      type: "manual_note"
      required: false
      description: "Draft copy, customer phrases, desired tone, phrases to avoid, proof ideas, objection notes, channel-specific copy ideas, launch copy ideas, and unresolved messaging questions."
  completionCriteria:
    - "The central question is answered through message architecture, audience/channel variants, proof, tone, objections, examples, and claim boundaries."
    - "Messaging objective defines what the audience should think, feel, understand, trust, and do after encountering the message."
    - "Message house includes core message, supporting pillars, proof points, emotional frame, functional frame, objections addressed, and claims to avoid."
    - "Core message expresses the single most important market-facing idea in clear, specific, non-misleading language."
    - "One-liner is concise, memorable, and faithful to positioning; it does not overload multiple audiences, categories, or claims."
    - "Short description works for bios/listings and includes audience, problem, value, and proof or category context where useful."
    - "Long description explains product context, target audience, pain, differentiated value, proof, and boundaries without becoming a feature dump."
    - "Audience message variants adapt the core message to primary, secondary, evaluator, buyer, user, supporter, and skeptical audiences where relevant."
    - "Channel message variants adapt the message to website, social, email, launch page, app store/listing, sales, community, paid, partner, and support contexts where relevant."
    - "Pain messages use customer language, name the felt problem, avoid manipulation, and connect to current alternatives/substitute behaviors."
    - "Outcome messages describe the after-state without promising guaranteed, unsupported, universal, medical/legal/financial, or technically untrue outcomes."
    - "Objection responses address top objections with honest answers, proof, boundary-setting, and escalation to support/sales/product when needed."
    - "Proof points map claims to evidence strength and indicate which proof is public-ready, internal-only, provisional, weak, missing, or review-needed."
    - "Claim boundaries translate Positioning claim boundaries into messaging rules: allowed claims, provisional claims, prohibited claims, context-specific claims, and review-needed claims."
    - "Tone and voice define practical voice rules, emotional register, vocabulary, sentence style, prohibited tone, examples, and channel adjustments."
    - "Message examples provide safe examples for key contexts without pretending they are final campaign copy when not requested."
    - "Forbidden claims include untrue, unproven, misleading, overbroad, technically unsupported, legally risky, ethically misaligned, or support-heavy claims."
    - "Messaging risks are concrete, source-linked, impact-aware, and routed to downstream GTM or Operations documents."
    - "Downstream handoff clarifies what Channel Strategy, Launch, Pricing, Content, Sales, Partnerships, Experiments, Analytics, GTM Risks, Support, and Operations must inherit."
  qualityChecks:
    - "Avoid vague claims."
    - "Avoid messaging theater: catchy copy without audience, pain, outcome, proof, claim boundary, context, or downstream use."
    - "Avoid generic AI/product language such as smarter, effortless, revolutionary, all-in-one, seamless, magical, or game-changing unless evidence and claim boundaries support it."
    - "Avoid turning messaging into final campaign copy when strategic message architecture is still unresolved."
    - "Avoid overpromising results, certainty, speed, ease, automation, support, compliance, security, privacy, revenue, health, financial outcomes, or technical capability."
    - "Avoid pain amplification that manipulates fear or shame instead of accurately naming the customer problem."
    - "Avoid outcome language that implies guaranteed transformation."
    - "Avoid inconsistent terminology across Positioning, Market Definition, Product, and Foundation."
    - "Avoid unsupported proof, fake testimonials, invented metrics, unverifiable quotes, or vague social proof."
    - "Prefer decision-useful statements."
    - "Make assumptions explicit."
    - "Do not invent customer quotes, metrics, proof points, compliance status, launch readiness, product capabilities, or technical guarantees."
    - "Messaging must preserve Foundation principles, validated customer language, market/category context, positioning claim boundaries, product truth, technical truth, and support capacity."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
    - "Separate strategic message, draft copy, evidence, assumption, claim, proof, boundary, audience variant, channel variant, and risk."
    - "Tie messages to Positioning, Market Definition, Customer Discovery, Product, Acceptance Criteria, Technical Risks, GTM Brief, or Decision Record where possible."
    - "Classify messages and claims as approved, draft, provisional, proof-needed, channel-specific, audience-specific, prohibited, review-needed, or rejected where useful."
    - "State where each message may be used and where it must not be used."
    - "Route detailed content calendar, landing page copy, sales scripts, launch copy, partner pitch, paid ads, email sequences, analytics instrumentation, and support macros to downstream GTM/Operations documents."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with Foundation, Validation, Product, Acceptance Criteria, Deployment, Technical Risks, GTM Brief, Market Definition, Positioning, or Decision Record."
    - "Flag messages that lack target audience, customer context, value, proof, or allowed use."
    - "Flag claims that exceed product readiness, evidence, technical truth, legal/compliance certainty, support capacity, or Positioning claim boundaries."
    - "Flag one-liners or descriptions that are too broad, jargon-heavy, generic, misleading, or category-confusing."
    - "Flag pain messages that are manipulative, vague, shame-based, or not grounded in customer evidence."
    - "Flag outcome messages that imply guaranteed transformation or unsupported performance."
    - "Flag objection responses that dodge the objection, overpromise, or contradict product constraints."
    - "Flag proof points without source, strength, limitation, and allowed use."
    - "Verify that downstream GTM documents receive concrete messaging handoff inputs."
    - "Flag content that belongs better in Positioning, Content Strategy, Launch Plan, Channel Strategy, Sales Motion, Partnerships, Pricing, Experiments, Analytics, GTM Risks, Support Model, or Operations."
  specializedFormats:
    messageFormat:
      description: "Recommended format for reusable message units."
      fields:
        - id
        - message
        - messageType
        - targetAudience
        - intendedUse
        - customerPain
        - valuePromise
        - proofRequired
        - claimBoundary
        - allowedChannels
        - prohibitedChannels
        - status
    messageHouseFormat:
      description: "Recommended format for message house elements."
      fields:
        - coreMessage
        - pillar
        - customerPain
        - valuePromise
        - supportingProof
        - objectionAddressed
        - emotionalFrame
        - functionalFrame
        - claimsToAvoid
        - downstreamUse
    descriptionFormat:
      description: "Recommended format for product descriptions."
      fields:
        - descriptionType
        - copy
        - wordOrLengthTarget
        - targetAudience
        - intendedUse
        - includedClaims
        - proofUsed
        - claimsExcluded
        - status
    objectionResponseFormat:
      description: "Recommended format for objection responses."
      fields:
        - objection
        - sourceOrAudience
        - underlyingConcern
        - honestResponse
        - proofOrEvidence
        - boundaryOrCaveat
        - escalationPath
        - downstreamUse
        - status
    proofPointFormat:
      description: "Recommended format for messaging proof points."
      fields:
        - proofPoint
        - supportsClaim
        - proofType
        - source
        - strength
        - limitation
        - publicUseAllowed
        - internalUseOnly
        - reviewNeeded
        - status
    voiceRuleFormat:
      description: "Recommended format for tone and voice rules."
      fields:
        - rule
        - rationale
        - preferredPattern
        - avoidPattern
        - examples
        - appliesToChannels
        - exception
        - status
    forbiddenClaimFormat:
      description: "Recommended format for forbidden claims."
      fields:
        - claim
        - reasonForbidden
        - riskType
        - saferAlternative
        - evidenceRequiredToRevisit
        - ownerOrReviewer
        - downstreamImplication
        - status
    messagingRiskFormat:
      description: "Recommended format for messaging risks."
      fields:
        - risk
        - riskType
        - source
        - likelihood
        - impact
        - earlySignal
        - mitigation
        - downstreamDocument
        - launchImpact
  sections:
    - id: "messaging-objective"
      title: "Messaging Objective"
      intent: "Define what the target audience should think, feel, understand, trust, and do after encountering the message."
      required: true
      outputGuidance:
        - "State the primary communication outcome."
        - "Separate cognitive, emotional, trust, and behavioral outcomes."
        - "Tie the objective to GTM Brief and Positioning."
      qualityChecks:
        - "Objective is specific enough to evaluate message quality."
        - "Objective does not try to make messaging do every GTM job at once."
        - "Objective is realistic for product readiness and proof level."
      questions:
        - "What should the audience think after encountering the message?"
        - "What should the audience feel?"
        - "What should the audience understand?"
        - "What should the audience trust?"
        - "What should the audience do next?"
        - "What should messaging intentionally not try to do yet?"
    - id: "message-house"
      title: "Message House"
      intent: "Define the core message architecture: core message, pillars, proof, emotional frame, functional frame, objections addressed, and claims to avoid."
      required: true
      outputGuidance:
        - "Use the message house format where useful."
        - "Limit pillars to a small set that can guide downstream content and launch copy."
        - "Tie each pillar to proof and claim boundaries."
      qualityChecks:
        - "Message house is coherent and not a list of unrelated slogans."
        - "Every pillar connects pain, value, and proof."
        - "Claims to avoid are visible."
      questions:
        - "What is the message house?"
        - "What is the core message?"
        - "What are the supporting pillars?"
        - "What proof supports each pillar?"
        - "What emotional and functional frames should the message use?"
        - "What objections does each pillar address?"
        - "What claims must each pillar avoid?"
    - id: "core-message"
      title: "Core Message"
      intent: "Craft the single most important market-facing idea the audience must hear."
      required: true
      outputGuidance:
        - "Write one primary core message."
        - "Optionally include alternatives only if they reflect materially different strategic directions."
        - "State allowed use and claim boundary."
      qualityChecks:
        - "Core message is specific, clear, and faithful to Positioning."
        - "Core message does not mix too many audiences or value propositions."
        - "Core message does not overclaim."
      questions:
        - "What is the single most important sentence the market must hear?"
        - "Who is it for?"
        - "What pain or outcome does it center?"
        - "What proof or belief supports it?"
        - "Where may this message be used?"
        - "Where should it not be used?"
    - id: "one-liner"
      title: "One-liner"
      intent: "Write the shortest faithful product description for quick recall and lightweight contexts."
      required: true
      outputGuidance:
        - "Target 10–15 words unless the product requires slightly more clarity."
        - "Prefer clarity over cleverness."
        - "Avoid unsupported superlatives and vague category language."
      qualityChecks:
        - "One-liner identifies audience or product context where needed."
        - "One-liner is not generic."
        - "One-liner is consistent with claim boundaries."
      questions:
        - "What is the 10–15 word description?"
        - "What must it include to remain clear?"
        - "What must it avoid to remain true?"
        - "Where will this one-liner be used?"
    - id: "short-description"
      title: "Short Description"
      intent: "Write the 2–3 sentence description for listings, bios, short launch pages, profiles, and compact introductions."
      required: true
      outputGuidance:
        - "Include audience, problem, value, and relevant proof or boundary."
        - "Keep it concise enough for public-facing contexts."
        - "State variants if different contexts require them."
      qualityChecks:
        - "Short description is usable without extra explanation."
        - "Short description does not become a feature list."
        - "Short description respects product readiness."
      questions:
        - "What is the 2–3 sentence description for listings and bios?"
        - "What audience and problem should it mention?"
        - "What value promise should it include?"
        - "What proof or caveat should it include or avoid?"
        - "What contexts need variants?"
    - id: "long-description"
      title: "Long Description"
      intent: "Write the paragraph-level product description for website, launch, investor/founder context, long-form profiles, or product overviews."
      required: true
      outputGuidance:
        - "Explain audience, problem, alternative, differentiated value, product role, proof, and claim boundaries."
        - "Keep paragraph-level, not a full landing page."
        - "Avoid feature-dump structure."
      qualityChecks:
        - "Long description explains the product clearly and credibly."
        - "Description includes enough context for a new reader."
        - "Description avoids unsupported claims and category confusion."
      questions:
        - "What is the full paragraph-level description?"
        - "What product context does a new reader need?"
        - "What customer pain and alternative should it name?"
        - "What differentiated value should it explain?"
        - "What proof or caveat should it include?"
    - id: "audience-message-variants"
      title: "Audience Message Variants"
      intent: "Adapt the core message to different audiences without fragmenting positioning."
      required: true
      outputGuidance:
        - "Use message records for important audience variants."
        - "Cover primary customer first; add buyer, user, evaluator, influencer, skeptical, technical, or partner variants only where relevant."
        - "Keep variants consistent with core positioning."
      qualityChecks:
        - "Variants adapt emphasis, not truth."
        - "Each variant identifies intended audience and allowed use."
        - "Variants do not create contradictory promises."
      questions:
        - "What message should the primary customer hear?"
        - "What changes for buyers, users, evaluators, influencers, partners, or skeptics?"
        - "What pain or outcome should each audience variant emphasize?"
        - "What proof does each audience need?"
        - "What claims should each audience variant avoid?"
    - id: "channel-message-variants"
      title: "Channel Message Variants"
      intent: "Adapt messaging to channels while preserving the same positioning and claim boundaries."
      required: true
      outputGuidance:
        - "Use message records for important channel variants."
        - "Cover only channels relevant to the GTM strategy."
        - "State channel-specific constraints and proof needs."
      qualityChecks:
        - "Channel variants preserve strategic consistency."
        - "Variants are appropriate to channel context and audience intent."
        - "Short-form channels do not remove necessary claim boundaries."
      questions:
        - "What message should be used on the website?"
        - "What message should be used in social channels?"
        - "What message should be used in email?"
        - "What message should be used in launch pages or listings?"
        - "What message should be used in sales or partner contexts?"
        - "What channel-specific claims or tones must be avoided?"
    - id: "pain-messages"
      title: "Pain Messages"
      intent: "Craft messages that speak directly to the customer's felt problem without manipulation or exaggeration."
      required: true
      outputGuidance:
        - "Use customer language when available."
        - "Connect pain to current alternatives and substitute behaviors."
        - "Avoid shame, fear amplification, or unsupported severity."
      qualityChecks:
        - "Pain messages are specific and grounded in customer context."
        - "Pain messages do not exaggerate or manipulate."
        - "Pain messages connect to a credible product value."
      questions:
        - "What messages speak directly to the problem the customer feels?"
        - "What customer language should be preserved?"
        - "What current alternative or coping mechanism should be named?"
        - "What pain framing would be too dramatic or misleading?"
    - id: "outcome-messages"
      title: "Outcome Messages"
      intent: "Craft messages that describe the desired after-state while staying within proof and claim boundaries."
      required: true
      outputGuidance:
        - "Describe outcomes as enabled, supported, clarified, improved, or made easier only when supported."
        - "Avoid guarantees unless explicitly proven and appropriate."
        - "Tie outcome to product role and customer agency."
      qualityChecks:
        - "Outcome messages are credible and not absolute."
        - "Outcome messages do not imply guaranteed transformation."
        - "Outcome messages remain connected to specific use case and audience."
      questions:
        - "What messages describe the after-state?"
        - "What outcome can be credibly promised?"
        - "What outcome should be framed as enabled or supported rather than guaranteed?"
        - "What outcome claims are too broad or unsupported?"
    - id: "objection-responses"
      title: "Objection Responses"
      intent: "Prepare honest responses to likely objections, concerns, skepticism, and comparison questions."
      required: true
      outputGuidance:
        - "Use objection response records for material objections."
        - "Include underlying concern, honest response, proof, caveat, and escalation path."
        - "Do not dodge real limitations."
      qualityChecks:
        - "Responses answer the real concern."
        - "Responses do not overpromise to neutralize objections."
        - "Limitations are acknowledged where necessary."
      questions:
        - "What are the top objections?"
        - "What concern sits underneath each objection?"
        - "What is the honest response?"
        - "What proof supports the response?"
        - "What caveat or boundary must be stated?"
        - "When should the objection be escalated to support, sales, product, or founder review?"
    - id: "proof-points"
      title: "Proof Points"
      intent: "Gather and classify facts, customer signals, quotes, numbers, demos, product capabilities, and technical/design choices that can support messaging."
      required: true
      outputGuidance:
        - "Use proof point records for material proof."
        - "Classify proof by strength and allowed use."
        - "Do not invent quotes, numbers, or customer results."
      qualityChecks:
        - "Every proof point maps to a claim."
        - "Proof strength and limitation are explicit."
        - "Public-use permission or review need is clear."
      questions:
        - "What facts, quotes, numbers, demos, product capabilities, design choices, or validation signals back the messaging?"
        - "Which claims does each proof point support?"
        - "How strong is each proof point?"
        - "What limitations apply?"
        - "Which proof can be used publicly?"
        - "Which proof is internal-only, provisional, missing, or review-needed?"
    - id: "claim-boundaries"
      title: "Claim Boundaries"
      intent: "Translate positioning claim boundaries into concrete messaging rules."
      required: true
      outputGuidance:
        - "Use claim and forbidden-claim records where useful."
        - "Separate allowed, provisional, context-specific, review-needed, and prohibited claims."
        - "Tie boundaries to evidence, product readiness, technical truth, legal/compliance uncertainty, and support capacity."
      qualityChecks:
        - "Claim boundaries are concrete enough for writers and reviewers."
        - "No downstream document needs to infer what is safe to say."
        - "Review-needed claims are not treated as approved."
      questions:
        - "What claims are approved for use?"
        - "What claims are provisional?"
        - "What claims require review?"
        - "What claims are context-specific?"
        - "What claims are prohibited?"
        - "What evidence or readiness milestone would change a claim boundary?"
    - id: "tone-and-voice"
      title: "Tone and Voice"
      intent: "Define brand voice, emotional register, vocabulary, sentence style, rhythm, prohibited tone, and channel-specific tone adjustments."
      required: true
      outputGuidance:
        - "Use voice rule records for practical rules."
        - "Define preferred and avoided patterns with examples."
        - "Tie voice to Foundation principles and Positioning."
      qualityChecks:
        - "Voice rules are concrete enough to guide copy."
        - "Tone supports trust and product truth."
        - "Voice does not become generic brand adjectives only."
      questions:
        - "What is the brand voice?"
        - "What emotional register does the messaging use?"
        - "What vocabulary should be preferred?"
        - "What vocabulary should be avoided?"
        - "What sentence style and rhythm fit the brand?"
        - "How should tone change by channel without changing truth?"
    - id: "message-examples"
      title: "Message Examples"
      intent: "Provide safe example messages for key contexts so downstream execution has concrete starting points."
      required: true
      outputGuidance:
        - "Provide examples only for approved or clearly provisional contexts."
        - "Label examples as draft, approved, or review-needed."
        - "Include where the example may be used."
      qualityChecks:
        - "Examples follow the message house and claim boundaries."
        - "Examples are not mistaken for final campaign copy unless explicitly approved."
        - "Examples are channel-aware where relevant."
      questions:
        - "What safe example messages should be used as starting points?"
        - "Which examples are approved, draft, provisional, or review-needed?"
        - "Where may each example be used?"
        - "What examples should downstream writers avoid?"
    - id: "forbidden-claims"
      title: "Forbidden Claims"
      intent: "Define what must never be said because it is untrue, unproven, misleading, technically unsupported, ethically misaligned, legally risky, or operationally unsafe."
      required: true
      outputGuidance:
        - "Use forbidden claim records for material prohibited claims."
        - "Explain why each claim is forbidden and provide safer alternatives where useful."
        - "Tie forbidden claims to Positioning, Product, Technical Risks, Security/Privacy, or Foundation boundaries."
      qualityChecks:
        - "Forbidden claims are specific and actionable."
        - "Safer alternatives do not become softer versions of the same overclaim."
        - "Review path is clear if evidence changes."
      questions:
        - "What must never be said about the product?"
        - "What claims are untrue, unproven, misleading, technically unsupported, ethically misaligned, legally risky, or operationally unsafe?"
        - "Why is each claim forbidden?"
        - "What safer alternative may be used, if any?"
        - "What evidence would be required to revisit the claim?"
    - id: "messaging-risks"
      title: "Messaging Risks"
      intent: "Identify risks that messaging is unclear, generic, misleading, overpromising, unsupported, off-brand, channel-inappropriate, or operationally dangerous."
      required: true
      outputGuidance:
        - "Use messaging risk records for material risks."
        - "Include early signal, mitigation, launch impact, and downstream document."
        - "Treat overclaiming and unclear category language as first-class risks."
      qualityChecks:
        - "Risks are concrete and monitorable."
        - "Risks include customer misunderstanding and internal misuse."
        - "Mitigations are actionable or routed downstream."
      questions:
        - "What are the biggest messaging risks?"
        - "Where could messaging be misunderstood?"
        - "Where could messaging sound generic or unbelievable?"
        - "Where could messaging overpromise or mislead?"
        - "Where could messaging create support, sales, product, legal, ethical, or reputational risk?"
        - "What early signals show messaging is not working?"
        - "What mitigations or downstream reviews are required?"
    - id: "downstream-handoff"
      title: "Downstream Handoff"
      intent: "Define what downstream GTM and Operations documents must inherit from Messaging and what they must not assume."
      required: true
      outputGuidance:
        - "Route messaging outputs to the correct downstream documents."
        - "Separate channel, launch, pricing, content, sales, partnerships, experiments, analytics, GTM risk, support, and operations implications."
        - "Preserve unresolved messaging questions and claim restrictions."
      qualityChecks:
        - "Handoff items are concrete and document-targeted."
        - "Downstream documents are not allowed to invent missing messaging assumptions silently."
        - "Messaging architecture and downstream copy execution remain distinct."
      questions:
        - "What should Channel Strategy inherit?"
        - "What should Launch Plan inherit?"
        - "What should Pricing and Packaging inherit?"
        - "What should Content Strategy inherit?"
        - "What should Sales Motion and Partnerships inherit?"
        - "What should Growth Experiments and GTM Analytics inherit?"
        - "What should GTM Risks, Support Model, and Risk Management inherit?"
        - "What unresolved messaging questions must be carried forward?"
