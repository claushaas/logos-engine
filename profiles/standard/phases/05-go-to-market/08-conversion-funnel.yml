        - "What must GTM Analytics inherit?"
    - id: "funnel-risks"
      title: "Funnel Risks"
      intent: "Identify risks that the funnel is misdefined, unmeasurable, misleading, privacy-unsafe, over-optimized, or disconnected from real customer value."
      required: true
      outputGuidance:
