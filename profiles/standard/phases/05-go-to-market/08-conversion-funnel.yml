        - "What stage does each experiment target?"
        - "What hypothesis does each experiment test?"
        - "What changes: message, channel, offer, onboarding, CTA, form, pricing, proof, or support?"
        - "What metric and threshold determine success or failure?"
        - "What is the next decision after the experiment?"
    - id: "instrumentation-ownership"
