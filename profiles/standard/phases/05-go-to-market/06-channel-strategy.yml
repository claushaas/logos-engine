document:
  id: "06-channel-strategy"
  title: "Channel Strategy"
  phase: "05-go-to-market"
  status: "not_started"
  order: 6
  type: "channel_strategy"
  purpose: "Define how the product reaches qualified customers through focused, segment-aligned, message-consistent,
    testable, measurable, and operationally sustainable channels."
  centralQuestion: "Which channels can credibly reach the right customers first, why should they work, how will they be
    tested, and what happens if they fail?"
  outputs:
    canonical:
      format: "markdown"
      path: "docs/05-go-to-market/06-channel-strategy.md"
      purpose: "Store the canonical channel strategy as a Markdown document."
    artifacts:
      - id: "gtm.channel_strategy_map"
        format: "html"
        path: "outcomes/html/05-go-to-market/channel-strategy-map.html"
        purpose: "Provide a founder-facing channel strategy map covering channel thesis, primary channel, secondary channels,
          segment fit, channel roles, assets, economics, experiments, constraints, fallbacks, risks, metrics, and
          downstream handoff."
        audience: "founder"
        includes:
          - "channel objective"
          - "channel thesis"
          - "channel taxonomy"
          - "primary channel"
          - "secondary channels"
          - "organic channels"
          - "paid channels"
          - "community channels"
          - "partnership channels"
          - "sales channels"
          - "marketplace channels"
          - "segment-channel fit"
          - "message-channel fit"
          - "channel assets"
          - "channel economics"
          - "channel experiments"
          - "channel metrics"
          - "channel constraints"
          - "fallback strategy"
          - "channel risks"
          - "downstream handoff"
        generationMode: "regenerate_from_canonical"
    agentPacks:
      - id: "gtm.channel_strategy_review_prompt"
        format: "markdown"
        path: "outcomes/agents/05-go-to-market/channel-strategy-review-prompt.md"
        purpose: "Provide compact context for agents reviewing whether channel strategy is focused, segment-aligned,
          message-safe, testable, measurable, asset-aware, capacity-aware, and realistic for launch."
        agentRole: "reviewer"
        includes:
          - "canonical channel strategy"
          - "GTM brief dependency"
          - "market definition dependency"
          - "positioning dependency"
          - "messaging dependency"
          - "customer segments dependency"
          - "channel formats"
          - "completion criteria"
          - "quality checks"
          - "review rules"
  dependsOn:
    - "01-foundation/01-thesis"
    - "01-foundation/03-audience"
    - "01-foundation/04-principles"
    - "01-foundation/05-boundaries"
    - "02-validation/04-research-plan"
    - "02-validation/08-evidence-log"
    - "02-validation/05-experiments"
    - "02-validation/10-validation-report"
    - "03-product/03-user-journeys"
    - "03-product/01-product-brief"
    - "03-product/02-scope"
    - "03-product/13-acceptance-criteria"
    - "04-engineering/12-deployment-and-environments"
    - "04-engineering/14-technical-risks"
    - "05-go-to-market/01-go-to-market-brief"
    - "05-go-to-market/02-market-definition"
    - "05-go-to-market/03-positioning"
    - "05-go-to-market/04-messaging"
    - "05-go-to-market/05-customer-segments"
  feeds:
    - "05-go-to-market/07-launch-plan"
    - "05-go-to-market/08-pricing-and-packaging"
    - "05-go-to-market/09-content-strategy"
    - "05-go-to-market/10-sales-motion"
    - "05-go-to-market/11-partnerships-and-distribution"
    - "05-go-to-market/12-growth-experiments"
    - "05-go-to-market/13-gtm-analytics"
    - "05-go-to-market/14-gtm-risks"
    - "06-operations/02-operating-model"
    - "06-operations/06-release-management"
    - "06-operations/07-support-model"
    - "06-operations/10-risk-management"
  inputs:
    - id: "go-to-market-brief"
      type: "context"
      required: false
      description: "GTM objective, market-entry thesis, beachhead segment, channel thesis, launch strategy, revenue motion,
        constraints, and GTM risks."
    - id: "market-definition"
      type: "context"
      required: false
      description: "Market category, alternatives, substitute behaviors, comparison lens, maturity, timing, constraints,
        evidence quality, and market risks."
    - id: "positioning"
      type: "context"
      required: false
      description: "Positioning statement, category frame, target customer, primary pain, alternatives, differentiated value,
        proof hierarchy, claim boundaries, messaging pillars, and anti-positioning."
    - id: "messaging"
      type: "context"
      required: false
      description: "Core message, message house, audience variants, channel variants, proof points, objection responses, claim
        boundaries, tone, and forbidden claims."
    - id: "customer-segments"
      type: "context"
      required: false
      description: "ICP, primary segment, secondary segments, early adopters, role map, qualification/disqualification
        signals, segment-specific messaging, segment-specific channels, exclusions, expansion triggers, and segment
        risks."
    - id: "product-readiness"
      type: "context"
      required: false
      description: "Product scope, acceptance criteria, launchable capabilities, onboarding needs, support constraints, and
        current limitations affecting channel promises."
    - id: "technical-risk-context"
      type: "context"
      required: false
      description: "Deployment readiness, technical limitations, unsupported capabilities, operational risks, scalability
        constraints, and claims/channels that may create risk."
    - id: "channel-notes"
      type: "manual_note"
      required: false
      description: "Candidate channels, founder distribution assets, owned audience, community access, paid channel
        assumptions, partnership ideas, marketplace ideas, sales channel notes, cost constraints, and unresolved channel
        questions."
  completionCriteria:
    - "The central question is answered through a focused, testable channel strategy with primary channel, supporting
      channels, segment fit, message fit, experiments, metrics, constraints, fallbacks, risks, and downstream handoff."
    - "Channel objective defines what channels must achieve first: validation, waitlist, acquisition, activation,
      revenue, community, awareness, sales pipeline, retention learning, or another explicit outcome."
    - "Channel thesis explains why the selected channel mix can reach the primary segment now and what must be true for
      channels to become repeatable."
    - "Channel taxonomy distinguishes owned, earned, paid, community, sales, partner, marketplace, referral,
      product-led, content-led, event-led, outbound, and support-led channels where relevant."
    - "Primary channel identifies one main channel for the first GTM motion, with rationale, segment fit, message fit,
      asset requirements, cost/capacity implications, experiment plan, success metric, failure signal, and fallback."
    - "Secondary channels are explicitly supportive and do not dilute focus; each has a role such as amplification,
      credibility, nurture, conversion, feedback, referral, retention, or proof generation."
    - "Organic channels include SEO, content, social, community, GitHub/open-source, referrals, email/newsletter,
      word-of-mouth, founder audience, and other relevant unpaid channels with realistic ramp assumptions."
    - "Paid channels are treated as tests unless validated; each includes audience fit, budget constraint, conversion
      path, creative/message fit, measurement plan, scaling condition, and stop condition."
    - "Community channels include community fit, participation ethics, contribution plan, non-promotional value, trust
      bar, moderator/platform rules, and reputation risk."
    - "Partnership channels include partner types, fit criteria, mutual value, distribution mechanism, activation
      requirements, proof needed, commercial model, operational burden, and risks."
    - "Sales channels include direct, founder-led, outbound, inbound, consultative, marketplace-assisted,
      app-store-assisted, reseller, or partner-led sales where relevant, with motion and handoff implications."
    - "Marketplace/app-store channels include listing strategy, ranking/discovery assumptions, review dynamics, platform
      rules, approval constraints, asset requirements, analytics limitations, and support implications where relevant."
    - "Segment-channel fit maps each material segment to plausible channels, reachability logic, required assets,
      validation signal, and cost/support risk."
    - "Message-channel fit maps which messages can safely be used in each channel, what proof is required, what claims
      are prohibited, and how tone must adapt."
    - "Channel assets define required landing pages, content, posts, email sequences, demos, videos, docs, lead magnets,
      open-source artifacts, case studies, proof assets, sales collateral, partner materials, and tracking links."
    - "Channel economics define expected effort, budget, CAC hypothesis if relevant, conversion assumptions,
      time-to-signal, scalability, capacity limits, and opportunity cost without inventing precision."
    - "Channel experiments define hypothesis, target segment, channel, message, asset, sample/reach target, timeframe,
      success threshold, failure threshold, instrumentation, owner, and next decision."
    - "Channel metrics define leading indicators, lagging indicators, diagnostic metrics, quality metrics, conversion
      metrics, cost metrics, and decision thresholds."
    - "Channel constraints include budget, team capacity, time, brand/ethics, platform rules, compliance/legal review,
      product readiness, support capacity, technical readiness, and measurement limitations."
    - "Fallback strategy defines what happens if the primary channel underperforms, including iteration path, alternate
      channel, narrower segment, messaging adjustment, offer adjustment, or launch pause."
    - "Channel risks are concrete, source-linked, impact-aware, and routed to downstream GTM or Operations documents."
    - "Downstream handoff clarifies what Launch, Pricing, Content, Sales, Partnerships, Experiments, Analytics, GTM
      Risks, Support, Release, and Operations must inherit."
  qualityChecks:
    - "Avoid vague claims."
    - "Avoid channel theater: channel lists without segment fit, message fit, asset requirements, experiment design,
      metrics, cost/capacity implications, constraints, or fallback."
    - "Avoid running many channels before validating a primary channel."
    - "Avoid assuming channels are free because they are organic; time, trust, content, community participation, and
      support load are real costs."
    - "Avoid paid acquisition assumptions without conversion path, tracking plan, budget constraint, stop condition, and
      scaling condition."
    - "Avoid community spam, extractive promotion, or participation plans that violate community norms."
    - "Avoid partnership assumptions without mutual value, activation path, operational owner, and distribution
      mechanism."
    - "Avoid channels that target segments Product, Engineering, Acceptance Criteria, Deployment, Technical Risks, or
      Support cannot serve truthfully."
    - "Avoid using messages in channels where claim boundaries, proof level, or tone do not fit."
    - "Avoid channel metrics that measure reach only while ignoring quality, fit, activation, conversion, and learning."
    - "Prefer decision-useful statements."
    - "Make assumptions explicit."
    - "Do not invent traffic numbers, CAC, conversion rates, community access, paid channel performance, partner
      willingness, marketplace ranking, or channel scalability."
    - "Channel strategy must preserve Foundation boundaries, segment focus, positioning, messaging claim boundaries,
      product truth, technical truth, support capacity, and operational sustainability."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
    - "Separate channel decision, hypothesis, evidence, assumption, asset, experiment, metric, constraint, fallback, and
      risk."
    - "Tie channel claims to GTM Brief, Market Definition, Positioning, Messaging, Customer Segments, Product,
      Acceptance Criteria, Technical Risks, or Decision Record where possible."
    - "Classify channels as primary, secondary, supportive, experimental, deferred, rejected, unavailable,
      review-needed, launch-ready, post-launch, or scale-only where useful."
    - "State what must be validated before a channel gets more investment."
    - "Route detailed content calendars, launch sequences, pricing tests, sales scripts, partner outreach, experiment
      execution, analytics implementation, and support workflows downstream."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with Foundation, Validation, Product, Acceptance Criteria, Deployment, Technical Risks, GTM
      Brief, Market Definition, Positioning, Messaging, Customer Segments, or Decision Record."
    - "Flag channels without segment fit, message fit, asset requirement, metric, experiment, owner, or fallback."
    - "Flag primary-channel choices that are not focused, measurable, reachable, or aligned with the primary segment."
    - "Flag channel mixes that spread effort too thin for the launch stage."
    - "Flag paid channels without budget limits, tracking, conversion path, scaling condition, and stop condition."
    - "Flag community or partnership channels that may create trust, ethics, reputation, support, or operational risk."
    - "Flag channel messages that violate claim boundaries or product/technical truth."
    - "Verify that downstream GTM and Operations documents receive concrete channel handoff inputs."
    - "Flag content that belongs better in Launch Plan, Pricing, Content Strategy, Sales Motion, Partnerships, Growth
      Experiments, Analytics, GTM Risks, Support Model, Release Management, or Operations."
  specializedFormats:
    channelFormat:
      description: "Recommended format for channel definitions."
      fields:
        - "channel"
        - "channelType"
        - "role"
        - "targetSegment"
        - "rationale"
        - "reachabilityLogic"
        - "messageFit"
        - "requiredAssets"
        - "costOrCapacityImplication"
        - "measurementMethod"
        - "successSignal"
        - "failureSignal"
        - "fallback"
        - "status"
    channelExperimentFormat:
      description: "Recommended format for channel experiments."
      fields:
        - "experiment"
        - "hypothesis"
        - "channel"
        - "targetSegment"
        - "message"
        - "asset"
        - "sampleOrReachTarget"
        - "timeframe"
        - "successThreshold"
        - "failureThreshold"
        - "instrumentation"
        - "owner"
        - "nextDecision"
        - "status"
    segmentChannelFitFormat:
      description: "Recommended format for segment-channel fit."
      fields:
        - "segment"
        - "channel"
        - "whyReachableHere"
        - "customerIntent"
        - "messageFit"
        - "requiredAsset"
        - "trustRequirement"
        - "validationSignal"
        - "costOrSupportRisk"
        - "status"
    messageChannelFitFormat:
      description: "Recommended format for message-channel fit."
      fields:
        - "channel"
        - "messageType"
        - "allowedMessage"
        - "proofRequired"
        - "toneAdjustment"
        - "claimsToAvoid"
        - "prohibitedUse"
        - "reviewNeeded"
        - "status"
    channelAssetFormat:
      description: "Recommended format for channel assets."
      fields:
        - "asset"
        - "channel"
        - "purpose"
        - "targetSegment"
        - "messageSupported"
        - "proofIncluded"
        - "owner"
        - "readinessStatus"
        - "dependency"
        - "downstreamDocument"
    channelMetricFormat:
      description: "Recommended format for channel metrics."
      fields:
        - "metric"
        - "metricType"
        - "channel"
        - "purpose"
        - "measurementMethod"
        - "leadingOrLagging"
        - "qualitySignal"
        - "threshold"
        - "decisionImplication"
        - "owner"
    channelEconomicsFormat:
      description: "Recommended format for channel economics."
      fields:
        - "channel"
        - "effortCost"
        - "budgetCost"
        - "timeToSignal"
        - "CACAssumption"
        - "conversionAssumption"
        - "scalabilityAssumption"
        - "capacityLimit"
        - "opportunityCost"
        - "confidenceLevel"
        - "reviewNeeded"
    channelRiskFormat:
      description: "Recommended format for channel risks."
      fields:
        - "risk"
        - "channel"
        - "riskType"
        - "source"
        - "likelihood"
        - "impact"
        - "earlySignal"
        - "mitigation"
        - "fallback"
        - "downstreamDocument"
        - "launchImpact"
  sections:
    - id: "channel-objective"
      title: "Channel Objective"
      intent: "Define what the channel strategy must achieve first and what it should not optimize yet."
      required: true
      outputGuidance:
        - "State the primary channel objective in one clear sentence."
        - "Classify the objective as validation, waitlist, acquisition, activation, revenue, community, awareness,
          pipeline, feedback, retention learning, or another explicit outcome."
        - "Tie objective to GTM Brief and launch stage."
      qualityChecks:
        - "Objective is specific enough to choose channels and metrics."
        - "Objective does not try to optimize reach, revenue, learning, and scale all at once."
        - "Objective matches product readiness and support capacity."
      questions: &a1
        - "What is the primary goal of the channel strategy?"
        - "Is the goal validation, waitlist, acquisition, activation, revenue, community, awareness, pipeline, feedback,
          retention learning, or something else?"
        - "What should channel strategy intentionally not optimize yet?"
        - "What would make the first channel motion a failure?"
    - id: "channel-thesis"
      title: "Channel Thesis"
      intent: "State why the selected channel strategy can credibly reach the first qualified customers now."
      required: true
      outputGuidance:
        - "Summarize why this channel mix fits the segment, message, launch motion, and constraints."
        - "Identify the biggest channel assumption."
        - "State what must be true for the strategy to become repeatable."
      qualityChecks:
        - "Thesis is testable."
        - "Thesis is focused on the primary segment."
        - "The biggest assumption is explicit."
      questions: &a2
        - "What is the channel thesis?"
        - "Why should this channel strategy work for the primary segment?"
        - "Why now?"
        - "What must be true for the channel to become repeatable?"
        - "What is the biggest channel assumption?"
    - id: "channel-taxonomy"
      title: "Channel Taxonomy"
      intent: "Define the channel classes used in this strategy and how each class should be interpreted."
      required: true
      outputGuidance:
        - "Define owned, earned, paid, community, partner, marketplace, sales, referral, product-led, content-led,
          event-led, outbound, and support-led channels where relevant."
        - "Classify channel status labels: primary, secondary, supportive, experimental, deferred, rejected, scale-only,
          review-needed."
        - "State how channel classes differ from tactics and assets."
      qualityChecks:
        - "Taxonomy prevents mixing channels, tactics, assets, and metrics."
        - "Status labels are clear."
        - "The taxonomy supports downstream execution."
      questions: &a3
        - "What channel categories are used?"
        - "How are owned, earned, paid, community, partner, marketplace, sales, referral, product-led, content-led, event-led,
          outbound, and support-led channels defined?"
        - "What channel statuses exist?"
        - "How is a channel different from a tactic, asset, or campaign?"
    - id: "primary-channel"
      title: "Primary Channel"
      intent: "Identify the single primary acquisition or validation channel and explain why it is the best first bet."
      required: true
      outputGuidance:
        - "Use the channel format for the primary channel."
        - "Include rationale, target segment, message fit, required assets, measurement method, success signal, failure
          signal, and fallback."
        - "Avoid selecting multiple primary channels."
      qualityChecks:
        - "Primary channel is specific and testable."
        - "It is plausible for the primary segment and current stage."
        - "It has clear success/failure signals."
      questions: &a4
        - "What is the single primary acquisition or validation channel?"
        - "Why is this channel the best first bet?"
        - "Which segment does it reach?"
        - "What message works in this channel?"
        - "What assets are required?"
        - "What success and failure signals will be used?"
        - "What is the fallback if it underperforms?"
    - id: "secondary-channels"
      title: "Secondary Channels"
      intent: "Define supporting channels and how they reinforce the primary channel without diluting focus."
      required: true
      outputGuidance:
        - "Use channel records for secondary channels."
        - "Assign each channel a clear role: amplification, credibility, nurture, conversion, feedback, referral,
          retention, or proof generation."
        - "State why each is secondary rather than primary."
      qualityChecks:
        - "Secondary channels support the primary channel."
        - "They do not fragment launch effort."
        - "Each has a measurable role."
      questions: &a5
        - "What channels support the primary channel?"
        - "What role does each secondary channel play?"
        - "How do they reinforce each other?"
        - "Why is each not primary?"
        - "What metric indicates each secondary channel is doing its job?"
    - id: "organic-channels"
      title: "Organic Channels"
      intent: "Define unpaid channels such as SEO, content, social, community, GitHub/open-source, referrals,
        email/newsletter, word-of-mouth, and founder audience."
      required: true
      outputGuidance:
        - "List only relevant organic channels."
        - "State realistic ramp expectations and required consistency."
        - "Tie organic channels to Content Strategy and Analytics."
      qualityChecks:
        - "Organic channels include time and consistency costs."
        - "SEO/content/community assumptions are realistic for the stage."
        - "Each channel has a measurable learning or acquisition role."
      questions: &a6
        - "What organic channels will be used?"
        - "What role will SEO, content, social, community, GitHub/open-source, referrals, email/newsletter, word-of-mouth, or
          founder audience play?"
        - "What organic channels are too slow or not useful yet?"
        - "What consistency or asset requirement does each organic channel create?"
        - "How will organic channel quality be measured?"
    - id: "paid-channels"
      title: "Paid Channels"
      intent: "Define paid channels to test, why they might work, budget limits, conversion path, measurement, scaling
        condition, and stop condition."
      required: true
      outputGuidance:
        - "Treat paid channels as tests unless already validated."
        - "Define budget constraints and stop conditions."
        - "State whether paid is deferred if tracking/conversion is not ready."
      qualityChecks:
        - "Paid tests have clear hypothesis and budget limit."
        - "Scaling condition is explicit."
        - "Paid channels are not used to compensate for unclear positioning or broken activation."
      questions: &a7
        - "What paid channels will be tested?"
        - "Why might each paid channel work for the target segment?"
        - "What budget or spend cap applies?"
        - "What conversion path must exist before paid spend is meaningful?"
        - "What metric validates or invalidates the paid channel?"
        - "Under what conditions would paid channels scale?"
        - "When should paid channels be stopped or deferred?"
    - id: "community-channels"
      title: "Community Channels"
      intent: "Map communities the target audience inhabits and define authentic, non-extractive participation plans."
      required: true
      outputGuidance:
        - "Identify specific community types or communities when known."
        - "Define value contribution before promotion."
        - "Include platform/moderator rules and reputation risks."
      qualityChecks:
        - "Community strategy is not disguised spam."
        - "Participation plan creates value before extraction."
        - "Trust and reputation risks are explicit."
      questions: &a8
        - "What communities does the target audience already inhabit?"
        - "Why are those communities relevant?"
        - "How will the product or founder participate authentically?"
        - "What non-promotional value can be contributed?"
        - "What rules, norms, or moderator expectations apply?"
        - "What reputation risks exist?"
    - id: "partnership-channels"
      title: "Partnership Channels"
      intent: "Identify partnership, affiliate, integration, reseller, creator, community, institutional, or ecosystem
        channels and define partner fit criteria."
      required: true
      outputGuidance:
        - "Use channel records for material partnership channels."
        - "Define partner fit and mutual value."
        - "Route detailed partner operations to Partnerships and Distribution."
      qualityChecks:
        - "Partnerships have clear mutual value and distribution mechanism."
        - "Operational burden is visible."
        - "Partner assumptions are not treated as commitments."
      questions: &a9
        - "What partnership or affiliate channels exist?"
        - "What types of partners are plausible?"
        - "What makes a potential partner a good fit?"
        - "What value does the partner receive?"
        - "What distribution mechanism would the partner provide?"
        - "What proof or assets are required?"
        - "What operational or reputation risks exist?"
    - id: "sales-channels"
      title: "Sales Channels"
      intent: "Define direct or indirect sales channels, including founder-led, inbound, outbound, consultative,
        marketplace-assisted, app-store-assisted, reseller, or partner-led motions."
      required: true
      outputGuidance:
        - "State whether sales is primary, secondary, deferred, or not applicable."
        - "Define sales channel role and required handoff to Sales Motion."
        - "Include buyer/user role implications from Customer Segments."
      qualityChecks:
        - "Sales channels align with buyer dynamics and pricing."
        - "Sales motion is not implied without capacity and process."
        - "Indirect sales assumptions are explicit."
      questions: &a10
        - "What direct or indirect sales channels will be used?"
        - "Is sales founder-led, inbound, outbound, consultative, marketplace-assisted, app-store-assisted, reseller,
          partner-led, or another motion?"
        - "What buyer/user roles does sales need to handle?"
        - "What assets or proof does sales require?"
        - "What sales channels are deferred or not applicable?"
    - id: "marketplace-and-platform-channels"
      title: "Marketplace and Platform Channels"
      intent: "Define marketplace, app store, extension marketplace, integration directory, template gallery, package
        registry, or platform discovery channels where relevant."
      required: true
      outputGuidance:
        - "Include this section even if marketplaces are deferred or not applicable."
        - "Define listing requirements, ranking/discovery assumptions, review dynamics, platform rules, analytics
          limitations, and support implications."
        - "Route app-store/package/platform-specific tactics downstream where needed."
      qualityChecks:
        - "Platform discovery assumptions are explicit."
        - "Approval, ranking, review, and support risks are considered."
        - "Marketplace channels do not bypass messaging and claim boundaries."
      questions: &a11
        - "Are marketplace or platform channels relevant?"
        - "What app stores, marketplaces, extension directories, integration directories, template galleries, package
          registries, or platform ecosystems matter?"
        - "What listing assets and approval constraints apply?"
        - "How do ranking, reviews, platform rules, and analytics limitations affect strategy?"
        - "What marketplace/platform channels are deferred or not applicable?"
    - id: "segment-channel-fit"
      title: "Segment-Channel Fit"
      intent: "Map each material segment to plausible channels and explain why the segment can be reached there."
      required: true
      outputGuidance:
        - "Use segment-channel fit records for material segment/channel pairs."
        - "Include customer intent, trust requirement, asset needs, validation signal, and risk."
        - "Tie to Customer Segments."
      qualityChecks:
        - "Reachability logic is concrete."
        - "Channels are not assigned to segments just because they are popular."
        - "Validation signals are explicit."
      questions: &a12
        - "Which channels fit each segment?"
        - "Why is the segment reachable through each channel?"
        - "What is the customer's intent in that channel?"
        - "What trust level is required?"
        - "What asset is needed?"
        - "What signal validates segment-channel fit?"
    - id: "message-channel-fit"
      title: "Message-Channel Fit"
      intent: "Define which messages can safely and effectively be used in each channel."
      required: true
      outputGuidance:
        - "Use message-channel fit records for material channels."
        - "Tie messages to Messaging claim boundaries."
        - "State proof and tone requirements by channel."
      qualityChecks:
        - "Messages fit channel context and audience intent."
        - "Claim boundaries are preserved."
        - "Tone adaptations do not change truth."
      questions: &a13
        - "Which messages fit which channels?"
        - "What proof does each channel require?"
        - "How should tone adapt by channel?"
        - "What claims must be avoided in each channel?"
        - "What messages are prohibited in specific channels?"
    - id: "channel-assets"
      title: "Channel Assets"
      intent: "Define the assets required to make each channel work."
      required: true
      outputGuidance:
        - "Use channel asset records for material assets."
        - "Classify assets as required, recommended, optional, deferred, missing, or review-needed."
        - "Route detailed content and collateral creation downstream."
      qualityChecks:
        - "Channels do not depend on missing assets without being marked blocked or deferred."
        - "Assets connect to messages and proof."
        - "Ownership and readiness are explicit."
      questions: &a14
        - "What assets are required for each channel?"
        - "What landing pages, content, posts, emails, demos, docs, videos, proof assets, open-source artifacts, sales
          collateral, partner materials, or tracking links are needed?"
        - "Which assets are ready, missing, deferred, or review-needed?"
        - "Who owns each asset?"
        - "What downstream document should produce or manage each asset?"
    - id: "channel-economics"
      title: "Channel Economics"
      intent: "Estimate effort, budget, time-to-signal, scalability, CAC assumptions, conversion assumptions, capacity limits,
        and opportunity cost by channel."
      required: true
      outputGuidance:
        - "Use channel economics records where useful."
        - "Use directional ranges or qualitative estimates when precise data does not exist."
        - "Mark assumptions clearly."
      qualityChecks:
        - "Economics are decision-useful without fake precision."
        - "Time and founder/team effort are treated as costs."
        - "Scaling assumptions are not made before validation."
      questions: &a15
        - "What effort cost does each channel require?"
        - "What budget cost does each channel require?"
        - "How long until each channel produces a useful signal?"
        - "What CAC or conversion assumptions exist, if any?"
        - "What capacity limit or opportunity cost exists?"
        - "What confidence level applies to each assumption?"
    - id: "channel-experiments"
      title: "Channel Experiments"
      intent: "Define channel experiments with hypotheses, segments, messages, assets, thresholds, instrumentation, and next
        decisions."
      required: true
      outputGuidance:
        - "Use channel experiment records for material experiments."
        - "Connect each experiment to one decision."
        - "Do not define experiments without success/failure thresholds."
      qualityChecks:
        - "Experiments are small enough to run and clear enough to decide."
        - "Each experiment validates or invalidates a channel assumption."
        - "Instrumentation is defined."
      questions: &a16
        - "What channel experiments are planned?"
        - "What hypothesis does each experiment test?"
        - "What segment, message, and asset are used?"
        - "What is the sample or reach target?"
        - "What is the timeframe?"
        - "What is the success threshold and failure threshold?"
        - "What is the next decision after the experiment?"
    - id: "channel-metrics"
      title: "Channel Metrics"
      intent: "Define leading, lagging, quality, conversion, cost, and diagnostic metrics for each channel."
      required: true
      outputGuidance:
        - "Use channel metric records for material metrics."
        - "Separate reach metrics from quality and conversion metrics."
        - "Tie metrics to GTM Analytics."
      qualityChecks:
        - "Metrics lead to decisions."
        - "Quality and fit are measured, not just volume."
        - "Measurement method is explicit."
      questions: &a17
        - "What metrics measure channel performance?"
        - "What leading indicators matter?"
        - "What lagging indicators matter?"
        - "What quality signals show the channel is reaching the right people?"
        - "What conversion and cost metrics matter?"
        - "What threshold changes the channel decision?"
    - id: "channel-constraints"
      title: "Channel Constraints"
      intent: "Identify constraints that limit channel choice, channel claims, channel scale, or channel timing."
      required: true
      outputGuidance:
        - "Classify constraints by budget, team capacity, time, platform rules, brand/ethics, compliance/legal review,
          product readiness, support capacity, technical readiness, and measurement limitations."
        - "State concrete channel implication for each constraint."
        - "Separate launch-blocking constraints from manageable constraints."
      qualityChecks:
        - "Constraints affect channel decisions concretely."
        - "Product/technical/support constraints are not hidden."
        - "Platform and community rules are considered."
      questions: &a18
        - "What constraints limit channel choice?"
        - "What budget, team, time, platform, brand, ethics, compliance, product, support, technical, or measurement
          constraints exist?"
        - "What channels or claims are constrained?"
        - "What constraints are launch-blocking versus manageable?"
    - id: "fallback-strategy"
      title: "Fallback Strategy"
      intent: "Define what happens if the primary channel or a major supporting channel underperforms."
      required: true
      outputGuidance:
        - "Define fallback by failure type."
        - "Separate message iteration, segment narrowing, offer adjustment, asset improvement, alternate channel, launch
          pause, and strategy revisit."
        - "State decision thresholds."
      qualityChecks:
        - "Fallbacks are realistic and decision-triggered."
        - "Underperformance does not automatically cause random channel hopping."
        - "Fallbacks preserve learning."
      questions: &a19
        - "What happens if the primary channel underperforms?"
        - "What signal indicates message failure versus segment failure versus channel failure versus offer failure?"
        - "When should the channel be iterated, paused, replaced, or scaled down?"
        - "What alternate channel is the first fallback?"
        - "What evidence would trigger strategy revisit?"
    - id: "channel-risks"
      title: "Channel Risks"
      intent: "Surface channel failure risks, reputation risks, support risks, cost risks, measurement risks, and fallback
        needs."
      required: true
      outputGuidance:
        - "Use channel risk records for material risks."
        - "Include early signal, mitigation, fallback, launch impact, and downstream document."
        - "Treat channel misfit and overextension as first-class risks."
      qualityChecks:
        - "Risks are concrete and monitorable."
        - "Risks include trust, ethics, cost, support, measurement, and operational burden."
        - "Mitigations are actionable or routed downstream."
      questions: &a20
        - "What could cause a channel to fail?"
        - "What could make a channel reach the wrong audience?"
        - "What could create reputation, trust, support, cost, or measurement risk?"
        - "What early signals show channel failure?"
        - "What mitigation or fallback exists?"
        - "What risks should downstream documents inherit?"
    - id: "downstream-handoff"
      title: "Downstream Handoff"
      intent: "Define what downstream GTM and Operations documents must inherit from Channel Strategy and what they must not
        assume."
      required: true
      outputGuidance:
        - "Route channel outputs to the correct downstream documents."
        - "Separate launch, pricing, content, sales, partnerships, experiments, analytics, GTM risk, release, support,
          and operations implications."
        - "Preserve unresolved channel questions and rejected/deferred channel decisions."
      qualityChecks:
        - "Handoff items are concrete and document-targeted."
        - "Downstream documents are not allowed to invent missing channel assumptions silently."
        - "Channel strategy and downstream tactical execution remain distinct."
      questions: &a21
        - "What should Launch Plan inherit?"
        - "What should Pricing and Packaging inherit?"
        - "What should Content Strategy inherit?"
        - "What should Sales Motion inherit?"
        - "What should Partnerships and Distribution inherit?"
        - "What should Growth Experiments and GTM Analytics inherit?"
        - "What should GTM Risks, Release Management, Support Model, Operating Model, and Risk Management inherit?"
        - "What unresolved channel questions must be carried forward?"
  interview:
    mode: "canonical_question_with_coverage"
    canonicalQuestion: "Explain channel strategy. Which channels can credibly reach the right customers first, why should
      they work, how will they be tested, and what happens if they fail?"
