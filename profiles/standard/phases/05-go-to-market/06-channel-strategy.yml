        required: true
        description: "Define what the channel strategy must achieve first and what it should not optimize yet."
        evaluationHint: "Look for concrete answers addressing: What is the primary goal of the channel strategy?; Is the goal
          validation, waitlist, acquisition, activation, revenue, community, awareness, pipeline, feedback, retention
          learning, or something else?; What should channel strategy intentionally not optimize yet?."
        sourceQuestions: *a1
        targetSections: &a22
          - "Channel Objective"
      - id: "channel-thesis"
        label: "Channel Thesis"
        required: true
        description: "State why the selected channel strategy can credibly reach the first qualified customers now."
        evaluationHint: "Look for concrete answers addressing: What is the channel thesis?; Why should this channel strategy
          work for the primary segment?; Why now?."
        sourceQuestions: *a2
        targetSections: &a23
          - "Channel Thesis"
