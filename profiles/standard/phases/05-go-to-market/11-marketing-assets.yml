document:
  id: "11-marketing-assets"
  title: "Marketing Assets"
  phase: "05-go-to-market"
  status: "not_started"
  order: 11
  type: "marketing_assets"
  purpose: "Define, prioritize, specify, produce, approve, maintain, and retire the marketing materials required to
    launch, communicate, sell, support, measure, and iterate the product without violating positioning, messaging, claim
    boundaries, product readiness, or operational constraints."
  centralQuestion: "What marketing assets must exist, for whom, in which channel, with what message, proof, format, owner,
    approval, readiness state, and downstream use?"
  outputs:
    canonical:
      format: "markdown"
      path: "docs/05-go-to-market/11-marketing-assets.md"
      purpose: "Store the canonical marketing assets inventory and production plan as a Markdown document."
    artifacts:
      - id: "gtm.marketing_assets_inventory"
        format: "html"
        path: "outcomes/html/05-go-to-market/marketing-assets-inventory.html"
        purpose: "Provide a founder-facing marketing asset inventory covering required assets, specifications, audiences,
          channels, messages, proof, claim boundaries, formats, owners, readiness, approvals, deadlines, risks, and
          downstream handoff."
        audience: "founder"
        includes:
          - "asset objective"
          - "asset taxonomy"
          - "asset inventory"
          - "asset priority"
          - "landing page"
          - "website copy"
          - "email assets"
          - "social assets"
          - "demo assets"
          - "product screenshots"
          - "explainer video"
          - "sales and pitch materials"
          - "press kit"
          - "app store and marketplace listings"
          - "partner assets"
          - "support-adjacent assets"
          - "tracking and attribution assets"
          - "asset production workflow"
          - "asset approval workflow"
          - "asset readiness checklist"
          - "asset maintenance"
          - "asset risks"
          - "downstream handoff"
        generationMode: "regenerate_from_canonical"
    agentPacks:
      - id: "gtm.marketing_assets_review_prompt"
        format: "markdown"
        path: "outcomes/agents/05-go-to-market/marketing-assets-review-prompt.md"
        purpose: "Provide compact context for agents reviewing whether marketing assets are complete, prioritized,
          channel-ready, claim-safe, proof-aware, production-ready, measurable, maintainable, and aligned with GTM
          strategy."
        agentRole: "reviewer"
        includes:
          - "canonical marketing assets inventory"
          - "positioning dependency"
          - "messaging dependency"
          - "customer segments dependency"
          - "channel strategy dependency"
          - "launch plan dependency"
          - "conversion funnel dependency"
          - "sales strategy dependency"
          - "pricing dependency"
          - "asset formats"
          - "completion criteria"
          - "quality checks"
          - "review rules"
  dependsOn:
    - "01-foundation/01-thesis"
    - "01-foundation/03-audience"
    - "01-foundation/04-principles"
    - "01-foundation/05-boundaries"
    - "02-validation/05-experiments"
    - "02-validation/10-validation-report"
    - "03-product/01-product-brief"
    - "03-product/03-user-journeys"
    - "03-product/02-scope"
    - "03-product/13-acceptance-criteria"
    - "04-engineering/11-observability"
    - "04-engineering/12-deployment-and-environments"
    - "04-engineering/14-technical-risks"
    - "05-go-to-market/01-go-to-market-brief"
    - "05-go-to-market/02-market-definition"
    - "05-go-to-market/03-positioning"
    - "05-go-to-market/04-messaging"
    - "05-go-to-market/05-customer-segments"
    - "05-go-to-market/06-channel-strategy"
    - "05-go-to-market/07-launch-plan"
    - "05-go-to-market/08-conversion-funnel"
    - "05-go-to-market/09-sales-strategy"
    - "05-go-to-market/10-pricing-and-packaging"
  feeds:
    - "05-go-to-market/12-partnerships-and-distribution"
    - "05-go-to-market/13-growth-experiments"
    - "05-go-to-market/14-gtm-analytics"
    - "05-go-to-market/15-gtm-risks"
    - "06-operations/03-customer-success"
    - "06-operations/06-release-management"
    - "06-operations/07-support-model"
    - "06-operations/10-risk-management"
  inputs:
    - id: "positioning"
      type: "context"
      required: false
      description: "Positioning statement, category frame, target customer context, primary pain, differentiated value, proof
        hierarchy, claim boundaries, messaging pillars, narrative frame, anti-positioning, and positioning risks."
    - id: "messaging"
      type: "context"
      required: false
      description: "Core message, message house, one-liner, short/long descriptions, audience variants, channel variants,
        proof points, objection responses, tone, message examples, and forbidden claims."
    - id: "customer-segments"
      type: "context"
      required: false
      description: "ICP, primary segment, secondary segments, role map, qualification/disqualification signals,
        segment-specific messaging, segment-specific channels, exclusions, and segment risks."
    - id: "channel-strategy"
      type: "context"
      required: false
      description: "Primary channel, secondary channels, segment-channel fit, message-channel fit, required channel assets,
        channel experiments, channel metrics, constraints, fallback strategy, and risks."
    - id: "launch-plan"
      type: "context"
      required: false
      description: "Launch objective, launch type, audience, cohorts, readiness gates, launch assets, launch communications,
        support readiness, analytics readiness, go/no-go criteria, success criteria, contingencies, and launch risks."
    - id: "conversion-funnel"
      type: "context"
      required: false
      description: "Funnel model, stages, events, metrics, attribution, cohorts, drop-off risks, funnel experiments, and
        instrumentation ownership that marketing assets must support."
    - id: "sales-strategy"
      type: "context"
      required: false
      description: "Sales motion, qualification criteria, sales process, demo strategy, objection handling, sales assets,
        sales metrics, handoffs, constraints, and risks."
    - id: "pricing-and-packaging"
      type: "context"
      required: false
      description: "Pricing thesis, value metric, pricing model, packages/plans, trial/free strategy, payment flow, discounts,
        plan changes, objections, pricing experiments, metrics, and risks."
    - id: "product-readiness"
      type: "context"
      required: false
      description: "Product scope, launchable capabilities, acceptance criteria, screenshots/demoable flows, unsupported
        claims, known limitations, and product readiness constraints."
    - id: "technical-risk-context"
      type: "context"
      required: false
      description: "Deployment readiness, technical risks, observability constraints, measurement constraints, support
        implications, and claims/assets that require caution."
    - id: "asset-notes"
      type: "manual_note"
      required: false
      description: "Known asset needs, landing page ideas, copy drafts, screenshot lists, video ideas, pitch materials, press
        kit needs, listing requirements, deadlines, owners, and unresolved asset questions."
  completionCriteria:
    - "The central question is answered through a complete, prioritized, owner-assigned, claim-safe, channel-aware, and
      readiness-tracked marketing asset inventory."
    - "Asset objective defines what assets must enable now: launch, acquisition, conversion, sales, onboarding, support,
      partnerships, experiments, analytics, or credibility."
    - "Asset taxonomy distinguishes launch assets, website assets, content assets, email assets, social assets, sales
      assets, partner assets, product media, listing assets, press assets, support-adjacent assets, tracking assets, and
      internal enablement assets."
    - "Asset inventory includes asset, purpose, audience, channel, funnel stage, message supported, proof included,
      format, owner, dependency, approval, readiness status, due trigger, maintenance rule, and downstream use."
    - "Asset priority defines required launch blockers, required non-blockers, recommended assets, optional assets,
      deferred assets, rejected assets, and post-launch assets with rationale."
    - "Landing page requirements define audience, objective, message hierarchy, sections, CTA, proof, pricing display,
      claim boundaries, tracking needs, SEO/social metadata, and launch readiness."
    - "Website copy requirements define required pages, page purpose, audience, core message, CTA, proof, claim
      boundaries, owner, approval, and readiness."
    - "Email assets define sequences, transactional emails, launch emails, onboarding emails, nurture emails,
      re-engagement emails, support-adjacent emails, triggers, cadence, audience, message, CTA, and opt-out/privacy
      requirements."
    - "Social assets define platforms, post types, launch posts, evergreen posts, proof posts, founder posts, community
      posts, visual needs, CTA, claim boundaries, and timing."
    - "Demo assets define demo script, demo environment, demo data, product areas shown, product areas avoided,
      narrative, proof, follow-up assets, caveats, and readiness."
    - "Product screenshots define screens/flows, audience, channel, device/frame requirements, format, resolution,
      state/data shown, privacy/sensitive data checks, annotation rules, and update triggers."
    - "Explainer video defines whether it is required, objective, target audience, script/narrative, length, format,
      distribution channels, production scope, proof, CTA, and fallback if deferred."
    - "Sales and pitch materials define one-pager, deck, FAQ, comparison sheet, demo script, objection sheet, pricing
      explainer, proposal, proof sheet, case study, or other collateral with audience and stage."
    - "Press kit defines whether press is relevant, kit contents, boilerplate, founder/product bio, logos/visuals,
      screenshots, media contact, press angles, claim boundaries, and target contacts if known."
    - "App store and marketplace listings define target platforms, listing title/subtitle, descriptions, keywords,
      screenshots, videos, categories, compliance/platform constraints, review assets, and analytics limitations."
    - "Partner assets define partner one-pager, co-marketing copy, partner pitch, integration description, referral
      assets, enablement materials, partner proof, and approval requirements where relevant."
    - "Support-adjacent assets define FAQs, known-issues page, onboarding guide, help snippets, support macros,
      troubleshooting notes, and escalation references needed before launch."
    - "Tracking and attribution assets define UTM conventions, tracking links, QR codes, campaign IDs, landing page
      variants, analytics tags, source mapping, and ownership."
    - "Asset production workflow defines intake, drafting, review, approval, implementation, QA, publishing, tracking,
      maintenance, and retirement."
    - "Asset approval workflow defines claim review, product review, technical review, pricing review,
      legal/compliance/accounting review when needed, support review, and final approver."
    - "Asset readiness checklist defines each asset's status, owner, due date or trigger, dependency, approval state, QA
      state, launch impact, and blocker status."
    - "Asset maintenance defines when assets must be updated due to product change, pricing change, claim change, launch
      phase change, screenshot drift, broken links, analytics changes, or support learnings."
    - "Asset risks identify missing asset, stale asset, overclaiming, inconsistent messaging, wrong format, unsupported
      screenshot/demo, untracked links, approval delay, legal/compliance risk, and launch blocker risks."
    - "Downstream handoff clarifies what Partnerships, Growth Experiments, GTM Analytics, GTM Risks, Customer Success,
      Release Management, Support, and Risk Management must inherit."
  qualityChecks:
    - "Avoid vague claims."
    - "Avoid asset theater: asset lists without audience, channel, message, proof, owner, approval, readiness,
      dependency, and launch impact."
    - "Avoid creating assets that are not tied to a channel, funnel stage, launch need, sales process, experiment,
      support need, or downstream decision."
    - "Avoid final copy that violates Messaging claim boundaries, Positioning proof limits, Pricing terms, Product
      readiness, Technical Risks, legal/compliance uncertainty, or support capacity."
    - "Avoid screenshots, demos, or videos showing mock, unstable, private, sensitive, misleading, outdated, or
      unsupported product states without clear caveat."
    - "Avoid app store/marketplace assumptions without platform requirements, review constraints, screenshot specs,
      metadata needs, and analytics limitations."
    - "Avoid press kit assumptions when press is not part of the launch strategy; mark as deferred or not applicable
      instead."
    - "Avoid asset overproduction before launch-critical assets are complete."
    - "Avoid analytics links or campaign assets without tracking convention and owner."
    - "Avoid stale assets by defining maintenance and retirement triggers."
    - "Prefer decision-useful statements."
    - "Make assumptions explicit."
    - "Do not invent customer quotes, testimonials, logos, media contacts, case studies, performance metrics, compliance
      claims, app store requirements, or platform approvals."
    - "Marketing assets must preserve segment focus, positioning, messaging claim boundaries, pricing truth, product
      truth, technical truth, privacy/security constraints, and support capacity."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
    - "Separate asset, purpose, audience, channel, message, proof, format, owner, dependency, approval, readiness,
      maintenance, and risk."
    - "Tie each material asset to Messaging, Channel Strategy, Launch Plan, Conversion Funnel, Sales Strategy, Pricing
      and Packaging, Customer Segments, Product Scope, Technical Risks, or Decision Record where possible."
    - "Classify assets as required, recommended, optional, deferred, rejected, blocked, draft, review-needed, approved,
      launch-ready, post-launch, stale, or retired where useful."
    - "State whether each asset is launch-blocking, conversion-supporting, sales-supporting, support-supporting,
      experiment-supporting, analytics-supporting, or credibility-supporting."
    - "Route detailed campaign planning, content calendar, sales execution, partner outreach, experiment execution,
      analytics implementation, support operations, and release procedures downstream."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with Foundation, Validation, Product, Acceptance Criteria, Deployment, Technical Risks, GTM
      Brief, Market Definition, Positioning, Messaging, Customer Segments, Channel Strategy, Launch Plan, Conversion
      Funnel, Sales Strategy, Pricing and Packaging, or Decision Record."
    - "Flag assets without audience, channel, purpose, message, proof, owner, status, dependency, approval, or launch
      impact."
    - "Flag asset priorities that do not match Launch Plan readiness gates and Channel Strategy required assets."
    - "Flag copy, screenshots, demos, videos, listings, sales assets, or press materials that violate claim boundaries
      or product/technical truth."
    - "Flag assets that require legal, compliance, accounting, product, technical, or support review but are not marked
      review-needed."
    - "Flag untracked campaign assets, missing UTM/tracking conventions, or analytics handoff gaps."
    - "Flag stale or drift-prone assets without maintenance trigger."
    - "Verify that downstream GTM and Operations documents receive concrete asset handoff inputs."
    - "Flag content that belongs better in Content Strategy, Sales Strategy, Partnerships, Growth Experiments, GTM
      Analytics, GTM Risks, Customer Success, Support Model, Release Management, or Operations."
  specializedFormats:
    assetFormat:
      description: "Recommended format for marketing asset records."
      fields:
        - "asset"
        - "assetType"
        - "purpose"
        - "targetAudience"
        - "channel"
        - "funnelStage"
        - "messageSupported"
        - "proofIncluded"
        - "format"
        - "owner"
        - "dependency"
        - "approvalRequired"
        - "readinessStatus"
        - "dueDateOrTrigger"
        - "launchImpact"
        - "maintenanceTrigger"
        - "downstreamUse"
    assetPriorityFormat:
      description: "Recommended format for asset prioritization."
      fields:
        - "asset"
        - "priority"
        - "priorityReason"
        - "launchBlocking"
        - "channelDependency"
        - "funnelDependency"
        - "salesDependency"
        - "supportDependency"
        - "effortLevel"
        - "riskIfMissing"
        - "decision"
    landingPageSectionFormat:
      description: "Recommended format for landing page sections."
      fields:
        - "section"
        - "purpose"
        - "targetAudience"
        - "message"
        - "proof"
        - "CTA"
        - "claimBoundary"
        - "requiredAsset"
        - "trackingEvent"
        - "status"
    emailAssetFormat:
      description: "Recommended format for email assets."
      fields:
        - "email"
        - "sequence"
        - "trigger"
        - "audience"
        - "purpose"
        - "subjectLineDirection"
        - "coreMessage"
        - "CTA"
        - "cadence"
        - "optOutOrPrivacyRequirement"
        - "owner"
        - "status"
    socialAssetFormat:
      description: "Recommended format for social assets."
      fields:
        - "postOrAsset"
        - "platform"
        - "postType"
        - "audience"
        - "message"
        - "visualRequired"
        - "proofOrLink"
        - "CTA"
        - "timing"
        - "claimsToAvoid"
        - "owner"
        - "status"
    productMediaFormat:
      description: "Recommended format for screenshots, videos, and demos."
      fields:
        - "media"
        - "mediaType"
        - "productArea"
        - "flowOrScreen"
        - "audience"
        - "channel"
        - "format"
        - "resolutionOrLength"
        - "dataShown"
        - "privacyCheck"
        - "claimBoundary"
        - "updateTrigger"
        - "owner"
        - "status"
    salesAssetFormat:
      description: "Recommended format for sales and pitch collateral."
      fields:
        - "asset"
        - "audience"
        - "salesStage"
        - "purpose"
        - "messageSupported"
        - "proofIncluded"
        - "objectionAddressed"
        - "pricingReference"
        - "owner"
        - "approvalRequired"
        - "readinessStatus"
    listingAssetFormat:
      description: "Recommended format for app store and marketplace listing assets."
      fields:
        - "platform"
        - "listingElement"
        - "requirement"
        - "copyOrAssetNeeded"
        - "formatOrSpec"
        - "claimBoundary"
        - "approvalOrReviewConstraint"
        - "analyticsLimitation"
        - "owner"
        - "status"
    trackingAssetFormat:
      description: "Recommended format for tracking and attribution assets."
      fields:
        - "trackingAsset"
        - "channel"
        - "campaignOrLaunchUse"
        - "sourceMediumCampaignRule"
        - "destination"
        - "owner"
        - "QARequirement"
        - "analyticsDestination"
        - "status"
    assetRiskFormat:
      description: "Recommended format for marketing asset risks."
      fields:
        - "risk"
        - "affectedAsset"
        - "riskType"
        - "source"
        - "likelihood"
        - "impact"
        - "earlySignal"
        - "mitigation"
        - "contingency"
        - "downstreamDocument"
        - "launchImpact"
  sections:
    - id: "asset-objective"
      title: "Asset Objective"
      intent: "Define what the marketing asset system must enable at the current GTM stage."
      required: true
      outputGuidance:
        - "State the primary objective of the asset set."
        - "Identify whether assets primarily support launch, acquisition, conversion, sales, onboarding, support,
          partnerships, experiments, analytics, or credibility."
        - "State what asset production should not optimize yet."
      qualityChecks:
        - "Objective matches GTM stage and Launch Plan."
        - "Asset production is not broader than current needs."
        - "Objective is tied to channel and funnel decisions."
      questions: &a1
        - "What must the marketing asset set enable now?"
        - "Are assets primarily for launch, acquisition, conversion, sales, onboarding, support, partnerships, experiments,
          analytics, credibility, or another purpose?"
        - "What should asset production intentionally not optimize yet?"
        - "What would make the asset set insufficient for launch?"
    - id: "asset-taxonomy"
      title: "Asset Taxonomy"
      intent: "Define asset categories, statuses, priorities, approval states, and maintenance states."
      required: true
      outputGuidance:
        - "Define asset categories before listing assets."
        - "Define statuses such as required, recommended, optional, deferred, rejected, blocked, draft, review-needed,
          approved, launch-ready, stale, and retired."
        - "Clarify difference between asset, copy, campaign, channel, and content strategy."
      qualityChecks:
        - "Taxonomy prevents confusing assets with campaigns or strategy."
        - "Statuses have clear meaning."
        - "Approval and maintenance states are explicit."
      questions: &a2
        - "What asset categories exist?"
        - "What readiness statuses are used?"
        - "What priority labels are used?"
        - "What approval states are used?"
        - "What maintenance states are used?"
        - "How is an asset different from a campaign, channel, tactic, or content strategy?"
    - id: "asset-inventory"
      title: "Asset Inventory"
      intent: "List all marketing assets needed with purpose, audience, channel, message, proof, format, owner, dependency,
        approval, readiness, and downstream use."
      required: true
      outputGuidance:
        - "Use asset records for each material asset."
        - "Group assets by type or launch priority."
        - "Mark missing, blocked, deferred, and launch-ready assets explicitly."
      qualityChecks:
        - "Every asset has purpose and owner."
        - "Every asset maps to a channel, funnel stage, launch need, sales process, support need, experiment, or
          downstream decision."
        - "No critical asset lacks approval/readiness status."
      questions: &a3
        - "What is the complete list of marketing assets needed?"
        - "What is each asset for?"
        - "Who is the audience?"
        - "What channel and funnel stage does it serve?"
        - "What message and proof does it carry?"
        - "Who owns it and what dependencies exist?"
        - "What is the readiness and approval status?"
    - id: "asset-priority"
      title: "Asset Priority"
      intent: "Prioritize assets by launch need, channel dependency, funnel impact, sales impact, support impact, effort, and
        risk if missing."
      required: true
      outputGuidance:
        - "Use asset priority records for material assets."
        - "Separate launch blockers from non-blockers."
        - "Explain why deferred or rejected assets are not needed now."
      qualityChecks:
        - "Prioritization matches Launch Plan and Channel Strategy."
        - "Effort and risk are considered."
        - "Deferred assets do not hide launch blockers."
      questions: &a4
        - "What is the priority order for asset creation?"
        - "Which assets block launch?"
        - "Which assets support conversion or sales but do not block launch?"
        - "Which assets are optional, deferred, or rejected?"
        - "What is the risk if each asset is missing?"
    - id: "landing-page"
      title: "Landing Page"
      intent: "Define landing page purpose, audience, message hierarchy, sections, CTA, proof, pricing display, claim
        boundaries, tracking, and readiness."
      required: true
      outputGuidance:
        - "Use landing page section records for major sections."
        - "Tie structure to Messaging, Conversion Funnel, Pricing, and Channel Strategy."
        - "State primary CTA and secondary CTA if applicable."
      qualityChecks:
        - "Landing page has one primary job."
        - "Message hierarchy is clear."
        - "CTA, proof, claim boundaries, and tracking are explicit."
      questions: &a5
        - "What must the landing page communicate?"
        - "Who is the landing page for?"
        - "What is the message hierarchy?"
        - "What sections are required?"
        - "What proof appears on the page?"
        - "What is the primary call to action?"
        - "What tracking events are required?"
    - id: "website-copy"
      title: "Website Copy"
      intent: "Define required website pages beyond the landing page and the purpose, audience, CTA, proof, and claim
        boundaries for each."
      required: true
      outputGuidance:
        - "List pages as assets, not a full content strategy."
        - "Tie each page to funnel, messaging, pricing, support, or trust need."
        - "Mark pages deferred when not launch-critical."
      qualityChecks:
        - "Each page has a clear purpose."
        - "Pages are not created without funnel or trust purpose."
        - "Copy respects claim boundaries."
      questions: &a6
        - "What pages are needed beyond the landing page?"
        - "What is the purpose of each page?"
        - "What audience does each page serve?"
        - "What CTA does each page use?"
        - "What proof or trust element does each page require?"
        - "Which pages are launch-critical versus deferred?"
    - id: "email-assets"
      title: "Email Assets"
      intent: "Define email sequences and standalone emails needed for launch, onboarding, nurture, re-engagement,
        transactional, support, and sales contexts."
      required: true
      outputGuidance:
        - "Use email asset records for each email or sequence."
        - "Define trigger, cadence, audience, purpose, CTA, opt-out/privacy requirement, owner, and status."
        - "Separate marketing emails from transactional/support emails."
      qualityChecks:
        - "Emails have trigger and purpose."
        - "Cadence is realistic and not spammy."
        - "Privacy, consent, and opt-out requirements are considered."
      questions: &a7
        - "What email sequences are needed?"
        - "What standalone emails are needed?"
        - "What triggers each email or sequence?"
        - "What is the cadence?"
        - "Who is the audience?"
        - "What is the CTA?"
        - "What privacy or opt-out rules apply?"
    - id: "social-assets"
      title: "Social Assets"
      intent: "Define social posts, visual assets, launch announcements, founder posts, proof posts, evergreen posts, and
        community-safe assets."
      required: true
      outputGuidance:
        - "Use social asset records."
        - "Tie posts to Channel Strategy and Messaging."
        - "Define platform-specific constraints and claims to avoid."
      qualityChecks:
        - "Social assets are platform-appropriate."
        - "Posts are not generic announcements without audience and CTA."
        - "Community norms and claim boundaries are respected."
      questions: &a8
        - "What social platforms will be used?"
        - "What post types are needed?"
        - "What is the launch announcement plan?"
        - "What visuals or links are needed?"
        - "What CTA should each post use?"
        - "What claims or tone should be avoided by platform?"
    - id: "demo-assets"
      title: "Demo Assets"
      intent: "Define demo script, demo environment, demo data, product areas shown, product areas avoided, narrative, proof,
        caveats, and follow-up assets."
      required: true
      outputGuidance:
        - "Tie demo assets to Sales Strategy and Product readiness."
        - "State what is demo-safe and what is not."
        - "Include follow-up assets."
      qualityChecks:
        - "Demo does not overstate unsupported capabilities."
        - "Demo data is safe and realistic."
        - "Caveats are explicit for unstable/manual/mock areas."
      questions: &a9
        - "What is the standard demo narrative?"
        - "What product areas are shown?"
        - "What product areas are avoided?"
        - "What demo data is used?"
        - "What proof or story supports the demo?"
        - "What follow-up assets are needed after the demo?"
    - id: "product-screenshots"
      title: "Product Screenshots"
      intent: "List screenshots and flows to capture with audience, channel, format, resolution, data shown, privacy check,
        claim boundary, and update trigger."
      required: true
      outputGuidance:
        - "Use product media records for screenshots."
        - "Define device/frame/format needs."
        - "Include privacy and stale-screenshot checks."
      qualityChecks:
        - "Screenshots represent real or clearly labeled product state."
        - "Sensitive data is not exposed."
        - "Update triggers are defined."
      questions: &a10
        - "What screens or flows must be captured?"
        - "What audience and channel uses each screenshot?"
        - "What format and resolution are required?"
        - "What product state or data is shown?"
        - "What privacy check is required?"
        - "When must screenshots be updated?"
    - id: "explainer-video"
      title: "Explainer Video"
      intent: "Determine whether an explainer video is required and define objective, audience, script, length, format,
        distribution, proof, CTA, and fallback if deferred."
      required: true
      outputGuidance:
        - "Include this section even if explainer video is deferred or rejected."
        - "Use product media records if video is required."
