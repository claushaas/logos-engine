    - id: "asset-production-workflow"
      title: "Asset Production Workflow"
      intent: "Define how assets move from need to draft, review, approval, implementation, QA, publishing, measurement,
        maintenance, and retirement."
      required: true
      outputGuidance:
        - "Describe workflow at a process level."
        - "Include intake, drafting, review, approval, publishing, QA, and tracking."
        - "State owner of workflow and blockers."
      qualityChecks:
        - "Workflow prevents unreviewed assets from going live."
        - "Production process is not heavier than necessary."
        - "Launch-critical assets can be tracked."
      questions: &a18
        - "How does an asset move from idea to published?"
        - "Who can request an asset?"
