        - "What goes in the press kit?"
        - "What boilerplate, founder/product bio, visuals, screenshots, or media contact are needed?"
        - "What press angles are safe?"
        - "Who are the target press contacts, if actually known?"
        - "What claims should press materials avoid?"
    - id: "app-store-marketplace-listing"
      title: "App Store / Marketplace Listing"
      intent: "Define listing requirements for app stores, marketplaces, extension directories, package registries,
