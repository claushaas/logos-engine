        - "Required assets and specs are explicit or marked research-needed."
        - "Analytics limitations are considered."
      questions: &a14
        - "What app stores or marketplaces will the product be listed on?"
        - "What listing title, subtitle, description, keywords, screenshots, video, category, and support links are
