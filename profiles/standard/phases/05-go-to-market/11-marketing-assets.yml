      intent: "Define approval needs by asset type, including claim, product, technical, pricing, legal/compliance/accounting,
        support, and final approval."
      required: true
      outputGuidance:
        - "Define approval by asset risk and type."
        - "State which assets require which reviewers."
        - "Include exception path for urgent corrections."
      qualityChecks:
        - "Risky assets receive proper review."
        - "Approval is not needlessly heavy for low-risk assets."
        - "Review-needed assets are clearly marked."
      questions: &a19
        - "What approval is required for each asset type?"
        - "Who reviews claims?"
        - "Who reviews product or technical accuracy?"
        - "Who reviews pricing, tax, legal, compliance, or accounting claims when relevant?"
        - "Who reviews support impact?"
        - "Who gives final approval?"
    - id: "asset-readiness-checklist"
      title: "Asset Readiness Checklist"
      intent: "Track status, ownership, dependencies, approval, QA, deadlines/triggers, and launch impact for all
        launch-critical assets."
      required: true
      outputGuidance:
        - "Use asset records or checklist-style records for all launch-critical assets."
        - "Mark blockerIfIncomplete where useful."
        - "Tie checklist to Launch Plan readiness gates."
      qualityChecks:
        - "Checklist is actionable."
        - "Every launch-critical asset has readiness status."
        - "Incomplete blockers are explicit."
      questions: &a20
        - "What is the status of each asset?"
        - "Who owns each asset?"
        - "What is the due date or due trigger?"
        - "What dependency blocks completion?"
        - "What approval or QA remains?"
        - "What launch impact does each asset have?"
    - id: "asset-maintenance"
      title: "Asset Maintenance"
      intent: "Define how assets are kept current, reviewed, updated, retired, or replaced as product, pricing, messaging,
        screenshots, channels, and support knowledge change."
      required: true
      outputGuidance:
        - "Define maintenance triggers by asset type."
        - "State stale-asset detection and owner."
        - "Include retirement rules."
      qualityChecks:
        - "Stale assets are treated as risk."
        - "Update triggers are concrete."
        - "Ownership extends beyond initial creation."
      questions: &a21
        - "When must assets be updated?"
        - "What product, pricing, messaging, launch, screenshot, link, analytics, or support changes trigger asset updates?"
        - "Who owns asset maintenance?"
        - "How are stale assets detected?"
        - "When should an asset be retired?"
    - id: "asset-risks"
      title: "Asset Risks"
      intent: "Identify risks related to missing, stale, misleading, unapproved, untracked, unsupported, or inconsistent
        marketing assets."
      required: true
      outputGuidance:
        - "Use asset risk records for material risks."
        - "Include early signal, mitigation, contingency, downstream document, and launch impact."
        - "Treat overclaiming and stale product media as first-class risks."
      qualityChecks:
        - "Risks are concrete and monitorable."
        - "Risks include claim safety, product truth, analytics, support, and launch blockers."
        - "Mitigation and contingency are distinct."
      questions: &a22
        - "What asset risks exist?"
        - "What happens if a launch-critical asset is missing?"
        - "What assets could become stale or misleading?"
        - "What assets could violate claim boundaries?"
        - "What assets could be untracked or hard to measure?"
        - "What mitigation or contingency is needed?"
    - id: "downstream-handoff"
      title: "Downstream Handoff"
      intent: "Define what downstream GTM and Operations documents must inherit from Marketing Assets and what they must not
        assume."
      required: true
      outputGuidance:
        - "Route asset outputs to the correct downstream documents."
        - "Separate partnerships, experiments, analytics, GTM risk, customer success, release, support, and risk
          management implications."
        - "Preserve unresolved asset questions, missing assets, blocked assets, and claim restrictions."
      qualityChecks:
        - "Handoff items are concrete and document-targeted."
        - "Downstream documents are not allowed to invent missing asset assumptions silently."
        - "Asset inventory and downstream execution remain distinct."
      questions: &a23
        - "What should Partnerships and Distribution inherit?"
        - "What should Growth Experiments inherit?"
        - "What should GTM Analytics inherit?"
        - "What should GTM Risks inherit?"
        - "What should Customer Success inherit?"
        - "What should Release Management and Support Model inherit?"
        - "What should Risk Management inherit?"
        - "What unresolved asset questions must be carried forward?"
