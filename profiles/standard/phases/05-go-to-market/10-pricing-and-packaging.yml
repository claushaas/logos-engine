document:
  id: "10-pricing-and-packaging"
  title: "Pricing and Packaging"
  phase: "05-go-to-market"
  status: "not_started"
  order: 10
  type: "pricing_packaging"
  purpose: "Define how value is packaged, priced, purchased, upgraded, downgraded, cancelled, tested, measured, and
    reviewed, while staying aligned with customer willingness, product readiness, sales motion, support capacity, and
    operational constraints."
  centralQuestion: "How should the offer be packaged and priced so the right customers can understand, trust, buy, use,
    expand, or cancel it without creating unsustainable product, support, or operational burden?"
  outputs:
    canonical:
      format: "markdown"
      path: "docs/05-go-to-market/10-pricing-and-packaging.md"
      purpose: "Store the canonical pricing and packaging document as a Markdown document."
    artifacts:
      - id: "gtm.pricing_packaging_reference"
        format: "html"
        path: "outcomes/html/05-go-to-market/pricing-and-packaging-reference.html"
        purpose: "Provide a founder-facing pricing and packaging reference covering pricing objective, value metric, model,
          packages, tiers, trial/free strategy, billing, checkout, taxes, discounts, upgrades, cancellations,
          objections, experiments, metrics, risks, and downstream handoff."
        audience: "founder"
        includes:
          - "pricing objective"
          - "pricing thesis"
          - "value metric"
          - "pricing model"
          - "packaging strategy"
          - "plan structure"
          - "feature and limit mapping"
          - "free tier strategy"
          - "trial strategy"
          - "subscription terms"
          - "billing cycles"
          - "payment flow"
          - "tax and invoice considerations"
          - "discount strategy"
          - "upgrade logic"
          - "downgrade logic"
          - "cancellation logic"
          - "refund policy"
          - "pricing objections"
          - "pricing experiments"
          - "pricing metrics"
          - "pricing risks"
          - "downstream handoff"
        generationMode: "regenerate_from_canonical"
    agentPacks:
      - id: "gtm.pricing_packaging_review_prompt"
        format: "markdown"
        path: "outcomes/agents/05-go-to-market/pricing-and-packaging-review-prompt.md"
        purpose: "Provide compact context for agents reviewing whether pricing and packaging are customer-aligned,
          value-aligned, conversion-aware, sales-aware, technically feasible, supportable, measurable, and not
          overfitted to unsupported assumptions."
        agentRole: "reviewer"
        includes:
          - "canonical pricing and packaging"
          - "GTM brief dependency"
          - "customer segments dependency"
          - "channel strategy dependency"
          - "launch plan dependency"
          - "conversion funnel dependency"
          - "sales strategy dependency"
          - "product readiness dependency"
          - "pricing formats"
          - "completion criteria"
          - "quality checks"
          - "review rules"
  dependsOn:
    - "01-foundation/01-thesis"
    - "01-foundation/03-audience"
    - "01-foundation/04-principles"
    - "01-foundation/05-boundaries"
    - "01-foundation/06-success-definition"
    - "02-validation/08-evidence-log"
    - "02-validation/05-experiments"
    - "02-validation/10-validation-report"
    - "03-product/01-product-brief"
    - "03-product/03-user-journeys"
    - "03-product/02-scope"
    - "03-product/10-functional-requirements"
    - "03-product/11-non-functional-requirements"
    - "03-product/13-acceptance-criteria"
    - "04-engineering/05-data-model"
    - "04-engineering/08-security-and-privacy"
    - "04-engineering/10-testing-strategy"
    - "04-engineering/11-observability"
    - "04-engineering/12-deployment-and-environments"
    - "04-engineering/14-technical-risks"
    - "05-go-to-market/01-go-to-market-brief"
    - "05-go-to-market/02-market-definition"
    - "05-go-to-market/03-positioning"
    - "05-go-to-market/04-messaging"
    - "05-go-to-market/05-customer-segments"
    - "05-go-to-market/06-channel-strategy"
    - "05-go-to-market/07-launch-plan"
    - "05-go-to-market/08-conversion-funnel"
    - "05-go-to-market/09-sales-strategy"
  feeds:
    - "05-go-to-market/11-content-strategy"
    - "05-go-to-market/12-partnerships-and-distribution"
    - "05-go-to-market/13-growth-experiments"
    - "05-go-to-market/14-gtm-analytics"
    - "05-go-to-market/15-gtm-risks"
    - "06-operations/02-operating-model"
    - "06-operations/03-customer-success"
    - "06-operations/06-release-management"
    - "06-operations/07-support-model"
    - "06-operations/10-risk-management"
  inputs:
    - id: "go-to-market-brief"
      type: "context"
      required: false
      description: "GTM objective, revenue motion, launch strategy, success criteria, constraints, and risks."
    - id: "customer-segments"
      type: "context"
      required: false
      description: "ICP, primary segment, buyers, payers, decision makers, willingness signals, objections, support needs,
        excluded segments, and expansion triggers."
    - id: "channel-strategy"
      type: "context"
      required: false
      description: "Primary channel, secondary channels, channel economics, channel experiments, channel constraints, and
        channel risks affecting price presentation and conversion."
    - id: "launch-plan"
      type: "context"
      required: false
      description: "Launch type, launch cohorts, readiness gates, launch assets, communications, support readiness, analytics
        readiness, go/no-go criteria, and launch risks."
    - id: "conversion-funnel"
      type: "context"
      required: false
      description: "Funnel model, acquisition, qualification, signup, activation, conversion, retention, expansion, funnel
        metrics, attribution, and drop-off risks."
    - id: "sales-strategy"
      type: "context"
      required: false
      description: "Sales motion, self-serve motion, founder-led sales, qualification, buyer/user roles, demo strategy,
        objection handling, sales assets, metrics, constraints, and risks."
    - id: "product-context"
      type: "context"
      required: false
      description: "Product scope, supported capabilities, feature limits, acceptance criteria, onboarding needs, activation
        moments, retention behaviors, upgradeable value, and unsupported claims."
    - id: "engineering-billing-context"
      type: "context"
      required: false
      description: "Payment processor constraints, entitlement model, data model, privacy/security constraints, tax/invoice
        implications, observability, deployment readiness, technical risks, and support constraints."
    - id: "pricing-notes"
      type: "manual_note"
      required: false
      description: "Candidate prices, plans, trial/free ideas, discount ideas, billing terms, payment processor ideas, refund
        ideas, objections, experiment ideas, and unresolved pricing questions."
  completionCriteria:
    - "The central question is answered through a clear pricing and packaging strategy that is customer-aligned,
      value-aligned, conversion-aware, technically feasible, supportable, measurable, and reviewable."
    - "Pricing objective defines whether pricing currently optimizes validation, adoption, revenue, retention,
      expansion, willingness-to-pay discovery, positioning, or operational simplicity."
    - "Pricing thesis explains why the proposed price/package structure fits the customer, pain, alternatives, category,
      value promise, channel, sales motion, launch stage, and support capacity."
    - "Value metric defines the unit of value customers understand and are willing to pay for, such as user, seat,
      account, usage, volume, outcome, workspace, dog, household, project, transaction, storage, automation, or another
      relevant unit."
    - "Pricing model defines subscription, one-time, usage-based, seat-based, tiered, flat-rate, freemium, trial-led,
      pay-as-you-go, credit-based, enterprise, donation/open-source support, or hybrid model, with rationale and
      assumptions."
    - "Packaging strategy defines what is bundled, what is gated, what is unlimited, what is limited, what is add-on,
      what is excluded, and what is intentionally deferred."
    - "Plan structure defines each plan/package with target customer, price, billing cycle, included capabilities,
      limits, entitlements, support level, upgrade trigger, downgrade behavior, and status."
    - "Feature and limit mapping defines which capabilities belong in which package, why, how limits are enforced, and
      whether each limit is value-aligned, cost-control, support-control, or positioning-driven."
    - "Free tier strategy defines whether a free tier exists, what it includes, what it excludes, why it exists,
      abuse/spam/cost/support risk, upgrade path, and success metric."
    - "Trial strategy defines whether a trial exists, duration, requirements, feature access, onboarding, reminders,
      conversion path, payment requirement, cancellation behavior, and trial abuse risk."
    - "Subscription terms define monthly/annual cycles, renewals, commitments, cancellation timing, plan changes, grace
      periods, failed payment handling, invoices/receipts, and customer communication."
    - "Payment flow defines checkout path, processor, payment methods, account creation order, entitlement activation,
      receipt/invoice behavior, failure states, support fallback, and analytics events."
    - "Tax and invoice considerations identify VAT/GST/sales tax/local tax needs, invoice requirements, refund
      implications, jurisdiction review needs, and what must be reviewed before launch."
    - "Discount strategy defines allowed discounts, annual discount, early adopter discount, founder/customer
      development discount, volume discount, nonprofit/education discount, partner discount, coupon rules, expiration,
      approval, and risks."
    - "Upgrade and downgrade logic defines triggers, customer path, entitlement changes, billing/proration behavior,
      data access, feature loss, communication, support impact, and edge cases."
    - "Cancellation logic defines cancel path, timing, access until period end, data export/deletion, retention,
      win-back, support escalation, feedback capture, and analytics events."
    - "Refund policy defines eligibility, window, process, exceptions, abuse prevention, customer communication, and
      support escalation."
    - "Pricing objections map objections to underlying concern, honest response, proof, caveat, pricing/page asset
      needed, and escalation path."
    - "Pricing experiments define hypothesis, segment, offer/package/price/trial change, metric, threshold, timeframe,
      instrumentation, owner, and next decision."
    - "Pricing metrics define conversion, trial-to-paid, ARPU/ARPA, churn, expansion, downgrade, failed payment, refund,
      support burden, willingness-to-pay, discount usage, and cohort metrics where relevant."
    - "Pricing risks identify underpricing, overpricing, wrong value metric, support overload, free-tier abuse, trial
      abuse, conversion friction, tax/payment issues, entitlement bugs, reputational risk, and operational burden."
    - "Downstream handoff clarifies what Content, Partnerships, Experiments, Analytics, GTM Risks, Customer Success,
      Support, Release, Operations, and Risk Management must inherit."
  qualityChecks:
    - "Avoid vague claims."
    - "Avoid pricing theater: prices and tiers without customer value logic, willingness evidence, value metric,
      conversion path, support impact, entitlement rules, and measurement."
    - "Avoid copying competitor pricing without explaining customer value, positioning, cost structure, support burden,
      and sales/channel fit."
    - "Avoid freemium or free tier by default; free must have a strategic reason and cost/support/abuse controls."
    - "Avoid trials without onboarding, conversion path, reminder strategy, abuse control, support expectation, and
      analytics."
    - "Avoid complex packages before the product, market, and support model can sustain them."
    - "Avoid price precision that lacks willingness-to-pay evidence; mark prices as hypotheses when unvalidated."
    - "Avoid hidden operational work caused by discounts, custom plans, manual billing, invoice requests, refunds,
      taxes, or entitlement overrides."
    - "Avoid payment or tax claims that require legal/accounting review unless verified."
    - "Avoid pricing claims or guarantees that violate Messaging, Positioning, Product, Technical Risks, or Support
      constraints."
    - "Prefer decision-useful statements."
    - "Make assumptions explicit."
    - "Do not invent willingness-to-pay data, competitor prices, tax obligations, processor support, conversion rates,
      churn rates, revenue projections, or billing capability."
    - "Pricing and packaging must preserve segment focus, value proposition, product truth, technical feasibility, sales
      motion, support capacity, privacy/security constraints, and operational sustainability."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
    - "Separate pricing hypothesis, packaging decision, value metric, feature gate, limit, entitlement, payment flow,
      billing term, discount, objection, experiment, metric, risk, and handoff."
    - "Tie pricing decisions to Customer Segments, Value Proposition, Conversion Funnel, Sales Strategy, Channel
      Strategy, Launch Plan, Product Scope, Acceptance Criteria, Technical Risks, or Decision Record where possible."
    - "Classify prices, packages, discounts, terms, and policies as committed, hypothesis, experimental, deferred,
      rejected, launch-ready, blocked, review-needed, legal/accounting-review-needed, or post-launch."
    - "State what must be validated before treating a price, package, trial, discount, or billing policy as stable."
    - "Route landing-page copy, price-page copy, sales collateral, partner commercial terms, experiments, analytics
      implementation, support macros, billing operations, and legal/accounting review downstream."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with Foundation, Validation, Product, Acceptance Criteria, Security/Privacy, Deployment,
      Technical Risks, GTM Brief, Market Definition, Positioning, Messaging, Customer Segments, Channel Strategy, Launch
      Plan, Conversion Funnel, Sales Strategy, or Decision Record."
    - "Flag pricing without value metric, customer segment, willingness evidence or assumption label, conversion path,
      and support implication."
    - "Flag packages without target customer, entitlement rules, feature/limit rationale, upgrade trigger, downgrade
      behavior, and operational impact."
    - "Flag free tier or trial strategy without abuse/cost/support controls and conversion path."
    - "Flag payment flow without processor, failure states, entitlement activation, analytics events, and support
      fallback."
    - "Flag tax/invoice/refund statements that require professional review but are treated as final."
    - "Flag discounts without approval, expiration, eligibility, tracking, and margin/support/reputation impact."
    - "Flag upgrade/downgrade/cancellation logic that ignores data access, billing, entitlement, support, and customer
      communication."
    - "Verify that downstream GTM and Operations documents receive concrete pricing handoff inputs."
    - "Flag content that belongs better in Content Strategy, Sales Strategy, Partnerships, Growth Experiments, GTM
      Analytics, GTM Risks, Customer Success, Support Model, Operating Model, or Risk Management."
  specializedFormats:
    pricingThesisFormat:
      description: "Recommended format for pricing thesis."
      fields:
        - "thesis"
        - "targetCustomer"
        - "valueMetric"
        - "pricingModel"
        - "primaryPackage"
        - "rationale"
        - "willingnessEvidence"
        - "biggestAssumption"
        - "validationNeeded"
        - "status"
    planFormat:
      description: "Recommended format for plans/packages."
      fields:
        - "plan"
        - "targetCustomer"
        - "price"
        - "billingCycle"
        - "includedCapabilities"
        - "limits"
        - "entitlements"
        - "supportLevel"
        - "upgradeTrigger"
        - "downgradeBehavior"
        - "operationalImpact"
        - "status"
    featureLimitFormat:
      description: "Recommended format for feature and limit mapping."
      fields:
        - "capabilityOrLimit"
        - "includedInPlans"
        - "rationale"
        - "limitType"
        - "enforcementMethod"
        - "customerImpact"
        - "costOrSupportImpact"
        - "upgradeImplication"
        - "status"
    trialFormat:
      description: "Recommended format for trial/free strategy."
      fields:
        - "offerType"
        - "duration"
        - "accessLevel"
        - "requirements"
        - "onboardingPath"
        - "conversionTrigger"
        - "reminders"
        - "abuseRisk"
        - "supportExpectation"
        - "successMetric"
        - "status"
    billingTermFormat:
      description: "Recommended format for billing and subscription terms."
      fields:
        - "term"
        - "appliesTo"
        - "rule"
        - "customerCommunication"
        - "billingImpact"
        - "supportImpact"
        - "exceptionPolicy"
        - "reviewNeeded"
        - "status"
    paymentFlowFormat:
      description: "Recommended format for payment flow."
      fields:
        - "step"
        - "customerAction"
        - "systemAction"
        - "processorOrTool"
        - "dataCollected"
        - "entitlementChange"
        - "failureState"
        - "analyticsEvent"
        - "supportFallback"
        - "status"
    discountFormat:
      description: "Recommended format for discount rules."
      fields:
        - "discount"
        - "purpose"
        - "eligibility"
        - "amountOrRule"
        - "duration"
        - "approvalRequired"
        - "expiration"
        - "trackingRequirement"
