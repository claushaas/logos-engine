        - "trigger"
        - "customerPath"
        - "entitlementChange"
        - "billingOrProrationRule"
        - "dataAccessRule"
        - "communication"
        - "supportImpact"
        - "edgeCases"
        - "analyticsEvent"
        - "status"
    pricingObjectionFormat:
      description: "Recommended format for pricing objections."
      fields:
        - "objection"
        - "sourceOrSegment"
        - "underlyingConcern"
        - "honestResponse"
        - "proofOrEvidence"
        - "caveat"
        - "assetNeeded"
        - "escalationPath"
        - "status"
    pricingExperimentFormat:
      description: "Recommended format for pricing experiments."
      fields:
