        - "impact"
        - "earlySignal"
        - "mitigation"
        - "contingency"
        - "downstreamDocument"
        - "launchImpact"
  sections:
    - id: "pricing-objective"
      title: "Pricing Objective"
      intent: "Define what pricing must optimize at this stage and what it should intentionally not optimize yet."
      required: true
      outputGuidance:
        - "State the primary pricing objective in one sentence."
        - "Classify the objective as validation, adoption, revenue, retention, expansion, willingness-to-pay discovery,
          positioning, operational simplicity, or another explicit goal."
        - "State what pricing should not optimize yet."
      qualityChecks:
        - "Objective matches launch stage, segment, channel, and sales motion."
        - "Objective is decision-useful."
        - "Pricing does not try to optimize all commercial outcomes at once."
      questions: &a1
        - "What is the primary goal of pricing right now?"
        - "Is the focus validation, adoption, revenue, retention, expansion, willingness-to-pay discovery, positioning, or
          operational simplicity?"
        - "What should pricing intentionally not optimize yet?"
        - "What would make the pricing strategy a failure?"
    - id: "pricing-thesis"
      title: "Pricing Thesis"
      intent: "State why the proposed price and package structure should work for the target customer and GTM motion."
      required: true
      outputGuidance:
        - "Use the pricing thesis format where useful."
        - "Separate evidence from assumptions."
        - "Identify the biggest pricing assumption."
      qualityChecks:
        - "Thesis connects customer value, alternative, willingness, channel, sales motion, and support."
        - "Thesis is testable."
        - "Unvalidated price points are labeled as hypotheses."
      questions: &a2
        - "What is the pricing thesis?"
        - "Why should this pricing work for the target customer?"
        - "How does it fit the value proposition and alternatives?"
        - "How does it fit channel and sales motion?"
        - "What willingness evidence exists?"
        - "What is the biggest pricing assumption?"
    - id: "value-metric"
      title: "Value Metric"
      intent: "Define the unit of value that pricing should align with."
      required: true
      outputGuidance:
        - "State the primary value metric and rejected alternatives."
        - "Explain why customers understand or accept this metric."
        - "Tie metric to packaging, entitlements, and expansion."
      qualityChecks:
        - "Value metric aligns with perceived customer value."
        - "Metric is technically and operationally measurable."
        - "Metric does not create perverse incentives or confusing billing."
      questions: &a3
        - "What unit of value should pricing use?"
        - "Is value tied to users, seats, accounts, usage, volume, outcomes, workspaces, projects, transactions, storage,
          automations, households, or another unit?"
        - "Why will customers understand this metric?"
        - "How is it measured or enforced?"
        - "What value metrics were rejected and why?"
    - id: "pricing-model"
      title: "Pricing Model"
      intent: "Choose the pricing model and justify why it fits value, segment, channel, sales motion, and operations."
      required: true
      outputGuidance:
        - "Define the primary pricing model and any secondary model."
        - "Classify unvalidated models as hypotheses."
        - "Explain why alternatives were rejected or deferred."
      qualityChecks:
        - "Pricing model fits customer behavior and operational feasibility."
        - "Hybrid models are explained clearly."
        - "Rejected models have rationale."
      questions: &a4
        - "What pricing model is used: subscription, one-time, usage-based, seat-based, tiered, flat-rate, freemium,
          trial-led, pay-as-you-go, credit-based, enterprise, donation/open-source support, or hybrid?"
        - "Why this model?"
        - "What models are rejected or deferred?"
        - "What assumptions must be validated?"
    - id: "packaging-strategy"
      title: "Packaging Strategy"
      intent: "Define how value is bundled, gated, limited, expanded, or excluded."
      required: true
      outputGuidance:
        - "Explain packaging logic before listing plans."
        - "Separate feature gating, usage limits, support levels, add-ons, and entitlements."
        - "State what is intentionally excluded or deferred."
      qualityChecks:
        - "Packaging is understandable to customers."
        - "Packaging reflects value and support burden."
        - "Packaging does not require unsupported capabilities."
      questions: &a5
        - "How is the offer packaged?"
        - "What is bundled?"
        - "What is gated?"
        - "What is limited?"
        - "What is unlimited?"
        - "What is offered as add-on?"
        - "What is excluded or deferred?"
    - id: "plan-structure"
      title: "Plan Structure"
      intent: "Define plans/packages, target customers, price, billing cycle, included capabilities, limits, entitlements,
        support levels, and status."
      required: true
      outputGuidance:
        - "Use plan records for each plan/package."
        - "Include side-by-side comparison if multiple plans exist."
        - "Mark plan prices and limits as committed, hypothesis, experimental, or review-needed."
      qualityChecks:
        - "Each plan has a clear target customer."
        - "Plan differences are meaningful and understandable."
        - "Entitlements and support implications are explicit."
      questions: &a6
        - "What packages or plans are offered?"
        - "Who is each plan for?"
        - "What is the price and billing cycle?"
        - "What capabilities and limits are included?"
        - "What support level applies?"
        - "How do plans compare side by side?"
    - id: "feature-and-limit-mapping"
      title: "Feature and Limit Mapping"
      intent: "Map features, limits, entitlements, and gates to plans with rationale and enforcement implications."
      required: true
      outputGuidance:
        - "Use feature limit records for material capabilities and limits."
        - "Classify limits as value-aligned, cost-control, support-control, abuse-control, or positioning-driven."
        - "Tie enforcement to Product/Engineering where relevant."
      qualityChecks:
        - "Feature gates are justified."
        - "Limits are enforceable and understandable."
        - "Customer impact and support impact are considered."
      questions: &a7
        - "Which features or capabilities belong in each plan?"
        - "What limits apply?"
        - "Why does each feature or limit belong there?"
        - "How are limits enforced?"
        - "What customer, cost, support, or upgrade implication follows?"
    - id: "free-tier-strategy"
      title: "Free Tier Strategy"
      intent: "Define whether a free tier exists and how it supports GTM without creating unsustainable cost or support
        burden."
      required: true
      outputGuidance:
        - "State whether free tier is active, deferred, rejected, or experimental."
        - "Define inclusion, exclusion, abuse risk, support expectation, and upgrade path."
        - "Explain why free exists if included."
      qualityChecks:
        - "Free tier has strategic purpose."
        - "Cost, abuse, and support risks are addressed."
        - "Upgrade path is explicit."
      questions: &a8
        - "Is there a free tier?"
        - "What does it include and exclude?"
        - "Why should a free tier exist?"
        - "What abuse, spam, cost, or support risk does it create?"
        - "What is the upgrade path?"
        - "What metric determines whether the free tier works?"
    - id: "trial-strategy"
      title: "Trial Strategy"
      intent: "Define trial terms, access, conversion path, onboarding, reminders, payment requirement, cancellation behavior,
        and abuse risk."
      required: true
      outputGuidance:
        - "Use trial records where useful."
        - "State whether trial is active, deferred, rejected, or experimental."
        - "Tie trial to onboarding and activation."
      qualityChecks:
        - "Trial leads users to meaningful value."
        - "Trial conversion path is explicit."
        - "Trial abuse and support expectations are addressed."
      questions: &a9
        - "Is there a trial?"
        - "How long is the trial?"
        - "What features are included?"
        - "Is payment required upfront?"
        - "What onboarding and reminders support trial conversion?"
        - "What happens at trial end?"
        - "What abuse or support risk exists?"
    - id: "subscription-terms"
      title: "Subscription Terms"
      intent: "Define billing cycles, renewals, commitments, failed payments, grace periods, invoices, receipts, and
        subscription communications."
      required: true
      outputGuidance:
        - "Use billing term records for material terms."
        - "Separate monthly, annual, trial, grace, renewal, failed payment, invoice, and cancellation terms."
        - "Mark legal/accounting review needs."
      qualityChecks:
        - "Terms are clear and customer-safe."
        - "Failed payment and renewal behavior are not ignored."
        - "Review-needed terms are not treated as final."
      questions: &a10
        - "What billing cycles exist?"
        - "How do renewals work?"
        - "Are there contracts or commitments?"
        - "What grace period applies?"
        - "What happens on failed payment?"
        - "How are invoices and receipts handled?"
        - "What customer communications are required?"
    - id: "payment-flow"
      title: "Payment Flow"
      intent: "Define checkout, payment methods, processor, account creation order, entitlement activation, failure states,
        analytics, and support fallback."
      required: true
      outputGuidance:
        - "Use payment flow records for material steps."
        - "Tie payment flow to Conversion Funnel and Engineering."
        - "Include failure states and support fallback."
      qualityChecks:
        - "Payment flow is clear and technically feasible."
        - "Entitlement activation is explicit."
        - "Payment failures are handled."
      questions: &a11
        - "How does the customer pay?"
        - "What payment methods and processors are used?"
        - "Does account creation happen before or after payment?"
        - "When are entitlements activated?"
        - "What happens if payment fails?"
        - "What analytics events are emitted?"
        - "What support fallback exists?"
    - id: "tax-and-invoice-considerations"
      title: "Tax and Invoice Considerations"
      intent: "Identify tax, invoicing, receipt, jurisdiction, and review implications without inventing legal/accounting
        conclusions."
      required: true
      outputGuidance:
        - "State known requirements and unknowns."
        - "Mark professional review needs."
        - "Tie implications to payment processor and support."
      qualityChecks:
        - "Tax and invoice claims are not overstated."
        - "Review-needed areas are explicit."
        - "Customer-facing invoice/receipt expectations are considered."
      questions: &a12
        - "What tax or invoice considerations apply?"
        - "What invoices or receipts must customers receive?"
        - "What jurisdictions or customer locations create uncertainty?"
        - "What must the payment processor support?"
        - "What requires accounting/legal review?"
    - id: "discount-strategy"
      title: "Discount Strategy"
      intent: "Define discounts, eligibility, purpose, approval, duration, tracking, expiration, and risks."
      required: true
      outputGuidance:
        - "Use discount records for material discounts."
        - "State which discounts are allowed, deferred, or prohibited."
        - "Include approval and expiration rules."
      qualityChecks:
        - "Discounts have strategic purpose."
        - "Discounting does not silently destroy positioning or operations."
        - "Discount usage is trackable."
      questions: &a13
        - "What discounts are allowed?"
        - "Is there an annual, early adopter, founder/customer development, volume, nonprofit, education, partner, or coupon
          discount?"
        - "Who qualifies?"
        - "Who approves discounts?"
        - "When do discounts expire?"
        - "What risks do discounts create?"
    - id: "upgrade-and-downgrade-logic"
      title: "Upgrade and Downgrade Logic"
      intent: "Define plan changes, entitlement changes, billing/proration, data access, customer communication, support
        impact, edge cases, and analytics."
      required: true
      outputGuidance:
        - "Use plan change records for upgrade and downgrade rules."
        - "Separate customer path from system behavior."
        - "Include edge cases and support impact."
      qualityChecks:
        - "Plan changes are customer-safe and technically feasible."
        - "Downgrade does not accidentally destroy or hide data without policy."
        - "Billing and entitlement behavior are explicit."
      questions: &a14
        - "How does a customer upgrade?"
        - "How does a customer downgrade?"
        - "What triggers upgrade or downgrade?"
        - "What happens to entitlements?"
        - "What happens to billing or proration?"
        - "What happens to data access and feature access?"
        - "What communication and support are required?"
    - id: "cancellation-logic"
      title: "Cancellation Logic"
      intent: "Define cancellation flow, access timing, data export/deletion, feedback capture, win-back, support escalation,
        and analytics."
      required: true
      outputGuidance:
        - "Use plan change records for cancellation when useful."
        - "Tie cancellation to customer trust and data rights."
        - "Separate cancellation from refund and deletion."
      qualityChecks:
        - "Cancellation is clear and not hostile."
        - "Data export/deletion options are considered."
        - "Feedback and analytics are captured without creating friction."
      questions: &a15
        - "What is the cancellation flow?"
        - "When does access end?"
        - "What data export or deletion option is offered?"
        - "What cancellation feedback is captured?"
        - "Is there a win-back or pause option?"
        - "What support escalation is available?"
        - "What analytics event marks cancellation?"
    - id: "refund-policy"
      title: "Refund Policy"
      intent: "Define refund eligibility, window, process, exceptions, abuse prevention, communication, and support
        escalation."
      required: true
      outputGuidance:
        - "State policy as committed, hypothesis, or review-needed."
        - "Separate customer experience from operational process."
        - "Mark accounting/legal review needs where relevant."
      qualityChecks:
        - "Refund policy is customer-safe and operationally feasible."
        - "Exceptions and abuse prevention are considered."
        - "Review-needed areas are explicit."
      questions: &a16
        - "Is there a refund policy?"
        - "What refund window applies?"
        - "Who is eligible?"
        - "What exceptions exist?"
        - "How are refunds requested and processed?"
        - "What abuse prevention is needed?"
        - "What communication and support escalation apply?"
    - id: "pricing-objections"
      title: "Pricing Objections"
      intent: "Anticipate pricing objections and prepare honest, claim-safe responses."
      required: true
      outputGuidance:
        - "Use pricing objection records for material objections."
        - "Tie responses to Messaging, Sales Strategy, proof, and claim boundaries."
        - "Do not answer price objections by overpromising value."
      qualityChecks:
        - "Objections reveal underlying concern."
        - "Responses are honest and evidence-aware."
        - "Escalation path and asset needs are explicit."
      questions: &a17
        - "What pricing objections are anticipated?"
        - "What concern sits underneath each objection?"
        - "How should each objection be handled?"
        - "What proof or evidence supports the response?"
        - "What caveat must be stated?"
        - "What asset or escalation is needed?"
    - id: "pricing-experiments"
      title: "Pricing Experiments"
      intent: "Define experiments to validate price, package, value metric, trial, discount, billing cycle, or payment flow
        assumptions."
      required: true
      outputGuidance:
        - "Use pricing experiment records."
        - "Each experiment should test one assumption."
        - "Define success/failure thresholds and next decision."
      qualityChecks:
        - "Experiments are decision-linked."
        - "Instrumentation is defined."
        - "Experiments do not create customer confusion or unfairness without controls."
      questions: &a18
        - "What pricing experiments are planned?"
        - "What hypothesis does each experiment test?"
        - "What segment is included?"
        - "What changes: price, package, trial, discount, billing cycle, payment flow, or value metric?"
        - "What metric and threshold determine success or failure?"
        - "What is the next decision after the experiment?"
    - id: "pricing-metrics"
      title: "Pricing Metrics"
      intent: "Define metrics that measure whether pricing and packaging are working commercially and operationally."
      required: true
      outputGuidance:
        - "Use pricing metric records."
        - "Separate conversion, revenue, retention, expansion, discount, payment, refund, support, and learning metrics."
        - "Tie metrics to GTM Analytics."
      qualityChecks:
        - "Metrics are formula-defined and decision-linked."
        - "Operational burden is measured, not ignored."
        - "Targets are not invented without assumption labels."
      questions: &a19
        - "What metrics measure pricing performance?"
        - "What conversion, trial-to-paid, ARPU/ARPA, churn, expansion, downgrade, failed payment, refund, discount usage,
          support burden, and willingness-to-pay metrics matter?"
        - "What is the formula and data source?"
        - "What threshold changes the pricing decision?"
        - "How are metrics segmented by cohort, segment, channel, plan, or experiment?"
    - id: "pricing-risks"
      title: "Pricing Risks"
      intent: "Identify what could make pricing fail commercially, operationally, technically, legally, or reputationally."
      required: true
      outputGuidance:
        - "Use pricing risk records for material risks."
        - "Include early signal, mitigation, contingency, downstream document, and launch impact."
        - "Separate risk from unresolved question."
      qualityChecks:
        - "Risks are concrete and monitorable."
        - "Risks include operational, support, payment, tax, entitlement, and reputation dimensions."
        - "Mitigation and contingency are distinct."
      questions: &a20
        - "What could make the pricing model fail?"
        - "What could indicate underpricing or overpricing?"
        - "What could make the value metric wrong?"
        - "What free/trial/discount risks exist?"
        - "What payment, tax, entitlement, support, or refund risks exist?"
        - "What would trigger a pricing review?"
    - id: "downstream-handoff"
      title: "Downstream Handoff"
      intent: "Define what downstream GTM and Operations documents must inherit from Pricing and Packaging and what they must
        not assume."
      required: true
      outputGuidance:
        - "Route pricing outputs to the correct downstream documents."
        - "Separate content, partnerships, experiments, analytics, GTM risk, customer success, support, release,
          operations, and risk implications."
        - "Preserve unresolved pricing questions, review-needed terms, and unsupported assumptions."
      qualityChecks:
        - "Handoff items are concrete and document-targeted."
        - "Downstream documents are not allowed to invent missing pricing assumptions silently."
        - "Pricing strategy and downstream implementation remain distinct."
      questions: &a21
        - "What should Content Strategy inherit?"
        - "What should Partnerships and Distribution inherit?"
        - "What should Growth Experiments inherit?"
        - "What should GTM Analytics inherit?"
        - "What should GTM Risks inherit?"
        - "What should Customer Success and Support Model inherit?"
        - "What should Release Management, Operating Model, and Risk Management inherit?"
        - "What unresolved pricing questions must be carried forward?"
