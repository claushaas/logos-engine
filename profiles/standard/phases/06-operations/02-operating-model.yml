document:
  id: "02-operating-model"
  title: "Operating Model"
  phase: "06-operations"
  status: "not_started"
  order: 2
  type: "operating_model"
  purpose: "Define how the project operates day to day, including ownership, responsibilities, rhythms, workflows, manual operations, automated operations, third-party dependencies, decisions, escalation, metrics, constraints, risks, and downstream operational handoffs."
  centralQuestion: "How does the project function day to day in a way that is reliable, supportable, maintainable, accountable, and sustainable?"
  outputs:
    canonical:
      format: "markdown"
      path: "docs/06-operations/02-operating-model.md"
      purpose: "Store the canonical operating model as a Markdown document."
    artifacts:
      - id: "operations.operating_model_map"
        format: "html"
        path: "outcomes/html/06-operations/operating-model-map.html"
        purpose: "Provide a founder-facing operating model map covering operating principles, ownership, functions, cadences, workflows, manual operations, automation, dependencies, decisions, escalation, metrics, constraints, risks, and downstream handoff."
        audience: "founder"
        includes:
          - "operating objective"
          - "operating principles"
          - "operating scope"
          - "ownership model"
          - "roles and responsibilities"
          - "operating cadences"
          - "core operational functions"
          - "manual operations"
          - "automated operations"
          - "third-party dependencies"
          - "standard workflows"
          - "decision rights"
          - "escalation paths"
          - "operational metrics"
          - "operating constraints"
          - "operating model risks"
          - "downstream handoff"
        generationMode: "regenerate_from_canonical"
    agentPacks:
      - id: "operations.operating_model_review_prompt"
        format: "markdown"
        path: "outcomes/agents/06-operations/operating-model-review-prompt.md"
        purpose: "Provide compact context for agents reviewing whether the operating model is executable, owner-aware, cadence-aware, risk-aware, automation-aware, supportable, and properly handed off to downstream Operations documents."
        agentRole: "reviewer"
        includes:
          - "canonical operating model"
          - "operations brief dependency"
          - "product dependency"
          - "engineering dependency"
          - "GTM dependency"
          - "operating model formats"
          - "completion criteria"
          - "quality checks"
          - "review rules"
  dependsOn:
    - "01-foundation/04-principles"
    - "01-foundation/05-boundaries"
    - "01-foundation/06-success-definition"
    - "03-product/08-product-scope"
    - "03-product/11-non-functional-requirements"
    - "03-product/13-acceptance-criteria"
    - "04-engineering/02-system-architecture"
    - "04-engineering/08-security-and-privacy"
    - "04-engineering/10-testing-strategy"
    - "04-engineering/11-observability"
    - "04-engineering/12-deployment-and-environments"
    - "04-engineering/13-engineering-standards"
    - "04-engineering/14-technical-risks"
    - "05-go-to-market/07-launch-plan"
    - "05-go-to-market/10-pricing-and-packaging"
    - "05-go-to-market/12-growth-metrics"
    - "05-go-to-market/13-go-to-market-risks"
    - "06-operations/01-operations-brief"
  feeds:
    - "06-operations/03-customer-success"
    - "06-operations/04-support-model"
    - "06-operations/05-maintenance-plan"
    - "06-operations/06-release-management"
    - "06-operations/07-incident-response"
    - "06-operations/08-data-and-privacy-operations"
    - "06-operations/09-financial-operations"
    - "06-operations/10-risk-management"
  inputs:
    - id: "operations-brief"
      type: "context"
      required: false
      description: "Operations objective, product/service context, ownership model, critical operational functions, service expectations, support expectations, incident expectations, maintenance expectations, release expectations, constraints, success criteria, and risks."
    - id: "product-context"
      type: "context"
      required: false
      description: "Product scope, NFRs, acceptance criteria, user-facing promises, supportable capabilities, deferred capabilities, and operational implications."
    - id: "engineering-context"
      type: "context"
      required: false
      description: "Architecture, security/privacy model, testing strategy, observability, deployment/environments, engineering standards, technical risks, manual runbooks, automation candidates, and third-party dependencies."
    - id: "gtm-context"
      type: "context"
      required: false
      description: "Launch plan, pricing and packaging, growth metrics, GTM risks, customer promises, support load, billing/payment operations, and operational burden created by GTM."
    - id: "operating-model-notes"
      type: "manual_note"
      required: false
      description: "Known routines, owner assumptions, manual tasks, automation ideas, vendor dependencies, decision bottlenecks, escalation preferences, cadence preferences, tooling, and unresolved operating model questions."
  completionCriteria:
    - "The central question is answered through an executable day-to-day operating model with ownership, roles, cadences, workflows, decisions, escalation, metrics, constraints, risks, and handoffs."
    - "Operating objective defines what day-to-day operation must preserve: reliability, supportability, maintainability, accountability, service quality, data/privacy, release safety, cost discipline, and sustainability."
    - "Operating principles define how operational trade-offs are resolved across speed, quality, cost, safety, privacy, customer trust, automation, manual work, and sustainability."
    - "Operating scope defines what the operating model covers, what is shared with Product/Engineering/GTM, what is out of scope, what is deferred, and what is explicitly unknown."
    - "Ownership model defines primary owners, backup owners, escalation owners, decision rights, responsibility boundaries, owner gaps, and transition rules."
    - "Roles and responsibilities define operational roles, recurring responsibilities, authority, interfaces, expected outputs, and handoff rules."
    - "Operating cadences define daily, weekly, monthly, release-cycle, launch-window, incident-triggered, risk-review, maintenance, support, and financial review rhythms where relevant."
    - "Core operational functions define each recurring operational function, purpose, cadence, owner, backup, trigger, health signal, failure signal, required tools, fallback, and downstream document."
    - "Manual operations define human-run tasks, trigger, steps, owner, checklist/runbook, expected evidence, error risk, fallback, automation candidate status, and review cadence."
    - "Automated operations define scripts, jobs, integrations, monitors, alerts, syncs, reports, billing/payment automations, support automations, and deployment automations, including owner, trigger, failure signal, and fallback."
    - "Third-party dependencies define vendors/platforms/tools, operational purpose, criticality, owner, failure mode, blast radius, monitoring, fallback, cost/capacity concern, and exit/replacement consideration."
    - "Standard workflows define recurring workflows with trigger, input, steps, owner, tool, output, SLA/internal target, quality check, escalation rule, and downstream handoff."
    - "Decision rights define which operational decisions are automatic, owner-decided, escalation-required, founder-required, product-required, engineering-required, legal/compliance-review-needed, or risk-acceptance-required."
    - "Escalation paths define escalation levels, triggers, severity, communication channel, owner, decision required, response expectation, customer communication, and downstream procedure."
    - "Operational metrics define operating health, support load, release quality, incident trend, maintenance freshness, automation reliability, cost/capacity, privacy/security, and risk indicators."
    - "Operating constraints define staffing, budget, tooling, vendors, technical, compliance/legal, privacy, security, process, knowledge, manual work, support, and time constraints."
    - "Operating model risks define failure modes such as owner gaps, manual-process overload, automation failure, vendor failure, weak escalation, poor documentation, support overload, release bottlenecks, data/privacy drift, and cost/capacity overload."
    - "Downstream handoff clarifies what Customer Success, Support Model, Maintenance Plan, Release Management, Incident Response, Data/Privacy Operations, Financial Operations, and Risk Management must inherit."
  qualityChecks:
    - "Avoid vague claims."
    - "Avoid operating-model theater: role names, cadences, or workflows without owner, trigger, expected output, signal, tool, fallback, escalation, and downstream handoff."
    - "Avoid ownerless functions, ownerless manual tasks, ownerless automations, ownerless vendor dependencies, ownerless metrics, and ownerless escalation paths."
    - "Avoid treating manual work as free, invisible, or infinitely scalable."
    - "Avoid automating before the manual workflow is understood, unless automation is required for safety, reliability, privacy, or scale."
    - "Avoid promising operational response times, uptime, support expectations, privacy handling, or release cadence that the current team, tooling, architecture, or budget cannot sustain."
    - "Avoid hiding third-party dependency risk, vendor lock-in, cost exposure, data access, privacy constraints, or platform limitations."
    - "Avoid duplicating detailed procedures that belong in Support, Maintenance, Release, Incident Response, Data/Privacy, Financial Operations, or Risk Management."
    - "Avoid importing unresolved assumptions from Operations Brief, Engineering, GTM, or Product as operational facts."
    - "Prefer decision-useful statements."
    - "Make assumptions explicit."
    - "Do not invent team capacity, vendor guarantees, automation reliability, support SLAs, escalation coverage, cost numbers, or compliance status."
    - "Operating model must preserve Foundation boundaries, product truth, technical truth, GTM promises, privacy/security constraints, support capacity, cost discipline, and sustainability."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
    - "Separate role, owner, function, cadence, workflow, manual step, automation, dependency, decision, escalation, metric, constraint, risk, and handoff."
    - "Tie operating model claims to Operations Brief, Product, Engineering, GTM, Technical Risks, GTM Risks, Observability, Deployment, Pricing, Launch Plan, Growth Metrics, or Decision Record where possible."
    - "Classify operational items as current, required, deferred, manual, automated, automation-candidate, blocked, review-needed, launch-critical, post-launch, or downstream-owned where useful."
    - "State where detailed procedure belongs downstream instead of overloading this document."
    - "Flag every unresolved owner, cadence, tool, threshold, or escalation rule as an operating gap."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with Operations Brief, Foundation, Product, Acceptance Criteria, NFRs, Security/Privacy, Testing, Observability, Deployment, Technical Risks, Launch Plan, Pricing, Growth Metrics, GTM Risks, or Decision Record."
    - "Flag operational functions without owner, cadence, trigger, health signal, failure signal, fallback, and downstream document."
    - "Flag workflows without input, output, owner, tool, quality check, escalation rule, and handoff."
    - "Flag manual operations without documentation, expected evidence, error risk, fallback, and automation-candidate status."
    - "Flag automations without owner, trigger, failure signal, monitoring, fallback, and review cadence."
    - "Flag third-party dependencies without criticality, failure mode, blast radius, monitoring, fallback, and exit/replacement consideration."
    - "Flag decision rights that leave approval ambiguous for operational, product, engineering, risk, compliance/legal, support, or customer-facing decisions."
    - "Verify that downstream Operations documents receive concrete handoff inputs."
    - "Flag content that belongs better in Customer Success, Support Model, Maintenance Plan, Release Management, Incident Response, Data/Privacy Operations, Financial Operations, or Risk Management."
  specializedFormats:
    operatingFunctionFormat:
      description: "Recommended format for core operational functions."
      fields:
        - function
        - purpose
        - cadence
        - trigger
        - primaryOwner
        - backupOwner
        - requiredTools
        - healthSignal
        - failureSignal
        - fallback
        - escalationPath
        - downstreamDocument
        - status
    roleResponsibilityFormat:
      description: "Recommended format for operational roles and responsibilities."
      fields:
        - role
        - purpose
        - responsibilities
        - decisionRights
        - recurringOutputs
        - interfaces
        - backupRole
        - escalationRole
        - unresolvedGaps
        - status
    cadenceFormat:
      description: "Recommended format for operating cadences."
      fields:
        - cadence
        - frequency
        - purpose
        - participants
        - inputs
        - outputs
        - owner
        - escalationCondition
        - downstreamDocument
        - status
    workflowFormat:
      description: "Recommended format for standard operational workflows."
      fields:
        - workflow
        - purpose
        - trigger
        - inputs
        - steps
        - owner
        - tools
        - expectedOutput
        - qualityCheck
        - internalTargetOrSLA
        - escalationRule
        - downstreamHandoff
        - status
    manualOperationFormat:
      description: "Recommended format for manual operations."
      fields:
        - operation
        - purpose
        - trigger
        - stepsReference
        - owner
        - expectedEvidence
        - frequency
        - errorRisk
        - fallback
        - automationCandidate
        - reviewCadence
        - downstreamDocument
        - status
    automationFormat:
      description: "Recommended format for automated operations."
      fields:
        - automation
        - purpose
        - toolOrSystem
        - trigger
        - schedule
        - owner
        - monitoredSignal
        - failureSignal
        - fallback
        - dataTouched
        - privacyOrSecurityConcern
        - reviewCadence
        - status
    dependencyFormat:
      description: "Recommended format for third-party dependencies."
      fields:
        - dependency
        - dependencyType
        - operationalPurpose
        - criticality
        - owner
        - failureMode
        - blastRadius
        - monitoringMethod
        - fallback
        - costOrCapacityConcern
        - dataOrPrivacyConcern
        - exitOrReplacementConsideration
        - status
    decisionRightFormat:
      description: "Recommended format for operational decision rights."
      fields:
        - decisionCategory
        - decisionExamples
        - defaultOwner
        - approvalRequired
        - escalationRequired
        - riskAcceptanceRequired
        - documentationRequired
        - downstreamDocument
        - status
    escalationPathFormat:
      description: "Recommended format for escalation paths."
      fields:
        - escalationLevel
        - trigger
        - severity
        - owner
        - backupOwner
        - communicationChannel
        - responseExpectation
        - decisionRequired
        - customerCommunicationRequired
        - downstreamProcedure
        - status
    operatingMetricFormat:
      description: "Recommended format for operating model metrics."
      fields:
        - metric
        - metricType
        - purpose
        - formulaOrMeasurement
        - source
        - threshold
        - cadence
        - owner
        - decisionImplication
        - downstreamDocument
        - status
    operatingRiskFormat:
      description: "Recommended format for operating model risks."
      fields:
        - risk
        - riskType
        - source
        - affectedArea
        - likelihood
        - impact
        - earlySignal
        - mitigation
        - contingency
        - owner
        - downstreamDocument
        - status
    operatingHandoffFormat:
      description: "Recommended format for downstream operating handoffs."
      fields:
        - handoffTarget
        - contextToPreserve
        - requiredAction
        - owner
        - timing
        - unresolvedQuestion
        - riskOrConstraint
        - status
  sections:
    - id: "operating-objective"
      title: "Operating Objective"
      intent: "Define what the day-to-day operating model must preserve and optimize."
      required: true
      outputGuidance:
        - "Open with the operating objective in one concise paragraph."
        - "Connect day-to-day operation to reliability, supportability, maintainability, accountability, cost discipline, data/privacy, and customer trust."
        - "State what this operating model intentionally does not cover in detail."
      qualityChecks:
        - "Objective is specific enough to guide roles, cadences, and workflows."
        - "Objective is grounded in Operations Brief."
        - "Detailed procedures are routed downstream."
      questions:
        - "What must the operating model preserve day to day?"
        - "What does reliable and sustainable daily operation mean for this project?"
        - "What should this document intentionally not detail?"
    - id: "operating-principles"
      title: "Operating Principles"
      intent: "Establish principles that guide day-to-day operational decisions and trade-off resolution."
      required: true
      outputGuidance:
        - "Define practical operating principles."
        - "Explain how trade-offs are resolved across speed, cost, quality, safety, privacy, customer trust, and sustainability."
        - "Tie principles to Foundation and Operations Brief."
      qualityChecks:
        - "Principles are actionable, not slogans."
        - "Trade-off rules are explicit."
        - "Principles constrain operational behavior."
      questions:
        - "What principles guide day-to-day operational decisions?"
        - "How are trade-offs between speed, cost, quality, safety, privacy, customer trust, and sustainability resolved?"
        - "What operational behaviors are explicitly discouraged?"
    - id: "operating-scope"
      title: "Operating Scope"
      intent: "Define what this operating model covers, excludes, shares, defers, or hands off downstream."
      required: true
      outputGuidance:
        - "Separate inside scope, outside scope, shared scope, deferred scope, and downstream-owned scope."
        - "Clarify interfaces with Product, Engineering, GTM, Support, Customer Success, Finance, and Risk Management."
        - "Preserve unresolved scope questions."
      qualityChecks:
        - "Scope prevents ambiguity."
        - "Shared ownership areas are visible."
        - "Deferred areas are explicit."
      questions:
        - "What does the operating model cover?"
        - "What is explicitly outside this operating model?"
        - "What responsibilities are shared with Product, Engineering, GTM, Support, Customer Success, Finance, or Risk Management?"
        - "What is deferred or unresolved?"
    - id: "ownership-model"
      title: "Ownership Model"
      intent: "Define primary ownership, backup ownership, escalation ownership, decision rights, and ownership gaps across operational areas."
      required: true
      outputGuidance:
        - "Use ownership records where useful."
        - "Flag owner gaps instead of assuming coverage."
        - "State how ownership changes over time or during incidents/releases."
      qualityChecks:
        - "Critical areas are not ownerless."
        - "Backup and escalation ownership are considered."
        - "Decision rights are connected to ownership."
      questions:
        - "Who owns each operational area?"
        - "Who is backup owner?"
        - "Who owns escalation?"
        - "What decision rights does each owner have?"
        - "What ownership gaps remain?"
    - id: "roles-and-responsibilities"
      title: "Roles and Responsibilities"
      intent: "Define operational roles, recurring responsibilities, authority, outputs, interfaces, and handoff expectations."
      required: true
      outputGuidance:
        - "Use role responsibility records for relevant roles."
        - "Define roles even when a single person temporarily fills multiple roles."
        - "Avoid implying unavailable headcount."
      qualityChecks:
        - "Roles are functional, not merely titles."
        - "Responsibilities and outputs are explicit."
        - "Temporary role consolidation is clear."
      questions:
        - "What operational roles exist?"
        - "What responsibilities does each role hold?"
        - "What decisions can each role make?"
        - "What recurring outputs does each role produce?"
        - "What interfaces and handoffs does each role manage?"
    - id: "operating-cadences"
      title: "Operating Cadences"
      intent: "Define the rhythms by which operations are reviewed, executed, adjusted, and escalated."
      required: true
      outputGuidance:
        - "Use cadence records for material cadences."
        - "Include daily, weekly, monthly, release-cycle, launch-window, maintenance, support, incident-triggered, risk-review, and financial cadences where relevant."
        - "State participants, inputs, outputs, owner, and escalation condition."
      qualityChecks:
        - "Cadences produce decisions or outputs."
        - "Cadences are not ritual overhead without purpose."
        - "Escalation triggers are explicit."
      questions:
        - "What daily, weekly, monthly, release, launch-window, maintenance, support, incident, risk-review, or financial cadences exist?"
        - "Who participates?"
        - "What inputs and outputs are expected?"
        - "Who owns each cadence?"
        - "What triggers escalation outside the cadence?"
    - id: "core-operational-functions"
      title: "Core Operational Functions"
      intent: "Enumerate functions performed daily, weekly, monthly, or event-triggered with clear accountability and health/failure signals."
      required: true
      outputGuidance:
        - "Use operating function records for material functions."
        - "Include cadence, trigger, owner, backup, tools, health signal, failure signal, fallback, escalation, and downstream document."
        - "Group functions by area where useful."
      qualityChecks:
        - "Each function is operationally specific."
        - "Accountability and fallback are explicit."
        - "Health and failure are observable."
      questions:
        - "Which functions must be performed daily, weekly, monthly, or event-triggered?"
        - "Who is accountable for each function?"
        - "What tools are required?"
        - "What indicates each function is healthy?"
        - "What indicates each function is failing?"
        - "What fallback or escalation exists?"
    - id: "manual-operations"
      title: "Manual Operations"
      intent: "Identify operations requiring human intervention, how they are documented, how they are executed, and whether they should eventually be automated."
      required: true
      outputGuidance:
        - "Use manual operation records."
        - "Include trigger, steps reference, owner, expected evidence, frequency, error risk, fallback, automation candidate status, review cadence, and downstream document."
        - "Do not hide manual work."
      qualityChecks:
        - "Manual operations are documented enough to execute."
        - "Error risk and fallback are explicit."
        - "Automation candidacy is considered but not forced."
      questions:
        - "Which operations require human intervention?"
        - "What triggers each manual operation?"
        - "Where are manual steps documented?"
        - "Who executes them?"
        - "What evidence proves completion?"
        - "What error risk exists?"
        - "Should any manual step become automated later?"
    - id: "automated-operations"
      title: "Automated Operations"
      intent: "Identify automated operations, candidate automations, tools, triggers, monitoring, failure signals, fallback, and review cadence."
      required: true
      outputGuidance:
        - "Use automation records."
        - "Include scripts, scheduled jobs, integrations, alerts, syncs, reports, deployments, billing/payment automations, support automations, and data/privacy automations where relevant."
        - "State what is automated now versus automation candidate."
      qualityChecks:
        - "Automations have owner and monitoring."
        - "Failure signals and fallbacks are explicit."
        - "Automations touching data/privacy are flagged."
      questions:
        - "Which operations are automated?"
        - "Which operations should be automated later?"
        - "What tools, scripts, jobs, integrations, or platforms run them?"
        - "What triggers or schedules them?"
        - "How is automation failure detected?"
        - "What fallback exists when automation fails?"
    - id: "third-party-dependencies"
      title: "Third-Party Dependencies"
      intent: "List critical third-party services and the operational impact of each dependency being degraded, unavailable, expensive, or replaced."
      required: true
      outputGuidance:
        - "Use dependency records for material dependencies."
        - "Include operational purpose, criticality, owner, failure mode, blast radius, monitoring, fallback, cost/capacity concern, data/privacy concern, and exit/replacement consideration."
        - "Do not treat vendor availability as guaranteed."
      qualityChecks:
        - "Dependency criticality is explicit."
        - "Failure mode and fallback are defined."
        - "Cost, data, privacy, and replacement concerns are considered."
      questions:
        - "Which third-party services are critical to daily operations?"
        - "What operational purpose does each dependency serve?"
        - "What happens when each dependency is unavailable or degraded?"
        - "What is the blast radius?"
        - "How is dependency health monitored?"
        - "What fallback or replacement path exists?"
    - id: "standard-workflows"
      title: "Standard Workflows"
      intent: "Define standard workflows for recurring operational tasks and how they are triggered, tracked, executed, quality-checked, escalated, and handed off."
      required: true
      outputGuidance:
        - "Use workflow records for recurring workflows."
        - "Include trigger, input, steps, owner, tools, expected output, quality check, internal target/SLA, escalation rule, and downstream handoff."
        - "Keep detailed runbooks in downstream docs where appropriate."
      qualityChecks:
        - "Workflows are executable."
        - "Input/output and owner are explicit."
        - "Escalation and quality checks are included."
      questions:
        - "What are the standard workflows for recurring operational tasks?"
        - "How are workflows triggered?"
        - "What inputs and outputs exist?"
        - "Who owns each workflow?"
        - "What tools are used?"
        - "How are workflows tracked, reviewed, quality-checked, and escalated?"
    - id: "decision-rights"
      title: "Decision Rights"
      intent: "Identify operational decisions requiring approval and who holds decision authority by category."
      required: true
      outputGuidance:
        - "Use decision right records."
        - "Separate automatic decisions, owner decisions, escalation-required decisions, founder-required decisions, product/engineering-required decisions, legal/compliance-review-needed decisions, and risk-acceptance-required decisions."
        - "State documentation requirement."
      qualityChecks:
        - "Decision authority is explicit."
        - "Risky decisions have escalation or acceptance path."
        - "Documentation requirements are clear."
      questions:
        - "Which operational decisions require approval?"
        - "Who has authority to make each category of decision?"
        - "Which decisions require escalation?"
        - "Which decisions require risk acceptance?"
        - "Which decisions require product, engineering, legal, compliance, finance, or support review?"
        - "What decisions must be documented?"
    - id: "escalation-paths"
      title: "Escalation Paths"
      intent: "Define how operational issues escalate and the chain of communication per escalation level."
      required: true
      outputGuidance:
        - "Use escalation path records."
        - "Define severity, trigger, owner, backup, communication channel, response expectation, decision required, customer communication, and downstream procedure."
        - "Route detailed incident procedure to Incident Response."
      qualityChecks:
        - "Escalation paths are concrete and actionable."
        - "Customer communication triggers are visible."
        - "Escalation is not dependent on informal memory."
      questions:
        - "How do operational issues escalate?"
        - "What is the chain of communication for each escalation level?"
        - "What trigger or severity applies?"
        - "Who owns response and backup response?"
        - "What decision is required?"
        - "When is customer communication required?"
    - id: "operational-metrics"
      title: "Operational Metrics"
      intent: "Define metrics that indicate whether the operating model is healthy, overloaded, stale, ownerless, risky, or failing."
      required: true
      outputGuidance:
        - "Use operating metric records."
        - "Include support, release, incident, maintenance, automation, dependency, cost/capacity, documentation, data/privacy, and risk indicators where relevant."
        - "Tie metrics to thresholds and decisions."
      qualityChecks:
        - "Metrics are decision-useful."
        - "Metrics have owner, threshold, source, and cadence."
        - "Operational sustainability is measured, not assumed."
      questions:
        - "What metrics show the operating model is healthy?"
        - "What metrics show overload or failure?"
        - "What support, release, incident, maintenance, automation, dependency, cost/capacity, documentation, data/privacy, and risk metrics matter?"
        - "Who owns each metric?"
        - "What threshold triggers action?"
    - id: "operating-constraints"
      title: "Operating Constraints"
      intent: "Catalog budget, tooling, staffing, compliance, contractual, vendor, technical, privacy, support, process, and knowledge constraints on operations."
      required: true
      outputGuidance:
        - "Classify constraints by type and affected area."
        - "State impact, mitigation, owner, downstream document, and status."
        - "Do not treat legal/compliance assumptions as verified unless evidence exists."
      qualityChecks:
        - "Constraints are connected to operational impact."
        - "Constraints are not confused with risks, though they may create risks."
        - "Review-needed constraints are explicit."
      questions:
        - "What budget, tooling, staffing, compliance, contractual, vendor, technical, privacy, support, process, or knowledge constraints limit operations?"
        - "What area does each constraint affect?"
        - "What is the operational impact?"
        - "What mitigation exists?"
        - "What downstream document must inherit the constraint?"
    - id: "operating-model-risks"
      title: "Operating Model Risks"
      intent: "Identify failure modes of the operating model and how they are detected, mitigated, escalated, or handed off."
      required: true
      outputGuidance:
        - "Use operating risk records."
        - "Include owner gaps, manual overload, automation failure, vendor failure, weak escalation, documentation drift, support overload, release bottlenecks, data/privacy drift, cost/capacity overload, and handoff failure."
        - "Route risks to Risk Management where needed."
      qualityChecks:
        - "Risks are concrete and monitorable."
        - "Mitigation and contingency are distinct."
        - "High-impact risks have owner and downstream handoff."
      questions:
