document:
  id: "06-business-processes"
  title: "Business Processes"
  phase: "06-operations"
  status: "not_started"
  order: 6
  type: "business_processes"
  purpose: "Define the recurring operational and business processes that must run repeatably, safely, measurably, and accountably across onboarding, billing, cancellation, refunds, feature requests, bug triage, release communication, vendor management, data requests, process review, and continuous improvement."
  centralQuestion: "What recurring business processes must happen, what triggers them, who owns them, what steps and controls apply, and how are they measured, improved, escalated, and handed off?"
  outputs:
    canonical:
      format: "markdown"
      path: "docs/06-operations/06-business-processes.md"
      purpose: "Store the canonical business processes document as a Markdown process catalog."
    artifacts:
      - id: "operations.business_process_catalog"
        format: "html"
        path: "outcomes/html/06-operations/business-process-catalog.html"
        purpose: "Provide a founder-facing business process catalog covering process inventory, triggers, owners, inputs, steps, outputs, controls, SLAs/internal targets, exceptions, metrics, risks, and downstream handoff."
        audience: "founder"
        includes:
          - "process objective"
          - "process taxonomy"
          - "process inventory"
          - "process prioritization"
          - "process ownership"
          - "process trigger model"
          - "standard process format"
          - "onboarding process"
          - "billing process"
          - "payment failure process"
          - "cancellation process"
          - "refund process"
          - "feature request process"
          - "bug triage process"
          - "release communication process"
          - "vendor management process"
          - "data export and deletion process"
          - "process controls"
          - "process metrics"
          - "process review cadence"
          - "process risks"
          - "downstream handoff"
        generationMode: "regenerate_from_canonical"
    agentPacks:
      - id: "operations.business_processes_review_prompt"
        format: "markdown"
        path: "outcomes/agents/06-operations/business-processes-review-prompt.md"
        purpose: "Provide compact context for agents reviewing whether recurring business processes are complete, repeatable, owner-assigned, controlled, measurable, exception-aware, privacy-safe, financially safe, and properly handed off downstream."
        agentRole: "reviewer"
        includes:
          - "canonical business processes"
          - "operations brief dependency"
          - "operating model dependency"
          - "team responsibilities dependency"
          - "customer support dependency"
          - "customer success dependency"
          - "pricing dependency"
          - "data/privacy dependency"
          - "business process formats"
          - "completion criteria"
          - "quality checks"
          - "review rules"
  dependsOn:
    - "01-foundation/04-principles"
    - "01-foundation/05-boundaries"
    - "01-foundation/06-success-definition"
    - "03-product/02-user-personas"
    - "03-product/03-user-journeys"
    - "03-product/08-product-scope"
    - "03-product/10-functional-requirements"
    - "03-product/11-non-functional-requirements"
    - "03-product/13-acceptance-criteria"
    - "04-engineering/05-data-model"
    - "04-engineering/08-security-and-privacy"
    - "04-engineering/10-testing-strategy"
    - "04-engineering/11-observability"
    - "04-engineering/12-deployment-and-environments"
    - "04-engineering/14-technical-risks"
    - "05-go-to-market/07-launch-plan"
    - "05-go-to-market/08-conversion-funnel"
    - "05-go-to-market/10-pricing-and-packaging"
    - "05-go-to-market/12-growth-metrics"
    - "05-go-to-market/13-go-to-market-risks"
    - "06-operations/01-operations-brief"
    - "06-operations/02-operating-model"
    - "06-operations/03-team-and-responsibilities"
    - "06-operations/04-customer-support"
    - "06-operations/05-customer-success"
  feeds:
    - "06-operations/07-maintenance-plan"
    - "06-operations/08-release-management"
    - "06-operations/09-incident-response"
    - "06-operations/10-data-and-privacy-operations"
    - "06-operations/11-financial-operations"
    - "06-operations/12-risk-management"
  inputs:
    - id: "operations-brief"
      type: "context"
      required: false
      description: "Operations objective, product/service context, critical operational functions, service expectations, support expectations, incident expectations, maintenance expectations, release expectations, data/privacy operations, cost/capacity constraints, operational success criteria, and operational risks."
    - id: "operating-model"
      type: "context"
      required: false
      description: "Operating scope, ownership model, roles, cadences, workflows, manual operations, automated operations, dependencies, decision rights, escalation paths, metrics, constraints, and operating model risks."
    - id: "team-and-responsibilities"
      type: "context"
      required: false
      description: "Process owners, backup owners, decision authority, handoff rules, escalation rules, responsibility gaps, future hiring needs, and responsibility risks."
    - id: "customer-support"
      type: "context"
      required: false
      description: "Support intake, ticket categories, priority levels, triage rules, escalation rules, bug reporting flow, known issue handling, refund/billing support, privacy/data requests, support metrics, and support risks."
    - id: "customer-success"
      type: "context"
      required: false
      description: "Onboarding model, activation milestones, customer health signals, retention actions, expansion opportunities, satisfaction measurement, feedback loops, churn analysis, cadences, metrics, and customer success risks."
    - id: "pricing-and-packaging"
      type: "context"
      required: false
      description: "Pricing model, plans, payment flow, subscription terms, billing terms, failed payment handling, cancellation logic, refund policy, discounts, upgrade/downgrade logic, and pricing risks."
    - id: "product-and-engineering-context"
      type: "context"
      required: false
      description: "Product scope, acceptance criteria, data model, security/privacy constraints, observability, deployment, technical risks, bug lifecycle constraints, and automation/integration constraints."
    - id: "business-process-notes"
      type: "manual_note"
      required: false
      description: "Known recurring processes, manual process notes, automation ideas, process pain points, approval rules, exceptions, metrics, process owners, bottlenecks, and unresolved process questions."
  completionCriteria:
    - "The central question is answered through a complete business process catalog with triggers, owners, inputs, steps, outputs, controls, exceptions, targets, metrics, risks, reviews, and handoffs."
    - "Process objective defines what business processes protect: repeatability, customer trust, financial correctness, product learning, supportability, privacy, accountability, and operational sustainability."
    - "Process taxonomy classifies processes by domain, criticality, frequency, customer visibility, privacy sensitivity, financial sensitivity, automation level, owner, and downstream dependency."
    - "Process inventory lists all recurring processes with purpose, trigger, owner, backup owner, frequency, customer impact, business impact, inputs, outputs, controls, metrics, risks, and downstream document."
    - "Process prioritization identifies launch-critical, revenue-critical, trust-critical, privacy-critical, support-critical, manual-heavy, automation-candidate, deferred, and post-launch processes."
    - "Process ownership defines accountable owner, executor, reviewer, approver, backup, escalation owner, decision authority, and responsibility gaps for each material process."
    - "Process trigger model defines event-based, scheduled, customer-requested, system-triggered, support-triggered, billing-triggered, release-triggered, incident-triggered, privacy-triggered, and review-triggered processes."
    - "Standard process format defines required fields for every process: process name, purpose, trigger, owner, inputs, steps, outputs, internal target/SLA, controls, exceptions, escalation, metrics, risks, and downstream handoff."
    - "User onboarding process defines the end-to-end process from signup or purchase to activation, including customer steps, system steps, manual steps, educational assets, stuck signals, support fallback, and success evidence."
    - "Billing process defines how charges are calculated, generated, collected, recorded, reconciled, communicated, failed, retried, escalated, and handed off to Financial Operations."
    - "Payment failure process defines failed payment detection, customer communication, retry logic, grace period, access rules, support handoff, financial handoff, and cancellation or suspension conditions."
    - "Cancellation process defines customer cancellation path, access timing, data/export options, feedback capture, billing consequences, support escalation, retention-safe boundaries, and downstream handoff."
    - "Refund process defines eligibility, intake, verification, approval, exception handling, processor action, customer communication, recording, abuse prevention, and Financial Operations handoff."
    - "Feature request process defines intake, classification, deduplication, evidence capture, prioritization, product review, roadmap linkage, customer follow-up, and closure/no-action rules."
    - "Bug triage process defines intake, reproduction, severity, priority, affected users, privacy constraints, engineering routing, backlog linkage, customer communication, release linkage, and closure criteria."
    - "Release communication process defines internal and external release notices, audience, timing, owner, content, support readiness, known issues, rollback/pause message, and release artifact requirements."
    - "Vendor management process defines vendor selection, onboarding, access, billing, monitoring, review, renewal, security/privacy review, fallback, replacement, and offboarding."
    - "Data export and deletion process defines request intake, identity/authority verification, allowed/prohibited support action, data scope, fulfillment, deletion/export evidence, timeline assumptions, customer communication, logging, and Data/Privacy Operations handoff."
    - "Process controls define checks, approvals, evidence, logs, audit trail, privacy safeguards, financial safeguards, access safeguards, and quality gates for sensitive or critical processes."
    - "Process metrics define completion time, backlog, failure rate, exception rate, rework, customer impact, manual effort, automation reliability, financial error, privacy risk, and process health metrics."
    - "Process review cadence defines when processes are reviewed, who participates, what inputs are reviewed, what outputs are expected, how improvements are prioritized, and how changes are documented."
    - "Process risks identify process gaps, manual overload, missed handoff, unclear ownership, financial error, privacy mishandling, stale process docs, automation failure, vendor failure, support overload, and customer trust risks."
    - "Downstream handoff clarifies what Maintenance Plan, Release Management, Incident Response, Data/Privacy Operations, Financial Operations, and Risk Management must inherit."
  qualityChecks:
    - "Avoid vague claims."
    - "Avoid process theater: process names without trigger, owner, inputs, steps, outputs, control, exception path, metric, risk, and downstream handoff."
    - "Avoid duplicating detailed runbooks better owned by Support, Maintenance, Release, Incident Response, Data/Privacy Operations, Financial Operations, or Risk Management."
    - "Avoid treating manual processes as free, invisible, or infinitely scalable."
    - "Avoid automating a process before the trigger, inputs, owner, exception path, and success evidence are clear, unless automation is required for safety, privacy, billing correctness, or reliability."
    - "Avoid billing, refund, cancellation, invoice, failed payment, or discount processes without authority rules, customer communication, processor behavior, and Financial Operations handoff."
    - "Avoid data export/deletion processes without verification, privacy review, evidence, logging, prohibited actions, and Data/Privacy Operations handoff."
    - "Avoid bug and feature request processes that bypass product/engineering triage, customer communication, prioritization, and closure/no-action rules."
    - "Avoid release communications that ignore support readiness, known issues, rollback/pause messaging, and customer-facing claim boundaries."
    - "Avoid vendor management without access, billing, security/privacy, monitoring, fallback, and offboarding responsibilities."
    - "Prefer decision-useful statements."
    - "Make assumptions explicit."
    - "Do not invent support staffing, processor behavior, legal timelines, tax/accounting obligations, vendor guarantees, automation readiness, SLA guarantees, or compliance status."
    - "Business processes must preserve Foundation boundaries, product truth, technical truth, pricing truth, privacy/security constraints, customer trust, financial correctness, support capacity, and operational sustainability."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
    - "Separate process, trigger, owner, input, step, output, control, exception, approval, metric, risk, review cadence, and handoff."
    - "Tie business processes to Operations Brief, Operating Model, Team and Responsibilities, Customer Support, Customer Success, Product, Engineering, Pricing and Packaging, Growth Metrics, GTM Risks, Technical Risks, or Decision Record where possible."
    - "Classify processes as current, required, deferred, manual, automated, automation-candidate, customer-facing, internal-only, financial-sensitive, privacy-sensitive, launch-critical, post-launch, blocked, review-needed, or downstream-owned where useful."
    - "State whether each process is manual, automated, hybrid, self-serve, support-assisted, customer-success-assisted, engineering-assisted, finance-assisted, or privacy-review-required."
    - "Route detailed execution procedures to downstream Operations documents when they exceed this process catalog's scope."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with Operations Brief, Operating Model, Team and Responsibilities, Customer Support, Customer Success, Product, Acceptance Criteria, Security/Privacy, Observability, Deployment, Technical Risks, Launch Plan, Conversion Funnel, Pricing and Packaging, Growth Metrics, GTM Risks, or Decision Record."
    - "Flag processes without trigger, accountable owner, backup owner, input, steps, output, control, exception path, metric, risk, and downstream handoff."
    - "Flag financial-sensitive processes without authority, evidence, customer communication, exception handling, and Financial Operations handoff."
    - "Flag privacy-sensitive processes without verification, prohibited actions, logging/evidence, escalation, and Data/Privacy Operations handoff."
    - "Flag manual-heavy processes without capacity risk, error risk, review cadence, and automation-candidate status."
    - "Flag automations without owner, monitored signal, failure signal, fallback, privacy/security review, and review cadence."
    - "Flag process metrics without source, owner, threshold, cadence, and decision implication."
    - "Verify that downstream Operations documents receive concrete process handoff inputs."
    - "Flag content that belongs better in Maintenance Plan, Release Management, Incident Response, Data/Privacy Operations, Financial Operations, or Risk Management."
  specializedFormats:
    processFormat:
      description: "Recommended format for recurring business processes."
      fields:
        - process
        - domain
        - purpose
        - trigger
        - frequency
        - customerFacing
        - financialSensitive
        - privacySensitive
        - primaryOwner
        - backupOwner
        - inputs
        - steps
        - outputs
        - internalTargetOrSLA
        - controls
        - exceptionPath
        - escalationPath
        - metrics
        - risks
        - downstreamDocument
        - status
    processOwnershipFormat:
      description: "Recommended format for process ownership."
      fields:
        - process
        - accountableOwner
        - executor
        - reviewer
        - approver
        - backupOwner
        - escalationOwner
        - decisionAuthority
        - responsibilityGap
        - downstreamDocument
        - status
    processTriggerFormat:
      description: "Recommended format for process triggers."
      fields:
        - trigger
        - triggerType
        - source
        - processStarted
        - requiredContext
        - acknowledgementRequired
        - priorityRule
        - owner
        - escalationIfMissed
        - status
    processStepFormat:
      description: "Recommended format for process steps when step-level detail is useful."
      fields:
        - step
        - sequence
        - owner
        - input
        - action
        - output
        - evidenceRequired
        - controlOrCheck
        - exceptionPath
        - status
    processControlFormat:
      description: "Recommended format for process controls."
      fields:
        - control
        - process
        - controlType
        - riskPrevented
        - owner
        - evidenceRequired
        - reviewCadence
        - failureSignal
        - escalationPath
        - status
    processMetricFormat:
      description: "Recommended format for process metrics."
      fields:
        - metric
        - process
        - metricType
        - purpose
        - formulaOrMeasurement
        - source
        - threshold
        - cadence
        - owner
        - decisionImplication
        - downstreamDocument
        - status
    processReviewFormat:
      description: "Recommended format for process review cadences."
      fields:
        - review
        - processOrDomain
        - cadence
        - participants
        - inputs
        - outputs
        - improvementDecision
        - owner
        - documentationUpdateRequired
        - downstreamDocument
        - status
    processRiskFormat:
      description: "Recommended format for process risks."
      fields:
        - risk
        - riskType
        - process
        - source
        - likelihood
        - impact
        - earlySignal
        - mitigation
        - contingency
        - owner
        - downstreamDocument
        - status
    processHandoffFormat:
      description: "Recommended format for downstream process handoffs."
      fields:
        - handoffTarget
        - processContext
        - contextToPreserve
        - requiredAction
        - owner
        - timing
        - unresolvedQuestion
        - riskOrConstraint
        - status
  sections:
    - id: "process-objective"
      title: "Process Objective"
      intent: "Define why recurring business processes must be documented and what operational outcomes they protect."
      required: true
      outputGuidance:
        - "Open with the purpose of the business process catalog."
        - "State what repeatable processes protect: customer trust, financial correctness, privacy, supportability, product learning, accountability, and sustainability."
        - "Clarify that detailed runbooks may live downstream."
      qualityChecks:
        - "Objective is tied to Operations Brief and Operating Model."
        - "The boundary between process catalog and detailed runbook is clear."
        - "Repeatability and accountability are explicit goals."
      questions:
        - "Why must recurring business processes be documented?"
        - "What operational outcomes do they protect?"
        - "What should this process catalog define versus route downstream?"
    - id: "process-taxonomy"
      title: "Process Taxonomy"
      intent: "Define how processes are categorized, prioritized, and labeled."
      required: true
      outputGuidance:
        - "Define process categories and statuses."
        - "Include sensitivity labels for customer-facing, financial-sensitive, privacy-sensitive, support-critical, launch-critical, and automation-candidate processes."
        - "Define current, required, deferred, manual, automated, hybrid, blocked, and review-needed statuses."
      qualityChecks:
        - "Taxonomy helps route, prioritize, and review processes."
        - "Sensitive processes are distinguishable."
        - "Status labels have operational meaning."
      questions:
        - "How are business processes categorized?"
        - "What process statuses exist?"
        - "Which labels indicate customer-facing, financial-sensitive, privacy-sensitive, support-critical, launch-critical, or automation-candidate processes?"
    - id: "process-inventory"
      title: "Process Inventory"
      intent: "Provide the complete list of recurring business processes with categorization, prioritization, owner, trigger, and downstream dependency."
      required: true
      outputGuidance:
        - "Use process records for every material process."
        - "Group processes by domain where useful."
        - "Mark missing, deferred, blocked, or downstream-owned processes explicitly."
      qualityChecks:
        - "Every process has purpose, trigger, owner, and downstream document."
        - "Sensitive and launch-critical processes are flagged."
        - "The list is not just a process wishlist."
      questions:
        - "What is the complete list of recurring business processes?"
        - "How is each process categorized and prioritized?"
        - "Who owns each process?"
        - "What triggers each process?"
        - "What downstream document owns detailed execution?"
    - id: "process-prioritization"
      title: "Process Prioritization"
      intent: "Rank processes by launch criticality, customer impact, financial impact, privacy impact, support impact, manual burden, risk, and automation need."
      required: true
      outputGuidance:
        - "Classify processes as launch-critical, revenue-critical, trust-critical, privacy-critical, support-critical, manual-heavy, automation-candidate, deferred, or post-launch."
        - "State rationale for priority."
        - "Identify process blockers."
      qualityChecks:
        - "Prioritization is operationally justified."
        - "Critical sensitive processes are not deferred without risk acceptance."
        - "Manual burden is considered."
      questions:
        - "Which processes are launch-critical?"
        - "Which processes are revenue-critical, trust-critical, privacy-critical, or support-critical?"
        - "Which processes are manual-heavy or automation candidates?"
        - "Which processes can be deferred?"
        - "What is the risk if a process is missing or immature?"
    - id: "process-ownership"
      title: "Process Ownership"
      intent: "Assign accountable owners, executors, reviewers, approvers, backups, escalation owners, and decision authority for recurring processes."
      required: true
      outputGuidance:
        - "Use process ownership records."
        - "Tie owners to Team and Responsibilities."
        - "Flag owner gaps and backup gaps."
      qualityChecks:
        - "No critical process is ownerless."
        - "Financial/privacy-sensitive processes have approval and escalation rules."
        - "Backup ownership is explicit or flagged."
      questions:
        - "Who owns each business process?"
        - "Who executes, reviews, and approves each process?"
        - "Who is backup owner?"
        - "Who owns escalation?"
        - "What decision authority applies?"
        - "What ownership gaps remain?"
    - id: "process-trigger-model"
      title: "Process Trigger Model"
      intent: "Define how recurring processes start and what context each trigger must provide."
      required: true
      outputGuidance:
        - "Use process trigger records for material triggers."
        - "Classify triggers as event-based, scheduled, customer-requested, system-triggered, support-triggered, billing-triggered, release-triggered, incident-triggered, privacy-triggered, or review-triggered."
        - "Define escalation if a trigger is missed."
      qualityChecks:
        - "Triggers are observable."
        - "Required context is explicit."
        - "Missed-trigger escalation is considered for critical processes."
      questions:
        - "What triggers each business process?"
        - "Which triggers are customer-requested, scheduled, system-triggered, support-triggered, billing-triggered, release-triggered, incident-triggered, privacy-triggered, or review-triggered?"
        - "What context must each trigger include?"
        - "What happens if a trigger is missed?"
    - id: "standard-process-format"
      title: "Standard Process Format"
      intent: "Define the required structure used to document any recurring process."
      required: true
      outputGuidance:
        - "Document the standard fields required for every process."
        - "Include trigger, owner, inputs, steps, outputs, target/SLA, controls, exceptions, escalation, metrics, risks, and handoff."
        - "Use this as the normalization rule for downstream process docs."
      qualityChecks:
        - "Format is complete but not overcomplicated."
        - "Fields support execution, review, and auditability."
        - "Sensitive processes have room for controls and approvals."
      questions:
        - "What fields must every recurring process include?"
        - "How should process steps, inputs, outputs, controls, exceptions, and metrics be represented?"
        - "What fields are mandatory for financial-sensitive or privacy-sensitive processes?"
    - id: "user-onboarding-process"
      title: "User Onboarding Process"
      intent: "Define the end-to-end onboarding process from signup or purchase to activation with clear accountability, success evidence, and fallback."
      required: true
      outputGuidance:
        - "Use process and process step records where useful."
        - "Tie to Customer Success onboarding and Conversion Funnel activation."
        - "Include customer steps, system steps, manual steps, educational assets, stuck signals, support fallback, and success evidence."
      qualityChecks:
        - "Onboarding process leads to meaningful activation."
        - "Manual and automated steps are explicit."
        - "Stuck signals and support fallback are defined."
      questions:
        - "What steps does a new user go through from signup or purchase to activation?"
        - "Which steps are customer-driven, system-driven, manual, automated, or support-assisted?"
        - "Who is responsible for each onboarding step?"
        - "What evidence proves successful onboarding?"
        - "What happens when onboarding stalls?"
    - id: "billing-process"
      title: "Billing Process"
      intent: "Define how recurring or one-time charges are calculated, generated, collected, recorded, reconciled, communicated, and handed off."
      required: true
      outputGuidance:
        - "Tie to Pricing and Packaging and Financial Operations."
        - "Include processor behavior as assumption unless confirmed."
        - "Define evidence, reconciliation, customer communication, and failure path."
      qualityChecks:
        - "Billing process preserves financial correctness and customer trust."
        - "Processor/tool assumptions are explicit."
        - "Financial Operations handoff is clear."
      questions:
        - "How are recurring or one-time charges calculated?"
        - "How are charges generated, collected, recorded, and reconciled?"
        - "What customer communication occurs?"
        - "What evidence proves billing succeeded?"
        - "What downstream financial process receives billing records?"
    - id: "payment-failure-process"
      title: "Payment Failure Process"
      intent: "Define what happens when payment fails, including retry, grace period, access rule, communication, escalation, and cancellation/suspension conditions."
      required: true
      outputGuidance:
        - "Tie to Pricing subscription terms and Financial Operations."
        - "State internal target/customer-facing policy separately."
        - "Include support and customer success implications."
      qualityChecks:
        - "Payment failure handling is customer-safe and financially clear."
        - "Access/grace/suspension rules are explicit or marked unresolved."
        - "Support and finance handoff are included."
      questions:
        - "How is payment failure detected?"
        - "What retry or grace period applies?"
        - "What customer communication happens and when?"
        - "What happens to account access?"
        - "When is support, customer success, or finance involved?"
        - "When does cancellation or suspension happen?"
    - id: "cancellation-process"
      title: "Cancellation Process"
      intent: "Define customer cancellation flow, access timing, data/export options, billing consequences, feedback capture, and safe retention boundary."
      required: true
      outputGuidance:
        - "Tie to Pricing cancellation logic and Customer Success churn prevention."
        - "Separate cancellation, refund, data deletion, and account deletion."
        - "Do not create hostile retention friction."
      qualityChecks:
        - "Cancellation is clear and customer-safe."
        - "Data/export and billing consequences are considered."
        - "Retention actions are ethical and bounded."
      questions:
        - "How does a user cancel their subscription or account?"
        - "When does access end?"
        - "What data export or deletion option is offered?"
        - "What billing consequences follow cancellation?"
        - "What feedback is captured?"
        - "What retention action is allowed or prohibited?"
    - id: "refund-process"
      title: "Refund Process"
      intent: "Define how refund requests are received, evaluated, approved, processed, communicated, recorded, and controlled."
      required: true
      outputGuidance:
        - "Tie to Pricing refund policy, Customer Support billing rules, and Financial Operations."
        - "Include approval authority and exception path."
        - "Mark legal/accounting review needs where relevant."
      qualityChecks:
        - "Refund process follows policy and authority."
        - "Exceptions and abuse prevention are included."
        - "Customer communication and financial recording are explicit."
      questions:
        - "How are refund requests submitted?"
        - "What information is required?"
        - "How are refund requests evaluated?"
        - "Who approves standard and exception refunds?"
        - "How is the refund processed and communicated?"
        - "How are refunds recorded and reviewed?"
    - id: "feature-request-process"
      title: "Feature Request Process"
      intent: "Define how feature requests are submitted, deduplicated, categorized, evaluated, prioritized, linked to roadmap, answered, and closed."
      required: true
      outputGuidance:
        - "Tie to Customer Support, Customer Success feedback loops, Product Scope, and Product roadmap ownership."
        - "Include no-action and deferred decision rules."
        - "Avoid treating requests as promises."
      qualityChecks:
        - "Feature requests are evidence, not commitments."
        - "Customer follow-up expectations are clear."
        - "Roadmap linkage and closure criteria are explicit."
      questions:
        - "How are feature requests submitted and captured?"
        - "How are requests deduplicated and categorized?"
        - "What evidence is captured?"
        - "How are requests evaluated and prioritized?"
        - "How do requests flow into roadmap review?"
        - "How are customers updated or not updated?"
    - id: "bug-triage-process"
      title: "Bug Triage Process"
      intent: "Define the lifecycle of bug reporting, reproduction, severity, priority, backlog linkage, release linkage, customer communication, and closure."
      required: true
      outputGuidance:
        - "Tie to Customer Support bug reporting, Engineering, Release Management, and Incident Response."
        - "Include privacy constraints for diagnostic data."
        - "Distinguish bug, incident, known issue, feature request, and user error."
      qualityChecks:
        - "Bug triage produces engineering-actionable work."
        - "Severity and priority are not confused."
        - "Customer communication and closure criteria are included."
      questions:
        - "How are bugs reported, reproduced, triaged, and prioritized?"
        - "What severity and priority levels exist?"
        - "What diagnostic information is allowed or prohibited?"
        - "How are bugs linked to backlog and releases?"
        - "How are customers updated?"
        - "What closes a bug?"
    - id: "release-communication-process"
      title: "Release Communication Process"
      intent: "Define how release information is prepared, approved, communicated, monitored, corrected, and archived."
      required: true
      outputGuidance:
        - "Tie to Release Management and Customer Support known issue handling."
        - "Include internal and external communication."
        - "Include rollback/pause message and known issue updates."
      qualityChecks:
        - "Release communication supports support readiness."
        - "Customer-facing claims remain accurate."
        - "Rollback and known issue communication are considered."
      questions:
        - "How are releases communicated to users and internal teams?"
        - "What artifacts accompany each release?"
        - "Who drafts, reviews, approves, and sends release communications?"
        - "What support readiness information is included?"
        - "What communication happens if a release is rolled back or paused?"
    - id: "vendor-management-process"
      title: "Vendor Management Process"
      intent: "Define vendor selection, onboarding, access management, billing, monitoring, review, renewal, fallback, replacement, and offboarding."
      required: true
      outputGuidance:
        - "Tie to Operating Model third-party dependencies and Financial Operations."
        - "Include security/privacy review for vendors touching data."
        - "Define offboarding and access revocation."
      qualityChecks:
        - "Vendor management includes access, billing, monitoring, privacy/security, and offboarding."
        - "Critical vendor fallback is considered."
        - "Vendor assumptions are not treated as guarantees."
      questions:
        - "How are third-party vendors selected and onboarded?"
        - "Who owns vendor accounts, access, and billing?"
        - "How are vendors reviewed and renewed?"
        - "What security/privacy review is required?"
        - "What fallback or replacement path exists?"
        - "How are vendors offboarded?"
    - id: "data-export-deletion-process"
      title: "Data Export and Deletion Process"
      intent: "Define how users request data exports or deletion and how requests are verified, fulfilled, logged, communicated, and escalated."
      required: true
      outputGuidance:
        - "Tie to Data and Privacy Operations."
        - "Mark legal/compliance timeline assumptions as review-needed unless verified."
        - "Separate account cancellation from data deletion."
      qualityChecks:
        - "Verification and prohibited support actions are explicit."
        - "Evidence/logging and customer communication are included."
        - "Data/privacy handoff is clear."
      questions:
        - "How do users request data export or deletion?"
        - "How is identity or authority verified?"
        - "What data is included or excluded?"
        - "What actions can support perform and what actions are prohibited?"
        - "How is fulfillment evidenced and logged?"
        - "What timeline assumptions require review?"
    - id: "process-controls"
      title: "Process Controls"
      intent: "Define controls that prevent financial, privacy, support, release, customer trust, and operational failures."
      required: true
      outputGuidance:
        - "Use process control records for material controls."
        - "Include approvals, evidence, logs, audit trail, privacy safeguards, financial safeguards, access safeguards, and quality gates."
        - "Tie controls to risks and sensitive processes."
      qualityChecks:
        - "Controls prevent specific risks."
        - "Evidence and review cadence are explicit."
        - "Controls are not bureaucratic without purpose."
      questions:
        - "What controls are required for sensitive or critical processes?"
        - "What approvals, evidence, logs, audit trails, privacy safeguards, financial safeguards, access safeguards, and quality gates are needed?"
        - "What risk does each control prevent?"
        - "Who owns each control and how often is it reviewed?"
    - id: "process-metrics"
      title: "Process Metrics"
      intent: "Define metrics used to measure process health, failure, cost, effort, quality, and improvement opportunities."
      required: true
      outputGuidance:
        - "Use process metric records."
        - "Include completion time, backlog, failure rate, exception rate, rework, customer impact, manual effort, automation reliability, financial error, privacy risk, and process health metrics where relevant."
        - "Tie metrics to decisions."
      qualityChecks:
        - "Metrics are process-specific and decision-useful."
        - "Manual effort and exception rate are measured where relevant."
        - "Metrics include owner, cadence, threshold, and source."
      questions:
        - "How is each process measured?"
        - "What metrics reveal bottlenecks, failure, exceptions, rework, customer impact, manual effort, automation reliability, financial error, or privacy risk?"
        - "What threshold triggers process improvement?"
        - "Who owns process reporting?"
    - id: "process-review-cadence"
      title: "Process Review Cadence"
      intent: "Define how processes are reviewed, improved, updated, retired, automated, or transferred downstream."
      required: true
      outputGuidance:
        - "Use process review records."
        - "Define cadence, participants, inputs, outputs, improvement decisions, documentation updates, and downstream handoff."
        - "Include out-of-cycle reviews for incidents, support trends, billing errors, privacy issues, and launch changes."
      qualityChecks:
        - "Process review produces decisions or updates."
        - "Documentation updates are required when process changes."
        - "Out-of-cycle review triggers are defined."
      questions:
        - "How often are business processes reviewed?"
        - "Who participates?"
        - "What inputs are reviewed?"
        - "What outputs or improvement decisions are expected?"
        - "What triggers out-of-cycle review?"
        - "How are process changes documented?"
    - id: "process-risks"
      title: "Process Risks"
      intent: "Identify risks that recurring processes are missing, unclear, ownerless, manual-heavy, error-prone, privacy-unsafe, financially unsafe, or poorly handed off."
      required: true
      outputGuidance:
        - "Use process risk records."
        - "Include process gaps, manual overload, missed handoff, unclear ownership, financial error, privacy mishandling, stale process docs, automation failure, vendor failure, support overload, and customer trust risks."
        - "Route risks to Risk Management when appropriate."
      qualityChecks:
        - "Risks are concrete and monitorable."
        - "Mitigation and contingency are distinct."
        - "High-impact risks have owner and downstream handoff."
      questions:
        - "What could cause business processes to fail?"
        - "Which processes are missing, unclear, ownerless, manual-heavy, error-prone, privacy-sensitive, or financially sensitive?"
        - "What early signal reveals process failure?"
        - "What mitigation and contingency apply?"
        - "What should Risk Management inherit?"
    - id: "downstream-handoff"
      title: "Downstream Handoff"
      intent: "Define what downstream Operations documents must inherit from Business Processes and what they must not assume."
      required: true
      outputGuidance:
        - "Use process handoff records."
        - "Route context to Maintenance Plan, Release Management, Incident Response, Data/Privacy Operations, Financial Operations, and Risk Management."
        - "Preserve unresolved questions, owner gaps, process controls, metrics, risks, exceptions, and sensitive process constraints."
      qualityChecks:
        - "Handoff items are concrete and document-targeted."
        - "Downstream documents are not allowed to invent missing process assumptions silently."
        - "Business Processes remains process catalog; detailed runbooks remain downstream."
      questions:
        - "What should Maintenance Plan inherit?"
        - "What should Release Management inherit?"
        - "What should Incident Response inherit?"
        - "What should Data and Privacy Operations inherit?"
        - "What should Financial Operations inherit?"
        - "What should Risk Management inherit?"
        - "What unresolved business process questions must be carried forward?"
