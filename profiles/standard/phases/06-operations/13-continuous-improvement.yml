  sections:
    - id: "improvement-objective"
      title: "Improvement Objective"
      intent: "Define the goal of continuous operational improvement and how it is balanced against stability, simplicity, risk, and capacity."
      required: true
      outputGuidance:
        - "Open with the purpose of continuous improvement in one concise paragraph."
        - "Define what improvement protects and what it must not destabilize."
        - "Explain the balance between improvement, stability, simplicity, risk reduction, cost discipline, and customer value."
      qualityChecks:
        - "Objective is not generic optimization language."
        - "Stability and capacity constraints are explicit."
        - "Improvement is tied to evidence and operational truth."
      questions:
        - "What is the goal of continuous operational improvement?"
        - "How is improvement balanced against stability, simplicity, and capacity?"
        - "What kinds of improvement are valuable?"
        - "What kinds of improvement should be avoided?"
    - id: "improvement-principles"
      title: "Improvement Principles"
      intent: "Define rules that keep improvement deliberate, safe, measurable, reversible, and aligned with customer value."
      required: true
      outputGuidance:
        - "Define principles for evidence, ownership, reversibility, small changes, measurement, guardrails, privacy, customer trust, and cost discipline."
        - "State what continuous improvement must not do."
        - "Tie principles to Foundation and Operations boundaries."
      qualityChecks:
        - "Principles constrain behavior."
        - "Guardrails and reversibility are explicit."
        - "Novelty-driven change is discouraged."
      questions:
        - "What principles guide continuous improvement?"
        - "How should improvements be validated before rollout?"
        - "How should improvements avoid unnecessary complexity?"
        - "When should the system choose no change?"
    - id: "improvement-scope"
      title: "Improvement Scope"
      intent: "Define what continuous improvement covers, shares, excludes, escalates, or hands off downstream."
      required: true
      outputGuidance:
        - "Separate in-scope, out-of-scope, shared, downstream-owned, and review-needed improvement areas."
        - "Clarify relationships with Product, Engineering, GTM, Support, Finance, Risk/Compliance, Knowledge Management, and Risk Management."
        - "Preserve unresolved scope questions."
      qualityChecks:
        - "Scope prevents every change from being treated as continuous improvement."
        - "Shared ownership and handoff rules are visible."
        - "Risk-sensitive improvements are routed correctly."
      questions:
        - "What kinds of improvements belong in this document?"
        - "What improvements belong to Product, Engineering, GTM, Support, Finance, Risk/Compliance, or Knowledge Management instead?"
        - "What improvement areas require downstream handoff or review?"
    - id: "feedback-sources"
      title: "Feedback Sources"
      intent: "Identify all sources of feedback that drive operational improvements and define collection, categorization, quality caveats, and downstream use."
      required: true
      outputGuidance:
        - "Use feedback source records."
        - "Include support, customer success, churn, incidents, releases, business processes, operational metrics, financial metrics, risk reviews, compliance reviews, knowledge reviews, user research, market feedback, and team observations."
        - "State signal quality and caveats."
      qualityChecks:
        - "Feedback sources are broad but not noisy."
        - "Signals have collection method and owner."
        - "Weak signals are caveated."
      questions:
        - "What sources of feedback drive operational improvements?"
        - "How is each feedback source collected?"
        - "How is feedback categorized and routed?"
        - "What caveats apply to each feedback source?"
    - id: "improvement-intake"
      title: "Improvement Intake"
      intent: "Define how improvement ideas enter the system and how they are enriched, deduplicated, accepted, rejected, deferred, or escalated."
      required: true
      outputGuidance:
        - "Define intake sources, required fields, owner, triage cadence, rejection/defer rules, and escalation."
        - "Separate improvement idea from bug, feature request, incident corrective action, risk mitigation, and process change."
        - "Require problem statement and source signal."
      qualityChecks:
        - "Intake prevents vague improvement ideas."
        - "Deduplication and rejection are explicit."
        - "Mandatory corrective actions are not treated as optional."
      questions:
        - "How are improvement ideas submitted?"
        - "What information is required before an idea enters the backlog?"
        - "How are duplicates handled?"
        - "When is an idea rejected, deferred, escalated, or accepted?"
    - id: "improvement-backlog"
      title: "Improvement Backlog"
      intent: "Define how the improvement backlog is maintained, reviewed, prioritized, cleaned, and connected to action."
      required: true
      outputGuidance:
        - "Use improvement item records."
        - "Include source signal, problem statement, hypothesis, expected benefit, risk reduced/created, owner, priority, validation, success criteria, guardrails, and status."
        - "Define stale backlog cleanup."
      qualityChecks:
        - "Backlog items are actionable."
        - "Backlog has owner and review cadence."
        - "Stale or duplicated items are cleaned up."
      questions:
        - "How is the operational improvement backlog maintained?"
        - "Who can propose improvements and how are they evaluated?"
        - "What statuses exist for improvement items?"
        - "How are stale improvement items closed or refreshed?"
    - id: "prioritization-rules"
      title: "Prioritization Rules"
      intent: "Define how improvement ideas are prioritized and what criteria determine implementation order."
      required: true
      outputGuidance:
        - "Use prioritization records."
        - "Include customer impact, operational risk reduction, reliability, support burden, cost, revenue protection, privacy/security, compliance, effort, reversibility, urgency, strategic alignment, and opportunity cost."
        - "Define tie-breakers."
      qualityChecks:
        - "Prioritization is explicit and decision-useful."
        - "Risk reduction and customer impact are considered."
        - "Effort and opportunity cost are not ignored."
      questions:
        - "How are improvement ideas prioritized?"
        - "What criteria determine which improvements are implemented first?"
        - "How are urgent risk-reduction improvements handled?"
        - "What tie-breaker rules apply?"
    - id: "improvement-experiment-model"
      title: "Improvement Experiment Model"
      intent: "Define how improvements are tested before full rollout and how success, failure, rollback, and adoption are decided."
      required: true
      outputGuidance:
        - "Use experiment records."
        - "Include pilot scope, target process/segment, duration/stop condition, success metric, guardrail metric, rollback rule, owner, and decision after experiment."
        - "State when experimentation is unnecessary or unsafe."
      qualityChecks:
        - "Experiments are bounded and measurable."
        - "Guardrails and rollback are explicit."
        - "Experiment design does not overstate statistical certainty."
      questions:
        - "How are improvements validated before full rollout?"
        - "When should an improvement be piloted or tested?"
        - "What success and stop criteria apply?"
        - "How is rollback or reversal handled?"
    - id: "process-review"
      title: "Process Review"
      intent: "Define how existing processes are reviewed for improvement opportunities and what triggers redesign."
      required: true
      outputGuidance:
        - "Use process improvement records."
        - "Tie to Business Processes, Process Metrics, Process Controls, and Reporting Cadence."
        - "Include bottlenecks, defects, manual burden, rework, control failure, customer impact, financial risk, and privacy risk."
      qualityChecks:
        - "Process review is grounded in signals."
        - "Redesign triggers are explicit."
        - "Control and risk impact are considered."
      questions:
        - "How are existing processes reviewed for improvement opportunities?"
        - "What triggers a process redesign?"
        - "How are bottlenecks, defects, rework, manual burden, and control failures detected?"
    - id: "automation-candidates"
      title: "Automation Candidates"
      intent: "Define how manual operations are evaluated for automation and how automation is implemented safely."
      required: true
      outputGuidance:
        - "Use automation candidate records."
        - "Include frequency, manual effort, error risk, privacy/security impact, financial impact, automation benefit/risk, fallback, observability, maintenance owner, and priority."
        - "Tie to Operating Model manual/automated operations."
      qualityChecks:
        - "Automation candidates are evaluated rigorously."
        - "Fallback and observability are required."
        - "Maintenance burden is considered."
      questions:
        - "How are manual operations evaluated for automation?"
        - "What makes an operation a good automation candidate?"
        - "What risks can automation introduce?"
        - "What fallback, observability, and maintenance ownership are required?"
    - id: "quality-improvement"
      title: "Quality Improvement"
      intent: "Define how operational quality is systematically improved through defect reduction, review loops, QA, testing, documentation, monitoring, and controls."
      required: true
      outputGuidance:
        - "Use quality improvement records."
        - "Tie quality work to support signals, incidents, tests, acceptance criteria, monitoring, process controls, and documentation."
        - "Include validation method and guardrail."
      qualityChecks:
        - "Quality improvement is measurable."
        - "Quality is not sacrificed for speed or cost."
        - "Defect types and affected areas are explicit."
      questions:
        - "How is operational quality systematically improved?"
        - "What defect types are targeted?"
        - "What QA, testing, monitoring, support feedback, and control improvements are used?"
        - "How is quality improvement validated?"
    - id: "cost-reduction"
      title: "Cost Reduction"
      intent: "Define how cost reduction opportunities are identified and validated without degrading service, trust, reliability, privacy, or future flexibility."
      required: true
      outputGuidance:
        - "Use cost reduction records."
        - "Tie to Financial Operations, Cost Monitoring, Margin Monitoring, Vendor Cost Management, and Operational Metrics."
        - "Include estimated savings, service-quality risk, validation method, guardrail, owner, and post-change review."
      qualityChecks:
        - "Cost reductions are validated against service quality."
        - "Hidden cost transfer is considered."
