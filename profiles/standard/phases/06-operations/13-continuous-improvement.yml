document:
  id: "13-continuous-improvement"
  title: "Continuous Improvement"
  phase: "06-operations"
  status: "not_started"
  order: 13
  type: "continuous_improvement"
  purpose: "Define how the operational system improves continuously without becoming chaotic, unstable, over-optimized, noisy, risky, or detached from customer value, operational truth, cost discipline, and strategic intent."
  centralQuestion: "How does the operational system improve deliberately, safely, measurably, and sustainably without creating chaos, instability, unnecessary complexity, or hidden risk?"
  outputs:
    canonical:
      format: "markdown"
      path: "docs/06-operations/13-continuous-improvement.md"
      purpose: "Store the canonical continuous improvement model as a Markdown document."
    artifacts:
      - id: "operations.continuous_improvement_system"
        format: "html"
        path: "outcomes/html/06-operations/continuous-improvement-system.html"
        purpose: "Provide a founder-facing continuous improvement system covering improvement objective, principles, feedback sources, improvement backlog, prioritization, experiments, process review, automation, quality, cost reduction, churn learning, incident learning, metric review, guardrails, change control, adoption, improvement cadence, metrics, risks, and downstream handoff."
        audience: "founder"
        includes:
          - "improvement objective"
          - "improvement principles"
          - "improvement scope"
          - "feedback sources"
          - "improvement intake"
          - "improvement backlog"
          - "prioritization rules"
          - "improvement experiment model"
          - "process review"
          - "automation candidates"
          - "quality improvement"
          - "cost reduction"
          - "customer success and churn learning"
          - "support learning"
          - "incident learning"
          - "release learning"
          - "metric and dashboard learning"
          - "knowledge improvement"
          - "risk reduction"
          - "change control"
          - "adoption and rollout"
          - "improvement cadence"
          - "improvement metrics"
          - "improvement guardrails"
          - "improvement risks"
          - "downstream handoff"
        generationMode: "regenerate_from_canonical"
    agentPacks:
      - id: "operations.continuous_improvement_review_prompt"
        format: "markdown"
        path: "outcomes/agents/06-operations/continuous-improvement-review-prompt.md"
        purpose: "Provide compact context for agents reviewing whether continuous improvement is feedback-driven, stable, measurable, prioritized, owner-assigned, experiment-aware, guardrail-aware, change-controlled, and risk-aware."
        agentRole: "reviewer"
        includes:
          - "canonical continuous improvement model"
          - "operations brief dependency"
          - "operating model dependency"
          - "team responsibilities dependency"
          - "customer support dependency"
          - "customer success dependency"
          - "business processes dependency"
          - "operational metrics dependency"
          - "reporting cadence dependency"
          - "incident management dependency"
          - "risk and compliance dependency"
          - "financial operations dependency"
          - "knowledge management dependency"
          - "continuous improvement formats"
          - "completion criteria"
          - "quality checks"
          - "review rules"
  dependsOn:
    - "01-foundation/04-principles"
    - "01-foundation/05-boundaries"
    - "01-foundation/06-success-definition"
    - "03-product/02-scope"
    - "03-product/10-functional-requirements"
    - "03-product/11-non-functional-requirements"
    - "03-product/13-acceptance-criteria"
    - "04-engineering/08-security-and-privacy"
    - "04-engineering/10-testing-strategy"
    - "04-engineering/11-observability"
    - "04-engineering/12-deployment-and-environments"
    - "04-engineering/13-engineering-standards"
    - "04-engineering/14-technical-risks"
    - "05-go-to-market/07-launch-plan"
    - "05-go-to-market/10-pricing-and-packaging"
    - "05-go-to-market/12-growth-metrics"
    - "05-go-to-market/13-go-to-market-risks"
    - "06-operations/01-operations-brief"
    - "06-operations/02-operating-model"
    - "06-operations/03-team-and-responsibilities"
    - "06-operations/04-customer-support"
    - "06-operations/05-customer-success"
    - "06-operations/06-business-processes"
    - "06-operations/07-operational-metrics"
    - "06-operations/08-reporting-and-cadence"
    - "06-operations/09-incident-management"
    - "06-operations/10-risk-and-compliance"
    - "06-operations/11-financial-operations"
    - "06-operations/12-knowledge-management"
  feeds:
    - "06-operations/14-risk-management"
  inputs:
    - id: "operations-context"
      type: "context"
      required: false
      description: "Operations Brief, Operating Model, Team and Responsibilities, Customer Support, Customer Success, Business Processes, Operational Metrics, Reporting and Cadence, Incident Management, Risk/Compliance, Financial Operations, and Knowledge Management outputs."
    - id: "product-engineering-context"
      type: "context"
      required: false
      description: "Product scope, requirements, acceptance criteria, NFRs, security/privacy constraints, observability, deployment, testing, engineering standards, technical risks, release quality, and technical improvement opportunities."
    - id: "customer-market-context"
      type: "context"
      required: false
      description: "Launch signals, pricing signals, growth metrics, GTM risks, support patterns, customer success signals, churn reasons, customer feedback, segment learnings, and customer trust concerns."
    - id: "risk-finance-knowledge-context"
      type: "context"
      required: false
      description: "Risk/compliance obligations, financial metrics, cost/margin signals, vendor costs, documentation freshness, incident learnings, accepted risks, knowledge risks, and professional-review constraints."
    - id: "continuous-improvement-notes"
      type: "manual_note"
      required: false
      description: "Known improvement ideas, backlog notes, automation ideas, quality concerns, cost concerns, process pain points, customer feedback, churn learnings, incident learnings, dashboard ideas, and unresolved continuous improvement questions."
  completionCriteria:
    - "The central question is answered through a continuous improvement model with feedback sources, intake, backlog, prioritization, experiments, process review, automation, quality, cost, churn, support, incident, release, metric, knowledge, risk, change control, adoption, metrics, guardrails, risks, and handoff."
    - "Improvement objective defines what improvement protects: stability, customer value, operational reliability, quality, cost discipline, supportability, maintainability, learning, risk reduction, and strategic alignment."
    - "Improvement principles define how improvements are deliberate, evidence-based, small enough to control, reversible when possible, owner-assigned, measurable, customer-safe, privacy-safe, financially safe, and not pursued for novelty alone."
    - "Improvement scope defines what continuous improvement covers, what belongs to Product/Engineering/GTM/Support/Finance/Risk/Compliance, what is downstream-owned, and what is explicitly out of scope."
    - "Feedback sources define all signal sources including support, customer success, churn, incidents, releases, business processes, operational metrics, financial metrics, risk reviews, compliance reviews, knowledge reviews, user research, market feedback, and team observations."
    - "Improvement intake defines how ideas are submitted, enriched, deduplicated, categorized, assigned, rejected, deferred, or accepted into the improvement backlog."
    - "Improvement backlog defines owner, status, source signal, problem statement, hypothesis, expected benefit, affected area, risk, cost, effort, priority, dependency, decision, and review cadence."
    - "Prioritization rules define how improvements are ranked by customer impact, operational risk reduction, reliability, support burden, cost, revenue protection, privacy/security, compliance, effort, reversibility, urgency, strategic alignment, and opportunity cost."
    - "Improvement experiment model defines how improvements are validated through pilots, A/B tests when appropriate, manual trials, limited rollouts, reversible changes, control metrics, success criteria, stop criteria, and rollback criteria."
    - "Process review defines how existing processes are reviewed for bottlenecks, defects, rework, manual burden, control failure, customer impact, financial risk, privacy risk, and improvement opportunities."
    - "Automation candidates define how manual work is evaluated for automation, including frequency, error risk, privacy/security impact, cost, effort, stability, observability, fallback, owner, and maintenance burden."
    - "Quality improvement defines how operational quality is improved through defect reduction, review loops, QA checks, acceptance criteria, support feedback, testing, documentation, monitoring, and control improvements."
    - "Cost reduction defines how cost opportunities are identified, validated, measured, and constrained so cost savings do not degrade customer trust, reliability, security/privacy, support quality, or strategic capacity."
    - "Customer success and churn learning define how activation, health, retention, churn, satisfaction, expansion, and feedback signals become operational improvements."
    - "Support learning defines how support tickets, known issues, macros, bugs, escalations, refunds/billing issues, unsupported requests, and customer language become improvements."
    - "Incident learning defines how postmortems, corrective actions, recurring incident patterns, detection gaps, communication gaps, rollback gaps, and unresolved risks become improvement work."
    - "Release learning defines how release quality, rollback, hotfix, post-release incident, release communication, readiness, and support handoff signals become improvements."
    - "Metric and dashboard learning defines how metric caveats, bad data, missing instrumentation, alert fatigue, misleading thresholds, and dashboard staleness become improvement work."
    - "Knowledge improvement defines how stale docs, missing runbooks, poor discoverability, duplicate truth, ownerless docs, and documentation gaps become improvement work."
    - "Risk reduction defines how accepted risks, operational risks, GTM risks, compliance risks, financial risks, knowledge risks, and technical risks are converted into mitigation work."
    - "Change control defines how improvements are approved, scheduled, communicated, implemented, monitored, reversed, documented, and handed off."
    - "Adoption and rollout define how process/tooling/documentation changes are introduced, trained, adopted, verified, and measured."
    - "Improvement cadence defines daily/weekly/monthly/quarterly/event-triggered review rhythms, participants, inputs, outputs, decision owners, and action tracking."
    - "Improvement metrics define backlog health, cycle time, completion rate, impact realized, rollback rate, adoption, cost savings, defect reduction, support reduction, incident recurrence reduction, process maturity, and risk reduction."
    - "Improvement guardrails define limits that prevent churn in process, excessive automation, cost-cutting harm, release instability, privacy risk, support overload, team overload, metric gaming, and uncontrolled scope expansion."
    - "Improvement risks identify chaotic change, over-automation, local optimization, novelty bias, weak validation, no adoption, owner gaps, unmeasured impact, hidden risk, process churn, documentation drift, and improvement backlog rot."
    - "Downstream handoff clarifies what Risk Management must inherit from Continuous Improvement."
  qualityChecks:
    - "Avoid vague claims."
    - "Avoid improvement theater: improvement ideas without source signal, problem statement, owner, hypothesis, expected impact, prioritization, validation method, guardrail, metric, adoption plan, and review cadence."
    - "Avoid constant change that creates instability, documentation drift, team overload, support confusion, or customer-facing inconsistency."
    - "Avoid optimizing local metrics while degrading customer value, reliability, privacy/security, support quality, financial correctness, or strategic direction."
    - "Avoid automation before the manual process, failure mode, fallback, observability, maintenance burden, and privacy/security implications are understood."
    - "Avoid cost reduction that hides cost elsewhere or degrades service, reliability, trust, privacy, support, compliance, or future flexibility."
    - "Avoid treating incident corrective actions as optional improvement ideas when they reduce recurrence risk."
    - "Avoid churn learning that blames customers instead of identifying onboarding, product, pricing, support, segment-fit, or expectation-setting issues."
    - "Avoid metrics that reward activity, backlog growth, shipped changes, or process churn instead of realized operational improvement."
    - "Avoid improvement backlogs that accumulate stale ideas without review, rejection, deferral, ownership, or closure."
    - "Prefer decision-useful statements."
    - "Make assumptions explicit."
    - "Do not invent improvement capacity, automation readiness, cost savings, impact estimates, statistical validity, customer feedback volume, metric baselines, or adoption certainty."
    - "Continuous Improvement must preserve Foundation boundaries, product truth, technical truth, pricing truth, privacy/security constraints, customer trust, support capacity, cost discipline, and operational sustainability."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
    - "Separate feedback signal, improvement idea, problem, hypothesis, owner, priority, experiment, change, rollout, metric, guardrail, risk, and handoff."
    - "Tie improvement claims to Operations Brief, Operating Model, Team and Responsibilities, Customer Support, Customer Success, Business Processes, Operational Metrics, Reporting and Cadence, Incident Management, Risk and Compliance, Financial Operations, Knowledge Management, Product, Engineering, GTM, or Decision Record where possible."
    - "Classify improvement items as current, proposed, accepted, rejected, deferred, blocked, experiment, pilot, rollout, adopted, reversed, stale, review-needed, launch-critical, post-launch, risk-reduction, cost-reduction, quality-improvement, automation-candidate, customer-facing, internal-only, privacy-sensitive, financial-sensitive, or downstream-owned where useful."
    - "State whether each improvement is manual, automated, process-only, tooling-based, product-dependent, engineering-dependent, support-dependent, finance-dependent, compliance-dependent, documentation-dependent, or risk-dependent."
    - "Route enterprise risk governance downstream to Risk Management."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with Operations Brief, Operating Model, Team and Responsibilities, Customer Support, Customer Success, Business Processes, Operational Metrics, Reporting and Cadence, Incident Management, Risk and Compliance, Financial Operations, Knowledge Management, Product Scope, Acceptance Criteria, Security/Privacy, Pricing, GTM Risks, Technical Risks, or Decision Record."
    - "Flag improvement items without source signal, owner, problem statement, hypothesis, expected impact, priority, validation method, success criteria, guardrail, and adoption plan."
    - "Flag automation candidates without manual-process clarity, failure mode, fallback, observability, maintenance burden, privacy/security review, and owner."
    - "Flag cost reductions without service-quality validation, risk review, customer impact review, and post-change monitoring."
    - "Flag process changes without change control, communication, documentation update, adoption check, and rollback/reversal plan where relevant."
    - "Flag incident learnings or corrective actions that are not tracked as mandatory risk-reduction work."
    - "Flag improvement metrics that measure shipped changes instead of realized benefit."
    - "Flag improvement backlog items that are stale, ownerless, duplicated, unprioritized, or not tied to operational signals."
    - "Verify that Risk Management receives concrete improvement-risk handoff inputs."
  specializedFormats:
