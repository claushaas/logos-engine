  sections:
    - id: "financial-operations-objective"
      title: "Financial Operations Objective"
      intent: "Define the goal of financial operations and its connection to pricing, customer trust, cost discipline, reporting, and sustainability."
      required: true
      outputGuidance:
        - "Open with the purpose of financial operations in one concise paragraph."
        - "State what financial operations protects: pricing truth, billing correctness, payment reliability, revenue data quality, customer trust, cost discipline, margin visibility, auditability, and sustainability."
        - "Clarify that tax/accounting/legal conclusions require professional review where uncertain."
      qualityChecks:
        - "Objective is operational, not purely accounting-oriented."
        - "Connection to Pricing and Packaging is explicit."
        - "Professional-review boundary is explicit."
      questions:
        - "What is the goal of financial operations?"
        - "How does financial operations connect to the economic model and pricing?"
        - "What must financial operations protect?"
        - "What requires professional tax/accounting/legal review?"
    - id: "financial-principles"
      title: "Financial Principles"
      intent: "Define how financial operations behaves when handling money, exceptions, customer communication, and uncertainty."
      required: true
      outputGuidance:
        - "Define principles for accuracy, transparency, reversibility, evidence, customer communication, exception discipline, fraud/abuse awareness, and privacy/security."
        - "State what financial operations must not do."
        - "Tie principles to Foundation boundaries and customer trust."
      qualityChecks:
        - "Principles are actionable."
        - "Exception and evidence discipline are explicit."
        - "Customer communication and financial privacy are included."
      questions:
        - "What principles guide financial operations?"
        - "How should money-related errors, exceptions, and uncertainty be handled?"
        - "How should financial operations communicate with customers?"
        - "What behaviors are prohibited?"
    - id: "financial-operations-scope"
      title: "Financial Operations Scope"
      intent: "Define what is inside financial operations and what belongs to Pricing, Support, Product/Engineering, Risk/Compliance, Tax/Accounting, or Risk Management."
      required: true
      outputGuidance:
        - "Separate in-scope, out-of-scope, shared, downstream-owned, and professional-review-needed areas."
        - "Clarify relationship with Pricing, Customer Support, Business Processes, Risk and Compliance, and Risk Management."
        - "Preserve unresolved scope questions."
      qualityChecks:
        - "Scope prevents responsibility drift."
        - "Financial authority and support intake are distinguished."
        - "Professional-review-needed areas are visible."
      questions:
        - "What falls inside financial operations?"
        - "What belongs to Pricing and Packaging instead?"
        - "What belongs to Customer Support, Product/Engineering, Risk/Compliance, Tax/Accounting, or Risk Management?"
        - "What is explicitly out of scope?"
    - id: "pricing-and-package-enforcement"
      title: "Pricing and Package Enforcement"
      intent: "Define how pricing, plans, limits, trials, discounts, entitlements, billing terms, and cancellation/refund promises are enforced operationally."
      required: true
      outputGuidance:
        - "Tie directly to Pricing and Packaging."
        - "Use billing, subscription, plan change, and financial control records where useful."
        - "State how pricing truth is verified against product entitlements and customer communication."
      qualityChecks:
        - "Pricing terms are operationalized rather than repeated."
        - "Entitlement and billing effects are consistent."
        - "Manual exceptions are controlled."
      questions:
        - "How are plans, packages, limits, trials, discounts, and entitlements enforced?"
        - "How are billing terms reflected in systems and customer communication?"
        - "How are cancellation and refund promises enforced?"
        - "What controls prevent mismatch between price, entitlement, and billing?"
    - id: "billing-operations"
      title: "Billing Operations"
      intent: "Define how charges are calculated, generated, collected, recorded, reconciled, communicated, failed, retried, adjusted, and corrected."
      required: true
      outputGuidance:
        - "Use billing rule records."
        - "State source of pricing, processor/system behavior, customer communication, owner, control, evidence, and exception path."
        - "Mark processor assumptions as assumptions unless verified."
      qualityChecks:
        - "Billing rules are auditable."
        - "Calculation, collection, reconciliation, and correction are covered."
        - "Customer communication and evidence are explicit."
      questions:
        - "How are charges calculated, invoiced/receipted, collected, and recorded?"
        - "What billing cycles and payment methods are supported?"
        - "How are billing adjustments and corrections handled?"
        - "How is billing reconciled?"
        - "What evidence proves billing accuracy?"
    - id: "payment-operations"
      title: "Payment Operations"
      intent: "Define supported payment methods, payment processor behavior, settlement, fees, failure modes, fraud/risk signals, and processor incidents."
      required: true
      outputGuidance:
        - "Use payment rule records."
        - "Do not invent processor behavior."
        - "Include payment method support, fees, settlement assumptions, failure modes, and processor incident handling."
      qualityChecks:
        - "Processor assumptions are explicit."
        - "Payment method support is accurate."
        - "Fees and settlement are included where known."
      questions:
        - "What payment methods are supported?"
        - "What processor or platform handles payments?"
        - "How do authorization, capture, settlement, and fees work?"
        - "What payment failure modes exist?"
        - "How are fraud/risk signals or processor incidents handled?"
    - id: "subscription-management"
      title: "Subscription Management"
      intent: "Define how subscriptions are created, renewed, cancelled, paused/suspended, reactivated, upgraded, downgraded, and connected to entitlement timing."
      required: true
      outputGuidance:
        - "Use subscription rule records."
        - "Include customer action, system action, entitlement effect, access timing, billing effect, customer communication, and exception path."
        - "Tie to cancellation and plan-change rules."
      qualityChecks:
        - "Subscription state changes are clear."
        - "Access timing and entitlement effects are explicit."
        - "Customer communication is included."
      questions:
        - "How are subscriptions created, renewed, modified, cancelled, paused, suspended, and reactivated?"
        - "What happens to access and entitlements at each state change?"
        - "How are customers informed?"
        - "What exceptions can occur?"
    - id: "plan-changes-and-proration"
      title: "Plan Changes and Proration"
      intent: "Define how upgrades, downgrades, billing-cycle changes, credits, proration, grandfathering, and entitlement timing are handled."
      required: true
      outputGuidance:
        - "Use plan change records."
        - "Mark proration and tax/accounting implications as review-needed unless verified."
        - "Include customer communication and approval for exceptions."
      qualityChecks:
        - "Plan changes do not create entitlement/billing mismatch."
        - "Proration assumptions are explicit."
        - "Exceptions are controlled."
      questions:
        - "How are upgrades and downgrades handled?"
        - "How are plan changes, credits, proration, and grandfathering handled?"
        - "When do entitlement changes take effect?"
        - "What customer communication is required?"
    - id: "payment-failures-and-dunning"
      title: "Payment Failures and Dunning"
      intent: "Define what happens when payments fail, including retry logic, grace periods, customer communication, support handoff, access rules, and cancellation/suspension conditions."
      required: true
      outputGuidance:
        - "Use billing/payment/subscription records where useful."
        - "Separate processor retry behavior from internal customer communication."
        - "Include support handoff and financial reporting."
      qualityChecks:
        - "Failure handling is customer-safe and financially clear."
        - "Access/grace/suspension rules are explicit or marked unresolved."
        - "Dunning does not become hostile or misleading."
      questions:
        - "What happens when a payment fails?"
        - "What retry logic and dunning process is in place?"
        - "What grace period and access rules apply?"
        - "How are customers informed?"
        - "When does support or finance intervene?"
    - id: "refund-operations"
      title: "Refund Operations"
      intent: "Define how refunds are evaluated, approved, processed, communicated, recorded, monitored, and controlled."
      required: true
      outputGuidance:
        - "Use refund rule records."
        - "Tie to Pricing refund policy and Customer Support billing intake."
        - "Include approval authority, exception path, abuse/fraud signals, evidence, and reporting impact."
      qualityChecks:
        - "Refund rules follow policy and authority."
        - "Exceptions and evidence are explicit."
        - "Customer communication is clear."
      questions:
        - "How are refunds evaluated, approved, and processed?"
        - "What refund policies apply and who can override them?"
        - "What information is required?"
        - "How are refunds communicated and recorded?"
        - "What abuse or fraud signals are monitored?"
    - id: "chargebacks-and-disputes"
      title: "Chargebacks and Disputes"
      intent: "Define how chargebacks, payment disputes, processor disputes, and related customer communication are handled."
      required: true
      outputGuidance:
        - "Use chargeback/dispute records."
        - "Mark processor timelines and requirements as assumptions unless verified."
        - "Include recurrence prevention and risk escalation."
      qualityChecks:
        - "Dispute handling has owner and evidence."
        - "Customer communication and financial impact are explicit."
        - "Chargebacks feed risk review when recurring."
      questions:
        - "How are chargebacks and disputes detected?"
        - "Who owns the dispute workflow?"
        - "What evidence is required?"
        - "How are customers communicated with?"
        - "How are recurring disputes prevented?"
    - id: "invoice-and-receipt-operations"
      title: "Invoice and Receipt Operations"
      intent: "Define how invoices and receipts are generated, delivered, corrected, duplicated, handed to accounting, and handled by support."
      required: true
      outputGuidance:
        - "Use invoice/receipt records."
        - "Mark tax/accounting requirements as review-needed unless verified."
        - "Include correction and duplicate request handling."
      qualityChecks:
        - "Invoice/receipt process is customer-safe and auditable."
        - "Accounting handoff is explicit."
        - "Tax/accounting uncertainty is visible."
      questions:
        - "When are invoices or receipts generated?"
        - "What required fields apply?"
        - "How are invoices or receipts delivered?"
        - "How are corrections and duplicate requests handled?"
        - "What accounting handoff is required?"
    - id: "revenue-data-and-recognition-interface"
      title: "Revenue Data and Recognition Interface"
      intent: "Define revenue event sources, reporting fields, accounting export, reconciliation, recognition assumptions, professional-review needs, and caveats."
      required: true
      outputGuidance:
        - "Use revenue data records."
        - "Do not state revenue recognition conclusions as final unless professionally reviewed."
        - "Focus on data interface and assumptions."
      qualityChecks:
        - "Revenue data source and caveats are explicit."
        - "Accounting interface is defined."
        - "Recognition assumptions are review-labeled."
      questions:
        - "How is revenue recognized for reporting purposes, if known?"
        - "What accounting interface exists for revenue data?"
        - "What revenue events and fields are captured?"
        - "How is revenue data reconciled?"
        - "What requires accounting review?"
    - id: "cost-monitoring"
      title: "Cost Monitoring"
      intent: "Define how operational costs are tracked, monitored, reviewed, allocated, optimized, and escalated."
      required: true
      outputGuidance:
        - "Use cost item records."
        - "Include infrastructure, vendors, support, payment processor fees, observability, AI/model costs, storage/bandwidth, and manual work where relevant."
        - "Define anomaly thresholds and owner."
      qualityChecks:
        - "Cost categories are complete enough for decision-making."
        - "Manual work and processor fees are not ignored."
        - "Anomaly thresholds and review cadence are included."
      questions:
        - "How are operational costs tracked and monitored?"
        - "What cost categories matter?"
        - "What cost anomalies trigger alerts?"
        - "Who owns cost review?"
        - "What optimization actions are available?"
    - id: "margin-monitoring"
      title: "Margin Monitoring"
      intent: "Define how gross margin, contribution margin, net margin, and per-customer/per-plan economics are calculated, reviewed, and acted on."
      required: true
      outputGuidance:
        - "Use margin metric records."
        - "State included/excluded costs and caveats."
        - "Tie margin thresholds to Pricing and Cost Monitoring."
      qualityChecks:
        - "Margin formula is explicit."
        - "Cost allocation assumptions are visible."
        - "Thresholds trigger decisions."
      questions:
        - "How is gross and net margin calculated and monitored?"
        - "What costs are included or excluded?"
        - "How are per-customer or per-plan economics reviewed?"
        - "What margin thresholds trigger action?"
    - id: "vendor-cost-management"
      title: "Vendor Cost Management"
      intent: "Define how third-party vendor costs are tracked, reviewed, optimized, renewed, cancelled, or replaced."
      required: true
      outputGuidance:
        - "Use vendor cost records."
        - "Tie to Vendor Compliance and Operating Model dependencies."
        - "Include renewal cadence, alert threshold, and offboarding/cancellation rule."
      qualityChecks:
        - "Vendor spend has owner and review cadence."
        - "Cost driver and alert threshold are explicit."
        - "Cancellation/replacement path is considered."
      questions:
        - "How are third-party vendor costs tracked?"
        - "Who owns vendor billing and account access?"
        - "What vendor cost review cadence exists?"
        - "What thresholds trigger vendor review, cancellation, downgrade, or replacement?"
    - id: "tax-accounting-interface"
      title: "Tax/Accounting Interface"
      intent: "Define how financial operations interfaces with tax and accounting functions and what data, evidence, and review needs are handed off."
      required: true
      outputGuidance:
        - "Focus on interface, data, cadence, owner, and professional-review need."
        - "Do not invent tax/accounting requirements."
        - "Tie to Risk and Compliance."
      qualityChecks:
        - "Tax/accounting interface is concrete."
        - "Professional-review needs are visible."
        - "Data handoff is defined."
      questions:
        - "How does financial operations interface with tax and accounting functions?"
        - "What data is shared with accounting systems or professionals?"
        - "What cadence and format apply?"
        - "What tax/accounting assumptions require review?"
    - id: "financial-controls"
      title: "Financial Controls"
      intent: "Define controls that prevent billing, refund, discount, invoice, vendor, processor, access, reconciliation, and reporting failures."
      required: true
      outputGuidance:
        - "Use financial control records."
        - "Include approvals, access controls, reconciliation checks, processor access review, vendor spend review, audit trail, and exception review."
        - "Tie controls to financial risks."
      qualityChecks:
        - "Controls prevent specific risks."
        - "Evidence and review cadence are explicit."
        - "Controls are not arbitrary bureaucracy."
      questions:
        - "What controls prevent financial errors or abuse?"
        - "What approvals are required?"
        - "What reconciliation checks exist?"
        - "How are processor/vendor access and spend reviewed?"
        - "What evidence proves controls ran?"
    - id: "financial-exceptions"
      title: "Financial Exceptions"
      intent: "Define how pricing, discount, refund, credit, billing correction, invoice correction, manual entitlement, payment, and customer-specific financial exceptions are handled."
      required: true
      outputGuidance:
        - "Use financial exception records."
        - "Separate exception from policy change and accepted risk."
        - "Include approval, expiration/review trigger, evidence, financial impact, customer impact, and abuse/fraud consideration."
      qualityChecks:
        - "Exceptions are auditable and time-bounded where appropriate."
        - "Approval authority is explicit."
        - "Exceptions do not silently become policy."
      questions:
        - "What financial exceptions can occur?"
        - "Who may approve exceptions?"
        - "What evidence and rationale are required?"
        - "When must exceptions be reviewed or closed?"
        - "How are abuse, fraud, and precedent risks handled?"
    - id: "financial-reporting"
      title: "Financial Reporting"
      intent: "Define what financial reports are produced, at what cadence, who consumes them, what data they use, and what decisions they support."
      required: true
      outputGuidance:
        - "Use financial report records."
        - "Tie to Reporting and Cadence and Operational Metrics."
        - "Include caveats, artifacts, and escalation triggers."
      qualityChecks:
        - "Reports are decision-useful."
        - "Reports have source, owner, cadence, and caveats."
        - "Financial reporting does not overstate accounting certainty."
      questions:
        - "What financial reports are produced and at what cadence?"
        - "Who consumes financial operations reports?"
        - "What metrics and data sources are included?"
        - "What decisions do reports support?"
        - "What caveats apply?"
    - id: "financial-metrics"
      title: "Financial Metrics"
      intent: "Define financial metrics used to monitor payment, billing, refund, chargeback, revenue, cost, margin, and financial support health."
      required: true
      outputGuidance:
        - "Use financial metric records."
        - "Include revenue/MRR/ARR where applicable, payments collected, failed payment rate, payment recovery, refund rate, chargeback rate, billing error rate, invoice issue rate, discount exception rate, subscription state errors, vendor cost, margin, and finance support burden."
        - "State formula, source, owner, cadence, threshold, caveat, and decision implication."
      qualityChecks:
        - "Metrics are formula-defined."
        - "Metrics have decision consequences."
        - "Review-needed metrics are labeled."
      questions:
        - "What financial metrics matter?"
        - "How are revenue, payment failures, recovery, refunds, chargebacks, billing errors, invoice issues, discounts, subscription errors, vendor costs, margins, and finance support burden measured?"
        - "What thresholds trigger action?"
    - id: "financial-evidence-and-audit-trail"
      title: "Financial Evidence and Audit Trail"
      intent: "Define what financial evidence is stored, who owns it, who may access it, how long it is retained, and how it supports audit/review."
      required: true
      outputGuidance:
        - "Use financial evidence records."
        - "Include billing events, payments, refunds, chargebacks, invoices/receipts, billing corrections, processor events, reports, reconciliations, approvals, exceptions, and vendor costs."
        - "Define access, retention, redaction, and review cadence."
      qualityChecks:
        - "Evidence is retrievable and protected."
        - "Sensitive financial data has access rules."
        - "Evidence links to controls and reports."
      questions:
        - "What financial evidence must be stored?"
        - "Where is financial evidence stored?"
        - "Who can access it?"
        - "How long is it retained?"
        - "How is evidence redacted, reviewed, and used?"
    - id: "financial-operations-risks"
      title: "Financial Operations Risks"
      intent: "Identify failure modes of financial operations and how financial risks are detected, mitigated, escalated, or handed off."
      required: true
      outputGuidance:
        - "Use financial risk records."
        - "Include billing errors, incorrect entitlements, failed payment gaps, refund abuse, chargebacks, processor failure, tax/accounting unknowns, cost spikes, margin erosion, vendor surprises, weak controls, evidence gaps, and owner gaps."
        - "Route risks to Risk Management where needed."
      qualityChecks:
        - "Risks are concrete and monitorable."
        - "Mitigation and contingency are distinct."
        - "High-impact risks have owner and downstream handoff."
      questions:
        - "What could cause financial operations to fail?"
        - "How are financial risks detected and mitigated?"
        - "What billing, payment, refund, chargeback, cost, margin, tax/accounting, vendor, control, or evidence risks exist?"
        - "What should Risk Management inherit?"
    - id: "downstream-handoff"
      title: "Downstream Handoff"
      intent: "Define what downstream Operations documents must inherit from Financial Operations and what they must not assume."
      required: true
      outputGuidance:
        - "Use financial handoff records."
        - "Route context to Risk Management."
        - "Preserve financial rules, records, controls, exceptions, professional-review needs, metrics, risks, unresolved questions, and evidence requirements."
      qualityChecks:
        - "Handoff items are concrete and document-targeted."
        - "Downstream documents are not allowed to invent missing financial assumptions silently."
        - "Financial Operations remains money-operations architecture; enterprise risk governance remains downstream."
      questions:
        - "What should Risk Management inherit?"
        - "What financial rules, controls, exceptions, metrics, risks, and evidence requirements must be preserved?"
        - "What unresolved financial operations questions must be carried forward?"
