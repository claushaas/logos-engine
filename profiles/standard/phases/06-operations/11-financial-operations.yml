document:
  id: "11-financial-operations"
  title: "Financial Operations"
  phase: "06-operations"
  status: "not_started"
  order: 11
  type: "financial_operations"
  purpose: "Define how money is operated day to day, including pricing enforcement, billing, payments, subscriptions, refunds, chargebacks, invoices/receipts, revenue data, cost monitoring, vendor spend, margin monitoring, tax/accounting interface, financial controls, reporting, evidence, exceptions, risks, and downstream handoff."
  centralQuestion: "How are revenue, billing, payments, refunds, costs, margins, vendors, financial records, and financial risks operated accurately, transparently, sustainably, and safely day to day?"
  outputs:
    canonical:
      format: "markdown"
      path: "docs/06-operations/11-financial-operations.md"
      purpose: "Store the canonical financial operations model as a Markdown document."
    artifacts:
      - id: "operations.financial_operations_playbook"
        format: "html"
        path: "outcomes/html/06-operations/financial-operations-playbook.html"
        purpose: "Provide a founder-facing financial operations playbook covering billing, payments, subscriptions, refunds, chargebacks, invoices, revenue data, costs, margins, vendors, tax/accounting interface, financial controls, reporting, exceptions, metrics, risks, and downstream handoff."
        audience: "founder"
        includes:
          - "financial operations objective"
          - "financial principles"
          - "financial operations scope"
          - "pricing and package enforcement"
          - "billing operations"
          - "payment operations"
          - "subscription management"
          - "plan changes and proration"
          - "payment failures and dunning"
          - "refund operations"
          - "chargebacks and disputes"
          - "invoice and receipt operations"
          - "revenue data and recognition interface"
          - "cost monitoring"
          - "margin monitoring"
          - "vendor cost management"
          - "tax and accounting interface"
          - "financial controls"
          - "financial exceptions"
          - "financial reporting"
          - "financial metrics"
          - "financial evidence and audit trail"
          - "financial operations risks"
          - "downstream handoff"
        generationMode: "regenerate_from_canonical"
    agentPacks:
      - id: "operations.financial_operations_review_prompt"
        format: "markdown"
        path: "outcomes/agents/06-operations/financial-operations-review-prompt.md"
        purpose: "Provide compact context for agents reviewing whether financial operations are accurate, owner-assigned, policy-aligned, processor-aware, evidence-backed, exception-aware, metric-driven, risk-aware, and not overclaiming accounting, tax, or legal conclusions."
        agentRole: "reviewer"
        includes:
          - "canonical financial operations model"
          - "pricing dependency"
          - "operations brief dependency"
          - "operating model dependency"
          - "team responsibilities dependency"
          - "business processes dependency"
          - "operational metrics dependency"
          - "reporting cadence dependency"
          - "incident management dependency"
          - "risk and compliance dependency"
          - "financial operations formats"
          - "completion criteria"
          - "quality checks"
          - "review rules"
  dependsOn:
    - "01-foundation/04-principles"
    - "01-foundation/05-boundaries"
    - "01-foundation/06-success-definition"
    - "03-product/08-product-scope"
    - "03-product/10-functional-requirements"
    - "03-product/11-non-functional-requirements"
    - "03-product/13-acceptance-criteria"
    - "04-engineering/05-data-model"
    - "04-engineering/08-security-and-privacy"
    - "04-engineering/11-observability"
    - "04-engineering/12-deployment-and-environments"
    - "04-engineering/14-technical-risks"
    - "05-go-to-market/07-launch-plan"
    - "05-go-to-market/10-pricing-and-packaging"
    - "05-go-to-market/12-growth-metrics"
    - "05-go-to-market/13-go-to-market-risks"
    - "06-operations/01-operations-brief"
    - "06-operations/02-operating-model"
    - "06-operations/03-team-and-responsibilities"
    - "06-operations/04-customer-support"
    - "06-operations/06-business-processes"
    - "06-operations/07-operational-metrics"
    - "06-operations/08-reporting-and-cadence"
    - "06-operations/09-incident-management"
    - "06-operations/10-risk-and-compliance"
  feeds:
    - "06-operations/12-risk-management"
  inputs:
    - id: "pricing-and-packaging"
      type: "context"
      required: false
      description: "Pricing thesis, plans/packages, value metric, billing terms, payment flow, free/trial strategy, subscription terms, discounts, refunds, cancellation, plan changes, pricing metrics, pricing risks, and customer-facing financial promises."
    - id: "operations-context"
      type: "context"
      required: false
      description: "Operations Brief, Operating Model, Team and Responsibilities, Customer Support, Business Processes, Operational Metrics, Reporting and Cadence, Incident Management, and Risk/Compliance outputs that affect financial operations."
    - id: "product-engineering-context"
      type: "context"
      required: false
      description: "Product scope, entitlements, data model, security/privacy constraints, observability, deployment environments, technical risks, entitlement logic, payment integration assumptions, and financial event tracking."
    - id: "processor-vendor-context"
      type: "context"
      required: false
      description: "Known payment processors, billing platforms, app store payment systems, invoicing tools, accounting tools, tax tools, vendors, fee structures, account owners, access owners, and processor behavior assumptions."
    - id: "tax-accounting-context"
      type: "context"
      required: false
      description: "Known accounting method, tax/accounting review needs, invoice/receipt requirements, revenue recognition assumptions, reconciliation needs, financial reporting expectations, and professional-review constraints."
    - id: "financial-operations-notes"
      type: "manual_note"
      required: false
      description: "Known billing rules, payment failure ideas, refund policies, chargeback concerns, cost concerns, margin targets, vendor costs, reporting needs, financial owner assumptions, and unresolved financial operations questions."
  completionCriteria:
    - "The central question is answered through a complete financial operations model covering billing, payments, subscriptions, refunds, chargebacks, invoices, revenue data, costs, margins, vendors, controls, reporting, evidence, exceptions, risks, and handoff."
    - "Financial operations objective defines what financial operations protects: pricing truth, billing correctness, payment reliability, customer trust, revenue data quality, cost discipline, margin visibility, accounting/tax interface, auditability, and sustainability."
    - "Financial principles define how financial operations handles accuracy, transparency, reversibility, customer communication, exception control, professional review, evidence, and financial privacy/security."
    - "Financial operations scope defines what is in scope, what belongs to Pricing, Product/Engineering, Customer Support, Risk/Compliance, Tax/Accounting, and Risk Management, and what is explicitly out of scope."
    - "Pricing and package enforcement defines how plans, entitlements, trials, discounts, plan limits, feature gates, billing terms, and cancellation/refund promises are operationalized and verified."
    - "Billing operations define how charges are calculated, generated, scheduled, invoiced/receipted, collected, recorded, reconciled, communicated, failed, retried, adjusted, and corrected."
    - "Payment operations define supported payment methods, payment processor assumptions, authorization/capture behavior, settlement, processor fees, failed payments, retries, fraud/risk signals, and processor incident handling."
    - "Subscription management defines subscription creation, renewal, cancellation, pause/suspension, reactivation, upgrade, downgrade, entitlement changes, access timing, and customer communication."
    - "Plan changes and proration define how upgrades, downgrades, billing-cycle changes, credits, proration, grandfathering, manual exceptions, and entitlement timing are handled."
    - "Payment failures and dunning define detection, retry logic, grace period, customer communication, support handoff, access rule, suspension/cancellation trigger, reactivation, and financial reporting."
    - "Refund operations define refund eligibility, intake, approval, exception authority, processor action, customer communication, recordkeeping, abuse/fraud signals, and reporting."
    - "Chargebacks and disputes define detection, evidence, owner, processor workflow, customer communication, financial impact, recurrence prevention, and escalation."
    - "Invoice and receipt operations define when invoices/receipts are generated, required fields, delivery, correction, duplicate requests, accounting handoff, customer support handoff, and review-needed tax/accounting assumptions."
    - "Revenue data and recognition interface defines revenue event sources, revenue reporting fields, accounting export, reconciliation, recognized/deferred revenue assumptions, professional-review needs, and caveats."
    - "Cost monitoring defines infrastructure costs, vendor costs, support costs, payment processor fees, observability costs, AI/model costs, storage/bandwidth costs, manual work costs, and anomaly thresholds."
    - "Margin monitoring defines gross margin, contribution margin, net margin, cost allocation assumptions, per-customer/per-plan economics, threshold triggers, caveats, and review cadence."
    - "Vendor cost management defines vendor inventory, billing owner, account owner, cost center/category, renewal cadence, usage/cost driver, alert threshold, cancellation/offboarding rule, and replacement consideration."
    - "Tax and accounting interface defines what data is shared, owner, cadence, format, accounting/tax review needs, unknown obligations, professional-review boundaries, and downstream evidence."
    - "Financial controls define approvals, access controls, refund controls, discount controls, invoice correction controls, reconciliation checks, processor access review, vendor spend review, audit trail, and exception review."
    - "Financial exceptions define how pricing, discounts, refunds, credits, billing corrections, invoice changes, manual entitlements, payment issues, and customer-specific financial exceptions are requested, approved, time-boxed, documented, reviewed, and closed."
    - "Financial reporting defines reports, cadence, audience, owner, metrics, source, artifact, caveats, escalation triggers, and decision use."
    - "Financial metrics define MRR/ARR/revenue where applicable, payments collected, failed payment rate, payment recovery, refund rate, chargeback rate, billing error rate, invoice issue rate, discount exception rate, subscription state errors, vendor cost, margin, and finance support burden."
    - "Financial evidence and audit trail define what financial actions, exceptions, refunds, chargebacks, invoices, billing corrections, processor events, reports, reconciliations, and approvals are stored, protected, reviewed, and retained."
    - "Financial operations risks identify billing errors, incorrect entitlements, failed payment handling gaps, refund abuse, chargebacks, processor failure, tax/accounting unknowns, cost spikes, margin erosion, vendor surprises, weak controls, evidence gaps, and owner gaps."
    - "Downstream handoff clarifies what Risk Management must inherit from Financial Operations."
  qualityChecks:
    - "Avoid vague claims."
    - "Avoid financial-operations theater: billing, payment, refund, cost, or reporting claims without owner, source, process, control, evidence, metric, exception path, and risk handling."
    - "Avoid asserting tax, accounting, revenue recognition, invoice, legal, chargeback, or regulatory conclusions as final unless professionally reviewed."
    - "Avoid confusing Pricing strategy with Financial Operations execution; pricing defines terms, financial operations enforces and records them."
    - "Avoid confusing Customer Support handling with Financial Operations authority; support may intake questions, but financial approval and evidence must be defined."
    - "Avoid refund, discount, credit, billing correction, or manual entitlement exceptions without approval authority, audit trail, expiration/review trigger, and abuse/fraud consideration."
    - "Avoid payment failure handling without customer communication, retry/grace/access rules, support handoff, and financial reporting."
    - "Avoid revenue metrics without source, formula, caveats, owner, and accounting/tax review boundary."
    - "Avoid margin metrics that ignore processor fees, vendor costs, infrastructure, support burden, observability, AI/model costs, storage/bandwidth, refunds, chargebacks, and manual work."
    - "Avoid vendor cost tracking without owner, renewal cadence, cost driver, alert threshold, and cancellation/offboarding path."
    - "Prefer decision-useful statements."
    - "Make assumptions explicit."
    - "Do not invent payment processor behavior, tax obligations, accounting method, revenue recognition treatment, invoice requirements, chargeback timelines, refund authority, cost numbers, margin targets, or financial tooling readiness."
    - "Financial Operations must preserve Foundation boundaries, product truth, technical truth, pricing truth, privacy/security constraints, customer trust, support capacity, cost discipline, and operational sustainability."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
    - "Separate billing rule, payment rule, subscription rule, refund rule, chargeback rule, cost item, vendor cost, margin metric, financial control, exception, report, evidence, risk, and handoff."
    - "Tie financial operations claims to Pricing and Packaging, Business Processes, Customer Support, Product Scope, Data Model, Security/Privacy, Operational Metrics, Reporting and Cadence, Incident Management, Risk and Compliance, or Decision Record where possible."
    - "Classify financial items as current, required, deferred, blocked, review-needed, professional-review-needed, customer-facing, internal-only, financial-sensitive, privacy-sensitive, processor-owned, manually-operated, automated, launch-critical, post-launch, or downstream-owned where useful."
    - "State whether each financial process is self-serve, processor-automated, system-automated, support-assisted, finance-assisted, manually reviewed, or professional-review-needed."
    - "Route enterprise risk governance downstream to Risk Management."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with Pricing and Packaging, Product Scope, Acceptance Criteria, Data Model, Security/Privacy, Observability, Technical Risks, GTM Risks, Operations Brief, Operating Model, Team Responsibilities, Customer Support, Business Processes, Operational Metrics, Reporting and Cadence, Incident Management, Risk and Compliance, or Decision Record."
    - "Flag financial processes without owner, backup owner, trigger, input, output, control, exception path, evidence, metric, and risk."
    - "Flag tax/accounting/revenue-recognition statements that sound final but are not marked reviewed or review-needed."
    - "Flag refund, discount, credit, billing correction, and manual entitlement exceptions without approval authority, evidence, expiration/review trigger, and abuse/fraud consideration."
    - "Flag payment failure logic without retry/grace/access/customer communication/support handoff."
    - "Flag subscription management without entitlement timing, cancellation access timing, plan-change handling, and customer communication."
    - "Flag chargeback/dispute handling without evidence, owner, processor workflow, financial impact, and escalation."
    - "Flag cost/margin metrics without formula, source, owner, cadence, threshold, caveat, and decision implication."
    - "Flag financial evidence/audit trail without storage, access control, retention, redaction, review, and evidence owner."
    - "Verify that Risk Management receives concrete financial risk handoff inputs."
