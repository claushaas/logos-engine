          loop."
        - "State daily/weekly/monthly split where relevant."
      qualityChecks:
        - "Support review detects overload and quality issues."
        - "Support feedback turns into action."
        - "Billing/refund and bug signals are included."
      questions: &a12
        - "What support data is reviewed daily, weekly, or monthly?"
        - "How are support volume, backlog, response, resolution, escalation, bugs, known issues, and billing/refund issues
          reviewed?"
        - "What support risks trigger escalation?"
        - "What actions can support review create?"
    - id: "customer-success-review-cadence"
      title: "Customer Success Review Cadence"
      intent: "Define reporting cadence for onboarding, activation, health, at-risk customers, retention, expansion,
        satisfaction, feedback, and churn."
      required: true
      outputGuidance:
        - "Tie to Customer Success and Growth Metrics."
        - "Include health signals, intervention review, churn analysis, feedback routing, and expansion ethics."
        - "Mark deferred cadences if customer success is not active yet."
      qualityChecks:
        - "Customer success review is proactive and value-based."
        - "Health and churn signals are reviewed with actions."
        - "Expansion is reviewed through customer benefit lens."
      questions: &a13
        - "What customer success data is reviewed daily, weekly, or monthly?"
        - "How are onboarding, activation, health, at-risk customers, retention, expansion, satisfaction, feedback, and churn
          reviewed?"
        - "What actions can customer success review create?"
    - id: "financial-review-cadence"
      title: "Financial Review Cadence"
      intent: "Define reporting cadence for billing, payments, refunds, invoices, discounts, chargebacks, revenue operations,
        cost, and finance risks."
      required: true
      outputGuidance:
        - "Tie to Pricing and Financial Operations."
        - "Include failed payments, refunds, discounts, invoices/receipts, chargebacks, costs, vendor spend, support
          burden, and finance-sensitive exceptions."
        - "Mark accounting/legal review needs where relevant."
      qualityChecks:
        - "Financial review protects correctness and customer trust."
        - "Exceptions and anomalies have escalation."
        - "Cost and revenue operations are both included."
      questions: &a14
        - "What financial data is reviewed daily, weekly, monthly, or quarterly?"
        - "How are billing, payment failures, refunds, invoices, discounts, chargebacks, revenue operations, costs, and
          financial risks reviewed?"
        - "What triggers financial escalation?"
    - id: "data-and-privacy-review-cadence"
      title: "Data and Privacy Review Cadence"
      intent: "Define reporting cadence for data access, privacy requests, retention/deletion controls, telemetry/logging
        review, and privacy incidents."
      required: true
      outputGuidance:
        - "Tie to Data and Privacy Operations."
        - "Include access reviews, data export/deletion requests, verification failures, telemetry/log reviews,
          retention/deletion control health, and privacy incidents."
        - "State privacy-sensitive access rules for reports."
      qualityChecks:
        - "Privacy reporting minimizes sensitive data exposure."
        - "Access/review ownership is explicit."
        - "Privacy incident escalation is included."
      questions: &a15
        - "What data/privacy information is reviewed and how often?"
        - "How are access reviews, privacy requests, export/deletion handling, telemetry/logging review, retention/deletion
          controls, and privacy incidents reviewed?"
        - "Who may access these reports?"
        - "What triggers privacy escalation?"
    - id: "risk-review-cadence"
      title: "Risk Review Cadence"
      intent: "Define cadence for reviewing operational risks, accepted risks, mitigation progress, residual risk, escalation,
        and risk register updates."
      required: true
      outputGuidance:
        - "Tie to GTM Risks and Risk Management."
        - "Include risk status, accepted risks, mitigation progress, residual risk, new risk detection, retired risks,
          and escalation."
        - "Define out-of-cycle risk review triggers."
      qualityChecks:
        - "Risk review is living and actionable."
        - "Accepted risks are reviewed."
        - "Mitigation progress is tracked."
      questions: &a16
        - "How often are operational and handed-off GTM risks reviewed?"
        - "How are accepted risks and mitigation progress reviewed?"
        - "What triggers out-of-cycle risk review?"
        - "What should Risk Management inherit?"
    - id: "process-review-cadence"
      title: "Process Review Cadence"
      intent: "Define cadence for reviewing recurring business process health, controls, exceptions, manual burden, automation
        reliability, and improvements."
      required: true
      outputGuidance:
        - "Tie to Business Processes."
        - "Include process metrics, controls, exceptions, rework, manual effort, automation reliability, and
          documentation updates."
        - "State how process improvements are prioritized."
      qualityChecks:
        - "Process review creates improvements or explicit no-action decisions."
        - "Control failures and manual burden are reviewed."
        - "Documentation updates are included."
      questions: &a17
        - "How often are business processes reviewed?"
        - "What process metrics and controls are reviewed?"
        - "How are exceptions, rework, manual burden, and automation reliability reviewed?"
        - "How are process improvements prioritized and documented?"
    - id: "metrics-dashboard"
      title: "Metrics Dashboard"
      intent: "Define operational dashboards, access controls, data sources, refresh cadence, QA, caveats, maintenance, and
        retirement/update triggers."
      required: true
      outputGuidance:
        - "Use dashboard records."
        - "Tie dashboards to Operational Metrics."
        - "Distinguish dashboard from report and meeting."
      qualityChecks:
        - "Dashboards have owner, data source, refresh cadence, QA, caveats, and access rule."
        - "Dashboards are maintained or retired when stale."
        - "Sensitive dashboards have restricted access."
      questions: &a18
        - "What dashboards exist for operational metrics?"
        - "Who has access?"
        - "What data sources and metrics are included?"
        - "How often are dashboards refreshed?"
        - "How are dashboards QA checked and maintained?"
        - "When are dashboards updated or retired?"
    - id: "decision-meetings"
      title: "Decision Meetings"
      intent: "Define recurring meetings dedicated to operational decisions, required inputs, participants, decision owner,
        artifacts, action tracking, and follow-up."
      required: true
      outputGuidance:
        - "Use decision meeting records."
        - "Include only meetings that create decisions or action."
        - "State async alternative when a meeting is unnecessary."
      qualityChecks:
        - "Meetings are decision-oriented."
        - "Decision owner and action owner are explicit."
        - "Artifacts and follow-up rules are included."
      questions: &a19
        - "What recurring meetings are dedicated to operational decisions?"
        - "What decisions are made in each meeting?"
        - "What inputs are required?"
        - "Who participates and who decides?"
        - "What artifact is produced?"
        - "How are actions followed up?"
    - id: "review-artifacts"
      title: "Review Artifacts"
      intent: "Define artifacts produced by each review cadence and how they are stored, shared, updated, retained, and linked
        to decisions/actions."
      required: true
      outputGuidance:
        - "Use review artifact records."
        - "Include storage location, access rule, update rule, retention rule, linked decisions, linked actions, and
          downstream use."
        - "Do not leave artifacts as informal notes only."
      qualityChecks:
        - "Artifacts are retrievable and useful."
        - "Access and retention are considered."
        - "Artifacts link to decisions and actions."
      questions: &a20
        - "What artifacts are produced by each review cadence?"
        - "How are artifacts stored and shared?"
        - "Who owns each artifact?"
        - "What access and retention rules apply?"
        - "How are artifacts linked to decisions and action items?"
    - id: "reporting-responsibilities"
      title: "Reporting Responsibilities"
      intent: "Assign responsibility for producing, validating, presenting, reviewing, acting on, and escalating reports."
      required: true
      outputGuidance:
        - "Use reporting responsibility records."
        - "Separate report owner, data owner, dashboard owner, QA owner, meeting owner, decision owner, action owner,
          and escalation owner."
        - "Flag owner gaps and backup gaps."
      qualityChecks:
        - "Reporting responsibilities are complete."
        - "Action ownership is not confused with report production."
        - "Backup owners are explicit for critical reporting."
      questions: &a21
        - "Who is responsible for producing each report?"
        - "Who owns the data source?"
        - "Who validates reporting quality?"
        - "Who owns the meeting or review?"
        - "Who is accountable for acting on findings?"
        - "What responsibility gaps remain?"
    - id: "escalation-triggers"
      title: "Escalation Triggers"
      intent: "Define metric thresholds, events, missed cadences, data failures, incidents, support overload, financial
        anomalies, privacy issues, and risk thresholds that trigger out-of-cycle escalation."
      required: true
      outputGuidance:
        - "Use escalation trigger records."
        - "Tie triggers to Operational Metrics and downstream procedures."
        - "Include notification target, response expectation, and customer communication requirement where relevant."
      qualityChecks:
        - "Escalation triggers are concrete."
        - "Every trigger has owner, backup, severity, and downstream procedure."
        - "Customer communication is considered when relevant."
      questions: &a22
        - "What metric thresholds or events trigger out-of-cycle escalation?"
        - "Who is notified when an escalation trigger fires?"
        - "What severity and response expectation applies?"
        - "When is customer communication required?"
        - "What downstream procedure handles escalation?"
    - id: "data-quality-and-caveats"
      title: "Data Quality and Caveats"
      intent: "Define how reporting data is validated, caveated, repaired, and marked unsafe for decisions when needed."
      required: true
      outputGuidance:
        - "Use data quality caveat records."
        - "Identify manual inputs, missing data, stale data, inconsistent data, privacy constraints, and metrics not
          safe for decisions."
        - "Define remediation owner."
      qualityChecks:
        - "Data caveats are visible in reports."
        - "Unsafe reports do not silently drive decisions."
        - "Remediation ownership is explicit."
      questions: &a23
        - "How is reporting data validated?"
        - "Which reports depend on manual inputs or incomplete sources?"
        - "What caveats must be shown with each report?"
        - "When is a report not decision-safe?"
        - "Who remediates data quality issues?"
    - id: "action-item-tracking"
      title: "Action Item Tracking"
      intent: "Define how decisions and action items produced by reporting cadences are assigned, tracked, escalated, and
        closed."
      required: true
      outputGuidance:
        - "Use action item records."
        - "Tie actions to source report/meeting and linked decision."
        - "Include owner, due date or trigger, status, closure evidence, and escalation if blocked."
      qualityChecks:
        - "Actions do not disappear after meetings."
        - "Closure requires evidence."
        - "Blocked actions have escalation path."
      questions: &a24
        - "How are action items created from reports and meetings?"
        - "Who owns each action?"
        - "How are due dates or due triggers set?"
        - "What evidence closes an action item?"
        - "What happens when an action is blocked?"
    - id: "cadence-risks"
      title: "Cadence Risks"
      intent: "Identify failure modes of the reporting cadence and how cadence risks are detected, mitigated, escalated, or
        handed off."
      required: true
      outputGuidance:
        - "Use cadence risk records."
        - "Include reporting overload, stale dashboards, ignored reports, owner gaps, bad data, no action
          follow-through, decision latency, meeting bloat, alert fatigue, hidden risks, and review theater."
        - "Route risks to Risk Management where needed."
      qualityChecks:
        - "Risks are concrete and monitorable."
        - "Mitigation and contingency are distinct."
        - "High-impact risks have owner and downstream handoff."
      questions: &a25
        - "What could cause the review cadence to fail?"
        - "Where could reporting become stale, ignored, ownerless, noisy, too frequent, too slow, or disconnected from
          action?"
        - "How are cadence risks detected?"
        - "How are cadence risks mitigated?"
        - "What should Risk Management inherit?"
    - id: "downstream-handoff"
      title: "Downstream Handoff"
      intent: "Define what downstream Operations documents must inherit from Reporting and Cadence and what they must not
        assume."
      required: true
      outputGuidance:
        - "Use reporting handoff records."
        - "Route context to Maintenance Plan, Release Management, Incident Response, Data/Privacy Operations, Financial
          Operations, and Risk Management."
        - "Preserve reports, cadences, metrics, thresholds, owners, artifacts, escalation triggers, caveats, unresolved
          questions, and cadence risks."
      qualityChecks:
        - "Handoff items are concrete and document-targeted."
        - "Downstream documents are not allowed to invent missing reporting assumptions silently."
        - "Reporting and Cadence remains rhythm architecture; detailed procedures remain downstream."
      questions: &a26
        - "What should Maintenance Plan inherit?"
        - "What should Release Management inherit?"
        - "What should Incident Response inherit?"
        - "What should Data and Privacy Operations inherit?"
        - "What should Financial Operations inherit?"
        - "What should Risk Management inherit?"
        - "What unresolved reporting and cadence questions must be carried forward?"
