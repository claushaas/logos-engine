document:
  id: "08-reporting-and-cadence"
  title: "Reporting and Cadence"
  phase: "06-operations"
  status: "not_started"
  order: 8
  type: "reporting_cadence"
  purpose: "Define how operational information is reviewed, reported, escalated, converted into decisions, documented, and
    handed off across daily, weekly, monthly, quarterly, launch-window, release, incident, support, customer success,
    financial, privacy, risk, and process cadences."
  centralQuestion: "When do we review which operational signals, who reviews them, what decisions are made, what artifacts
    are produced, what thresholds trigger escalation, and how are decisions followed through?"
  outputs:
    canonical:
      format: "markdown"
      path: "docs/06-operations/08-reporting-and-cadence.md"
      purpose: "Store the canonical reporting and cadence model as a Markdown document."
    artifacts:
      - id: "operations.reporting_cadence_calendar"
        format: "html"
        path: "outcomes/html/06-operations/reporting-and-cadence-calendar.html"
        purpose: "Provide a founder-facing reporting cadence calendar covering reporting objective, report inventory, daily
          checks, weekly reviews, monthly reviews, quarterly reviews, launch-window reviews, release reviews, incident
          reviews, support reviews, customer success reviews, financial reviews, data/privacy reviews, risk reviews,
          process review cadence, dashboards, decision meetings, artifacts, responsibilities, escalation triggers, data
          quality, cadence risks, and downstream handoff."
        audience: "founder"
        includes:
          - "reporting objective"
          - "reporting principles"
          - "cadence taxonomy"
          - "report inventory"
          - "daily checks"
          - "weekly review"
          - "monthly review"
          - "quarterly review"
          - "launch-window cadence"
          - "release review cadence"
          - "incident review cadence"
          - "support review cadence"
          - "customer success review cadence"
          - "financial review cadence"
          - "data and privacy review cadence"
          - "risk review cadence"
          - "process review cadence"
          - "metrics dashboard"
          - "decision meetings"
          - "review artifacts"
          - "reporting responsibilities"
          - "escalation triggers"
          - "data quality and caveats"
          - "cadence risks"
          - "downstream handoff"
        generationMode: "regenerate_from_canonical"
    agentPacks:
      - id: "operations.reporting_cadence_review_prompt"
        format: "markdown"
        path: "outcomes/agents/06-operations/reporting-and-cadence-review-prompt.md"
        purpose: "Provide compact context for agents reviewing whether operational reporting cadence is complete,
          decision-useful, owner-assigned, artifact-backed, threshold-aware, data-quality-aware, escalation-ready, and
          aligned with operational metrics and downstream Operations documents."
        agentRole: "reviewer"
        includes:
          - "canonical reporting and cadence model"
          - "operations brief dependency"
          - "operating model dependency"
          - "team responsibilities dependency"
          - "business processes dependency"
          - "operational metrics dependency"
          - "customer support dependency"
          - "customer success dependency"
          - "reporting formats"
          - "completion criteria"
          - "quality checks"
          - "review rules"
  dependsOn:
    - "01-foundation/06-success-definition"
    - "03-product/11-non-functional-requirements"
    - "03-product/13-acceptance-criteria"
    - "04-engineering/08-security-and-privacy"
    - "04-engineering/11-observability"
    - "04-engineering/12-deployment-and-environments"
    - "04-engineering/14-technical-risks"
    - "05-go-to-market/07-launch-plan"
    - "05-go-to-market/10-pricing-and-packaging"
    - "05-go-to-market/12-growth-metrics"
    - "05-go-to-market/13-go-to-market-risks"
    - "06-operations/01-operations-brief"
    - "06-operations/02-operating-model"
    - "06-operations/03-team-and-responsibilities"
    - "06-operations/04-customer-support"
    - "06-operations/05-customer-success"
    - "06-operations/06-business-processes"
    - "06-operations/07-operational-metrics"
  feeds:
    - "06-operations/09-maintenance-plan"
    - "06-operations/10-release-management"
    - "06-operations/11-incident-response"
    - "06-operations/12-data-and-privacy-operations"
    - "06-operations/13-financial-operations"
    - "06-operations/14-risk-management"
  inputs:
    - id: "operations-brief"
      type: "context"
      required: false
      description: "Operations objective, operational success criteria, service expectations, support expectations, incident
        expectations, maintenance expectations, release expectations, data/privacy operations, cost/capacity
        constraints, and operational risks."
    - id: "operating-model"
      type: "context"
      required: false
      description: "Operating cadences, standard workflows, decision rights, escalation paths, operating metrics, constraints,
        risks, and downstream handoffs."
    - id: "team-and-responsibilities"
      type: "context"
      required: false
      description: "Report owners, backup owners, decision authority, escalation owners, handoff rules, responsibility gaps,
        and responsibility risks."
    - id: "customer-support"
      type: "context"
      required: false
      description: "Support metrics, support risks, ticket review needs, known issue handling, bug flow, escalation rules, and
        support feedback loop."
    - id: "customer-success"
      type: "context"
      required: false
      description: "Customer success cadences, customer success metrics, health signals, retention actions, churn analysis,
        feedback loops, and risks."
    - id: "business-processes"
      type: "context"
      required: false
      description: "Process review cadence, process metrics, process controls, process risks, financial-sensitive processes,
        privacy-sensitive processes, and process handoffs."
    - id: "operational-metrics"
      type: "context"
      required: false
      description: "Metric taxonomy, metric inventory, health scorecard, domain metrics, SLO/SLA metrics, guardrail metrics,
        thresholds, reporting cadence, alert rules, data quality checks, and metric risks."
    - id: "engineering-observability-context"
      type: "context"
      required: false
      description: "Observability sources, dashboards, alerting constraints, deployment environments, reliability metrics,
        incident signals, data quality constraints, and technical risks."
    - id: "reporting-notes"
      type: "manual_note"
      required: false
      description: "Preferred meeting cadence, report examples, dashboard ideas, escalation thresholds, stakeholders,
        reporting artifacts, ownership assumptions, cadence pain points, and unresolved reporting questions."
  completionCriteria:
    - "The central question is answered through a complete reporting and cadence model with reports, review rhythms,
      dashboards, meetings, owners, artifacts, thresholds, escalation, data quality, risks, and downstream handoff."
    - "Reporting objective defines what reporting protects: operational awareness, decision quality, accountability,
      customer trust, supportability, release safety, risk visibility, financial correctness, data/privacy safety, and
      continuous improvement."
    - "Reporting principles define how reports should remain decision-useful, lightweight, timely, accurate,
      owner-assigned, threshold-aware, and action-oriented."
    - "Cadence taxonomy defines reporting types, review types, cadence frequency, trigger-based reviews, domain reviews,
      decision meetings, escalation reviews, and artifact expectations."
    - "Report inventory lists report name, purpose, audience, owner, backup owner, cadence, data source, metrics
      included, decisions supported, artifact produced, distribution method, escalation trigger, and status."
    - "Daily checks define which signals are checked daily, owner, source, expected review time, threshold, action,
      escalation, evidence, and what is intentionally not checked daily."
    - "Weekly review defines scope, participants, owner, inputs, dashboard, required decisions, action item tracking,
      artifact, escalation path, and unresolved questions."
    - "Monthly review defines scope, participants, owner, operating trends, financial/process/support/customer
      success/release/maintenance/risk review, planning implications, artifact, and downstream action."
    - "Quarterly review defines strategic operational review scope, participants, operating model changes, capacity
      changes, risk review, cost review, process maturity review, service expectations review, and planning outputs."
    - "Launch-window cadence defines temporary high-frequency checks, readiness gates, support readiness, analytics
      readiness, issue review, go/no-go signals, customer feedback, escalation, and pause/rollback review."
    - "Release review cadence defines pre-release readiness review, release-day monitoring, post-release review, release
      quality metrics, rollback/pause signals, support handoff, and release artifact."
    - "Incident review cadence defines incident-triggered reporting, severity review, live updates, post-incident
      review, action item tracking, recurrence review, communication review, and Risk Management handoff."
    - "Support review cadence defines ticket volume, backlog, response, resolution, escalation, bugs, known issues,
      refunds/billing, macros/docs, support burden, and feedback loop review."
    - "Customer success review cadence defines onboarding, activation, health, at-risk customers, retention, churn,
      expansion, satisfaction, feedback, and intervention review."
    - "Financial review cadence defines revenue operations, billing, failed payments, refunds, invoices/receipts,
      discounts, chargebacks, cost, vendor/tooling spend, and financial risk review."
    - "Data and privacy review cadence defines access review, data request review, export/deletion handling,
      telemetry/logging review, retention/deletion controls, privacy incidents, and privacy risk review."
    - "Risk review cadence defines operational risks, GTM risks handed off to operations, accepted risks, mitigation
      status, escalation triggers, residual risks, and risk register updates."
    - "Process review cadence defines which business processes are reviewed, what metrics/controls are checked, how
      exceptions/rework/manual burden are reviewed, and how process improvements are decided."
    - "Metrics dashboard defines dashboard inventory, purpose, audience, access, owner, data sources, refresh cadence,
      QA process, caveats, maintenance, and retirement/update triggers."
    - "Decision meetings define recurring decision forums, decision categories, required inputs, participants, decision
      owner, decision log, follow-up owner, escalation rule, and artifact."
    - "Review artifacts define reports, scorecards, meeting notes, decision logs, action registers, risk updates,
      incident reports, release reports, support summaries, financial summaries, and where/how they are stored."
    - "Reporting responsibilities define report owner, backup owner, data owner, dashboard owner, QA owner, meeting
      owner, decision owner, action owner, escalation owner, and responsibility gaps."
    - "Escalation triggers define metric thresholds, missed cadence, stale dashboard, data quality failure, incident
      signal, support overload, privacy issue, financial anomaly, release issue, cost spike, and risk threshold
      triggers."
    - "Data quality and caveats define how reporting data is validated, which reports depend on manual inputs, what
      caveats apply, when reports are not decision-safe, and who owns remediation."
    - "Cadence risks identify reporting overload, stale dashboards, ignored reports, owner gaps, bad data, no action
      follow-through, decision latency, meeting bloat, alert fatigue, hidden risks, and review theater."
    - "Downstream handoff clarifies what Maintenance Plan, Release Management, Incident Response, Data/Privacy
      Operations, Financial Operations, and Risk Management must inherit."
  qualityChecks:
    - "Avoid vague claims."
    - "Avoid reporting theater: reports, dashboards, or meetings without owner, audience, source, decision, threshold,
      artifact, action tracking, and escalation path."
    - "Avoid cadences that exist only to create meetings without decisions, outputs, or risk reduction."
    - "Avoid daily reporting for signals that do not change daily or do not support daily decisions."
    - "Avoid monthly or quarterly reviews that are too slow for operationally volatile risks, incidents, support
      overload, payment failures, or privacy issues."
    - "Avoid dashboards without data ownership, QA, refresh cadence, caveats, and maintenance trigger."
    - "Avoid reports that combine internal targets and customer-facing commitments without distinction."
    - "Avoid report-driven escalation without explicit threshold, owner, backup, response expectation, and communication
      rule."
    - "Avoid action items without owner, due trigger/date, status, follow-up cadence, and closure evidence."
    - "Avoid reporting sensitive customer, billing, privacy, or security data to audiences that do not need access."
    - "Prefer decision-useful statements."
    - "Make assumptions explicit."
    - "Do not invent report consumers, staffing coverage, dashboard readiness, alert reliability, data source
      availability, baselines, thresholds, SLAs/SLOs, or meeting cadences as facts."
    - "Reporting and cadence must preserve Foundation boundaries, product truth, technical truth, pricing truth,
      privacy/security constraints, customer trust, support capacity, cost discipline, and operational sustainability."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
    - "Separate report, cadence, dashboard, meeting, metric, threshold, artifact, owner, action, escalation, caveat,
      risk, and handoff."
    - "Tie reporting rules to Operations Brief, Operating Model, Team and Responsibilities, Customer Support, Customer
      Success, Business Processes, Operational Metrics, Observability, Launch Plan, Pricing, GTM Risks, Technical Risks,
      or Decision Record where possible."
    - "Classify reports and cadences as current, required, deferred, manual, automated, dashboard-backed, meeting-based,
      trigger-based, internal-only, customer-facing, privacy-sensitive, financial-sensitive, launch-critical,
      post-launch, blocked, review-needed, or downstream-owned where useful."
    - "State whether reporting is automated, manually compiled, dashboard-backed, meeting-based, async, trigger-based,
      or unavailable."
    - "Route detailed maintenance, release, incident, data/privacy, financial, and risk procedures downstream."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with Operations Brief, Operating Model, Team and Responsibilities, Customer Support, Customer
      Success, Business Processes, Operational Metrics, Security/Privacy, Observability, Deployment, Technical Risks,
      Launch Plan, Pricing, Growth Metrics, GTM Risks, or Decision Record."
    - "Flag reports without owner, backup owner, audience, source, cadence, metrics, decision use, artifact, and
      escalation trigger."
    - "Flag meetings without decision categories, required inputs, decision owner, artifact, action tracking, and
      follow-up rule."
    - "Flag dashboards without owner, data source, refresh cadence, QA, access control, caveats, and maintenance
      trigger."
    - "Flag escalation triggers without threshold, owner, backup, response expectation, and downstream procedure."
    - "Flag reporting artifacts without storage location, access rule, retention/update rule, and action tracking."
    - "Flag cadences that are too frequent, too slow, duplicated, ownerless, or not tied to decisions."
    - "Flag data quality gaps that make reports unsafe for decisions."
    - "Verify that downstream Operations documents receive concrete reporting/cadence handoff inputs."
    - "Flag content that belongs better in Maintenance Plan, Release Management, Incident Response, Data/Privacy
      Operations, Financial Operations, or Risk Management."
  specializedFormats:
    reportFormat:
      description: "Recommended format for operational reports."
      fields:
        - "report"
        - "purpose"
        - "audience"
        - "cadence"
        - "trigger"
        - "owner"
        - "backupOwner"
        - "dataSources"
        - "metricsIncluded"
        - "decisionsSupported"
        - "artifactProduced"
        - "distributionMethod"
        - "escalationTrigger"
        - "caveats"
        - "status"
    cadenceFormat:
      description: "Recommended format for review cadences."
      fields:
        - "cadence"
        - "frequency"
        - "purpose"
        - "participants"
        - "owner"
        - "inputs"
        - "outputs"
        - "decisionsSupported"
        - "actionTrackingMethod"
        - "escalationCondition"
        - "downstreamDocument"
        - "status"
    dashboardFormat:
      description: "Recommended format for dashboards."
      fields:
        - "dashboard"
        - "purpose"
        - "audience"
        - "owner"
        - "dataSources"
        - "metricsIncluded"
        - "refreshCadence"
        - "accessRule"
        - "QAOwner"
        - "caveats"
        - "maintenanceTrigger"
        - "retirementTrigger"
        - "status"
    decisionMeetingFormat:
      description: "Recommended format for recurring decision meetings."
      fields:
        - "meeting"
        - "purpose"
        - "cadence"
        - "participants"
        - "requiredInputs"
        - "decisionCategories"
        - "decisionOwner"
        - "artifactProduced"
        - "actionOwner"
        - "followUpRule"
        - "escalationRule"
        - "status"
    reviewArtifactFormat:
      description: "Recommended format for review artifacts."
      fields:
        - "artifact"
        - "producedBy"
        - "purpose"
        - "owner"
        - "storageLocation"
        - "accessRule"
        - "updateRule"
        - "retentionRule"
        - "linkedDecisions"
        - "linkedActions"
        - "downstreamUse"
        - "status"
    reportingResponsibilityFormat:
      description: "Recommended format for reporting responsibilities."
      fields:
        - "reportingArea"
        - "reportOwner"
        - "backupOwner"
        - "dataOwner"
        - "dashboardOwner"
        - "QAOwner"
        - "meetingOwner"
        - "decisionOwner"
        - "actionOwner"
