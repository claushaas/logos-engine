  sections:
    - id: "reporting-objective"
      title: "Reporting Objective"
      intent: "Define the purpose of operational reporting and how it supports decisions, accountability, escalation,
        learning, and risk management."
      required: true
      outputGuidance:
        - "Open with the operational reporting purpose in one concise paragraph."
        - "State what reporting protects and what decisions it supports."
        - "Clarify that reporting is not measurement for its own sake."
      qualityChecks:
        - "Objective is decision-oriented."
        - "Objective connects reporting to operational health and accountability."
        - "Reporting bloat is explicitly discouraged."
      questions: &a1
        - "What is the purpose of operational reporting?"
        - "Who consumes operational reports?"
        - "What decisions should reports support?"
        - "What should reporting intentionally avoid?"
    - id: "reporting-principles"
      title: "Reporting Principles"
      intent: "Define principles that keep reporting lightweight, accurate, timely, decision-useful, privacy-safe, and
        action-oriented."
      required: true
      outputGuidance:
        - "Define practical principles for report design and review rhythm."
        - "Include rules for action tracking, data caveats, threshold-based escalation, and privacy-sensitive
          information."
        - "Tie principles to Foundation and Operations Brief."
      qualityChecks:
        - "Principles are actionable."
        - "Principles prevent reporting theater."
        - "Privacy and action ownership are included."
      questions: &a2
        - "What principles guide operational reporting?"
        - "How should reports stay lightweight and decision-useful?"
        - "How should data caveats be handled?"
        - "How should sensitive information be protected?"
    - id: "cadence-taxonomy"
      title: "Cadence Taxonomy"
      intent: "Define review cadence types and labels used throughout the reporting system."
      required: true
      outputGuidance:
        - "Define daily, weekly, monthly, quarterly, launch-window, release, incident, support, customer success,
          financial, data/privacy, risk, and process review cadences."
        - "Define statuses such as current, required, deferred, manual, automated, dashboard-backed, meeting-based,
          trigger-based, blocked, and review-needed."
        - "Clarify difference between report, dashboard, review, meeting, alert, escalation, and artifact."
      qualityChecks:
        - "Taxonomy prevents cadence ambiguity."
        - "Reports, dashboards, meetings, alerts, and artifacts are not conflated."
        - "Cadence statuses have operational meaning."
      questions: &a3
        - "What cadence types exist?"
        - "What reporting statuses are used?"
        - "How are report, dashboard, review, meeting, alert, escalation, and artifact different?"
    - id: "report-inventory"
      title: "Report Inventory"
      intent: "List every recurring or trigger-based operational report with purpose, audience, cadence, owner, source,
        metrics, decisions, artifact, escalation, and caveats."
      required: true
      outputGuidance:
        - "Use report records for every material report."
        - "Group reports by domain where useful."
        - "Mark missing, blocked, deferred, manual, automated, or dashboard-backed reports explicitly."
      qualityChecks:
        - "Every report supports decisions or escalation."
        - "Every report has owner, audience, data source, cadence, artifact, and caveats."
        - "Reports do not duplicate each other without purpose."
      questions: &a4
        - "What reports exist or must exist?"
        - "What is each report for?"
        - "Who receives each report?"
        - "Who owns each report?"
        - "What data sources and metrics does each report include?"
        - "What decisions or escalations does each report support?"
    - id: "daily-checks"
      title: "Daily Checks"
      intent: "Define which operational signals are checked daily, by whom, from which source, and what actions or escalations
        they trigger."
      required: true
      outputGuidance:
        - "Use cadence or report records where useful."
        - "Include only signals that need daily review."
        - "State what is intentionally not checked daily."
      qualityChecks:
        - "Daily checks are actionable."
        - "Daily review load is realistic."
        - "Every daily check has threshold and owner."
      questions: &a5
        - "What metrics and signals are checked daily?"
        - "Who performs daily checks?"
        - "What source is checked?"
        - "What threshold triggers action?"
        - "What actions or escalations can daily checks trigger?"
        - "What should not be checked daily?"
    - id: "weekly-review"
      title: "Weekly Review"
      intent: "Define the weekly operational review scope, inputs, decisions, participants, artifact, and action tracking."
      required: true
      outputGuidance:
        - "Use cadence records."
        - "Include support, customer success, reliability, incidents, releases, process metrics, costs, and risks where
          relevant."
        - "Keep weekly review decision-oriented."
      qualityChecks:
        - "Weekly review has decisions and action tracking."
        - "Participants and owner are explicit."
        - "Review scope matches weekly volatility."
      questions: &a6
        - "What is reviewed weekly?"
        - "Who participates?"
        - "What inputs and dashboards are used?"
        - "What decisions are made?"
        - "What artifact is produced?"
        - "How are action items tracked?"
    - id: "monthly-review"
      title: "Monthly Review"
      intent: "Define the monthly operational review scope and how it feeds planning, process improvements, financial review,
        and risk review."
      required: true
      outputGuidance:
        - "Use cadence records."
        - "Include trend review, planning implications, cost/capacity, process health, support/customer success,
          release/maintenance, and risks."
        - "Tie to operational planning."
      qualityChecks:
        - "Monthly review identifies trends and planning decisions."
        - "Financial/process/risk dimensions are included."
        - "Review produces documented outputs."
      questions: &a7
        - "What is reviewed monthly?"
        - "How does monthly review feed operational planning?"
        - "What trends are reviewed?"
        - "What financial, process, support, customer success, release, maintenance, and risk decisions are made?"
        - "What artifact is produced?"
    - id: "quarterly-review"
      title: "Quarterly Review"
      intent: "Define the quarterly review scope and how it connects operational reality to strategic planning, capacity,
        cost, risk, and operating model changes."
      required: true
      outputGuidance:
        - "Use cadence records."
        - "Include operating model, team capacity, costs, risk posture, service expectations, process maturity, customer
          trust, and strategic adjustments."
        - "Avoid turning quarterly review into a generic business retrospective."
      qualityChecks:
        - "Quarterly review connects operations to strategy."
        - "Capacity and risk are reviewed."
        - "Review outputs affect planning."
      questions: &a8
        - "What is reviewed quarterly?"
        - "How does quarterly review connect to strategic planning?"
        - "What operating model, capacity, cost, risk, process maturity, service expectation, and customer trust questions are
          reviewed?"
        - "What decisions or planning outputs result?"
    - id: "launch-window-cadence"
      title: "Launch-Window Cadence"
      intent: "Define temporary high-frequency reporting during launch windows and cohort expansions."
      required: true
      outputGuidance:
        - "Tie to Launch Plan, GTM Risks, Support, Operational Metrics, and Incident Response."
        - "Include readiness gates, support load, customer feedback, analytics, incidents, go/no-go, and pause/rollback
          review."
        - "State when launch-window cadence starts and ends."
      qualityChecks:
        - "Launch cadence is temporary and threshold-based."
        - "Go/no-go and pause/rollback signals are explicit."
        - "Support and analytics readiness are included."
      questions: &a9
        - "What reporting cadence applies during launch windows?"
        - "What readiness and support signals are reviewed?"
        - "What go/no-go or pause/rollback thresholds apply?"
        - "Who participates and who decides?"
        - "When does launch-window cadence end?"
    - id: "release-review-cadence"
      title: "Release Review Cadence"
      intent: "Define cadence for pre-release readiness, release-day monitoring, post-release review, and release quality
        decisions."
      required: true
      outputGuidance:
        - "Tie to Release Management."
        - "Include readiness, deployment, smoke checks, monitoring, support handoff, rollback signals, communication,
          and post-release artifact."
        - "Route detailed procedure downstream."
      qualityChecks:
        - "Release review supports release safety."
        - "Rollback/pause thresholds are included."
        - "Post-release review is not skipped."
      questions: &a10
        - "What reporting happens before release?"
        - "What is monitored during release?"
        - "What is reviewed after release?"
        - "What thresholds trigger rollback or pause?"
        - "What should Release Management inherit?"
    - id: "incident-review-cadence"
      title: "Incident Review Cadence"
      intent: "Define reporting and review cadence during and after incidents."
      required: true
      outputGuidance:
        - "Tie to Incident Response."
        - "Include incident updates, severity review, customer communication, post-incident review, action item
          tracking, recurrence review, and risk handoff."
        - "Do not duplicate full incident runbook."
      qualityChecks:
        - "Incident reporting supports response and learning."
        - "Post-incident actions are tracked."
        - "Customer communication review is included."
      questions: &a11
        - "What reporting happens during incidents?"
