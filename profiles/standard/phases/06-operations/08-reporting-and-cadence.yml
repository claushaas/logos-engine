        - "triggerType"
        - "sourceMetricOrEvent"
        - "threshold"
        - "severity"
        - "owner"
        - "backupOwner"
        - "notificationTarget"
        - "responseExpectation"
        - "customerCommunicationRequired"
        - "downstreamProcedure"
