document:
  id: "09-incident-management"
  title: "Incident Management"
  phase: "06-operations"
  status: "not_started"
  order: 9
  type: "incident_management"
  purpose: "Define how incidents are detected, declared, classified, assigned, coordinated, communicated, mitigated, resolved, reviewed, archived, and converted into corrective actions that reduce future operational risk."
  centralQuestion: "When something materially degrades customer trust, product availability, data safety, billing correctness, security/privacy, or operational continuity, how do we detect it, declare it, respond, communicate, recover, learn, and prevent recurrence?"
  outputs:
    canonical:
      format: "markdown"
      path: "docs/06-operations/09-incident-management.md"
      purpose: "Store the canonical incident management runbook and policy as a Markdown document."
    artifacts:
      - id: "operations.incident_management_runbook"
        format: "html"
        path: "outcomes/html/06-operations/incident-management-runbook.html"
        purpose: "Provide a founder-facing incident management runbook covering incident definition, severity, declaration, roles, detection, triage, response, communication, mitigation, rollback, resolution, postmortem, corrective actions, archive, metrics, risks, and downstream handoff."
        audience: "founder"
        includes:
          - "incident objective"
          - "incident principles"
          - "incident scope"
          - "incident definition"
          - "incident taxonomy"
          - "severity levels"
          - "incident declaration"
          - "incident roles"
          - "detection sources"
          - "triage and classification"
          - "response process"
          - "coordination rules"
          - "mitigation and containment"
          - "rollback and pause rules"
          - "communication rules"
          - "status updates"
          - "customer communication"
          - "privacy and security incidents"
          - "billing and payment incidents"
          - "incident resolution"
          - "postmortem process"
          - "corrective actions"
          - "incident metrics"
          - "incident archive"
          - "incident risks"
          - "downstream handoff"
        generationMode: "regenerate_from_canonical"
    agentPacks:
      - id: "operations.incident_management_review_prompt"
        format: "markdown"
        path: "outcomes/agents/06-operations/incident-management-review-prompt.md"
        purpose: "Provide compact context for agents reviewing whether incident management is severity-aware, role-assigned, escalation-ready, communication-safe, privacy-aware, measurable, postmortem-driven, and connected to release, support, data/privacy, financial operations, and risk management."
        agentRole: "reviewer"
        includes:
          - "canonical incident management"
          - "operations brief dependency"
          - "operating model dependency"
          - "team responsibilities dependency"
          - "customer support dependency"
          - "business processes dependency"
          - "operational metrics dependency"
          - "reporting cadence dependency"
          - "incident formats"
          - "completion criteria"
          - "quality checks"
          - "review rules"
  dependsOn:
    - "01-foundation/04-principles"
    - "01-foundation/05-boundaries"
    - "01-foundation/06-success-definition"
    - "03-product/11-non-functional-requirements"
    - "03-product/13-acceptance-criteria"
    - "04-engineering/08-security-and-privacy"
    - "04-engineering/10-testing-strategy"
    - "04-engineering/11-observability"
    - "04-engineering/12-deployment-and-environments"
    - "04-engineering/14-technical-risks"
    - "05-go-to-market/07-launch-plan"
    - "05-go-to-market/10-pricing-and-packaging"
    - "05-go-to-market/12-growth-metrics"
    - "05-go-to-market/13-go-to-market-risks"
    - "06-operations/01-operations-brief"
    - "06-operations/02-operating-model"
    - "06-operations/03-team-and-responsibilities"
    - "06-operations/04-customer-support"
    - "06-operations/06-business-processes"
    - "06-operations/07-operational-metrics"
    - "06-operations/08-reporting-and-cadence"
  feeds:
    - "06-operations/10-data-and-privacy-operations"
    - "06-operations/11-financial-operations"
    - "06-operations/12-risk-management"
  inputs:
    - id: "operations-brief"
      type: "context"
      required: false
      description: "Operations objective, service expectations, incident expectations, critical operational functions, data/privacy operations, cost/capacity constraints, operational success criteria, and operational risks."
    - id: "operating-model"
      type: "context"
      required: false
      description: "Operating scope, ownership model, roles, standard workflows, decision rights, escalation paths, manual/automated operations, dependencies, operating metrics, constraints, and risks."
    - id: "team-and-responsibilities"
      type: "context"
      required: false
      description: "Incident commander, technical responder, support owner, customer communication owner, escalation owner, backup owners, decision authority, handoff rules, responsibility gaps, and responsibility risks."
    - id: "customer-support"
      type: "context"
      required: false
      description: "Support channels, ticket categories, priority levels, triage rules, escalation rules, known issue handling, incident handoff, customer communication expectations, support metrics, and support risks."
    - id: "business-processes"
      type: "context"
      required: false
      description: "Bug triage process, release communication process, billing process, refund process, data export/deletion process, process controls, process metrics, and sensitive process risks."
    - id: "operational-metrics"
      type: "context"
      required: false
      description: "Reliability metrics, incident metrics, release metrics, support metrics, SLA/SLO metrics, guardrail metrics, thresholds, alert rules, data quality checks, and metric risks."
    - id: "reporting-and-cadence"
      type: "context"
      required: false
      description: "Incident review cadence, escalation triggers, reporting artifacts, action item tracking, dashboard/reporting responsibilities, data quality caveats, and cadence risks."
    - id: "engineering-observability-context"
      type: "context"
      required: false
      description: "Observability sources, alerts, dashboards, logs, traces, metrics, deployment environments, rollback mechanisms, feature flags, release health, technical risks, and operational diagnostics."
    - id: "incident-notes"
      type: "manual_note"
      required: false
      description: "Known incident scenarios, severity ideas, responder assumptions, communication preferences, status page/tooling ideas, postmortem preferences, rollback concerns, privacy/security incident concerns, and unresolved incident management questions."
  completionCriteria:
    - "The central question is answered through a complete incident management model covering detection, declaration, severity, roles, triage, response, communication, mitigation, rollback, resolution, postmortem, corrective actions, metrics, archive, risks, and handoff."
    - "Incident objective defines what incident management protects: customer trust, safety, availability, data integrity, privacy/security, billing correctness, operational continuity, recovery speed, and learning."
    - "Incident principles define how incidents are handled: fast ownership, truthful communication, customer protection, privacy minimization, clear authority, evidence preservation, blameless learning, and recurrence reduction."
    - "Incident scope defines what is in scope, out of scope, support-only, bug-only, privacy/security incident, billing/payment incident, release incident, operational incident, vendor incident, or GTM/customer-communication incident."
    - "Incident definition distinguishes incident, bug, support ticket, known issue, feature request, maintenance task, release issue, privacy request, security event, billing issue, and operational risk."
    - "Incident taxonomy classifies incidents by domain, severity, customer impact, business impact, data/privacy impact, security impact, financial impact, operational impact, detection source, and status."
    - "Severity levels define SEV-1 through SEV-4 or an equivalent scale with impact, examples, response expectation, escalation requirement, communication requirement, incident commander requirement, and resolution expectation."
    - "Incident declaration defines who can declare an incident, what evidence is required, how severity is initially assigned, who is notified, how incident record is created, and how false positives are handled."
    - "Incident roles define incident commander, technical responder, support coordinator, communications owner, customer communication owner, subject matter expert, scribe, decision owner, escalation owner, and backup roles."
    - "Detection sources define monitoring alerts, support reports, customer reports, internal discovery, release monitoring, vendor alerts, billing anomalies, privacy/security signals, and manual checks."
    - "Triage and classification define how an incident candidate is assessed, severity assigned, impact determined, duplicates linked, ownership assigned, and escalation started."
    - "Response process defines acknowledgement, role assignment, situation assessment, containment, investigation, mitigation, communication, verification, resolution, monitoring, and handoff."
    - "Coordination rules define incident channel, source of truth, meeting/bridge rules, status cadence, decision logging, evidence logging, handoff, and communication boundaries."
    - "Mitigation and containment define how impact is reduced before root cause is fully known, including feature disablement, rollback, traffic reduction, account-level containment, manual workaround, vendor escalation, and customer guidance."
    - "Rollback and pause rules define when to rollback releases, pause rollout, pause GTM, disable feature, pause billing action, pause automation, or block risky customer action."
    - "Communication rules define internal communication, support communication, customer communication, status page/public communication if any, privacy/security-sensitive communication, billing-sensitive communication, and post-resolution communication."
    - "Status updates define update cadence by severity, audience, owner, required content, channel, source of truth, skipped-update rules, and update closure."
    - "Customer communication defines what customers are told, when, by whom, through which channel, with what caveats, and how unsupported or uncertain information is avoided."
    - "Privacy and security incidents define special handling, escalation, evidence preservation, data minimization, access restrictions, legal/compliance review needs, notification uncertainty, and Data/Privacy Operations handoff."
    - "Billing and payment incidents define special handling for payment failures, incorrect charges, refunds, entitlement errors, subscription state errors, processor issues, customer communication, and Financial Operations handoff."
    - "Incident resolution defines conditions for resolution, verification, monitoring period, customer update, support update, known issue update, release note update, and archive/update requirements."
    - "Postmortem process defines when postmortem is required, timeline, participants, artifact, blameless analysis, root cause, contributing factors, customer impact, timeline, decisions, corrective actions, and follow-up review."
    - "Corrective actions define action creation, owner, priority, due trigger/date, verification evidence, risk linkage, release/maintenance linkage, tracking, escalation if overdue, and closure criteria."
    - "Incident metrics define incident count, severity distribution, detection time, acknowledgement time, mitigation time, resolution time, recurrence, postmortem completion, corrective action completion, communication timeliness, and customer impact."
    - "Incident archive defines storage location, access rules, retention rules, searchability, link to decisions/actions, privacy redaction, lessons learned, and review cadence."
    - "Incident risks identify delayed detection, unclear severity, owner gaps, weak escalation, poor communication, privacy mishandling, billing mishandling, failed rollback, repeated incidents, action item decay, and postmortem theater."
    - "Downstream handoff clarifies what Data/Privacy Operations, Financial Operations, and Risk Management must inherit."
  qualityChecks:
    - "Avoid vague claims."
    - "Avoid incident-management theater: severity tables and postmortems without declaration rules, roles, authority, response steps, communication cadence, mitigation, resolution criteria, metrics, corrective actions, and risk handoff."
    - "Avoid incident response that depends on informal memory, unnamed owners, unavailable coverage, or unspecified tools."
    - "Avoid severity levels without customer impact, business impact, privacy/security impact, financial impact, response expectation, escalation rule, and communication requirement."
    - "Avoid customer communication that overstates certainty, hides impact, blames customers, exposes sensitive details, or promises timelines not controlled by the team."
    - "Avoid privacy/security incident handling without data minimization, evidence preservation, access restriction, review/escalation, and Data/Privacy Operations handoff."
    - "Avoid billing/payment incident handling without Financial Operations handoff, customer communication, entitlement review, and correction evidence."
    - "Avoid declaring resolution before mitigation is validated and monitoring confirms stability."
    - "Avoid postmortems that focus on blame instead of timeline, contributing factors, decision points, prevention, and corrective actions."
    - "Avoid corrective actions without owner, due trigger/date, verification evidence, escalation if overdue, and closure criteria."
    - "Prefer decision-useful statements."
    - "Make assumptions explicit."
    - "Do not invent staffing coverage, on-call rotations, response time guarantees, public status page availability, legal/compliance conclusions, breach notification obligations, vendor guarantees, or rollback capability."
    - "Incident management must preserve Foundation boundaries, product truth, technical truth, pricing truth, privacy/security constraints, customer trust, support capacity, cost discipline, and operational sustainability."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
    - "Separate incident, severity, role, detection source, triage rule, response step, mitigation, communication, status update, resolution condition, postmortem, corrective action, metric, risk, and handoff."
    - "Tie incident rules to Operations Brief, Operating Model, Team and Responsibilities, Customer Support, Business Processes, Operational Metrics, Reporting and Cadence, Observability, Deployment, Security/Privacy, Technical Risks, Pricing, GTM Risks, or Decision Record where possible."
    - "Classify incident items as current, required, deferred, manual, automated, customer-facing, internal-only, privacy-sensitive, security-sensitive, billing-sensitive, release-related, vendor-related, launch-critical, blocked, review-needed, or downstream-owned where useful."
    - "State where incident handling is internal policy versus customer-facing commitment."
    - "Route detailed data/privacy, financial, and risk governance procedures downstream."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with Operations Brief, Operating Model, Team and Responsibilities, Customer Support, Business Processes, Operational Metrics, Reporting and Cadence, Product NFRs, Acceptance Criteria, Security/Privacy, Observability, Deployment, Technical Risks, Launch Plan, Pricing, Growth Metrics, GTM Risks, or Decision Record."
    - "Flag incident definitions that blur bug, support ticket, known issue, feature request, privacy request, security event, billing issue, and incident."
    - "Flag severity levels without impact definition, examples, response expectation, escalation requirement, communication requirement, and resolution expectation."
    - "Flag incident roles without owner, backup owner, authority, handoff rule, and escalation path."
    - "Flag response process without acknowledgement, triage, containment, mitigation, communication, verification, resolution, and monitoring."
    - "Flag communication rules without audience, owner, channel, cadence, required content, caveats, and customer communication trigger."
    - "Flag privacy/security or billing/payment incidents without downstream handoff."
    - "Flag postmortems without timeline, contributing factors, customer impact, decisions, corrective actions, owner, and follow-up review."
    - "Verify that downstream Operations documents receive concrete incident handoff inputs."
    - "Flag content that belongs better in Data/Privacy Operations, Financial Operations, or Risk Management."
  specializedFormats:
