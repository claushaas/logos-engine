  sections:
    - id: "incident-objective"
      title: "Incident Objective"
      intent: "Define why incident management exists and what operational outcomes it protects."
      required: true
      outputGuidance:
        - "Open with the incident management purpose in one concise paragraph."
        - "State what incident management protects: customer trust, safety, availability, data integrity, privacy/security, billing correctness, continuity, recovery speed, and learning."
        - "Clarify that incident management is for material degradation, not every bug or support ticket."
      qualityChecks:
        - "Objective is tied to Operations Brief and Operational Metrics."
        - "Incident management is distinguished from routine support and bug triage."
        - "Learning and recurrence reduction are explicit."
      questions:
        - "Why does incident management exist?"
        - "What operational outcomes does it protect?"
        - "What should not be treated as an incident?"
    - id: "incident-principles"
      title: "Incident Principles"
      intent: "Define behavioral rules for incident response, communication, evidence, authority, privacy, and learning."
      required: true
      outputGuidance:
        - "Define principles for fast ownership, truthful communication, customer protection, data minimization, evidence preservation, clear authority, blameless learning, and recurrence reduction."
        - "State what responders must not do during incidents."
        - "Tie principles to Foundation boundaries and customer trust."
      qualityChecks:
        - "Principles are actionable."
        - "Privacy and communication discipline are included."
        - "Principles prevent blame-oriented or opaque response."
      questions:
        - "What principles guide incident response?"
        - "How should responders behave under uncertainty?"
        - "How are customer trust, privacy, and evidence protected?"
        - "What behaviors are explicitly prohibited during incidents?"
    - id: "incident-scope"
      title: "Incident Scope"
      intent: "Define what incident management covers and what should remain in support, bug triage, maintenance, release management, data/privacy, financial operations, or risk management."
      required: true
      outputGuidance:
        - "Separate in-scope, out-of-scope, support-only, bug-only, privacy/security incident, billing/payment incident, release incident, operational incident, vendor incident, and downstream-owned areas."
        - "Preserve escalation boundary for ambiguous cases."
        - "Route detailed domain-specific procedures downstream."
      qualityChecks:
        - "Scope prevents incident inflation and under-declaration."
        - "Sensitive categories are explicit."
        - "Ambiguous cases have escalation path."
      questions:
        - "What is in scope for incident management?"
        - "What remains a support ticket, bug, known issue, maintenance task, release issue, data/privacy matter, financial matter, or risk item?"
        - "What ambiguous cases require escalation?"
    - id: "incident-definition"
      title: "Incident Definition"
      intent: "Define what constitutes an incident versus a bug, support ticket, known issue, feature request, maintenance task, release issue, security/privacy event, billing issue, or operational risk."
      required: true
      outputGuidance:
        - "Give a precise definition of incident."
        - "Include exclusion examples and escalation examples."
        - "State who can ask for incident review."
      qualityChecks:
        - "Definition is operationally testable."
        - "Incident threshold is not vague."
        - "Adjacent categories are distinguished."
      questions:
        - "What constitutes an incident versus a bug or support ticket?"
        - "What is a known issue rather than an incident?"
        - "What privacy/security or billing event becomes an incident?"
        - "Who can request incident review?"
    - id: "incident-taxonomy"
      title: "Incident Taxonomy"
      intent: "Classify incident types, statuses, domains, sensitivities, and impact dimensions."
      required: true
      outputGuidance:
        - "Define incident domains and statuses."
        - "Include customer impact, business impact, privacy/security impact, financial impact, operational impact, vendor impact, release impact, and data integrity impact."
        - "Define statuses such as suspected, declared, triaged, mitigating, monitoring, resolved, postmortem-required, action-tracking, closed, or false positive."
      qualityChecks:
        - "Taxonomy helps triage and reporting."
        - "Sensitive incidents are distinguishable."
        - "Statuses are not ambiguous."
      questions:
        - "What incident types and domains exist?"
        - "What statuses can an incident have?"
        - "What impact dimensions are assessed?"
    - id: "severity-levels"
      title: "Severity Levels"
      intent: "Define severity levels with impact, examples, response expectations, escalation, communication, and resolution expectations."
      required: true
      outputGuidance:
        - "Use severity records."
        - "Define SEV-1 through SEV-4 or equivalent."
        - "Separate internal response expectations from customer-facing promises."
      qualityChecks:
        - "Severity levels are actionable."
        - "Impact and communication requirements are explicit."
        - "Response expectations do not invent staffing coverage."
      questions:
        - "How are SEV-1, SEV-2, SEV-3, and SEV-4 defined?"
        - "What customer, business, privacy/security, and financial impact applies to each severity?"
        - "What response, update, escalation, communication, and resolution expectations apply?"
    - id: "incident-declaration"
      title: "Incident Declaration"
      intent: "Define who can declare an incident, how initial severity is assigned, who is notified, and how the incident record is created."
      required: true
      outputGuidance:
        - "Define declaration authority and request-for-declaration path."
        - "Include false-positive handling and severity changes."
        - "State the first artifact created."
      qualityChecks:
        - "Declaration path is fast and clear."
        - "Under-declaration risk is considered."
        - "Incident record creation is explicit."
      questions:
        - "Who can declare an incident?"
        - "Who can request incident declaration?"
        - "What evidence is needed to declare?"
        - "How is initial severity assigned and changed?"
        - "Who is notified and what record is created?"
    - id: "incident-roles"
      title: "Incident Roles"
      intent: "Define roles activated during an incident and how they are assigned, authorized, backed up, and handed off."
      required: true
      outputGuidance:
        - "Use incident role records."
        - "Include incident commander, technical responder, support coordinator, communications owner, customer communication owner, subject matter expert, scribe, decision owner, escalation owner, and backup roles where relevant."
        - "Define authority and handoff rules."
      qualityChecks:
        - "Roles include authority and backup."
        - "Communication and decision roles are explicit."
        - "Incident ownership is not distributed vaguely."
      questions:
        - "What roles are activated during an incident?"
        - "Who assigns roles?"
        - "What authority does each role have?"
        - "How are roles handed off during long incidents?"
        - "What backup roles exist?"
    - id: "detection-sources"
      title: "Detection Sources"
      intent: "Define how incidents are detected and which signals create incident candidates."
      required: true
      outputGuidance:
        - "Use detection source records."
        - "Include monitoring, alerts, support reports, customer reports, internal discovery, release monitoring, vendor alerts, billing anomalies, privacy/security signals, and manual checks."
        - "State false-positive risk and incident-candidate rule."
      qualityChecks:
        - "Detection sources have owners."
        - "Automated versus manual detection is explicit."
        - "False-positive and missed-detection risks are considered."
      questions:
        - "How are incidents detected?"
        - "What automated alerting exists?"
        - "What manual checks or human reports can trigger incident review?"
        - "What signals create an incident candidate?"
    - id: "triage-and-classification"
      title: "Triage and Classification"
      intent: "Define how incident candidates are assessed, classified, assigned, escalated, and either declared or rejected."
      required: true
      outputGuidance:
        - "Use triage rule records."
        - "Include impact assessment, severity assignment, evidence, affected users, affected systems, privacy/security/financial sensitivity, and escalation condition."
        - "Include false-positive closure path."
      qualityChecks:
        - "Triage is fast and evidence-aware."
        - "Sensitive incidents escalate correctly."
        - "Classification informs response."
      questions:
        - "How is an incident candidate triaged?"
        - "What checks determine severity and impact?"
        - "How are affected users/systems identified?"
        - "When is escalation required during triage?"
        - "How are false positives handled?"
    - id: "response-process"
      title: "Response Process"
      intent: "Define the step-by-step incident response process and how work is coordinated across responders."
      required: true
      outputGuidance:
        - "Use response step records."
        - "Include acknowledge, assign roles, assess, contain, investigate, mitigate, communicate, verify, resolve, monitor, and hand off."
        - "Keep response generic enough to apply across incident types while allowing downstream specialization."
      qualityChecks:
        - "Response process is executable."
        - "Each step has owner and output."
        - "Communication and verification are included."
      questions:
        - "What is the step-by-step incident response process?"
        - "Who owns each response step?"
        - "What evidence or output is required at each step?"
        - "How is the response coordinated across teams?"
    - id: "coordination-rules"
      title: "Coordination Rules"
      intent: "Define how incident work is coordinated, documented, handed off, and kept aligned under pressure."
      required: true
      outputGuidance:
        - "Define incident channel, source of truth, meeting/bridge rules, decision logging, evidence logging, status cadence, handoff rules, and communication boundaries."
        - "State where incident records live."
        - "Include rules for long-running incidents."
      qualityChecks:
        - "Coordination avoids fragmented response."
        - "Decision and evidence logging are explicit."
        - "Long-running incidents have handoff rules."
      questions:
        - "What is the source of truth during an incident?"
        - "What channels or bridge are used?"
        - "How are decisions and evidence logged?"
        - "How are handoffs handled?"
        - "How are long-running incidents coordinated?"
    - id: "mitigation-and-containment"
      title: "Mitigation and Containment"
      intent: "Define how incident impact is reduced before full root cause is known and how mitigation is validated."
      required: true
      outputGuidance:
        - "Use mitigation records."
        - "Include feature disablement, rollback, traffic reduction, account containment, manual workaround, vendor escalation, customer guidance, and support workaround where relevant."
        - "Define validation method and risk created by mitigation."
      qualityChecks:
        - "Mitigation reduces impact without pretending root cause is solved."
        - "Validation is explicit."
        - "Mitigation side effects are considered."
      questions:
        - "What mitigation or containment steps apply to common incident types?"
        - "Who can authorize mitigation?"
        - "How is mitigation validated?"
        - "What risks can mitigation create?"
    - id: "rollback-and-pause-rules"
      title: "Rollback and Pause Rules"
      intent: "Define when to rollback, pause rollout, pause GTM, disable feature, pause billing action, pause automation, or block risky customer action."
      required: true
      outputGuidance:
        - "Use rollback/pause records."
        - "Tie to Release Management, Business Processes, Pricing, Support, and GTM where relevant."
        - "State decision owner, approval, execution owner, validation, and communication."
      qualityChecks:
        - "Rollback/pause decisions have authority and trigger."
        - "Customer/support communication is considered."
        - "Delayed rollback risk is explicit."
      questions:
        - "When should a release be rolled back?"
        - "When should rollout, GTM, billing action, automation, or feature access be paused?"
        - "Who decides and who executes?"
        - "How is rollback or pause validated and communicated?"
    - id: "communication-rules"
      title: "Communication Rules"
      intent: "Define internal, support, customer, public, privacy-sensitive, security-sensitive, and billing-sensitive incident communication rules."
      required: true
      outputGuidance:
        - "Use communication rule records."
        - "Separate internal updates from customer-facing communication."
        - "Include prohibited content and approval requirements."
      qualityChecks:
        - "Communication is truthful, bounded, and role-owned."
        - "Sensitive information is protected."
        - "Customer communication triggers are clear."
      questions:
        - "What communication channels are used during an incident?"
        - "Who communicates internally and externally?"
        - "What content is required or prohibited?"
        - "What communication requires approval?"
    - id: "status-updates"
      title: "Status Updates"
      intent: "Define frequency, content, owner, audience, and closure of status updates during incidents."
      required: true
      outputGuidance:
        - "Use communication rule records or severity records."
        - "Define update cadence by severity."
        - "State what happens if there is no new information."
      qualityChecks:
        - "Status update cadence matches severity."
        - "No-update updates are handled honestly."
        - "Closure update is required when appropriate."
      questions:
        - "How often are status updates provided during an incident?"
        - "Where are status updates published?"
        - "Who owns each update?"
        - "What content must updates include?"
        - "How is the final update handled?"
    - id: "customer-communication"
      title: "Customer Communication"
      intent: "Define how and when affected customers are notified, updated, and given resolution or workaround guidance."
      required: true
      outputGuidance:
        - "Separate affected-customer communication from broad public communication."
        - "Include caveats, uncertainty, support coordination, and follow-up."
        - "Tie to Customer Support and Messaging claim boundaries."
      qualityChecks:
        - "Customer communication is accurate and safe."
        - "Affected audience and channel are explicit."
        - "Uncertainty is communicated without overpromising."
      questions:
        - "When are users notified of incidents?"
        - "Which users are notified?"
        - "What channel is used?"
        - "What workaround or resolution guidance is provided?"
        - "How is uncertainty communicated safely?"
    - id: "privacy-and-security-incidents"
      title: "Privacy and Security Incidents"
      intent: "Define special handling for privacy/security-sensitive incidents and what must be handed off to Data and Privacy Operations."
      required: true
      outputGuidance:
        - "State special escalation, evidence preservation, data minimization, access restriction, and review needs."
        - "Do not assert legal notification obligations unless verified."
        - "Route detailed procedure to Data/Privacy Operations."
      qualityChecks:
        - "Privacy/security incidents receive higher control."
        - "Legal/compliance uncertainty is marked review-needed."
        - "Sensitive details are protected."
      questions:
        - "What incident types require privacy/security handling?"
        - "Who must be escalated to?"
        - "What evidence must be preserved?"
        - "What access restrictions apply?"
        - "What communication requires review?"
        - "What should Data and Privacy Operations inherit?"
    - id: "billing-and-payment-incidents"
      title: "Billing and Payment Incidents"
      intent: "Define special handling for payment, billing, refund, entitlement, subscription, invoice, discount, and processor incidents."
      required: true
      outputGuidance:
        - "Tie to Pricing, Customer Support, Business Processes, and Financial Operations."
        - "Include customer communication, financial correction, entitlement review, and evidence."
        - "Route detailed procedure to Financial Operations."
      qualityChecks:
        - "Financial/customer trust impact is explicit."
        - "Financial correction evidence is required."
        - "Support and Financial Operations handoff are explicit."
      questions:
        - "What billing or payment events become incidents?"
        - "How are incorrect charges, failed payments, refund errors, entitlement errors, and processor issues handled?"
        - "Who communicates with affected customers?"
        - "What evidence proves financial correction?"
        - "What should Financial Operations inherit?"
    - id: "incident-resolution"
      title: "Incident Resolution"
      intent: "Define the conditions required to mark an incident resolved and what monitoring, communication, and documentation must follow."
      required: true
      outputGuidance:
        - "Use resolution criteria records."
        - "Define verification, monitoring period, customer/support updates, known issue update, and archive requirements."
        - "Separate mitigation from resolution."
      qualityChecks:
        - "Resolution is evidence-based."
        - "Monitoring and communication follow resolution."
        - "Mitigated is not confused with resolved."
      questions:
        - "What conditions must be met before an incident is marked resolved?"
        - "How is resolution verified?"
        - "What monitoring period applies?"
        - "What customer, support, known issue, or archive update is required?"
    - id: "postmortem-process"
      title: "Postmortem Process"
      intent: "Define when postmortems are required, who participates, what artifact is produced, and how learning is captured."
      required: true
      outputGuidance:
        - "Use postmortem records where useful."
        - "Define required postmortem fields and timeline."
        - "Include blameless analysis, decisions, customer impact, contributing factors, and corrective actions."
      qualityChecks:
        - "Postmortem produces learning and action."
        - "Blame is avoided."
        - "Corrective actions are not optional when recurrence risk exists."
      questions:
        - "What is the postmortem process after an incident is resolved?"
        - "Which incidents require postmortem?"
        - "Who participates?"
        - "What artifact is produced?"
        - "What timeline, customer impact, root cause, contributing factors, decisions, and corrective actions must be captured?"
    - id: "corrective-actions"
      title: "Corrective Actions"
      intent: "Define how corrective actions are identified, assigned, tracked, verified, escalated, and closed."
      required: true
      outputGuidance:
        - "Use corrective action records."
        - "Tie actions to release, maintenance, support, data/privacy, financial operations, or risk management where relevant."
        - "Define overdue escalation and closure evidence."
      qualityChecks:
        - "Corrective actions have owner, priority, due trigger/date, evidence, and closure criteria."
        - "Actions reduce recurrence risk."
        - "Overdue actions escalate."
      questions:
        - "How are corrective actions identified, assigned, and tracked?"
        - "Who owns each action?"
        - "How is completion verified?"
        - "What happens if corrective actions become overdue?"
        - "How are actions linked to risks, releases, or maintenance work?"
    - id: "incident-metrics"
      title: "Incident Metrics"
      intent: "Define metrics that measure incident detection, response, mitigation, resolution, communication, recurrence, and learning."
      required: true
      outputGuidance:
        - "Use incident metric records."
        - "Tie to Operational Metrics and Reporting and Cadence."
        - "Include thresholds and decision implications."
      qualityChecks:
        - "Incident metrics improve response and prevention."
        - "Metrics have source, owner, cadence, and threshold."
        - "Metrics do not incentivize hiding incidents."
      questions:
        - "What incident metrics are tracked?"
        - "How are detection time, acknowledgement time, mitigation time, resolution time, recurrence, postmortem completion, corrective action completion, communication timeliness, and customer impact measured?"
        - "What thresholds trigger review?"
    - id: "incident-archive"
      title: "Incident Archive"
      intent: "Define where incident records and postmortems are stored and how they are accessed, retained, searched, reviewed, and used for learning."
      required: true
      outputGuidance:
        - "Define archive location, access rules, retention rules, privacy redaction, searchability, linked decisions/actions, and review cadence."
        - "Mark sensitive incidents with restricted access."
        - "Tie archive to Risk Management and Reporting."
      qualityChecks:
        - "Archive is useful for learning."
        - "Access and privacy redaction are considered."
        - "Incident records link to actions and risks."
      questions:
        - "Where are incident records and postmortems stored?"
        - "Who can access incident records?"
        - "How are sensitive details redacted or restricted?"
        - "How is the archive searched and reviewed?"
        - "How is the incident archive used for learning and improvement?"
    - id: "incident-risks"
      title: "Incident Risks"
      intent: "Identify failure modes of incident management and how they are detected, mitigated, escalated, or handed off."
      required: true
      outputGuidance:
        - "Use incident risk records."
        - "Include delayed detection, unclear severity, owner gaps, weak escalation, poor communication, privacy mishandling, billing mishandling, failed rollback, repeated incidents, action item decay, and postmortem theater."
        - "Route risks to Risk Management where needed."
      qualityChecks:
        - "Risks are concrete and monitorable."
        - "Mitigation and contingency are distinct."
        - "High-impact risks have owner and downstream handoff."
      questions:
        - "What could cause incident management to fail?"
        - "Where could detection, triage, communication, mitigation, resolution, postmortem, or corrective actions fail?"
        - "How are incident management risks detected?"
        - "What mitigation and contingency apply?"
        - "What should Risk Management inherit?"
    - id: "downstream-handoff"
      title: "Downstream Handoff"
      intent: "Define what downstream Operations documents must inherit from Incident Management and what they must not assume."
      required: true
      outputGuidance:
        - "Use incident handoff records."
        - "Route context to Data/Privacy Operations, Financial Operations, and Risk Management."
        - "Preserve incident categories, severity rules, roles, communication rules, postmortem requirements, corrective actions, metrics, risks, and unresolved questions."
      qualityChecks:
        - "Handoff items are concrete and document-targeted."
        - "Downstream documents are not allowed to invent missing incident assumptions silently."
        - "Incident Management remains response architecture; domain-specific governance remains downstream."
      questions:
        - "What should Data and Privacy Operations inherit?"
        - "What should Financial Operations inherit?"
        - "What should Risk Management inherit?"
        - "What unresolved incident management questions must be carried forward?"
