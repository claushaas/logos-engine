        - "What should Observability Plan and Support Model inherit?"
    - id: "privacy-and-compliance"
      title: "Privacy and Compliance"
      intent: "Surface privacy, security, legal, contractual, data processing, data residency, user consent, retention, deletion, and third-party policy concerns for integrations."
      required: true
      outputGuidance:
