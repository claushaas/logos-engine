        - "Critical integrations have realistic failure-mode tests."
        - "Mocks do not become incompatible with real provider behavior."
      questions:
        - "How are external services mocked for testing and development?"
        - "What mocking tools, fakes, sandboxes, recorded fixtures, or service virtualization are used?"
        - "How are success, failure, rate-limit, timeout, malformed response, auth failure, and provider-change scenarios simulated?"
        - "How are mocks kept aligned with provider contracts?"
        - "What mocks are required for CI?"
        - "What integrations cannot be safely mocked and require sandbox testing?"
    - id: "sandbox-and-test-environments"
      title: "Sandbox and Test Environments"
      intent: "Define provider sandbox usage, test accounts, environment separation, fixture data, test credentials, destructive test limits, and CI integration behavior."
      required: true
