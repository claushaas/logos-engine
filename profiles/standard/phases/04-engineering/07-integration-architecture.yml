        - "What data processing, data residency, retention, deletion, export, or user consent concerns exist?"
        - "What provider terms, policies, or compliance requirements may apply?"
        - "What integration data must not be shared with providers?"
        - "What privacy or compliance questions require review?"
        - "What should Security Architecture, Data Model, and Operations inherit?"
    - id: "integration-risks"
      title: "Integration Risks"
      intent: "Identify integration risks, including provider outage, API deprecation, provider schema changes, auth failure, rate limits, duplicate events, malformed data, privacy exposure, cost spikes, and operational fragility."
      required: true
      outputGuidance:
