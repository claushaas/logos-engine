        - "State branch model and rationale."
        - "Define commit message conventions and merge policy."
        - "Include hotfix and release-tag expectations where relevant."
      qualityChecks:
        - "Git workflow supports CI/CD and release management."
        - "History policy is explicit."
        - "Hotfix workflow is not improvised."
      questions: &a18
        - "What branching strategy is used?"
        - "What commit message convention applies?"
        - "What merge strategy is used: squash, merge commit, rebase, fast-forward?"
