        - "What review requirements apply by change type?"
        - "What approvals and CI checks are required before merge?"
    - id: "review-checklist"
      title: "Review Checklist"
      intent: "Define what reviewers check by change type, including correctness, architecture, domain, data, API,
        security/privacy, testing, observability, performance, accessibility, migration, deployment, docs, and
        operations impact."
      required: true
      outputGuidance:
        - "Use review checklist records for material checklist items."
        - "Separate general checklist from specialized checklists by change type."
        - "Define blocking and non-blocking review findings."
      qualityChecks:
        - "Checklist reflects project-specific risks."
        - "Reviewers are not expected to rely on memory."
        - "Automation-supported checks are not duplicated manually unless judgment is needed."
      questions: &a20
        - "What should every code review check?"
