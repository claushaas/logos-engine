      intent: "Define which standards are enforced by tooling, CI, templates, codeowners, policy checks, scanners, scripts,
        docs, or manual review."
      required: true
      outputGuidance:
        - "Use automation rule records for enforceable standards."
        - "Prioritize automation for repetitive objective checks."
        - "State failure consequences and exception process."
      qualityChecks:
        - "Objective standards are automated where practical."
        - "Subjective standards are supported by templates/checklists."
        - "CI enforcement aligns with Deployment and Testing Strategy."
      questions: &a21
        - "Which standards are enforced automatically?"
        - "What tools enforce formatting, linting, types, tests, dependency checks, secret scans, security scans,
