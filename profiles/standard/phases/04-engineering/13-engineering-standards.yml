        - "How are fake clocks, randomness, network calls, and time zones handled?"
        - "What snapshot testing policy applies?"
        - "How are flaky tests handled?"
        - "When are regression tests mandatory?"
    - id: "documentation-rules"
      title: "Documentation Rules"
      intent: "Define required documentation alongside code, ADR triggers, README expectations, comments, API docs, migration
        docs, runbook updates, and documentation freshness rules."
      required: true
      outputGuidance:
        - "Define docs required by change type."
        - "State where documentation lives and how it is kept current."
        - "Distinguish useful comments from redundant comments."
      qualityChecks:
        - "Docs are updated when behavior, contracts, architecture, operations, or standards change."
        - "ADR triggers are explicit."
        - "Documentation burden is useful rather than ceremonial."
      questions: &a17
        - "What documentation is required alongside code changes?"
        - "When is an ADR required?"
        - "What README, API docs, migration docs, runbooks, examples, comments, and changelog updates are required?"
        - "Where does documentation live?"
        - "How is documentation kept current?"
        - "What documentation anti-patterns are prohibited?"
    - id: "git-workflow"
