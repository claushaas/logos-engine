        - "What standards remain manual review responsibilities?"
        - "What happens when automation fails?"
        - "How are enforcement exceptions handled?"
    - id: "exception-process"
      title: "Exception Process"
      intent: "Define how standards can be waived, who approves exceptions, how risk is recorded, when exceptions expire, and
        how cleanup is tracked."
      required: true
      outputGuidance:
        - "Use exception records for material exceptions."
        - "Distinguish temporary exceptions from permanent policy changes."
        - "Require risk, mitigation, expiry/review trigger, and cleanup plan."
      qualityChecks:
        - "Exceptions are explicit and auditable."
        - "Temporary exceptions cannot become permanent silently."
        - "High-risk exceptions require proper authority."
      questions: &a22
        - "When can a standard be waived?"
        - "Who can approve exceptions?"
        - "How is exception risk recorded?"
        - "How are exceptions tracked, reviewed, and expired?"
        - "What mitigation or cleanup plan is required?"
        - "What standards cannot be waived without release-risk acceptance?"
    - id: "ownership-and-maintenance"
      title: "Ownership and Maintenance"
      intent: "Define who owns standards, how they evolve, review cadence, deprecation process, onboarding expectations, and
        standards drift monitoring."
      required: true
      outputGuidance:
        - "Assign ownership for standards categories."
        - "Define how standards change over time."
        - "State onboarding and drift-control expectations."
      qualityChecks:
        - "Standards have maintainers."
        - "Standards evolution is intentional, not accidental."
        - "Deprecated standards and stale rules are cleaned up."
      questions: &a23
        - "Who owns engineering standards?"
        - "How are standards proposed, changed, deprecated, and removed?"
        - "What review cadence applies?"
        - "How are new contributors onboarded into standards?"
        - "How is standards drift detected?"
        - "How are outdated standards cleaned up?"
    - id: "standards-risks"
      title: "Standards Risks"
      intent: "Identify risks of the chosen standards, including inconsistency, over-strictness, under-enforcement, tool
        drift, review bottlenecks, exception abuse, and operational burden."
      required: true
      outputGuidance:
        - "Use standards risk records for material risks."
        - "Describe risks as concrete standards failure modes."
        - "Include early signal, mitigation, owner, and downstream impact."
      qualityChecks:
        - "Risks are specific enough to mitigate or accept."
        - "Both too much and too little process are considered."
        - "Standards most likely to drift are identified."
      questions: &a24
        - "What are the risks of the chosen standards?"
        - "Which standards are most likely to be inconsistently applied?"
        - "Where could standards be too strict and slow delivery?"
        - "Where could standards be too weak and allow quality erosion?"
        - "Where could tooling drift from documented rules?"
        - "What mitigations are needed?"
    - id: "downstream-handoff"
      title: "Downstream Handoff"
      intent: "Define what Operations documents must inherit from Engineering Standards and what they must not assume."
      required: true
      outputGuidance:
        - "Route standards outputs to the correct Operations documents."
        - "Separate operating model, maintenance, release management, support, and risk implications."
        - "Preserve unresolved standards questions and risky assumptions."
      qualityChecks:
        - "Handoff items are concrete and document-targeted."
        - "Operations documents are not allowed to invent missing engineering governance silently."
        - "Engineering standards and operational procedures remain distinct but connected."
      questions: &a25
        - "What should Operating Model inherit from Engineering Standards?"
        - "What should Maintenance Plan inherit?"
        - "What should Release Management inherit?"
        - "What should Support Model inherit?"
        - "What should Risk Management inherit?"
        - "What unresolved standards questions must be carried forward?"
