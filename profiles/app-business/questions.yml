version: 0.1.0
profileId: app-business

defaults:
  allowUnknown: true
  allowAssumption: true
  maxQuestionsPerRound: 8

questionSets:
  - id: foundation
    phaseId: 00-intake
    title: Foundation
    purpose: Clarify the initial idea.
    questions:
      - id: foundation.idea
        text: What is the app idea?
        helpText: Describe the app in plain language. Focus on what it helps someone do.
        examples:
          - An app that helps independent personal trainers manage workouts, payments, and client progress.
          - A simple ordering app for small restaurants that currently receive orders through WhatsApp.
        answerType: text
        mapsToDecisionIds: [foundation.initial_idea]
        allowUnknown: false
        allowAssumption: false
      - id: foundation.primary_user
        text: Who is the primary user?
        helpText: Name the person or segment that feels the problem most strongly.
        examples:
          - Freelance designers who manage client approvals manually.
          - Parents coordinating recurring school transportation.
        answerType: text
        mapsToDecisionIds: [foundation.target_user]
      - id: foundation.problem
        text: What problem does it solve?
        helpText: State the painful situation the user has today, not the feature you want to build.
        examples:
          - Users lose track of payments and send reminders manually.
          - Teams make decisions in chat, but cannot find the rationale later.
        answerType: text
        mapsToDecisionIds: [foundation.problem_statement]
      - id: foundation.current_alternative
        text: How does the user solve this today?
        helpText: Mention tools, spreadsheets, manual work, competitors, or doing nothing.
        examples:
          - Google Sheets plus WhatsApp.
          - A generic CRM that feels too complex.
        answerType: text
        mapsToDecisionIds: [market.current_alternative]
      - id: foundation.why_now
        text: Why does this matter now?
        helpText: Explain timing, urgency, or recent change that makes the problem worth solving.
        examples:
          - New regulation changed the workflow.
          - AI made a previously expensive workflow affordable.
        answerType: text
        mapsToDecisionIds: [foundation.why_now]
      - id: foundation.smallest_valuable_version
        text: What is the smallest valuable version?
        helpText: Name the smallest version that would still create real value for the primary user.
        examples:
          - A private beta that only handles scheduling and reminders.
          - A single-player version before team collaboration.
        answerType: text
        mapsToDecisionIds: [product.smallest_valuable_version]

  - id: market
    phaseId: 01-market
    title: Market
    purpose: Understand opportunity and context.
    questions:
      - id: market.category
        text: What market or category does this belong to?
        helpText: Pick the closest category. It does not need to be perfect yet.
        examples:
          - Fitness business software.
          - Restaurant operations.
          - Developer productivity.
        answerType: text
        mapsToDecisionIds: [market.category]
      - id: market.direct_competitors
        text: Who are the direct competitors?
        helpText: List products solving the same problem for a similar user.
        examples:
          - Notion, Linear, Trainerize, Toast, Shopify.
        answerType: text
        mapsToDecisionIds: [market.direct_competitors]
      - id: market.alternative_types
        text: What kinds of alternatives already exist?
        helpText: Include competitors and manual substitutes.
        answerType: multi_choice
        options:
          - { value: direct_competitors, label: Direct competitors, description: Products built for the same problem and user. }
          - { value: indirect_competitors, label: Indirect competitors, description: Products in a nearby category users adapt. }
          - { value: manual_workarounds, label: Manual workarounds, description: Spreadsheets, chat, email, paper, or repeated human effort. }
          - { value: doing_nothing, label: Doing nothing, description: Users tolerate the pain instead of solving it. }
        mapsToDecisionIds: [market.alternative_types]
      - id: market.problem_frequency
        text: Is this a frequent or occasional problem?
        helpText: Frequency affects retention, pricing, onboarding, and acquisition.
        answerType: choice
        options:
          - { value: daily, label: Daily, description: The user feels this problem almost every day. }
          - { value: weekly, label: Weekly, description: The user feels this problem regularly, but not daily. }
          - { value: monthly, label: Monthly, description: The problem is recurring but relatively infrequent. }
          - { value: occasional, label: Occasional, description: The problem appears only in specific moments. }
          - { value: unknown, label: I do not know yet, description: The frequency still needs validation. }
        mapsToDecisionIds: [market.problem_frequency]
      - id: market.niche
        text: What niche could be served first?
        helpText: Choose a narrow beachhead segment where the pain is sharp.
        examples:
          - Solo personal trainers with 20-80 clients.
          - Restaurants that already accept delivery orders by chat.
        answerType: text
        mapsToDecisionIds: [market.initial_niche]

  - id: business_model
    phaseId: 02-business
    title: Business Model
    purpose: Clarify value capture.
    questions:
      - id: business.pricing_mode
        text: Will this be free, paid, freemium, subscription, one-time, or B2B?
        helpText: Choose the business model that best matches value delivery and buying behavior.
        answerType: choice
        options:
          - { value: free, label: Free, description: No direct revenue in the first version. }
          - { value: freemium, label: Freemium, description: Free core with paid limits or upgrades. }
          - { value: subscription, label: Subscription, description: Recurring monthly or yearly payment. }
          - { value: one_time, label: One-time, description: User pays once for access. }
          - { value: b2b, label: B2B, description: Company pays through a sales or procurement process. }
        mapsToDecisionIds: [economics.pricing_model]
      - id: business.buyer
        text: Who pays?
        helpText: Identify whether the payer is the user, a manager, a company, or another stakeholder.
        answerType: text
        mapsToDecisionIds: [business.buyer]
      - id: business.why_pay
        text: Why would they pay?
        helpText: Tie payment to saved time, avoided cost, increased revenue, reduced risk, or status.
        answerType: text
        mapsToDecisionIds: [business.value_capture_reason]
      - id: business.paid_features
        text: What features might be paid?
        helpText: Separate core value from upgrade value.
        answerType: text
        mapsToDecisionIds: [business.paid_feature_candidates]

  - id: economics
    phaseId: 03-economics
    title: Economics
    purpose: Test business viability.
    questions:
      - id: economics.fixed_costs
        text: What are expected fixed monthly costs?
        helpText: Include hosting, tools, contractors, support, and baseline operations.
        answerType: number
        mapsToDecisionIds: [economics.fixed_costs]
      - id: economics.variable_costs
        text: What are expected variable costs per user?
        helpText: Include AI calls, storage, messaging, payments, support, or third-party APIs.
        answerType: number
        mapsToDecisionIds: [economics.variable_costs]
      - id: economics.ai_costs
        text: Will AI or external APIs create variable costs?
        helpText: Flag anything where usage increases cost as the user base grows.
        answerType: boolean
        mapsToDecisionIds: [product.uses_ai_heavy_workflows]
      - id: economics.arpu
        text: What is the expected ARPU?
        helpText: Estimate average revenue per user or account per month.
        answerType: number
        mapsToDecisionIds: [economics.arpu]
      - id: economics.cac
        text: What CAC range seems plausible?
        helpText: Estimate how much it may cost to acquire a paying user or account.
        answerType: text
        mapsToDecisionIds: [economics.cac_assumption]

  - id: product
    phaseId: 04-product
    title: Product
    purpose: Define product scope.
    questions:
      - id: product.core_loop
        text: What is the core user loop?
        helpText: Describe the repeating action that creates value and brings the user back.
        examples:
          - Add client progress, review next workout, send update.
          - Capture decision, resolve open question, regenerate docs.
        answerType: text
        mapsToDecisionIds: [product.core_loop]
      - id: product.activation_moment
        text: What is the activation moment?
        helpText: Name the moment when the user first feels real value.
        answerType: text
        mapsToDecisionIds: [product.activation_moment]
      - id: product.mvp_features
        text: What features are essential for MVP?
        helpText: Include only features needed to prove the core value.
        answerType: text
        mapsToDecisionIds: [product.mvp_scope]
      - id: product.out_of_scope
        text: What features are explicitly out of scope?
        helpText: List tempting features that should not be built yet.
        answerType: text
        mapsToDecisionIds: [product.mvp_non_goals]
      - id: product.main_risk
        text: What is the main product risk?
        helpText: Pick the risk that could invalidate the product thesis.
        answerType: text
        mapsToDecisionIds: [product.main_risk]

  - id: design
    phaseId: 05-design
    title: Design
    purpose: Define user experience.
    questions:
      - id: design.primary_screens
        text: What are the primary screens?
        helpText: List screens needed for the core flow.
        answerType: text
        mapsToDecisionIds: [design.primary_screens]
      - id: design.onboarding_flow
        text: What is the onboarding flow?
        helpText: Describe what happens before the user reaches first value.
        answerType: text
        mapsToDecisionIds: [design.onboarding_flow]
      - id: design.empty_states
        text: What empty states are important?
        helpText: Identify screens where the user has no data yet.
        answerType: text
        mapsToDecisionIds: [design.empty_states]
      - id: design.tone
        text: What is the tone of the interface?
        helpText: Choose the feeling the UI should create.
        answerType: multi_choice
        options:
          - { value: calm, label: Calm, description: Low-friction and reassuring. }
          - { value: precise, label: Precise, description: Clear, structured, and exact. }
          - { value: playful, label: Playful, description: Friendly and expressive. }
          - { value: professional, label: Professional, description: Trustworthy and work-focused. }
        mapsToDecisionIds: [design.interface_tone]

  - id: architecture
    phaseId: 06-architecture
    title: Architecture
    purpose: Define technical direction.
    questions:
      - id: architecture.platform_targets
        text: What platforms will be supported first?
        helpText: Choose the initial runtime targets.
        answerType: multi_choice
        options:
          - { value: web, label: Web, description: Browser-based app. }
          - { value: ios, label: iOS, description: Native or cross-platform iOS app. }
          - { value: android, label: Android, description: Native or cross-platform Android app. }
          - { value: desktop, label: Desktop, description: Desktop app or packaged web app. }
        mapsToDecisionIds: [architecture.platform_targets]
      - id: architecture.stack
        text: What stack will be used?
        helpText: Mention frontend, backend, database, hosting, and testing tools if known.
        answerType: text
        mapsToDecisionIds: [architecture.tech_stack]
      - id: architecture.offline_strategy
        text: Is the app server-first, offline-first, or hybrid?
        helpText: This affects storage, sync, auth, and testing.
        answerType: choice
        options:
          - { value: server_first, label: Server-first, description: Most state lives remotely. }
          - { value: offline_first, label: Offline-first, description: Local use remains reliable without network. }
          - { value: hybrid, label: Hybrid, description: Some core flows work locally, others require network. }
        mapsToDecisionIds: [architecture.offline_strategy]
      - id: architecture.authentication
        text: Does the app require authentication?
        helpText: Authentication is usually needed for remote user data, sync, payments, or private accounts.
        answerType: boolean
        mapsToDecisionIds: [architecture.authentication_strategy]

  - id: implementation
    phaseId: 07-implementation
    title: Implementation
    purpose: Define execution.
    questions:
      - id: implementation.first_milestone
        text: What is the first milestone?
        helpText: Pick the first concrete build milestone that proves progress.
        answerType: text
        mapsToDecisionIds: [implementation.first_milestone]
      - id: implementation.before_ui
        text: What should be implemented before UI?
        helpText: Identify data models, APIs, auth, validation, or core domain logic that should exist first.
        answerType: text
        mapsToDecisionIds: [implementation.pre_ui_dependencies]
      - id: implementation.testing_day_one
        text: What must be tested from day one?
        helpText: Name the flows or risks that should never be left untested.
        answerType: text
        mapsToDecisionIds: [testing.required_strategy]
      - id: implementation.release_process
        text: What release process should exist?
        helpText: Mention environments, CI/CD, review, deployment, and rollback expectations.
        answerType: text
        mapsToDecisionIds: [implementation.release_process]

  - id: go_to_market
    phaseId: 09-go-to-market
    title: Go-To-Market
    purpose: Define distribution.
    questions:
      - id: gtm.discovery
        text: How will users discover the app?
        helpText: Choose the first realistic discovery path.
        answerType: multi_choice
        options:
          - { value: content, label: Content, description: Articles, SEO, videos, or guides. }
          - { value: community, label: Community, description: Existing communities, forums, or social channels. }
          - { value: partnerships, label: Partnerships, description: Distribution through aligned partners. }
          - { value: paid_ads, label: Paid ads, description: Paid acquisition channels. }
          - { value: direct_sales, label: Direct sales, description: Manual outreach or sales-led acquisition. }
        mapsToDecisionIds: [gtm.primary_distribution_channel]
      - id: gtm.launch_channel
        text: What is the primary launch channel?
        helpText: Pick the first channel used to announce or validate the product.
        answerType: text
        mapsToDecisionIds: [gtm.primary_launch_channel]
      - id: gtm.landing_page_promise
        text: What promise should the landing page communicate?
        helpText: Write the central promise in direct user-facing language.
        answerType: text
        mapsToDecisionIds: [gtm.landing_page_promise]

  - id: operations
    phaseId: 10-operations
    title: Operations
    purpose: Define sustainability.
    questions:
      - id: operations.support
        text: How will support work?
        helpText: Define channels, response expectations, and escalation paths.
        answerType: text
        mapsToDecisionIds: [operations.support_model]
      - id: operations.bug_reporting
        text: How will bugs be reported?
        helpText: Mention forms, email, in-app reporting, GitHub issues, or support tools.
        answerType: text
        mapsToDecisionIds: [operations.bug_reporting]
      - id: operations.metrics
        text: What metrics matter after launch?
        helpText: Include activation, retention, revenue, reliability, and support metrics.
        answerType: text
        mapsToDecisionIds:
          - operations.activation_metrics
          - operations.retention_metrics
          - operations.revenue_metrics
          - operations.reliability_metrics
      - id: operations.feedback
        text: How will user feedback be processed?
        helpText: Define how feedback becomes decisions, roadmap changes, or support actions.
        answerType: text
        mapsToDecisionIds: [operations.feedback_loop]
