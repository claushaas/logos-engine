    dependencies:
      documents:
        - architecture.architecture
      decisions: []
    validationRules: []
    promptContext: *defaultPromptContext

  - id: architecture.data_model
    phaseId: 06-architecture
    path: docs/06-architecture/DATA_MODEL.md
    title: Data Model
    template: templates/06-architecture/DATA_MODEL.md
    purpose: Define domain entities, ownership, lifecycle, storage, and sensitive data.
    primaryQuestions:
      - What data must exist?
      - Who owns the data?
      - What data is sensitive?
    requiredInputs: *emptyInputs
    sections:
      - { id: domain_entities, title: Domain Entities, required: true }
      - { id: entity_relationships, title: Entity Relationships, required: true }
      - { id: data_ownership, title: Data Ownership, required: true }
      - { id: data_lifecycle, title: Data Lifecycle, required: true }
      - { id: sensitive_data, title: Sensitive Data, required: true }
      - { id: migration_considerations, title: Migration Considerations, required: false }
    generatedOutputs:
      - entity list
      - relationship summary
      - sensitive data register
    completionCriteria:
      - Core entities, relationships, lifecycle, and sensitive data are explicit.
    dependencies:
      documents:
        - architecture.architecture
      decisions: []
    validationRules: []
    promptContext: *defaultPromptContext

  - id: architecture.api_spec
    phaseId: 06-architecture
    path: docs/06-architecture/API_SPEC.md
    title: API Spec
    template: templates/06-architecture/API_SPEC.md
    purpose: Define API principles, endpoints, auth, errors, and versioning where applicable.
    primaryQuestions:
      - Does this app need an API?
      - What endpoints are required?
      - How are auth and errors handled?
    requiredInputs: *emptyInputs
    sections:
