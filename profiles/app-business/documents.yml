    requiredInputs: *emptyInputs
    sections:
      - { id: platform_targets, title: Platform Targets, required: true }
      - { id: frontend_stack, title: Frontend Stack, required: false }
      - { id: backend_stack, title: Backend Stack, required: false }
      - { id: database, title: Database, required: false }
      - { id: hosting_and_infrastructure, title: Hosting and Infrastructure, required: false }
      - { id: testing_tools, title: Testing Tools, required: true }
      - { id: trade_offs, title: Trade-Offs, required: true }
    generatedOutputs:
