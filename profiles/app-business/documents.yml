version: 0.1.0
profileId: app-business

defaults:
  promptContext: &defaultPromptContext
    includeConfirmedDecisions: true
    includeAssumptions: true
    includeOpenQuestions: true
  requiredInputs: &emptyInputs
    decisions: []
    answers: []
    assumptions: []

documents:
  - id: intake.idea_brief
    phaseId: 00-intake
    path: docs/00-intake/IDEA_BRIEF.md
    title: Idea Brief
    template: templates/00-intake/IDEA_BRIEF.md
    purpose: Capture the initial idea with enough clarity to support structured exploration.
    primaryQuestions:
      - What is the idea?
      - Who is it for?
      - What problem does it solve?
      - Why does it matter?
    requiredInputs:
      decisions:
        - foundation.initial_idea
        - foundation.target_user
        - foundation.problem_statement
        - foundation.desired_outcome
      answers:
        - foundation.idea
        - foundation.primary_user
        - foundation.problem
      assumptions: []
    sections:
      - { id: purpose, title: Purpose, required: true }
      - { id: initial_idea, title: Initial Idea, required: true }
      - { id: target_user, title: Target User, required: true }
      - { id: problem_statement, title: Problem Statement, required: true }
      - { id: desired_outcome, title: Desired Outcome, required: true }
      - { id: current_alternatives, title: Current Alternatives, required: false }
      - { id: assumptions, title: Assumptions, required: true }
      - { id: open_questions, title: Open Questions, required: true }
      - { id: risks, title: Risks, required: true }
      - { id: next_actions, title: Next Actions, required: true }
    generatedOutputs:
      - idea summary
      - target user statement
      - problem statement
      - desired outcome statement
    completionCriteria:
      - Idea, target user, problem, and desired outcome are explicitly stated.
    dependencies:
      documents: []
      decisions: []
    validationRules:
      - foundation.target_user_required
      - foundation.problem_required
    promptContext: *defaultPromptContext

  - id: intake.assumptions
    phaseId: 00-intake
    path: docs/00-intake/ASSUMPTIONS.md
    title: Assumptions
    template: templates/00-intake/ASSUMPTIONS.md
    purpose: Track all planning assumptions that are not yet validated.
    primaryQuestions:
      - Which claims are still assumptions?
      - Which assumptions are risky?
      - How should each assumption be validated?
    requiredInputs: *emptyInputs
    sections:
      - { id: purpose, title: Purpose, required: true }
      - { id: active_assumptions, title: Active Assumptions, required: true }
      - { id: assumptions_by_domain, title: Assumptions by Domain, required: true }
      - { id: validation_plan, title: Validation Plan, required: true }
      - { id: deprecated_assumptions, title: Deprecated Assumptions, required: false }
    generatedOutputs:
      - assumption register
      - validation plan
    completionCriteria:
      - Material non-confirmed claims are recorded as assumptions.
    dependencies:
      documents: []
      decisions: []
    validationRules: []
    promptContext: *defaultPromptContext

  - id: intake.open_questions
    phaseId: 00-intake
    path: docs/00-intake/OPEN_QUESTIONS.md
    title: Open Questions
    template: templates/00-intake/OPEN_QUESTIONS.md
    purpose: Track unresolved questions that affect the project.
    primaryQuestions:
      - What is unresolved?
      - Which questions block progress?
      - Which domain owns each question?
    requiredInputs: *emptyInputs
    sections:
      - { id: purpose, title: Purpose, required: true }
      - { id: critical_questions, title: Critical Questions, required: true }
      - { id: important_questions, title: Important Questions, required: true }
      - { id: optional_questions, title: Optional Questions, required: false }
      - { id: questions_by_domain, title: Questions by Domain, required: true }
      - { id: resolved_questions, title: Resolved Questions, required: false }
    generatedOutputs:
      - open question register
      - question severity grouping
    completionCriteria:
      - Unresolved questions are grouped by severity and domain.
    dependencies:
      documents: []
      decisions: []
    validationRules: []
    promptContext: *defaultPromptContext

  - id: market.market_analysis
    phaseId: 01-market
    path: docs/01-market/MARKET_ANALYSIS.md
    title: Market Analysis
    template: templates/01-market/MARKET_ANALYSIS.md
    purpose: Evaluate whether the target market is understandable, reachable, and potentially viable.
    primaryQuestions:
      - What market does this belong to?
      - Who already serves this market?
      - Where is the opportunity?
    requiredInputs:
      decisions:
        - foundation.target_user
        - foundation.problem_statement
        - market.category
      answers:
        - market.category
        - market.alternatives
      assumptions:
        - market.size_assumption
    sections:
      - { id: purpose, title: Purpose, required: true }
      - { id: executive_summary, title: Executive Summary, required: true }
      - { id: market_category, title: Market Category, required: true }
      - { id: target_segment, title: Target Segment, required: true }
      - { id: current_alternatives, title: Current Alternatives, required: true }
      - { id: market_size_reasoning, title: Market Size Reasoning, required: false }
      - { id: opportunity_gaps, title: Opportunity Gaps, required: true }
      - { id: risks, title: Risks, required: true }
      - { id: validation_plan, title: Validation Plan, required: true }
    generatedOutputs:
      - market category summary
      - target segment definition
      - opportunity gap summary
      - validation plan
    completionCriteria:
      - Market category, target segment, alternatives, opportunity gap, and validation plan are explicit.
    dependencies:
      documents:
        - intake.idea_brief
      decisions:
        - foundation.target_user
        - foundation.problem_statement
    validationRules:
      - market.competitors_required
    promptContext: *defaultPromptContext

  - id: market.competitor_matrix
    phaseId: 01-market
    path: docs/01-market/COMPETITOR_MATRIX.md
    title: Competitor Matrix
    template: templates/01-market/COMPETITOR_MATRIX.md
    purpose: Compare direct, indirect, and substitute alternatives.
    primaryQuestions:
      - Who are the direct competitors?
      - What indirect alternatives exist?
      - What substitute behaviors compete with this app?
    requiredInputs: *emptyInputs
    sections:
      - { id: competitor_categories, title: Competitor Categories, required: true }
      - { id: comparison_table, title: Comparison Table, required: true }
      - { id: feature_comparison, title: Feature Comparison, required: false }
      - { id: pricing_comparison, title: Pricing Comparison, required: false }
      - { id: differentiation_opportunities, title: Differentiation Opportunities, required: true }
      - { id: risks, title: Risks, required: true }
    generatedOutputs:
      - competitor list
      - comparison matrix
      - differentiation opportunities
    completionCriteria:
      - Direct alternatives, indirect alternatives, and substitute behaviors are identified.
    dependencies:
      documents:
        - market.market_analysis
      decisions: []
    validationRules:
      - market.competitors_required
    promptContext: *defaultPromptContext

  - id: market.icp
    phaseId: 01-market
    path: docs/01-market/ICP.md
    title: Ideal Customer Profile
    template: templates/01-market/ICP.md
    purpose: Define the ideal customer profile for product, messaging, pricing, and onboarding.
    primaryQuestions:
      - Who is the primary user?
      - Who pays?
      - What pain do they have?
      - How do they currently solve it?
    requiredInputs: *emptyInputs
    sections:
      - { id: primary_user, title: Primary User, required: true }
      - { id: buyer, title: Buyer, required: false }
      - { id: decision_maker, title: Decision Maker, required: false }
      - { id: jobs_to_be_done, title: Jobs To Be Done, required: true }
      - { id: pain_points, title: Pain Points, required: true }
      - { id: existing_behaviors, title: Existing Behaviors, required: true }
      - { id: willingness_to_pay, title: Willingness to Pay, required: false }
      - { id: validation_plan, title: Validation Plan, required: true }
    generatedOutputs:
      - ICP definition
      - acquisition context
      - validation plan
    completionCriteria:
      - Primary user, buyer, pain, current behavior, and acquisition context are explicit.
    dependencies:
      documents:
        - market.market_analysis
      decisions: []
    validationRules:
      - market.icp_required
    promptContext: *defaultPromptContext

  - id: business.business_model
    phaseId: 02-business
    path: docs/02-business/BUSINESS_MODEL.md
    title: Business Model
    template: templates/02-business/BUSINESS_MODEL.md
    purpose: Define how the app creates, delivers, and captures value.
    primaryQuestions:
      - What value is created?
      - Who pays?
      - How is revenue captured?
    requiredInputs: *emptyInputs
    sections:
      - { id: value_proposition, title: Value Proposition, required: true }
      - { id: customer_segments, title: Customer Segments, required: true }
      - { id: revenue_model, title: Revenue Model, required: true }
      - { id: pricing_logic, title: Pricing Logic, required: true }
      - { id: cost_structure, title: Cost Structure, required: true }
      - { id: distribution_model, title: Distribution Model, required: true }
      - { id: retention_model, title: Retention Model, required: false }
      - { id: business_risks, title: Business Risks, required: true }
    generatedOutputs:
      - business model summary
      - value capture logic
      - business risks
    completionCriteria:
      - Value creation, value delivery, and value capture are explicitly connected.
    dependencies:
      documents:
        - market.icp
      decisions: []
    validationRules: []
    promptContext: *defaultPromptContext

  - id: business.positioning
    phaseId: 02-business
    path: docs/02-business/POSITIONING.md
    title: Positioning
    template: templates/02-business/POSITIONING.md
    purpose: Define how the product should be understood by the market.
    primaryQuestions:
      - What category should users place this in?
      - What promise should be remembered?
      - What alternatives does this replace?
    requiredInputs: *emptyInputs
    sections:
      - { id: category, title: Category, required: true }
      - { id: target_audience, title: Target Audience, required: true }
      - { id: core_promise, title: Core Promise, required: true }
      - { id: primary_differentiation, title: Primary Differentiation, required: true }
      - { id: messaging_pillars, title: Messaging Pillars, required: true }
      - { id: anti_positioning, title: Anti-Positioning, required: false }
    generatedOutputs:
      - positioning statement
      - messaging pillars
      - landing page message
    completionCriteria:
      - Category, audience, promise, and differentiation are clear.
    dependencies:
      documents:
        - business.business_model
        - market.competitor_matrix
      decisions: []
    validationRules: []
    promptContext: *defaultPromptContext

  - id: economics.pricing
    phaseId: 03-economics
    path: docs/03-economics/PRICING.md
    title: Pricing
    template: templates/03-economics/PRICING.md
    purpose: Define pricing model, tiers, boundaries, and value metric.
    primaryQuestions:
      - What pricing model is plausible?
      - Who pays?
      - What value metric drives pricing?
    requiredInputs: *emptyInputs
    sections:
      - { id: pricing_model, title: Pricing Model, required: true }
      - { id: pricing_tiers, title: Pricing Tiers, required: false }
      - { id: free_vs_paid_boundaries, title: Free vs Paid Boundaries, required: false }
      - { id: value_metric, title: Value Metric, required: true }
      - { id: willingness_to_pay_assumptions, title: Willingness to Pay Assumptions, required: true }
      - { id: validation_plan, title: Validation Plan, required: true }
    generatedOutputs:
      - pricing model
      - pricing assumptions
      - validation plan
    completionCriteria:
      - Pricing model, value metric, and willingness-to-pay assumptions are explicit.
    dependencies:
      documents:
        - business.business_model
        - market.icp
      decisions: []
    validationRules:
      - economics.pricing_required
    promptContext: *defaultPromptContext

  - id: economics.financial_model
    phaseId: 03-economics
    path: docs/03-economics/FINANCIAL_MODEL.md
    title: Financial Model
    template: templates/03-economics/FINANCIAL_MODEL.md
    purpose: Model revenue, costs, margin, CAC, LTV, churn, and scenarios.
    primaryQuestions:
      - What revenue assumptions exist?
      - What costs matter?
      - What scenarios should be considered?
    requiredInputs: *emptyInputs
    sections:
      - { id: revenue_assumptions, title: Revenue Assumptions, required: true }
      - { id: fixed_costs, title: Fixed Costs, required: true }
      - { id: variable_costs, title: Variable Costs, required: true }
      - { id: gross_margin, title: Gross Margin, required: true }
      - { id: cac_assumptions, title: CAC Assumptions, required: false }
      - { id: ltv_assumptions, title: LTV Assumptions, required: false }
      - { id: scenario_model, title: Scenario Model, required: true }
      - { id: financial_risks, title: Financial Risks, required: true }
    generatedOutputs:
      - financial assumptions
      - scenario model
      - financial risks
    completionCriteria:
      - Revenue, costs, margin, and scenarios are explicit.
    dependencies:
      documents:
        - economics.pricing
      decisions: []
    validationRules:
      - economics.variable_costs_required
      - economics.cac_assumption_required
    promptContext: *defaultPromptContext

  - id: economics.break_even
    phaseId: 03-economics
    path: docs/03-economics/BREAK_EVEN.md
    title: Break-Even Analysis
    template: templates/03-economics/BREAK_EVEN.md
    purpose: Estimate break-even users, revenue, and sensitivity.
    primaryQuestions:
      - What fixed costs exist?
      - What is contribution margin?
      - How many users are needed to break even?
    requiredInputs: *emptyInputs
    sections:
      - { id: formula, title: Formula, required: true }
      - { id: fixed_costs, title: Fixed Costs, required: true }
      - { id: variable_cost_per_user, title: Variable Cost per User, required: true }
      - { id: arpu, title: ARPU, required: true }
      - { id: break_even_users, title: Break-Even Users, required: true }
      - { id: sensitivity_analysis, title: Sensitivity Analysis, required: false }
    generatedOutputs:
      - break-even formula
      - break-even user estimate
      - sensitivity notes
    completionCriteria:
      - Break-even formula and assumptions are explicit.
    dependencies:
      documents:
        - economics.pricing
        - economics.financial_model
      decisions: []
    validationRules:
      - economics.pricing_required
      - economics.variable_costs_required
    promptContext: *defaultPromptContext

  - id: product.product_thesis
    phaseId: 04-product
    path: docs/04-product/PRODUCT_THESIS.md
    title: Product Thesis
    template: templates/04-product/PRODUCT_THESIS.md
    purpose: Define the product hypothesis, core loop, activation, retention, and differentiation.
    primaryQuestions:
      - What product hypothesis should be tested?
      - What is the core loop?
      - What makes this product meaningfully different?
    requiredInputs: *emptyInputs
    sections:
      - { id: problem, title: Problem, required: true }
      - { id: target_user, title: Target User, required: true }
      - { id: product_hypothesis, title: Product Hypothesis, required: true }
      - { id: core_loop, title: Core Loop, required: true }
      - { id: activation_moment, title: Activation Moment, required: true }
      - { id: retention_hypothesis, title: Retention Hypothesis, required: false }
      - { id: success_criteria, title: Success Criteria, required: true }
    generatedOutputs:
      - product thesis
      - core loop
      - success criteria
    completionCriteria:
      - Problem, target user, hypothesis, core loop, and success criteria are explicit.
    dependencies:
      documents:
        - intake.idea_brief
        - market.icp
      decisions: []
    validationRules:
      - product.core_loop_required
      - product.activation_moment_required
    promptContext: *defaultPromptContext

  - id: product.mvp_scope
    phaseId: 04-product
    path: docs/04-product/MVP_SCOPE.md
    title: MVP Scope
    template: templates/04-product/MVP_SCOPE.md
    purpose: Define the smallest valuable version and explicit non-goals.
    primaryQuestions:
      - What is included in the MVP?
      - What is excluded?
      - What must be true for MVP success?
    requiredInputs: *emptyInputs
    sections:
      - { id: mvp_hypothesis, title: MVP Hypothesis, required: true }
      - { id: included_features, title: Included Features, required: true }
      - { id: excluded_features, title: Excluded Features, required: true }
      - { id: core_user_flow, title: Core User Flow, required: true }
      - { id: acceptance_criteria, title: Acceptance Criteria, required: true }
      - { id: risks, title: Risks, required: true }
    generatedOutputs:
      - MVP scope
      - explicit non-goals
      - acceptance criteria
    completionCriteria:
      - Included features, excluded features, and acceptance criteria are explicit.
    dependencies:
      documents:
        - product.product_thesis
      decisions: []
    validationRules:
      - product.mvp_scope_required
    promptContext: *defaultPromptContext

  - id: product.roadmap
    phaseId: 04-product
    path: docs/04-product/ROADMAP.md
    title: Product Roadmap
    template: templates/04-product/ROADMAP.md
    purpose: Define staged product evolution and decision gates.
    primaryQuestions:
      - What should be validated first?
      - What comes after MVP?
      - What should be deferred?
    requiredInputs: *emptyInputs
    sections:
      - { id: roadmap_principles, title: Roadmap Principles, required: true }
      - { id: validation_phase, title: Phase 0 - Validation, required: true }
      - { id: mvp_phase, title: Phase 1 - MVP, required: true }
      - { id: beta_phase, title: Phase 2 - Beta, required: false }
      - { id: public_launch_phase, title: Phase 3 - Public Launch, required: false }
      - { id: feature_backlog, title: Feature Backlog, required: true }
      - { id: decision_gates, title: Decision Gates, required: true }
    generatedOutputs:
      - staged roadmap
      - feature backlog
      - decision gates
    completionCriteria:
      - Phases, decision gates, and deferred ideas are explicit.
    dependencies:
      documents:
        - product.mvp_scope
      decisions: []
    validationRules: []
    promptContext: *defaultPromptContext

  - id: design.ux_flows
    phaseId: 05-design
    path: docs/05-design/UX_FLOWS.md
    title: UX Flows
    template: templates/05-design/UX_FLOWS.md
    purpose: Define core user journeys and interaction logic.
    primaryQuestions:
      - What is the primary journey?
      - How does onboarding work?
      - What edge cases matter?
    requiredInputs: *emptyInputs
    sections:
      - { id: primary_user_journey, title: Primary User Journey, required: true }
      - { id: onboarding_flow, title: Onboarding Flow, required: true }
      - { id: core_loop_flow, title: Core Loop Flow, required: true }
      - { id: empty_states, title: Empty States, required: true }
      - { id: error_states, title: Error States, required: true }
      - { id: edge_cases, title: Edge Cases, required: true }
      - { id: accessibility_considerations, title: Accessibility Considerations, required: false }
    generatedOutputs:
      - UX flow outline
      - edge case list
      - state requirements
    completionCriteria:
      - Onboarding, core loop, empty states, and critical edge cases are defined.
    dependencies:
      documents:
        - product.product_thesis
      decisions: []
    validationRules: []
    promptContext: *defaultPromptContext

  - id: design.design_direction
    phaseId: 05-design
    path: docs/05-design/DESIGN_DIRECTION.md
    title: Design Direction
    template: templates/05-design/DESIGN_DIRECTION.md
    purpose: Define visual and interaction direction for the app.
    primaryQuestions:
      - What should the interface feel like?
      - What design principles matter?
      - What should be avoided?
    requiredInputs: *emptyInputs
    sections:
      - { id: design_principles, title: Design Principles, required: true }
      - { id: visual_tone, title: Visual Tone, required: true }
      - { id: typography_direction, title: Typography Direction, required: false }
      - { id: color_direction, title: Color Direction, required: false }
      - { id: layout_principles, title: Layout Principles, required: true }
      - { id: component_principles, title: Component Principles, required: true }
      - { id: anti_patterns, title: Anti-Patterns, required: true }
    generatedOutputs:
      - design principles
      - visual direction
      - anti-patterns
    completionCriteria:
      - Visual tone, design principles, component direction, and anti-patterns are explicit.
    dependencies:
      documents:
        - design.ux_flows
      decisions: []
    validationRules: []
    promptContext: *defaultPromptContext

  - id: design.onboarding
    phaseId: 05-design
    path: docs/05-design/ONBOARDING.md
    title: Onboarding
    template: templates/05-design/ONBOARDING.md
    purpose: Define how a new user reaches first value.
    primaryQuestions:
      - What happens on first run?
      - What is the activation moment?
      - Where can users drop off?
    requiredInputs: *emptyInputs
    sections:
      - { id: first_run_experience, title: First-Run Experience, required: true }
      - { id: activation_moment, title: Activation Moment, required: true }
      - { id: required_inputs, title: Required Inputs, required: true }
      - { id: progressive_disclosure, title: Progressive Disclosure, required: false }
      - { id: drop_off_risks, title: Drop-Off Risks, required: true }
      - { id: success_metrics, title: Success Metrics, required: false }
    generatedOutputs:
      - onboarding flow
      - activation requirements
      - drop-off risks
    completionCriteria:
