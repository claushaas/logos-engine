    promptContext: *defaultPromptContext

  - id: architecture.tech_stack
    phaseId: 06-architecture
    path: docs/06-architecture/TECH_STACK.md
    title: Tech Stack
    template: templates/06-architecture/TECH_STACK.md
    purpose: Define platform targets, tools, infrastructure, and trade-offs.
    primaryQuestions:
