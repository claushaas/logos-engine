      decisions: []
    validationRules:
      - product.activation_moment_required
    promptContext: *defaultPromptContext

  - id: architecture.architecture
    phaseId: 06-architecture
    path: docs/06-architecture/ARCHITECTURE.md
    title: Architecture
    template: templates/06-architecture/ARCHITECTURE.md
    purpose: Define system architecture, runtime, data flow, security, and scalability.
    primaryQuestions:
      - What are the system boundaries?
      - What runtime architecture is needed?
      - What data and integrations matter?
    requiredInputs: *emptyInputs
    sections:
      - { id: architectural_principles, title: Architectural Principles, required: true }
      - { id: system_context, title: System Context, required: true }
      - { id: runtime_architecture, title: Runtime Architecture, required: true }
      - { id: application_layers, title: Application Layers, required: true }
      - { id: data_flow, title: Data Flow, required: true }
      - { id: persistence, title: Persistence, required: true }
      - { id: sync_strategy, title: Sync Strategy, required: false }
      - { id: security_considerations, title: Security Considerations, required: true }
    generatedOutputs:
