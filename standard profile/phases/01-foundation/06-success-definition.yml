document:
  id: "06-success-definition"
  title: "Success Definition"
  phase: "01-foundation"
  status: "not_started"
  order: 6
  type: "success_definition"
  purpose: "Define the criteria by which the project is judged to be working."
  centralQuestion: "What must be true for us to say this project works?"
  outputs:
    canonical:
      format: "markdown"
      path: "01-foundation/06-success-definition.md"
      purpose: "Rendered success definition document"
  dependsOn:
    - "01-thesis"
    - "02-problem"
    - "03-audience"
    - "04-principles"
    - "05-boundaries"
  feeds:
    - "07-glossary"
  completionCriteria:
    - "The central question is directly answered."
    - "All required sections contain substantive content."
    - "Success signals and failure signals are both defined."
    - "The minimum validation threshold is concrete and testable."
  qualityChecks:
    - "Avoid vague claims."
    - "Prefer decision-useful statements."
    - "Success criteria must be falsifiable."
    - "False success indicators must be distinguishable from true success."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
    - "Prefer observable outcomes over abstract aspirations."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with upstream documents."
    - "Verify that success criteria align with the thesis, not just stakeholder wishes."
  sections:
    - id: "foundational-success"
      title: "Foundational Success"
      intent: "Define how success is recognized and what minimum result validates the thesis."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "How will success be recognized?"
        - "What change should the user experience?"
        - "What minimum result would validate the thesis?"
        - "What signals indicate misalignment?"
        - "What apparent success would be false success?"
    - id: "user-level-success"
      title: "User-Level Success"
      intent: "Define observable outcomes that indicate the user is succeeding."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What observable outcomes indicate the user is succeeding?"
        - "What does the user say when the project works for them?"
    - id: "system-level-success"
      title: "System-Level Success"
      intent: "Define technical and structural measures that indicate system health."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What technical or structural measures indicate health?"
        - "What metrics matter for the system itself?"
    - id: "failure-signals"
      title: "Failure Signals"
      intent: "Identify early indicators that the project is not working as intended."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What early indicators suggest the project is not working?"
        - "What user behaviors or feedback patterns signal misalignment?"
    - id: "false-success"
      title: "False Success"
      intent: "Identify metrics and adoption patterns that could mask failure."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What metrics could look good while masking failure?"
        - "What adoption patterns would be vanity metrics?"
    - id: "minimum-validation-threshold"
      title: "Minimum Validation Threshold"
      intent: "Define the smallest result that would count as validation of the thesis."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What is the smallest result that would count as validation?"
        - "What conditions must be met to declare the thesis tested?"
