document:
  id: "04-principles"
  title: "Design Principles"
  phase: "01-foundation"
  status: "not_started"
  order: 4
  type: "principles"
  purpose: "Establish normative rules that govern decisions when there is conflict."
  centralQuestion: "What rules govern decisions when there is conflict?"
  outputs:
    canonical:
      format: "markdown"
      path: "01-foundation/04-principles.md"
      purpose: "Rendered design principles document"
  dependsOn:
    - "01-thesis"
    - "02-problem"
    - "03-audience"
  feeds:
    - "05-boundaries"
    - "06-success-definition"
  completionCriteria:
    - "The central question is directly answered."
    - "All required sections contain substantive content."
    - "Each principle includes a decision rule, acceptable trade-offs, and violations."
  qualityChecks:
    - "Avoid vague claims."
    - "Prefer decision-useful statements."
    - "Each principle must be falsifiable: it must be possible to identify a violation."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
    - "State each principle in positive, actionable terms."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with upstream documents."
    - "Verify that no two principles directly contradict each other."
  specializedFormats:
    principleFormat:
      description: "Used by principles documents."
      fields:
        - name
        - meaning
        - decisionRule
        - acceptableTradeoffs
        - violations
