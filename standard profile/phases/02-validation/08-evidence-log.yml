document:
  id: "08-evidence-log"
  title: "Evidence Log"
  phase: "02-validation"
  status: "not_started"
  order: 8
  type: "evidence_log"
  purpose: "Centralized registry of all evidence collected, its sources, strength, and interpretation."
  centralQuestion: "What evidence was collected and from where?"
  outputs:
    canonical:
      format: "markdown"
      path: "02-validation/08-evidence-log.md"
      purpose: "Centralized registry of all evidence collected, its sources, strength, and interpretation."
  dependsOn: []
  feeds: []
  completionCriteria:
    - "The central question is directly answered."
    - "All required sections contain substantive content."
  qualityChecks:
    - "Avoid vague claims."
    - "Prefer decision-useful statements."
    - "Make assumptions explicit."
    - "Evidence entries must be traceable to specific hypotheses or experiments."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with upstream documents."
  sections:
    - id: "evidence-register"
      title: "Evidence Register"
      intent: "Maintain the master log of all evidence entries with source, interpretation, and strength."
      required: true
      outputGuidance: []
      qualityChecks:
        - "Answers each listed question substantively."
        - "Avoids unsupported assertions."
      questions:
        - "What is the complete inventory of evidence collected?"
        - "Which evidence entries are strongest and weakest?"
    - id: "interview-evidence"
      title: "Interview Evidence"
      intent: "Catalog evidence from interviews, including key quotes and patterns across participants."
      required: true
      outputGuidance: []
      qualityChecks:
        - "Answers each listed question substantively."
        - "Avoids unsupported assertions."
      questions:
        - "What evidence was collected from interviews?"
        - "Which participant quotes are most revealing?"
        - "What patterns emerged across interviews?"
    - id: "behavioral-evidence"
      title: "Behavioral Evidence"
      intent: "Document observed behavior, comparing actual actions to stated intentions."
      required: true
      outputGuidance: []
      qualityChecks:
        - "Answers each listed question substantively."
        - "Avoids unsupported assertions."
      questions:
        - "What evidence was collected from observed behavior?"
        - "What did people actually do vs. what they said they would do?"
        - "What behavioral patterns were unexpected?"
    - id: "quantitative-evidence"
      title: "Quantitative Evidence"
      intent: "Document numerical evidence, key metrics, and statistical significance."
      required: true
      outputGuidance: []
      qualityChecks:
        - "Answers each listed question substantively."
        - "Avoids unsupported assertions."
      questions:
        - "What numerical evidence was collected?"
        - "What are the key metrics and their values?"
        - "What is the statistical significance of the quantitative findings?"
    - id: "market-evidence"
      title: "Market Evidence"
      intent: "Document evidence about the market, competitors, substitutes, and adjacent markets."
      required: true
      outputGuidance: []
      qualityChecks:
        - "Answers each listed question substantively."
        - "Avoids unsupported assertions."
      questions:
        - "What evidence about the market was collected?"
        - "What do competitors, substitutes, and adjacent markets indicate?"
        - "What market data supports or refutes the opportunity?"
    - id: "contradictory-evidence"
      title: "Contradictory Evidence"
      intent: "Surface evidence that contradicts assumptions and track reconciliation."
      required: true
      outputGuidance: []
      qualityChecks:
        - "Answers each listed question substantively."
        - "Avoids unsupported assertions."
      questions:
        - "What evidence contradicts the project's assumptions?"
        - "What evidence was collected that we did not want to find?"
        - "How are contradictions being reconciled?"
    - id: "evidence-quality-notes"
      title: "Evidence Quality Notes"
      intent: "Assess overall evidence quality, source reliability, gaps, and potential biases."
      required: true
      outputGuidance: []
      qualityChecks:
        - "Answers each listed question substantively."
        - "Avoids unsupported assertions."
      questions:
        - "What is the overall quality of the evidence collected?"
        - "Which evidence sources are most reliable?"
        - "Where are the evidence gaps?"
        - "What biases may have affected evidence collection?"
