document:
  id: "06-economic-model"
  title: "Economic Model"
  phase: "02-validation"
  status: "not_started"
  purpose: "Determine whether the project can pay its own costs and generate enough margin to continue existing."
  centralQuestion: "Is there a plausible configuration where this project pays its own costs and generates enough margin to continue existing?"
  sections:
    - id: "economic-validation-objective"
      title: "Economic Validation Objective"
      questions:
        - "What is the financial goal for this project?"
        - "What economic assumptions must hold true?"
        - "What is the minimum viable economic outcome?"
    - id: "revenue-model"
      title: "Revenue Model"
      questions:
        - "How can the project generate revenue?"
        - "What are the primary and secondary revenue streams?"
        - "What is the pricing model: subscription, one-time, usage-based, freemium?"
    - id: "pricing-assumptions"
      title: "Pricing Assumptions"
      questions:
        - "What price points are being considered?"
        - "What is the willingness-to-pay evidence supporting each price point?"
        - "How does pricing compare to alternatives and substitutes?"
    - id: "cost-structure"
      title: "Cost Structure"
      questions:
        - "What are fixed monthly costs?"
        - "What are variable costs per customer?"
        - "What are one-time setup or launch costs?"
        - "What infrastructure costs are expected at each scale?"
    - id: "unit-economics"
      title: "Unit Economics"
      questions:
        - "What is the estimated gross margin per customer?"
        - "What is the customer lifetime value (LTV)?"
        - "What is the customer acquisition cost (CAC)?"
        - "What is the LTV:CAC ratio?"
    - id: "break-even-analysis"
      title: "Break-even Analysis"
      questions:
        - "How many paying customers are needed to break even?"
        - "What is the time to break-even under different scenarios?"
        - "What is the required conversion rate from free to paid?"
    - id: "scenario-analysis"
      title: "Scenario Analysis"
      questions:
        - "Conservative scenario: what are the assumptions and outcome?"
        - "Realistic scenario: what are the assumptions and outcome?"
        - "Optimistic scenario: what are the assumptions and outcome?"
        - "Failure scenario: what are the assumptions and outcome?"
    - id: "sensitivity-analysis"
      title: "Sensitivity Analysis"
      questions:
        - "How sensitive is the model to price changes?"
        - "How sensitive is the model to churn rate?"
        - "How sensitive is the model to CAC?"
        - "How sensitive is the model to infrastructure cost?"
        - "What is the maximum tolerable churn?"
    - id: "economic-risks"
      title: "Economic Risks"
      questions:
        - "What are the top economic risks?"
        - "What economic conditions would make the project non-viable?"
        - "What competitive responses could undermine the economic model?"
    - id: "invalidating-conditions"
      title: "Invalidating Conditions"
      questions:
        - "What economic results would invalidate the project?"
        - "At what thresholds is a pivot required?"
    - id: "economic-validation-summary"
      title: "Economic Validation Summary"
      questions:
        - "Is the project economically viable based on current evidence?"
        - "What is the confidence level in the economic model?"
        - "What additional evidence is needed to increase confidence?"
