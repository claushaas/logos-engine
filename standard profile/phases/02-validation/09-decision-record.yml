document:
  id: "09-decision-record"
  title: "Decision Record"
  phase: "02-validation"
  status: "not_started"
  purpose: "Record all decisions made from evidence, including reasoning, alternatives, and remaining risk."
  centralQuestion: "What was decided based on what evidence?"
  sections:
    - id: "decision-register"
      title: "Decision Register"
      description: "Master log of all validation-driven decisions. Each entry uses the format below."
      format:
        - "VDR-XXX"
        - "Date"
        - "Decision (Proceed/Pivot/Pause/Stop/Re-test)"
        - "Related Hypotheses"
        - "Evidence Used"
        - "Reasoning"
        - "Alternatives Considered"
        - "Remaining Risk"
        - "Next Step"
      questions:
        - "What decisions have been made based on evidence?"
        - "What is the complete decision history?"
    - id: "accepted-hypotheses"
      title: "Accepted Hypotheses"
      questions:
        - "Which hypotheses have been accepted as supported?"
        - "What evidence supports each accepted hypothesis?"
        - "What is the confidence level in each accepted hypothesis?"
    - id: "refuted-hypotheses"
      title: "Refuted Hypotheses"
      questions:
        - "Which hypotheses have been refuted?"
        - "What evidence refuted each hypothesis?"
        - "What was the impact of each refutation on the project?"
    - id: "pivot-decisions"
      title: "Pivot Decisions"
      questions:
        - "What pivot decisions have been made?"
        - "What triggered each pivot?"
        - "What changed as a result of each pivot?"
    - id: "proceed-decisions"
      title: "Proceed Decisions"
      questions:
        - "What proceed/go-forward decisions have been made?"
        - "What evidence justified proceeding?"
        - "What conditions were attached to proceeding?"
    - id: "stop-decisions"
      title: "Stop Decisions"
      questions:
        - "What stop/kill decisions have been made?"
        - "What evidence triggered the decision to stop?"
        - "What can be learned from the stopped initiative?"
    - id: "open-risks"
      title: "Open Risks"
      questions:
        - "What risks remain open and unaddressed?"
        - "Which risks are being actively monitored?"
        - "Which risks require further evidence before a decision can be made?"
