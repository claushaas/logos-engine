document:
  id: "07-business-model"
  title: "Business Model"
  phase: "02-validation"
  status: "not_started"
  purpose: "Define the integrated mechanism by which the project becomes economically, operationally, and strategically viable."
  centralQuestion: "What is the mechanism by which this project becomes economically, operationally, and strategically viable?"
  sections:
    - id: "business-model-objective"
      title: "Business Model Objective"
      questions:
        - "What is the overall business logic that makes the project viable?"
        - "How do the pieces fit together into a coherent whole?"
    - id: "value-proposition"
      title: "Value Proposition"
      questions:
        - "What unique value does the project create?"
        - "For whom does it create value?"
        - "Why is this value proposition defensible?"
    - id: "customer-segments"
      title: "Customer Segments"
      description: "Distinguish between users, customers, buyers, and beneficiaries."
      questions:
        - "Who are the users (people who interact with the product)?"
        - "Who are the customers (people who pay)?"
        - "Who are the buyers (people who make the purchasing decision)?"
        - "Who are the beneficiaries (people who derive value)?"
        - "Are these the same people or different groups?"
    - id: "revenue-streams"
      title: "Revenue Streams"
      questions:
        - "What are all sources of revenue?"
        - "What is the expected contribution of each revenue stream?"
        - "How do revenue streams interact?"
    - id: "pricing-logic"
      title: "Pricing Logic"
      questions:
        - "What is the rationale behind the chosen pricing model?"
        - "How does pricing align with perceived value?"
        - "What pricing tiers or options exist?"
    - id: "distribution-channels"
      title: "Distribution Channels"
      questions:
        - "How will the product reach customers?"
        - "What are the primary and secondary channels?"
        - "What is the cost and conversion rate of each channel?"
    - id: "customer-relationships"
      title: "Customer Relationships"
      questions:
        - "What type of relationship will be established with customers?"
        - "How will customers be supported?"
        - "How will customer feedback be collected and used?"
    - id: "key-activities"
      title: "Key Activities"
      questions:
        - "What are the most important activities required to deliver the value proposition?"
        - "What activities are needed to operate the business?"
    - id: "key-resources"
      title: "Key Resources"
      questions:
        - "What resources are essential to deliver the value proposition?"
        - "What intellectual, human, financial, and physical resources are needed?"
    - id: "key-partners"
      title: "Key Partners"
      questions:
        - "Who are the key partners and suppliers?"
        - "What activities or resources do partners provide?"
        - "What is the nature of each partnership?"
    - id: "cost-drivers"
      title: "Cost Drivers"
      questions:
        - "What are the most significant costs?"
        - "Which costs are fixed vs. variable?"
        - "How do costs scale with growth?"
    - id: "competitive-advantage"
      title: "Competitive Advantage"
      questions:
        - "What is the source of competitive advantage?"
        - "How sustainable is the advantage?"
        - "What are the barriers to entry for competitors?"
        - "What are the barriers to exit for customers?"
    - id: "scalability-logic"
      title: "Scalability Logic"
      questions:
        - "How does the business model scale?"
        - "What are the limits to scaling?"
        - "What changes at each order of magnitude of scale?"
    - id: "investor-stakeholder-narrative"
      title: "Investor/Stakeholder Narrative"
      questions:
        - "What is the story that makes this project investable?"
        - "What metrics matter most to stakeholders?"
        - "What is the expected return profile?"
    - id: "business-model-risks"
      title: "Business Model Risks"
      questions:
        - "What are the biggest risks to the business model?"
        - "What assumptions about the business model are least validated?"
        - "What competitive or market changes could undermine the model?"
    - id: "invalidating-conditions"
      title: "Invalidating Conditions"
      questions:
        - "What conditions would prove the business model unworkable?"
        - "What specific evidence would trigger a fundamental rethink?"
    - id: "business-model-summary"
      title: "Business Model Summary"
      questions:
        - "Is the business model viable based on current evidence?"
        - "What is the single strongest piece of evidence supporting the model?"
        - "What is the single weakest point in the model?"
