document:
  id: "05-customer-success"
  title: "Customer Success"
  phase: "06-operations"
  status: "not_started"
  order: 5
  type: "customer_success"
  purpose: "Define how the project proactively helps customers reach meaningful value, stay healthy, retain, expand when appropriate, provide feedback, and avoid preventable churn without confusing customer success with reactive support."
  centralQuestion: "How are customers proactively guided from onboarding to activation, continued value, retention, expansion, feedback, satisfaction, and churn prevention?"
  outputs:
    canonical:
      format: "markdown"
      path: "docs/06-operations/05-customer-success.md"
      purpose: "Store the canonical customer success model as a Markdown document."
    artifacts:
      - id: "operations.customer_success_playbook"
        format: "html"
        path: "outcomes/html/06-operations/customer-success-playbook.html"
        purpose: "Provide a founder-facing customer success playbook covering onboarding, activation, customer health, retention, expansion, satisfaction, churn prevention, feedback loops, metrics, risks, and downstream handoff."
        audience: "founder"
        includes:
          - "customer success objective"
          - "customer success principles"
          - "customer success scope"
          - "customer lifecycle"
          - "customer segments and cohorts"
          - "onboarding model"
          - "activation milestones"
          - "onboarding follow-up"
          - "health signals"
          - "health scoring"
          - "at-risk signals"
          - "retention actions"
          - "expansion opportunities"
          - "satisfaction measurement"
          - "feedback loops"
          - "churn prevention"
          - "churn analysis"
          - "customer success cadences"
          - "customer success metrics"
          - "customer success risks"
          - "downstream handoff"
        generationMode: "regenerate_from_canonical"
    agentPacks:
      - id: "operations.customer_success_review_prompt"
        format: "markdown"
        path: "outcomes/agents/06-operations/customer-success-review-prompt.md"
        purpose: "Provide compact context for agents reviewing whether customer success is proactive, lifecycle-aware, activation-aware, retention-aware, expansion-aware, measurable, owner-aware, and distinct from reactive customer support."
        agentRole: "reviewer"
        includes:
          - "canonical customer success model"
          - "operations brief dependency"
          - "operating model dependency"
          - "team responsibilities dependency"
          - "customer support dependency"
          - "product dependency"
          - "growth metrics dependency"
          - "pricing dependency"
          - "customer success formats"
          - "completion criteria"
          - "quality checks"
          - "review rules"
  dependsOn:
    - "01-foundation/04-principles"
    - "01-foundation/05-boundaries"
    - "01-foundation/06-success-definition"
    - "03-product/02-user-personas"
    - "03-product/03-user-journeys"
    - "03-product/04-value-proposition"
    - "03-product/08-product-scope"
    - "03-product/10-functional-requirements"
    - "03-product/11-non-functional-requirements"
    - "03-product/13-acceptance-criteria"
    - "04-engineering/08-security-and-privacy"
    - "04-engineering/11-observability"
    - "04-engineering/14-technical-risks"
    - "05-go-to-market/05-customer-segments"
    - "05-go-to-market/07-launch-plan"
    - "05-go-to-market/08-conversion-funnel"
    - "05-go-to-market/09-sales-strategy"
    - "05-go-to-market/10-pricing-and-packaging"
    - "05-go-to-market/12-growth-metrics"
    - "05-go-to-market/13-go-to-market-risks"
    - "06-operations/01-operations-brief"
    - "06-operations/02-operating-model"
    - "06-operations/03-team-and-responsibilities"
    - "06-operations/04-customer-support"
  feeds:
    - "06-operations/06-maintenance-plan"
    - "06-operations/07-release-management"
    - "06-operations/08-incident-response"
    - "06-operations/09-data-and-privacy-operations"
    - "06-operations/10-financial-operations"
    - "06-operations/11-risk-management"
  inputs:
    - id: "operations-brief"
      type: "context"
      required: false
      description: "Operations objective, support expectations, service expectations, operational success criteria, cost/capacity constraints, operational risks, and downstream handoffs."
    - id: "operating-model"
      type: "context"
      required: false
      description: "Operating scope, ownership model, cadences, workflows, manual operations, automated operations, metrics, constraints, escalation paths, and operating risks."
    - id: "team-and-responsibilities"
      type: "context"
      required: false
      description: "Customer success owner, backup owner, support owner, product owner, GTM owner, decision authority, handoff rules, responsibility gaps, and future hiring needs."
    - id: "customer-support"
      type: "context"
      required: false
      description: "Support scope, ticket categories, support feedback loop, support metrics, known issues, support risks, and support-to-customer-success handoff rules."
    - id: "product-context"
      type: "context"
      required: false
      description: "Personas, user journeys, value proposition, product scope, activation moments, supported capabilities, deferred capabilities, acceptance criteria, and product limitations."
    - id: "gtm-context"
      type: "context"
      required: false
      description: "Customer segments, launch cohorts, conversion funnel, sales strategy, pricing and packaging, growth metrics, GTM risks, retention assumptions, expansion assumptions, and customer promises."
    - id: "engineering-analytics-context"
      type: "context"
      required: false
      description: "Observability, event tracking, product telemetry, privacy constraints, technical risks, customer health signal availability, and data quality limitations."
    - id: "customer-success-notes"
      type: "manual_note"
      required: false
      description: "Known onboarding ideas, activation milestones, health signals, retention actions, expansion ideas, satisfaction survey ideas, churn concerns, feedback loops, and unresolved customer success questions."
  completionCriteria:
    - "The central question is answered through a proactive customer success model covering lifecycle, onboarding, activation, health, retention, expansion, satisfaction, feedback, churn prevention, metrics, risks, and handoff."
    - "Customer success objective defines what customer success protects: value realization, activation, retained value, customer trust, product learning, expansion quality, churn prevention, and sustainable growth."
    - "Customer success principles define how proactive outreach, education, health monitoring, retention work, expansion, and feedback loops should behave without becoming spammy, manipulative, overpromising, or support-overloading."
    - "Customer success scope distinguishes proactive success from reactive support, sales, product management, account management, financial operations, and incident response."
    - "Customer lifecycle defines stages from acquisition or signup through onboarding, activation, habit formation, retained value, expansion, advocacy/referral, churn risk, churn, and win-back where relevant."
    - "Customer segments and cohorts define which customers receive proactive success attention, which are self-serve only, which are high-touch, which are at risk, which are expansion candidates, and which are excluded or unsupported."
    - "Onboarding model defines path, owner, trigger, customer action, system action, educational asset, success signal, stuck signal, support fallback, and privacy/data constraints."
    - "Activation milestones define meaningful value milestones, entry criteria, completion event, evidence source, target timeframe, owner, stuck signal, intervention, and false-activation exclusion."
    - "Onboarding follow-up defines post-signup/customer follow-up, trigger, cadence, channel, message, personalization, CTA, owner, stop condition, escalation, and privacy/opt-out rules."
    - "Health signals define usage, value, engagement, support, payment, satisfaction, feedback, product outcome, and risk signals, with source, owner, cadence, threshold, and caveats."
    - "Health scoring defines whether a score is used, how it is calculated, what inputs are included/excluded, confidence level, threshold, review cadence, owner, and risk of false positives."
    - "At-risk signals define churn/abandonment/low-value indicators, early signal, likely cause, priority, response speed, intervention, owner, and escalation path."
    - "Retention actions define proactive actions by risk type, customer segment, lifecycle stage, channel, owner, message, success signal, stop condition, and downstream feedback."
    - "Expansion opportunities define ethical expansion triggers, qualification signals, customer benefit, plan/feature/usage upgrade path, sales/pricing handoff, support impact, and risks."
    - "Satisfaction measurement defines CSAT/NPS/CES/interview/qualitative methods where useful, cadence, sample, trigger, question set, owner, response handling, privacy constraints, and decision use."
    - "Feedback loops define how customer success captures, categorizes, routes, prioritizes, and follows up on product feedback, onboarding friction, support patterns, pricing friction, churn reasons, and customer language."
    - "Churn prevention defines systematic actions before churn, including health monitoring, outreach, education, issue resolution, value reinforcement, expectation correction, and escalation."
    - "Churn analysis defines how churn is identified, categorized, measured, reviewed, learned from, and routed to product, pricing, support, GTM, risk, or operations."
    - "Customer success cadences define review rhythms for onboarding, activation, at-risk customers, health scoring, feedback, satisfaction, retention, expansion, churn, and leadership/operations review."
    - "Customer success metrics define activation, onboarding completion, time-to-value, health, retention, churn, expansion, satisfaction, feedback, intervention success, support handoff, and risk metrics."
    - "Customer success risks identify low activation, false health signals, spammy outreach, poor retention action, unethical expansion, ignored churn signals, insufficient data, privacy risk, ownership gaps, and support overload."
    - "Downstream handoff clarifies what Maintenance Plan, Release Management, Incident Response, Data/Privacy Operations, Financial Operations, and Risk Management must inherit."
  qualityChecks:
    - "Avoid vague claims."
    - "Avoid customer-success theater: lifecycle stages and health scores without signals, thresholds, owners, cadences, interventions, metrics, risks, and handoffs."
    - "Avoid confusing customer success with reactive support; customer success is proactive value realization, while support handles reactive issues."
    - "Avoid treating activity as value; health and activation must reflect meaningful customer outcomes, not only logins, page views, or emails opened."
    - "Avoid health scoring before enough data exists; mark health score as provisional or deferred when instrumentation is insufficient."
    - "Avoid proactive outreach that becomes spammy, manipulative, privacy-invasive, or inconsistent with customer consent and channel expectations."
    - "Avoid expansion motions that push upgrades without demonstrated customer benefit, fit, and pricing clarity."
    - "Avoid satisfaction surveys without clear purpose, cadence, response handling, and decision use."
    - "Avoid churn analysis that blames customers instead of identifying product, onboarding, pricing, support, expectation, or segment-fit causes."
    - "Avoid collecting unnecessary personal, sensitive, behavioral, or telemetry data for success tracking."
    - "Prefer decision-useful statements."
    - "Make assumptions explicit."
    - "Do not invent activation rates, churn rates, health scores, satisfaction scores, expansion rates, customer capacity, survey benchmarks, or instrumentation readiness."
    - "Customer success must preserve Foundation boundaries, product truth, technical truth, pricing truth, privacy/security constraints, customer trust, support capacity, and operational sustainability."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
    - "Separate lifecycle stage, segment, cohort, milestone, signal, score, threshold, intervention, owner, cadence, metric, risk, and handoff."
    - "Tie customer success rules to Operations Brief, Operating Model, Team and Responsibilities, Customer Support, Product Scope, User Journeys, Value Proposition, Conversion Funnel, Pricing, Growth Metrics, GTM Risks, Technical Risks, or Decision Record where possible."
    - "Classify customer success items as current, required, deferred, self-serve, high-touch, automated, manual, review-needed, launch-critical, post-launch, privacy-sensitive, support-handoff, or sales-handoff where useful."
    - "State whether interventions are automated, manual, self-serve, support-assisted, sales-assisted, or product-led."
    - "Route detailed support procedures, release fixes, data/privacy procedures, financial procedures, and risk ownership downstream."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with Operations Brief, Operating Model, Team and Responsibilities, Customer Support, Foundation, Product, Acceptance Criteria, NFRs, Security/Privacy, Observability, Technical Risks, Customer Segments, Launch Plan, Conversion Funnel, Sales Strategy, Pricing and Packaging, Growth Metrics, GTM Risks, or Decision Record."
    - "Flag activation milestones that do not represent meaningful value."
    - "Flag health signals or scores without data source, threshold, owner, cadence, confidence level, and caveats."
    - "Flag at-risk signals without intervention, response speed, owner, and escalation path."
    - "Flag retention actions without target segment, trigger, message, success signal, and stop condition."
    - "Flag expansion opportunities without customer benefit, qualification, pricing/sales handoff, and ethical boundary."
    - "Flag satisfaction measurement without method, cadence, sample, response handling, and decision use."
    - "Flag churn prevention or churn analysis without cause taxonomy, owner, review cadence, and downstream feedback loop."
    - "Flag customer success metrics without formula/source, owner, cadence, threshold, and decision implication."
    - "Verify that downstream Operations documents receive concrete customer success handoff inputs."
    - "Flag content that belongs better in Customer Support, Maintenance Plan, Release Management, Incident Response, Data/Privacy Operations, Financial Operations, or Risk Management."
