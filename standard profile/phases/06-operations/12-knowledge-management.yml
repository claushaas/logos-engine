document:
  id: "12-knowledge-management"
  title: "Knowledge Management"
  phase: "06-operations"
  status: "not_started"
  order: 12
  type: "knowledge_management"
  purpose: "Define how operational knowledge is captured, structured, versioned, validated, searched, reviewed, deprecated, archived, transferred, and protected from loss or staleness across runbooks, decisions, support knowledge, customer-facing documentation, internal notes, incident learnings, process documentation, financial knowledge, privacy/compliance knowledge, and risk knowledge."
  centralQuestion: "How is operational knowledge preserved, kept current, made discoverable, transferred across owners, protected from loss, and converted into reliable action?"
  outputs:
    canonical:
      format: "markdown"
      path: "docs/06-operations/12-knowledge-management.md"
      purpose: "Store the canonical knowledge management model as a Markdown document."
    artifacts:
      - id: "operations.knowledge_management_system"
        format: "html"
        path: "outcomes/html/06-operations/knowledge-management-system.html"
        purpose: "Provide a founder-facing knowledge management system covering knowledge objective, source taxonomy, canonical sources, runbooks, decision records, support knowledge base, internal notes, customer-facing documentation, incident knowledge, process knowledge, financial/privacy/compliance knowledge, ownership, review cadence, freshness, search, archival, transfer, metrics, risks, and downstream handoff."
        audience: "founder"
        includes:
          - "knowledge objective"
          - "knowledge principles"
          - "knowledge scope"
          - "knowledge taxonomy"
          - "canonical sources"
          - "documentation sources"
          - "source of truth rules"
          - "runbooks"
          - "decision records"
          - "support knowledge base"
          - "internal notes"
          - "customer-facing documentation"
          - "incident knowledge"
          - "process knowledge"
          - "financial knowledge"
          - "privacy and compliance knowledge"
          - "risk knowledge"
          - "documentation ownership"
          - "review cadence"
          - "freshness and staleness rules"
          - "search and discoverability"
          - "versioning and change control"
          - "knowledge transfer"
          - "archival rules"
          - "knowledge metrics"
          - "knowledge risks"
          - "downstream handoff"
        generationMode: "regenerate_from_canonical"
    agentPacks:
      - id: "operations.knowledge_management_review_prompt"
        format: "markdown"
        path: "outcomes/agents/06-operations/knowledge-management-review-prompt.md"
        purpose: "Provide compact context for agents reviewing whether operational knowledge is canonical, current, owner-assigned, searchable, versioned, reviewable, safely archived, and protected from knowledge loss or documentation rot."
        agentRole: "reviewer"
        includes:
          - "canonical knowledge management model"
          - "operations brief dependency"
          - "operating model dependency"
          - "team responsibilities dependency"
          - "customer support dependency"
          - "customer success dependency"
          - "business processes dependency"
          - "operational metrics dependency"
          - "reporting cadence dependency"
          - "incident management dependency"
          - "risk and compliance dependency"
          - "financial operations dependency"
          - "knowledge management formats"
          - "completion criteria"
          - "quality checks"
          - "review rules"
  dependsOn:
    - "01-foundation/04-principles"
    - "01-foundation/05-boundaries"
    - "01-foundation/06-success-definition"
    - "03-product/08-product-scope"
    - "03-product/10-functional-requirements"
    - "03-product/11-non-functional-requirements"
    - "03-product/13-acceptance-criteria"
    - "04-engineering/08-security-and-privacy"
    - "04-engineering/11-observability"
    - "04-engineering/13-engineering-standards"
    - "04-engineering/14-technical-risks"
    - "05-go-to-market/04-messaging"
    - "05-go-to-market/10-pricing-and-packaging"
    - "05-go-to-market/13-go-to-market-risks"
    - "06-operations/01-operations-brief"
    - "06-operations/02-operating-model"
    - "06-operations/03-team-and-responsibilities"
    - "06-operations/04-customer-support"
    - "06-operations/05-customer-success"
    - "06-operations/06-business-processes"
    - "06-operations/07-operational-metrics"
    - "06-operations/08-reporting-and-cadence"
    - "06-operations/09-incident-management"
    - "06-operations/10-risk-and-compliance"
    - "06-operations/11-financial-operations"
  feeds:
    - "06-operations/13-risk-management"
  inputs:
    - id: "operations-context"
      type: "context"
      required: false
      description: "Operations Brief, Operating Model, Team and Responsibilities, Customer Support, Customer Success, Business Processes, Operational Metrics, Reporting and Cadence, Incident Management, Risk/Compliance, and Financial Operations outputs that define operational knowledge sources and ownership."
    - id: "product-engineering-context"
      type: "context"
      required: false
      description: "Product scope, requirements, acceptance criteria, security/privacy constraints, observability, engineering standards, technical risks, release notes, runbooks, and engineering documentation expectations."
    - id: "customer-facing-context"
      type: "context"
      required: false
      description: "Messaging, pricing, support macros, customer-facing help docs, onboarding guides, known issue language, public policies, customer promises, and claim boundaries."
    - id: "risk-compliance-finance-context"
      type: "context"
      required: false
      description: "Policies, obligations, audit evidence, vendor records, accepted risks, compliance reviews, financial rules, financial evidence, and professional-review constraints."
    - id: "knowledge-management-notes"
      type: "manual_note"
      required: false
      description: "Known documentation locations, naming conventions, current knowledge gaps, stale docs, runbook ideas, decision log practices, search/discovery issues, ownership assumptions, archival preferences, and unresolved knowledge management questions."
  completionCriteria:
    - "The central question is answered through a complete knowledge management model covering capture, source-of-truth, ownership, review, freshness, search, versioning, archival, transfer, metrics, risks, and downstream handoff."
    - "Knowledge objective defines what knowledge management protects: continuity, onboarding, support accuracy, operational reliability, customer trust, decision memory, incident learning, process repeatability, compliance evidence, financial correctness, and risk reduction."
    - "Knowledge principles define how knowledge should be canonical, current, searchable, owner-assigned, versioned, concise, actionable, privacy-safe, customer-safe, and free from stale duplicate truth."
    - "Knowledge scope defines what is inside knowledge management, what belongs to Product/Engineering/GTM/Support/Finance/Compliance/Risk documents, what is customer-facing, what is internal-only, and what is explicitly out of scope."
    - "Knowledge taxonomy defines categories, sensitivity, audience, canonicality, freshness state, review state, owner state, archival state, customer-facing status, and downstream ownership."
    - "Canonical sources define where source-of-truth documents live, how conflicts are resolved, who can change them, how changes are reviewed, and how downstream artifacts are regenerated."
    - "Documentation sources identify repositories, docs folders, runbooks, dashboards, issue trackers, support tools, knowledge bases, decision records, incident archives, policy repositories, finance records, and customer-facing docs."
    - "Source of truth rules define how duplicate, derived, archived, deprecated, generated, draft, and canonical knowledge are distinguished."
    - "Runbooks define operational procedures, owner, trigger, audience, steps, prerequisites, validation, last tested date, review cadence, failure mode, and downstream document."
    - "Decision records define what decisions are recorded, format, owner, decision context, options considered, rationale, consequences, linked documents, supersession rules, and archive rules."
    - "Support knowledge base defines support-facing articles, macros, known issues, troubleshooting guides, billing/refund guidance, privacy/data request guidance, escalation guidance, owner, review cadence, and customer-safe language boundaries."
    - "Internal notes define how informal notes are captured, triaged, promoted, linked, expired, archived, or discarded without becoming a competing source of truth."
    - "Customer-facing documentation defines help center docs, FAQs, guides, onboarding materials, release notes, known issues, policy pages, pricing/refund docs, claim boundaries, review owner, and update triggers."
    - "Incident knowledge defines how incidents, postmortems, timelines, root causes, contributing factors, corrective actions, known issues, and lessons learned are preserved and reused."
    - "Process knowledge defines where business process docs, process controls, process metrics, exceptions, and process review learnings are stored and updated."
    - "Financial knowledge defines where billing rules, refund rules, invoice/receipt guidance, chargeback/dispute guidance, revenue/cost reporting caveats, financial controls, and financial evidence references are documented."
    - "Privacy and compliance knowledge defines where policies, obligations, vendor records, audit evidence references, professional-review notes, exceptions, and accepted risks are documented and restricted."
    - "Risk knowledge defines where risks, mitigations, accepted risks, incident learnings, compliance risks, financial risks, operational risks, and risk review outputs are stored and updated."
    - "Documentation ownership defines owner, backup owner, approver, reviewer, contributor, audience, review cadence, update trigger, and responsibility gap for each major knowledge category."
    - "Review cadence defines scheduled and event-triggered reviews for runbooks, support knowledge, customer-facing docs, policies, financial docs, incident archives, decision records, and risk knowledge."
    - "Freshness and staleness rules define freshness status, stale signal, expiry/review trigger, stale-content warning, owner notification, forced review, and removal/deprecation process."
    - "Search and discoverability define naming, metadata, tags, indexes, backlinks, nav structure, ownership labels, search expectations, and how users find the right source quickly."
    - "Versioning and change control define how documentation changes are proposed, reviewed, approved, versioned, linked to decisions, released, communicated, and rolled back if misleading."
    - "Knowledge transfer defines how ownership transfers, how onboarding/offboarding captures tacit knowledge, how critical knowledge is backed up, and how bus factor is reduced."
    - "Archival rules define when docs are deprecated, archived, superseded, retained, redacted, restricted, or deleted, and how archived knowledge remains discoverable without being mistaken as current."
    - "Knowledge metrics define documentation freshness, review completion, stale doc count, ownerless docs, search success, runbook test completion, decision record completeness, support KB quality, and knowledge risk signals."
    - "Knowledge risks identify documentation rot, duplicate truth, owner gaps, bus factor, tribal knowledge, stale customer-facing docs, stale support macros, missing incident learning, bad search, over-documentation, and sensitive knowledge exposure."
    - "Downstream handoff clarifies what Risk Management must inherit from Knowledge Management."
  qualityChecks:
    - "Avoid vague claims."
    - "Avoid knowledge-management theater: documentation categories without owner, source of truth, review cadence, freshness state, update trigger, discoverability rule, archival rule, and risk handling."
    - "Avoid creating duplicate sources of truth without explicit canonical/derived relationship."
    - "Avoid informal notes becoming hidden operational truth."
    - "Avoid customer-facing documentation that contradicts Product, Pricing, Support, Incident Management, Risk/Compliance, or Financial Operations."
    - "Avoid support macros and KB articles without claim boundaries, owner, review cadence, update trigger, and stale-risk warning."
    - "Avoid runbooks that are never tested, never reviewed, ownerless, or disconnected from actual operations."
    - "Avoid decision records that omit context, options considered, rationale, consequences, supersession, and linked documents."
    - "Avoid archived documentation that remains discoverable as if current."
    - "Avoid storing sensitive privacy, security, financial, customer, incident, or compliance knowledge without access and redaction rules."
    - "Prefer decision-useful statements."
    - "Make assumptions explicit."
    - "Do not invent tooling, repositories, search capability, access controls, automation, review completion, documentation coverage, or ownership certainty."
    - "Knowledge Management must preserve Foundation boundaries, product truth, technical truth, pricing truth, privacy/security constraints, customer trust, support capacity, cost discipline, and operational sustainability."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
    - "Separate source, artifact, owner, audience, sensitivity, canonicality, freshness, review cadence, update trigger, archival rule, metric, risk, and handoff."
    - "Tie knowledge rules to Operations Brief, Operating Model, Team and Responsibilities, Customer Support, Customer Success, Business Processes, Operational Metrics, Reporting and Cadence, Incident Management, Risk and Compliance, Financial Operations, Product, Engineering, GTM, or Decision Record where possible."
    - "Classify knowledge items as current, draft, canonical, derived, generated, archived, deprecated, superseded, stale, review-needed, ownerless, customer-facing, internal-only, privacy-sensitive, financial-sensitive, security-sensitive, compliance-sensitive, launch-critical, post-launch, blocked, or downstream-owned where useful."
    - "State whether knowledge is manually maintained, generated from canonical source, automatically synced, dashboard-backed, ticket-system-backed, or unavailable."
    - "Route enterprise risk governance downstream to Risk Management."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with Operations Brief, Operating Model, Team and Responsibilities, Customer Support, Customer Success, Business Processes, Operational Metrics, Reporting and Cadence, Incident Management, Risk and Compliance, Financial Operations, Product Scope, Acceptance Criteria, Security/Privacy, Pricing, GTM Risks, Technical Risks, or Decision Record."
    - "Flag knowledge sources without canonicality, owner, audience, access rule, review cadence, freshness rule, and archival rule."
    - "Flag runbooks without trigger, steps, owner, validation/test rule, last-tested expectation, review cadence, and failure mode."
    - "Flag decision records without context, options, rationale, consequences, supersession rule, and linked documents."
    - "Flag customer-facing docs without owner, claim boundary, update trigger, approval/review rule, and stale-content risk."
    - "Flag support KB/macros without support owner, source-of-truth link, review cadence, and escalation/update trigger."
    - "Flag sensitive knowledge without access, redaction, retention, and downstream ownership rules."
    - "Flag stale, duplicate, ownerless, or archived docs that could mislead operations."
    - "Verify that Risk Management receives concrete knowledge-risk handoff inputs."
  specializedFormats:
    knowledgeSourceFormat:
      description: "Recommended format for operational knowledge sources."
      fields:
        - source
        - sourceType
        - purpose
        - canonicality
        - audience
        - sensitivity
        - owner
        - backupOwner
        - accessRule
        - updateTrigger
        - reviewCadence
        - freshnessStatus
        - archivalRule
        - downstreamDocument
        - status
    runbookFormat:
      description: "Recommended format for operational runbooks."
      fields:
        - runbook
        - procedureType
        - purpose
        - trigger
        - audience
        - owner
        - backupOwner
        - prerequisites
        - stepsReference
        - validationMethod
        - lastTestedOrReviewStatus
        - failureMode
        - escalationPath
        - reviewCadence
        - status
    decisionRecordFormat:
      description: "Recommended format for operational decision records."
      fields:
        - decision
        - decisionType
        - dateOrTrigger
        - owner
        - context
        - optionsConsidered
        - decisionMade
        - rationale
        - consequences
        - linkedDocuments
        - supersededBy
        - archiveRule
        - status
    knowledgeArticleFormat:
      description: "Recommended format for support/customer-facing knowledge articles."
      fields:
        - article
        - articleType
        - audience
        - sourceOfTruth
        - owner
        - reviewer
        - claimBoundary
        - lastReviewed
        - updateTrigger
        - staleRisk
        - customerFacing
        - accessRule
        - status
    documentationOwnershipFormat:
      description: "Recommended format for documentation ownership."
      fields:
        - knowledgeArea
        - owner
        - backupOwner
        - approver
        - contributors
        - audience
        - reviewCadence
        - updateTrigger
        - responsibilityGap
        - downstreamDocument
        - status
    freshnessRuleFormat:
      description: "Recommended format for freshness and staleness rules."
      fields:
        - knowledgeType
        - freshnessRequirement
        - staleSignal
        - reviewTrigger
        - warningLabel
        - ownerNotification
        - forcedReviewRule
        - deprecationRule
        - status
    searchDiscoveryFormat:
      description: "Recommended format for search and discoverability rules."
      fields:
        - knowledgeArea
        - namingConvention
        - metadataRequired
        - tagsOrIndex
        - navigationLocation
        - backlinkRule
        - searchExpectation
        - ownerLabelRequired
