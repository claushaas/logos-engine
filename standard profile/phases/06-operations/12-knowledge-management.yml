      description: "Recommended format for downstream knowledge handoffs."
      fields:
        - handoffTarget
        - knowledgeContext
        - sourcesToPreserve
        - risksToPreserve
        - ownersToPreserve
        - requiredAction
        - timing
        - unresolvedQuestion
        - status
  sections:
    - id: "knowledge-objective"
      title: "Knowledge Objective"
      intent: "Define the goal of operational knowledge management and the consequences of knowledge loss, staleness, duplication, or poor discoverability."
      required: true
      outputGuidance:
        - "Open with the knowledge management purpose in one concise paragraph."
        - "State what knowledge management protects: continuity, onboarding, support accuracy, operational reliability, customer trust, decision memory, incident learning, process repeatability, compliance evidence, financial correctness, and risk reduction."
        - "Explain consequences of lost, stale, duplicated, or undiscoverable knowledge."
      qualityChecks:
        - "Objective connects knowledge to operational action."
        - "Knowledge loss consequences are concrete."
        - "Knowledge management is not treated as documentation volume."
      questions:
        - "What is the goal of operational knowledge management?"
        - "What happens if operational knowledge is lost, stale, duplicated, or hard to find?"
        - "What decisions and workflows depend on reliable knowledge?"
    - id: "knowledge-principles"
      title: "Knowledge Principles"
      intent: "Define the rules that keep knowledge useful, accurate, safe, concise, current, and actionable."
      required: true
      outputGuidance:
        - "Define principles for canonical sources, freshness, ownership, discoverability, sensitivity, review, and actionability."
        - "State what knowledge management must avoid."
        - "Tie principles to Foundation and Operations."
      qualityChecks:
        - "Principles are actionable."
        - "Duplicate truth and stale knowledge are explicitly discouraged."
        - "Sensitive knowledge handling is included."
      questions:
        - "What principles guide operational documentation and knowledge?"
        - "How is duplicate truth avoided?"
        - "How should knowledge remain current, searchable, and actionable?"
        - "How is sensitive knowledge protected?"
    - id: "knowledge-scope"
      title: "Knowledge Scope"
      intent: "Define what knowledge management covers and what remains owned by other operational documents or systems."
      required: true
      outputGuidance:
        - "Separate in-scope, out-of-scope, shared, downstream-owned, customer-facing, internal-only, and sensitive areas."
        - "Clarify relationship with Support, Customer Success, Business Processes, Incident Management, Risk/Compliance, Financial Operations, Product, and Engineering."
        - "Preserve unresolved scope questions."
      qualityChecks:
        - "Scope prevents ownership ambiguity."
        - "Customer-facing and internal knowledge are distinguished."
        - "Sensitive knowledge is routed carefully."
      questions:
        - "What types of operational knowledge are in scope?"
        - "What knowledge belongs to Product, Engineering, Support, Finance, Compliance, or Risk instead?"
        - "What is customer-facing versus internal-only?"
        - "What knowledge requires restricted access?"
    - id: "knowledge-taxonomy"
      title: "Knowledge Taxonomy"
      intent: "Define categories, statuses, audiences, sensitivities, canonicality, freshness, and archival labels for operational knowledge."
      required: true
      outputGuidance:
        - "Define knowledge categories and statuses."
        - "Include canonical, derived, generated, draft, current, stale, review-needed, archived, deprecated, superseded, ownerless, and restricted labels."
        - "Define audience and sensitivity classes."
      qualityChecks:
        - "Taxonomy helps search, review, and ownership."
        - "Canonical and derived knowledge are distinguishable."
        - "Sensitivity labels are operationally meaningful."
      questions:
        - "How is operational knowledge categorized?"
        - "What statuses indicate current, stale, archived, deprecated, or superseded knowledge?"
        - "What audience and sensitivity labels are used?"
    - id: "canonical-sources"
      title: "Canonical Sources"
      intent: "Define the authoritative sources of truth and how conflicts between sources are resolved."
      required: true
      outputGuidance:
        - "Use knowledge source records for canonical sources."
        - "Define conflict resolution rules."
        - "State how derived artifacts are regenerated from canonical sources."
      qualityChecks:
        - "Canonical sources are explicit."
        - "Conflicts have resolution path."
        - "Generated/derived artifacts do not become competing truth."
      questions:
        - "What are the canonical sources of truth?"
        - "How are conflicts between documents resolved?"
        - "Who may change canonical sources?"
        - "How are derived artifacts regenerated from canonical sources?"
    - id: "documentation-sources"
      title: "Documentation Sources"
      intent: "Identify all operational documentation sources and how they are synchronized, linked, and reviewed."
      required: true
      outputGuidance:
        - "Use knowledge source records."
        - "Include repositories, docs folders, runbooks, dashboards, issue trackers, support tools, knowledge bases, decision logs, incident archives, policies, financial records, and customer-facing docs."
        - "Mark current, missing, unknown, or deferred sources."
      qualityChecks:
        - "Sources have owner, audience, canonicality, and review rules."
        - "Synchronization rules are explicit."
        - "Unknown or missing sources are visible."
      questions:
        - "What are the primary sources of operational documentation?"
        - "Where does each source live?"
        - "How are documentation sources kept synchronized?"
        - "Which sources are canonical versus derived?"
    - id: "source-of-truth-rules"
      title: "Source of Truth Rules"
      intent: "Define how duplicate, derived, archived, deprecated, generated, draft, and canonical knowledge are distinguished and reconciled."
      required: true
      outputGuidance:
        - "Define source precedence rules."
        - "Define how stale or conflicting docs are flagged."
        - "Define how customer-facing docs inherit from internal canonical sources."
      qualityChecks:
        - "Rules prevent duplicate truth."
        - "Archived/deprecated docs cannot masquerade as current."
        - "Customer-facing truth aligns with internal canonical docs."
      questions:
        - "What makes a source authoritative?"
        - "How are duplicates and conflicts handled?"
        - "How are drafts, generated files, archived docs, and canonical docs distinguished?"
        - "How do customer-facing docs inherit from internal sources?"
    - id: "runbooks"
      title: "Runbooks"
      intent: "Define operational runbooks for common procedures and how they are tested, maintained, improved, and escalated."
      required: true
      outputGuidance:
        - "Use runbook records."
        - "Include trigger, owner, prerequisites, steps reference, validation, last tested/review status, failure mode, escalation, and review cadence."
        - "Tie runbooks to Business Processes, Incident Management, Release Management, Data/Privacy, and Financial Operations where relevant."
      qualityChecks:
        - "Runbooks are executable."
        - "Runbooks have owner and validation."
        - "Untested runbooks are flagged."
      questions:
        - "What runbooks exist for common operational procedures?"
        - "What triggers each runbook?"
        - "Who owns each runbook?"
        - "How are runbooks tested, maintained, and improved?"
        - "What happens if a runbook fails?"
    - id: "decision-records"
      title: "Decision Records"
      intent: "Define how operational decisions are recorded, linked, superseded, archived, and used later."
      required: true
      outputGuidance:
        - "Use decision record records."
        - "Include context, options, decision, rationale, consequences, linked documents, supersession, and archive rule."
        - "State which decisions require records."
      qualityChecks:
        - "Decision records preserve reasoning and consequences."
        - "Superseded decisions remain traceable."
        - "Decision records link to affected docs."
      questions:
        - "How are operational decisions recorded and archived?"
        - "What decisions require decision records?"
        - "What format is used for decision records?"
        - "How are decisions superseded or linked to later changes?"
    - id: "support-knowledge-base"
      title: "Support Knowledge Base"
      intent: "Define the internal support knowledge base and how support knowledge stays accurate, safe, current, and linked to canonical sources."
      required: true
      outputGuidance:
        - "Use knowledge article records."
        - "Include support articles, macros, troubleshooting, known issues, billing/refund guidance, privacy request guidance, escalation guidance, and claim boundaries."
        - "Tie to Customer Support."
      qualityChecks:
        - "Support KB has source-of-truth links."
        - "Macros and guidance have claim boundaries."
        - "Stale support knowledge has update triggers."
      questions:
        - "What internal knowledge base exists for support staff?"
        - "What support macros, known issues, troubleshooting guides, and escalation docs exist?"
        - "How is the knowledge base kept current?"
        - "How does support knowledge link to canonical product/pricing/privacy/incident sources?"
    - id: "internal-notes"
      title: "Internal Notes"
      intent: "Define how informal operational notes are captured, organized, triaged, promoted, expired, archived, or discarded."
      required: true
      outputGuidance:
        - "Define note capture channels and promotion rules."
        - "Separate notes from formal docs."
        - "Define expiry and cleanup behavior."
      qualityChecks:
        - "Notes cannot become hidden source of truth."
        - "Useful notes have promotion path."
        - "Stale notes are cleaned up or archived."
      questions:
        - "How are internal operational notes captured and organized?"
        - "What distinguishes a note from formal documentation?"
        - "How are notes promoted into canonical docs?"
        - "When are notes expired, archived, or discarded?"
    - id: "customer-facing-documentation"
      title: "Customer-Facing Documentation"
      intent: "Define customer-facing documentation and how it is approved, maintained, updated, corrected, and aligned with internal truth."
      required: true
      outputGuidance:
        - "Use knowledge article records."
        - "Include help center docs, FAQs, guides, onboarding materials, release notes, known issues, policy pages, pricing/refund docs, and customer-safe language boundaries."
        - "Tie to Messaging, Pricing, Support, Risk/Compliance, and Product truth."
      qualityChecks:
        - "Customer-facing docs do not overpromise."
        - "Claim boundaries and approval are explicit."
        - "Update triggers are tied to product/pricing/policy/release changes."
      questions:
        - "What customer-facing documentation exists?"
        - "Who owns approval and updates?"
        - "How is customer-facing documentation maintained and updated?"
        - "How are claim boundaries and stale content handled?"
    - id: "incident-knowledge"
      title: "Incident Knowledge"
      intent: "Define how incidents, postmortems, corrective actions, known issues, and lessons learned are preserved and reused."
      required: true
      outputGuidance:
        - "Tie to Incident Management."
        - "Define archive, search, access, redaction, linked actions, and review cadence."
        - "State how incident lessons update runbooks, support KB, risk records, and process docs."
      qualityChecks:
        - "Incident learning is reusable."
        - "Sensitive incident knowledge is restricted/redacted."
        - "Corrective action knowledge feeds downstream docs."
      questions:
        - "How are incident records and postmortems preserved?"
        - "How are lessons learned reused?"
        - "How do incidents update runbooks, support knowledge, risk records, and process docs?"
        - "How is sensitive incident information protected?"
    - id: "process-knowledge"
      title: "Process Knowledge"
      intent: "Define where process documentation, controls, exceptions, metrics, and improvement learnings are stored and maintained."
      required: true
      outputGuidance:
        - "Tie to Business Processes."
        - "Define process doc owner, update trigger, review cadence, and relation to runbooks."
        - "Include process controls and exceptions."
