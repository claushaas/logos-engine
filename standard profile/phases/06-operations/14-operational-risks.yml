document:
  id: "14-operational-risks"
  title: "Operational Risks"
  phase: "06-operations"
  status: "not_started"
  purpose: "Maintain the operational risk register identifying what can break the operation."
  centralQuestion: "What can break the operation?"
  sections:
    - id: "risk-register"
      title: "Risk Register"
      questions:
        - "What is the complete inventory of operational risks?"
        - "How are risks identified, assessed, and updated?"
    - id: "support-risks"
      title: "Support Risks"
      questions:
        - "What risks could degrade or break the support function?"
        - "What mitigations are in place for support risks?"
    - id: "reliability-risks"
      title: "Reliability Risks"
      questions:
        - "What risks threaten product reliability and availability?"
        - "What mitigations are in place for reliability risks?"
    - id: "financial-risks"
      title: "Financial Risks"
      questions:
        - "What risks threaten financial operations (billing errors, payment failures)?"
        - "What mitigations are in place for financial risks?"
    - id: "compliance-risks"
      title: "Compliance Risks"
      questions:
        - "What risks threaten regulatory or contractual compliance?"
        - "What mitigations are in place for compliance risks?"
    - id: "vendor-risks"
      title: "Vendor Risks"
      questions:
        - "What risks arise from third-party vendor dependencies?"
        - "What mitigations are in place for vendor risks?"
    - id: "team-risks"
      title: "Team Risks"
      questions:
        - "What risks arise from team composition, capacity, or knowledge gaps?"
        - "What mitigations are in place for team risks?"
    - id: "process-risks"
      title: "Process Risks"
      questions:
        - "What risks arise from process failures or gaps?"
        - "What mitigations are in place for process risks?"
    - id: "customer-success-risks"
      title: "Customer Success Risks"
      questions:
        - "What risks threaten the customer success function?"
        - "What mitigations are in place for customer success risks?"
    - id: "knowledge-risks"
      title: "Knowledge Risks"
      questions:
        - "What risks arise from knowledge loss or documentation gaps?"
        - "What mitigations are in place for knowledge risks?"
    - id: "mitigation-plan"
      title: "Mitigation Plan"
      questions:
        - "What is the overall plan for mitigating operational risks?"
        - "How are mitigation actions tracked and verified?"
