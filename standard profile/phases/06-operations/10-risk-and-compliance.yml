
document:
  id: "10-risk-and-compliance"
  title: "Risk and Compliance"
  phase: "06-operations"
  status: "not_started"
  order: 10
  type: "risk_compliance"
  purpose: "Define how operational, regulatory, legal, contractual, policy, vendor, audit, governance, privacy, security, financial, and compliance-related risks are identified, classified, reviewed, assigned, mitigated, accepted, escalated, documented, and handed off without pretending that operational documentation replaces professional legal, accounting, security, or compliance review."
  centralQuestion: "What operational, regulatory, legal, contractual, policy, vendor, audit, governance, privacy, security, financial, and compliance risks can affect the project, and how are they detected, reviewed, assigned, mitigated, accepted, escalated, evidenced, and kept current?"
  outputs:
    canonical:
      format: "markdown"
      path: "docs/06-operations/10-risk-and-compliance.md"
      purpose: "Store the canonical risk and compliance operating model as a Markdown document."
    artifacts:
      - id: "operations.risk_compliance_register"
        format: "html"
        path: "outcomes/html/06-operations/risk-and-compliance-register.html"
        purpose: "Provide a founder-facing risk and compliance register covering scope, obligation inventory, risk taxonomy, privacy/data protection, terms and policies, vendor compliance, contractual obligations, audit trail, governance, exceptions, accepted risks, review cadence, compliance incidents, evidence, risks, and downstream handoff."
        audience: "founder"
        includes:
          - "risk and compliance objective"
          - "compliance disclaimer"
          - "risk and compliance scope"
          - "risk taxonomy"
          - "obligation inventory"
          - "legal and regulatory requirements"
          - "privacy requirements"
          - "data protection requirements"
          - "security compliance interface"
          - "financial compliance interface"
          - "terms and policies"
          - "vendor compliance"
          - "contractual obligations"
          - "audit trail"
          - "governance rules"
          - "exception handling"
          - "accepted risks"
          - "compliance review cadence"
          - "compliance evidence"
          - "compliance incidents"
          - "compliance metrics"
          - "compliance risks"
          - "downstream handoff"
        generationMode: "regenerate_from_canonical"
    agentPacks:
      - id: "operations.risk_compliance_review_prompt"
        format: "markdown"
        path: "outcomes/agents/06-operations/risk-and-compliance-review-prompt.md"
        purpose: "Provide compact context for agents reviewing whether risk and compliance operations are scoped, owner-assigned, review-aware, evidence-backed, escalation-ready, and not overclaiming legal, accounting, security, privacy, or regulatory certainty."
        agentRole: "reviewer"
        includes:
          - "canonical risk and compliance model"
          - "operations brief dependency"
          - "operating model dependency"
          - "team responsibilities dependency"
          - "business processes dependency"
          - "operational metrics dependency"
          - "reporting cadence dependency"
          - "incident management dependency"
          - "security/privacy dependency"
          - "pricing/financial dependency"
          - "risk and compliance formats"
          - "completion criteria"
          - "quality checks"
          - "review rules"
  dependsOn:
    - "01-foundation/04-principles"
    - "01-foundation/05-boundaries"
    - "01-foundation/06-success-definition"
    - "03-product/08-product-scope"
    - "03-product/10-functional-requirements"
    - "03-product/11-non-functional-requirements"
    - "03-product/13-acceptance-criteria"
    - "04-engineering/05-data-model"
    - "04-engineering/08-security-and-privacy"
    - "04-engineering/11-observability"
    - "04-engineering/12-deployment-and-environments"
    - "04-engineering/14-technical-risks"
    - "05-go-to-market/07-launch-plan"
    - "05-go-to-market/10-pricing-and-packaging"
    - "05-go-to-market/12-growth-metrics"
    - "05-go-to-market/13-go-to-market-risks"
    - "06-operations/01-operations-brief"
    - "06-operations/02-operating-model"
    - "06-operations/03-team-and-responsibilities"
    - "06-operations/04-customer-support"
    - "06-operations/05-customer-success"
    - "06-operations/06-business-processes"
    - "06-operations/07-operational-metrics"
    - "06-operations/08-reporting-and-cadence"
    - "06-operations/09-incident-management"
  feeds:
    - "06-operations/11-data-and-privacy-operations"
    - "06-operations/12-financial-operations"
    - "06-operations/13-risk-management"
  inputs:
    - id: "foundation-context"
      type: "context"
      required: false
      description: "Principles, boundaries, success definition, non-goals, ethical constraints, data rights commitments, and governance expectations."
    - id: "product-context"
      type: "context"
      required: false
      description: "Product scope, capabilities, customer-facing promises, acceptance criteria, data collection, data processing, sensitive workflows, and deferred or unsupported capabilities."
    - id: "engineering-security-context"
      type: "context"
      required: false
      description: "Data model, security/privacy model, observability, deployment environments, access controls, logging, telemetry, technical risks, security obligations, and engineering-owned safeguards."
    - id: "gtm-financial-context"
      type: "context"
      required: false
      description: "Launch promises, pricing and packaging, payment flow, billing terms, refund/cancellation policy, growth metrics, GTM risks, public claims, and financial/legal review needs."
    - id: "operations-context"
      type: "context"
      required: false
      description: "Operations Brief, Operating Model, Team and Responsibilities, Customer Support, Customer Success, Business Processes, Operational Metrics, Reporting and Cadence, and Incident Management outputs."
    - id: "vendor-contract-context"
      type: "context"
      required: false
      description: "Known vendors, processors, platforms, infrastructure providers, analytics tools, support tools, contracts, terms, DPAs, invoices, account ownership, and renewal/review obligations."
    - id: "risk-compliance-notes"
      type: "manual_note"
      required: false
      description: "Known legal/regulatory concerns, compliance assumptions, policy drafts, contractual constraints, vendor due diligence notes, accepted risk candidates, audit needs, governance concerns, and unresolved compliance questions."
  completionCriteria:
    - "The central question is answered through a risk and compliance operating model with scope, taxonomy, obligation inventory, owners, evidence, review cadence, exceptions, accepted risks, incidents, metrics, risks, and downstream handoff."
    - "Risk and compliance objective defines what the function protects: legal/regulatory awareness, contractual discipline, policy consistency, customer trust, data/privacy safety, security interface, financial correctness, vendor accountability, governance, auditability, and operational continuity."
    - "Compliance disclaimer states that this document is an operational control surface and does not replace professional legal, accounting, security, tax, privacy, or compliance review."
    - "Risk and compliance scope defines what is inside this document, what belongs to Engineering Security/Privacy, Data and Privacy Operations, Financial Operations, Incident Management, Risk Management, Customer Support, and Product, and what is explicitly out of scope."
    - "Risk taxonomy defines categories, severity, likelihood, impact, confidence, review-needed labels, evidence states, obligation states, exception states, accepted-risk states, escalation levels, and downstream ownership."
    - "Obligation inventory lists each known or suspected obligation with source, jurisdiction/scope when known, affected area, owner, reviewer, evidence, review cadence, status, professional-review need, and downstream document."
    - "Legal and regulatory requirements identify known obligations, suspected obligations, unknowns, review-needed items, monitoring source, owner, external review need, customer-facing impact, and operational controls."
    - "Privacy requirements identify applicable or potentially applicable privacy obligations, data subject/customer rights, consent/notice requirements, lawful-basis or equivalent review needs, privacy request handling, notification uncertainty, and Data/Privacy Operations handoff."
    - "Data protection requirements define classification, access, retention, deletion, export, backup, logging, telemetry, data minimization, audit trail, and verification requirements that must be operationalized downstream."
    - "Security compliance interface defines the boundary between compliance operations and engineering security controls, including access reviews, security policies, incident escalation, vendor security review, audit evidence, and technical-control ownership."
    - "Financial compliance interface defines operational obligations around billing, payments, refunds, invoices/receipts, taxes, chargebacks, subscription terms, discounts, accounting review, and Financial Operations handoff."
    - "Terms and policies define required public or internal policies, owner, source assumptions, approval requirement, review cadence, publication location, customer-facing impact, update trigger, and legal review state."
    - "Vendor compliance defines vendor inventory, vendor criticality, data touched, compliance/security/privacy review, DPA/contract needs, access/billing owner, renewal cadence, monitoring method, fallback, and offboarding."
    - "Contractual obligations define contracts, customer commitments, vendor commitments, platform obligations, payment processor terms, open-source/license obligations, support commitments, renewal/termination terms, and tracking owner."
    - "Audit trail defines which actions, decisions, approvals, incidents, data requests, financial exceptions, policy changes, vendor reviews, accepted risks, and compliance reviews are recorded, protected, reviewed, retained, and redacted."
    - "Governance rules define decision rules, approval authority, policy-change authority, exception authority, risk-acceptance authority, review requirements, violation handling, and decision log requirements."
    - "Exception handling defines how compliance exceptions are requested, reviewed, approved, time-boxed, documented, monitored, escalated, renewed, or closed."
    - "Accepted risks define intentionally accepted legal/compliance/contractual/vendor/governance risks with rationale, approver, residual risk, mitigation still required, review trigger, expiration, and downstream owner."
    - "Compliance review cadence defines daily/weekly/monthly/quarterly/annual/event-triggered reviews where relevant, participants, inputs, outputs, evidence, escalation triggers, and downstream updates."
    - "Compliance evidence defines what evidence is required, where it is stored, who owns it, access rules, retention rules, review cadence, redaction rules, and what evidence proves control operation."
    - "Compliance incidents define incidents involving privacy, security, billing/payment, contractual breach, vendor failure, policy violation, audit failure, governance violation, or regulatory concern and route them to Incident Management/Data Privacy/Finance/Risk as needed."
    - "Compliance metrics define obligation coverage, review completion, exception count, accepted-risk count, vendor review freshness, policy freshness, audit evidence completeness, access review completion, privacy request handling, financial exception rate, and incident trend."
    - "Compliance risks identify missing obligations, unsupported legal assumptions, stale policies, vendor noncompliance, weak audit trail, unresolved contracts, privacy mishandling, financial compliance gaps, governance drift, owner gaps, and review failure."
    - "Downstream handoff clarifies what Data and Privacy Operations, Financial Operations, and Risk Management must inherit."
  qualityChecks:
    - "Avoid vague claims."
    - "Avoid compliance theater: naming regulations, frameworks, or policies without applicability status, source, owner, evidence, review cadence, operational control, professional-review need, and downstream handoff."
    - "Avoid asserting legal, tax, accounting, regulatory, privacy, security, or contractual compliance as final unless verified by appropriate professional review."
    - "Avoid using GDPR, LGPD, CCPA, SOC 2, ISO 27001, HIPAA, PCI, tax, employment, consumer protection, or accessibility claims as generic checkboxes without applicability analysis."
    - "Avoid treating security compliance as purely legal or privacy compliance as purely engineering."
    - "Avoid public terms/policies that promise capabilities, rights, timelines, refunds, support, uptime, deletion, export, or security controls the operation cannot sustain."
    - "Avoid vendor compliance without data touched, access, DPA/contract needs, security/privacy review, billing owner, monitoring, fallback, and offboarding."
    - "Avoid audit trail requirements without storage, protection, access, retention, redaction, review, and evidence owner."
    - "Avoid accepted risks without approver, residual risk, mitigation, review trigger, expiration, and escalation rule."
    - "Avoid compliance reviews without cadence, participants, inputs, outputs, evidence, escalation, and documentation update."
    - "Prefer decision-useful statements."
    - "Make assumptions explicit."
    - "Do not invent applicable laws, jurisdictions, professional conclusions, certification status, vendor compliance status, tax obligations, legal deadlines, contractual duties, audit-readiness, or policy sufficiency."
    - "Risk and compliance must preserve Foundation boundaries, product truth, technical truth, pricing truth, privacy/security constraints, customer trust, support capacity, cost discipline, and operational sustainability."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
    - "Separate obligation, risk, policy, vendor, contract, audit evidence, governance rule, exception, accepted risk, incident, metric, review cadence, and handoff."
    - "Tie compliance and risk claims to Foundation, Product, Security/Privacy, Data Model, Observability, Deployment, Technical Risks, Pricing, GTM Risks, Operations Brief, Operating Model, Team Responsibilities, Business Processes, Operational Metrics, Reporting Cadence, Incident Management, or Decision Record where possible."
    - "Classify items as applicable, potentially-applicable, not-applicable, unknown, current, required, deferred, blocked, review-needed, professional-review-needed, customer-facing, internal-only, privacy-sensitive, financial-sensitive, security-sensitive, contractual, vendor-owned, accepted-risk, or downstream-owned where useful."
    - "State whether each obligation or control is verified, assumed, suspected, unverified, professionally reviewed, or review-needed."
    - "Route detailed privacy procedures, financial procedures, incident procedures, and enterprise risk governance downstream."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with Foundation, Product, Acceptance Criteria, NFRs, Data Model, Security/Privacy, Observability, Deployment, Technical Risks, Launch Plan, Pricing, GTM Risks, Operations Brief, Operating Model, Team and Responsibilities, Business Processes, Operational Metrics, Reporting and Cadence, Incident Management, or Decision Record."
    - "Flag obligations without source, applicability status, owner, evidence, review cadence, operational control, professional-review need, and downstream target."
    - "Flag legal/regulatory/privacy/security/financial claims that sound final but are not marked reviewed or review-needed."
    - "Flag policies without owner, approval requirement, publication location, update trigger, review cadence, and claim-boundary review."
    - "Flag vendors without criticality, data touched, compliance/security/privacy review, contract/DPA state, access/billing owner, monitoring, fallback, and offboarding path."
    - "Flag contracts without obligation owner, renewal/termination tracking, customer/vendor commitments, and evidence."
    - "Flag audit trails without storage, access control, retention, redaction, review, and evidence owner."
    - "Flag exceptions and accepted risks without approver, expiration/review trigger, mitigation, residual risk, and escalation path."
    - "Verify that downstream Operations documents receive concrete compliance/risk handoff inputs."
    - "Flag content that belongs better in Data and Privacy Operations, Financial Operations, or Risk Management."
