  sections:
    - id: "risk-and-compliance-objective"
      title: "Risk and Compliance Objective"
      intent: "Define why operational risk and compliance management exists and what it protects."
      required: true
      outputGuidance:
        - "Open with the purpose of risk and compliance operations in one concise paragraph."
        - "State what it protects: trust, legal/regulatory awareness, policy consistency, data/privacy safety, financial correctness, vendor accountability, governance, evidence, and continuity."
        - "Clarify that the document manages operational controls and does not provide legal/accounting advice."
      qualityChecks:
        - "Objective is operational, not legalistic theater."
        - "The professional-review boundary is explicit."
        - "Objective connects to downstream Data/Privacy, Finance, and Risk Management."
      questions:
        - "Why does this risk and compliance document exist?"
        - "What operational outcomes does it protect?"
        - "What does it not replace?"
    - id: "compliance-disclaimer"
      title: "Compliance Disclaimer"
      intent: "State the boundary between operational documentation and professional legal, accounting, security, privacy, tax, or compliance review."
      required: true
      outputGuidance:
        - "State that this document identifies operational obligations, assumptions, evidence, and review needs."
        - "State that professional review is required where legal, tax, accounting, security, privacy, regulatory, or contractual conclusions are uncertain."
        - "Prohibit treating unreviewed assumptions as compliance facts."
      qualityChecks:
        - "Disclaimer prevents false certainty."
        - "Review-needed assumptions remain visible."
        - "The document remains operationally useful."
      questions:
        - "What professional review boundaries apply?"
        - "Which conclusions must not be treated as final without review?"
        - "How are unreviewed assumptions labeled?"
    - id: "risk-and-compliance-scope"
      title: "Risk and Compliance Scope"
      intent: "Define what this document covers and what belongs in downstream Operations documents."
      required: true
      outputGuidance:
        - "Separate in-scope, out-of-scope, shared, downstream-owned, and professional-review-needed areas."
        - "Clarify relationship with Engineering Security, Data/Privacy Operations, Financial Operations, Incident Management, and Risk Management."
        - "Preserve unresolved scope questions."
      qualityChecks:
        - "Scope prevents duplication and gaps."
        - "Downstream ownership is clear."
        - "Professional-review-needed areas are visible."
      questions:
        - "What risk and compliance areas are covered here?"
        - "What belongs to Engineering Security or Data/Privacy Operations instead?"
        - "What belongs to Financial Operations, Incident Management, or Risk Management?"
        - "What is explicitly out of scope?"
    - id: "risk-taxonomy"
      title: "Risk Taxonomy"
      intent: "Define how risks, obligations, controls, evidence, exceptions, accepted risks, and review-needed items are classified."
      required: true
      outputGuidance:
        - "Define categories, likelihood, impact, confidence, evidence state, obligation state, exception state, accepted-risk state, review-needed state, and escalation level."
        - "Define labels for applicable, potentially-applicable, not-applicable, unknown, verified, assumed, review-needed, and professional-review-needed."
        - "Include downstream ownership labels."
      qualityChecks:
        - "Taxonomy prevents false certainty."
        - "Unknown and review-needed states are first-class."
        - "Risk labels support decisions and escalation."
      questions:
        - "How are compliance and governance risks classified?"
        - "What applicability, evidence, review, exception, and acceptance statuses exist?"
        - "How are severity and escalation determined?"
    - id: "obligation-inventory"
      title: "Obligation Inventory"
      intent: "List known, suspected, unknown, applicable, potentially applicable, and not applicable obligations with source, owner, evidence, review cadence, and downstream target."
      required: true
      outputGuidance:
        - "Use obligation records."
        - "Include legal, regulatory, contractual, privacy, data protection, financial, vendor, platform, policy, audit, and governance obligations."
        - "Mark unknown and review-needed obligations explicitly."
      qualityChecks:
        - "Obligations are not merely named; each has source, applicability, owner, evidence, and review cadence."
        - "Unknowns are not hidden."
        - "Professional-review needs are explicit."
      questions:
        - "What known or suspected obligations apply?"
        - "What obligations are potentially applicable or unknown?"
        - "What is the source of each obligation?"
        - "Who owns each obligation?"
        - "What evidence proves the obligation is being handled?"
        - "What requires professional review?"
    - id: "legal-and-regulatory-requirements"
      title: "Legal and Regulatory Requirements"
      intent: "Identify legal/regulatory obligations and how they are monitored, reviewed, operationalized, and escalated."
      required: true
      outputGuidance:
        - "Use obligation records for material legal/regulatory requirements."
        - "Separate known obligations from assumptions and unknowns."
        - "State monitoring source and review owner."
      qualityChecks:
        - "Legal/regulatory claims do not exceed evidence."
        - "Monitoring and update process are explicit."
        - "Professional review is marked where needed."
      questions:
        - "What legal or regulatory obligations does the project have or potentially have?"
        - "What obligations are unknown or require review?"
        - "How are legal/regulatory changes monitored?"
        - "Who owns review and operationalization?"
    - id: "privacy-requirements"
      title: "Privacy Requirements"
      intent: "Identify privacy obligations and how they are routed into Data and Privacy Operations without overclaiming compliance."
      required: true
      outputGuidance:
        - "Use obligation records for privacy obligations."
        - "Include notice, consent, rights requests, lawful basis or equivalent review, data subject/customer rights, deletion/export/correction, notification uncertainty, and privacy incident escalation."
        - "Mark jurisdiction and applicability uncertainty."
      qualityChecks:
        - "Privacy requirements are not reduced to a privacy policy."
        - "Data rights and request handling are operationalized downstream."
        - "Jurisdictional uncertainty is explicit."
      questions:
        - "What privacy obligations may apply?"
        - "What customer/data subject rights must be supported or reviewed?"
        - "What privacy notices, consent, or lawful-basis/equivalent questions exist?"
        - "What should Data and Privacy Operations inherit?"
    - id: "data-protection-requirements"
      title: "Data Protection Requirements"
      intent: "Define operational data protection obligations around classification, access, retention, deletion, export, backup, logs, telemetry, and minimization."
      required: true
      outputGuidance:
        - "Use obligation or control records where useful."
        - "Tie to Data Model and Security/Privacy."
        - "Route detailed execution to Data and Privacy Operations."
      qualityChecks:
        - "Data protection requirements are operational, not only policy-level."
        - "Access, retention, deletion, export, backup, logs, and telemetry are included."
        - "Verification/evidence is defined."
      questions:
        - "What data protection obligations exist?"
        - "How are data classification, access, retention, deletion, export, backup, logs, telemetry, and minimization handled?"
        - "How is data protection compliance verified?"
    - id: "security-compliance-interface"
      title: "Security Compliance Interface"
      intent: "Define the boundary between compliance operations and engineering-owned security controls."
      required: true
      outputGuidance:
        - "Identify security controls that produce compliance evidence."
        - "Define who owns policy/evidence versus implementation."
        - "Route technical controls to Engineering Security/Privacy and incident handling to Incident Management/Data Privacy where relevant."
      qualityChecks:
        - "Security compliance is not treated as legal paperwork only."
        - "Technical-control ownership is explicit."
        - "Evidence and review cadence are included."
      questions:
        - "Which security controls have compliance relevance?"
        - "Who owns security implementation versus compliance evidence?"
        - "How are access reviews, security incidents, vendor security review, and audit evidence handled?"
    - id: "financial-compliance-interface"
      title: "Financial Compliance Interface"
      intent: "Define the boundary between compliance operations and financial operations."
      required: true
      outputGuidance:
        - "Identify billing, payment, refund, invoice, tax, chargeback, subscription, discount, and accounting review obligations."
        - "Mark tax/accounting/legal assumptions as review-needed unless verified."
        - "Route detailed execution to Financial Operations."
      qualityChecks:
        - "Financial compliance does not invent tax/accounting conclusions."
        - "Customer-facing financial commitments are checked against Pricing."
        - "Financial Operations handoff is concrete."
      questions:
        - "What billing, payment, refund, invoice, tax, chargeback, subscription, discount, or accounting obligations may apply?"
        - "What requires accounting/legal review?"
        - "What should Financial Operations inherit?"
    - id: "terms-and-policies"
      title: "Terms and Policies"
      intent: "Define published and internal policies, their owners, approval needs, review cadence, update triggers, and claim boundaries."
      required: true
      outputGuidance:
        - "Use policy records."
        - "Include terms of service, privacy policy, refund policy, cancellation policy, acceptable use, support policy, security statement, cookie/tracking notice, community policy, vendor policy, and internal governance policies where relevant."
        - "Mark policies as required, deferred, professional-review-needed, or not applicable."
      qualityChecks:
        - "Policies do not promise unsupported capabilities or timelines."
        - "Policies have owner, approver, review cadence, update trigger, and publication location."
        - "Professional review is marked where needed."
      questions:
        - "What public and internal policies are required?"
        - "Who owns and approves each policy?"
        - "Where is each policy published or stored?"
        - "When must policies be reviewed or updated?"
        - "What claims must policies avoid or qualify?"
    - id: "vendor-compliance"
      title: "Vendor Compliance"
      intent: "Define vendor due diligence, compliance review, contract/DPA state, access/billing ownership, monitoring, fallback, and offboarding."
      required: true
      outputGuidance:
        - "Use vendor compliance records."
        - "Include vendors touching customer data, payments, analytics, infrastructure, support, messaging, storage, AI, auth, or observability."
        - "Tie vendor records to Operating Model dependencies and Business Processes vendor management."
      qualityChecks:
        - "Vendor data access and criticality are explicit."
        - "Review and offboarding are included."
        - "Vendor compliance claims are not accepted without evidence."
      questions:
        - "Which vendors require compliance review?"
        - "What data or access does each vendor have?"
        - "What contracts, DPAs, security/privacy reviews, or compliance evidence are needed?"
        - "Who owns vendor monitoring, billing, and offboarding?"
    - id: "contractual-obligations"
      title: "Contractual Obligations"
      intent: "Define contractual obligations that affect operations and how they are tracked, evidenced, reviewed, and escalated."
      required: true
      outputGuidance:
        - "Use contract obligation records."
        - "Include customer commitments, vendor commitments, platform terms, payment processor terms, open-source/license obligations, support commitments, renewals, and termination triggers."
        - "Mark unknown contracts or terms as review-needed."
      qualityChecks:
        - "Contractual obligations have owners and evidence."
        - "Renewal/termination and support commitments are tracked."
        - "License/platform/payment terms are not ignored."
      questions:
        - "What contractual obligations affect operations?"
        - "What customer, vendor, platform, payment processor, or license commitments exist?"
        - "Who owns each obligation?"
        - "How are renewal, termination, and compliance tracked?"
    - id: "audit-trail"
      title: "Audit Trail"
      intent: "Define which operational actions and decisions are recorded for evidence, review, accountability, and learning."
      required: true
      outputGuidance:
        - "Use audit trail records."
        - "Include policy changes, vendor reviews, data requests, access reviews, financial exceptions, refunds, incidents, accepted risks, compliance reviews, governance decisions, and approvals where relevant."
        - "Define storage, access, retention, redaction, and review."
      qualityChecks:
        - "Audit trail requirements are concrete."
        - "Sensitive audit data is protected."
        - "Audit evidence is reviewable."
      questions:
        - "What operational actions and decisions must be recorded?"
        - "Where are audit logs or records stored?"
        - "Who can access audit records?"
        - "How long are records retained?"
        - "What redaction or protection is required?"
    - id: "governance-rules"
      title: "Governance Rules"
      intent: "Define governance rules for operational decisions, approvals, exceptions, violations, and decision logs."
      required: true
      outputGuidance:
        - "Use governance rule records."
        - "Include policy changes, customer-facing commitments, pricing/refund exceptions, privacy/security decisions, vendor onboarding, risk acceptance, and incident communication where relevant."
        - "State violation detection and escalation."
      qualityChecks:
        - "Governance rules have decision owner and evidence."
        - "Exception path and escalation are explicit."
        - "Rules do not create unnecessary bureaucracy."
      questions:
        - "What governance rules apply to operational decisions?"
        - "Who approves policy changes, exceptions, vendor onboarding, pricing/refund exceptions, and risk acceptance?"
        - "How are governance violations detected and addressed?"
    - id: "exception-handling"
      title: "Exception Handling"
      intent: "Define how compliance and governance exceptions are requested, approved, time-boxed, monitored, escalated, and closed."
      required: true
      outputGuidance:
        - "Use exception records."
        - "Separate exception from accepted risk and unresolved gap."
        - "Include expiration/review trigger and residual risk."
      qualityChecks:
        - "Exceptions are explicit and auditable."
        - "Time-box and review trigger are required."
        - "Expired exceptions escalate."
      questions:
        - "How are compliance or governance exceptions requested?"
        - "Who approves exceptions?"
        - "What residual risk remains?"
        - "When does an exception expire or require review?"
        - "What happens if an exception is not closed?"
    - id: "accepted-risks"
      title: "Accepted Risks"
      intent: "Define intentionally accepted risk and distinguish it from ignored risk, deferred work, unknown obligations, and temporary exceptions."
      required: true
      outputGuidance:
        - "Use accepted risk records."
        - "Include rationale, approver, residual risk, mitigation, review trigger, communication requirement, and downstream owner."
        - "Do not treat accepted risk as resolved risk."
      qualityChecks:
        - "Accepted risks are explicit and reviewable."
        - "Residual risk remains visible."
        - "Acceptance authority is documented."
      questions:
        - "What risk and compliance risks are intentionally accepted?"
        - "Who accepts each risk?"
        - "What rationale and residual risk apply?"
        - "What mitigation still applies?"
        - "When must the accepted risk be reviewed?"
    - id: "compliance-review-cadence"
      title: "Compliance Review Cadence"
      intent: "Define how often obligations, policies, vendors, contracts, audit evidence, governance rules, exceptions, and accepted risks are reviewed."
      required: true
      outputGuidance:
        - "Use review cadence records."
        - "Include scheduled and event-triggered reviews."
        - "Tie reviews to Reporting and Cadence."
      qualityChecks:
        - "Review cadence produces evidence and decisions."
        - "Event-triggered reviews are included."
        - "Review ownership is explicit."
      questions:
        - "How often are compliance obligations reviewed?"
        - "What triggers out-of-cycle review?"
        - "Who participates?"
        - "What inputs, outputs, and evidence are produced?"
        - "What documentation updates follow review?"
    - id: "compliance-evidence"
      title: "Compliance Evidence"
      intent: "Define what evidence proves compliance-related controls are operating and how evidence is stored, protected, reviewed, and retained."
      required: true
      outputGuidance:
        - "Use evidence records."
        - "Include evidence for policy reviews, vendor reviews, access reviews, data requests, financial exceptions, incidents, accepted risks, and governance approvals."
        - "Define access, retention, redaction, and downstream use."
      qualityChecks:
        - "Evidence is specific and retrievable."
        - "Sensitive evidence is protected."
        - "Evidence links to controls and reviews."
      questions:
        - "What evidence is required for compliance-related controls?"
        - "Where is evidence stored?"
        - "Who owns evidence collection and review?"
        - "What access, retention, and redaction rules apply?"
    - id: "compliance-incidents"
      title: "Compliance Incidents"
      intent: "Define which compliance-related events become incidents and how they are escalated and handed off."
      required: true
      outputGuidance:
        - "Use compliance incident records."
        - "Include privacy, security, billing/payment, contractual breach, vendor failure, audit failure, policy violation, governance violation, or regulatory concern."
        - "Route to Incident Management, Data/Privacy Operations, Financial Operations, and Risk Management as appropriate."
      qualityChecks:
        - "Compliance incidents have escalation path."
        - "Sensitive communication constraints are explicit."
        - "Professional review needs are marked."
      questions:
        - "What compliance-related events become incidents?"
        - "Who owns escalation?"
        - "What evidence is required?"
        - "What communication constraints apply?"
        - "What downstream procedure handles each incident type?"
    - id: "compliance-metrics"
      title: "Compliance Metrics"
      intent: "Define metrics that measure risk and compliance operating health."
      required: true
      outputGuidance:
        - "Use compliance metric records."
        - "Include obligation coverage, review completion, exception count, accepted-risk count, vendor review freshness, policy freshness, audit evidence completeness, access review completion, privacy request handling, financial exception rate, and incident trend."
        - "Tie to Operational Metrics and Reporting Cadence."
      qualityChecks:
        - "Metrics are operational and decision-useful."
        - "Metrics have source, owner, threshold, cadence, and decision implication."
        - "Metrics do not imply certified compliance."
      questions:
        - "What metrics show compliance operating health?"
        - "How are obligation coverage, review completion, vendor review freshness, policy freshness, evidence completeness, accepted risks, exceptions, and compliance incidents measured?"
        - "What thresholds trigger escalation or review?"
    - id: "compliance-risks"
      title: "Compliance Risks"
      intent: "Identify failure modes of risk and compliance operations and how they are detected, mitigated, escalated, or handed off."
      required: true
      outputGuidance:
        - "Use compliance risk records."
        - "Include missing obligations, unsupported assumptions, stale policies, vendor noncompliance, weak audit trail, unresolved contracts, privacy mishandling, financial compliance gaps, governance drift, owner gaps, review failure, and evidence gaps."
        - "Route risks to Risk Management where needed."
      qualityChecks:
        - "Risks are concrete and monitorable."
        - "Mitigation and contingency are distinct."
        - "High-impact risks have owner and downstream handoff."
      questions:
        - "What could cause a compliance or governance failure?"
        - "What assumptions could be wrong or unsupported?"
        - "Where could policies, vendors, contracts, audit trails, privacy, finance, governance, reviews, or evidence fail?"
        - "How are risks detected and mitigated?"
        - "What should Risk Management inherit?"
    - id: "downstream-handoff"
      title: "Downstream Handoff"
      intent: "Define what downstream Operations documents must inherit from Risk and Compliance and what they must not assume."
      required: true
      outputGuidance:
        - "Use compliance handoff records."
        - "Route context to Data and Privacy Operations, Financial Operations, and Risk Management."
        - "Preserve obligations, risks, evidence, owners, policies, vendor records, contracts, exceptions, accepted risks, review cadence, incidents, and unresolved questions."
      qualityChecks:
        - "Handoff items are concrete and document-targeted."
        - "Downstream documents are not allowed to invent missing compliance assumptions silently."
        - "Risk and Compliance remains obligation/control architecture; detailed privacy, finance, and enterprise risk procedures remain downstream."
      questions:
        - "What should Data and Privacy Operations inherit?"
        - "What should Financial Operations inherit?"
        - "What should Risk Management inherit?"
        - "What unresolved risk and compliance questions must be carried forward?"
