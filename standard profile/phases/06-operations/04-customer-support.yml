document:
  id: "04-customer-support"
  title: "Customer Support"
  phase: "06-operations"
  status: "not_started"
  order: 4
  type: "customer_support"
  purpose: "Define how reactive customer questions, problems, complaints, bug reports, billing issues, refund requests, unsupported requests, and escalations are handled in a way that protects customer trust, product truth, operational capacity, and downstream learning."
  centralQuestion: "How are customer questions, problems, complaints, bugs, billing issues, refund requests, and unsupported requests received, triaged, answered, escalated, resolved, measured, and learned from?"
  outputs:
    canonical:
      format: "markdown"
      path: "docs/06-operations/04-customer-support.md"
      purpose: "Store the canonical customer support model as a Markdown document."
    artifacts:
      - id: "operations.customer_support_playbook"
        format: "html"
        path: "outcomes/html/06-operations/customer-support-playbook.html"
        purpose: "Provide a founder-facing support playbook covering support objective, channels, scope, intake, ticketing, triage, categories, priorities, response targets, escalation, bug reporting, billing/refunds, macros, unsupported requests, metrics, risks, and downstream handoff."
        audience: "founder"
        includes:
          - "support objective"
          - "support principles"
          - "support scope"
          - "support channels"
          - "support intake"
          - "ticketing model"
          - "ticket categories"
          - "priority levels"
          - "triage rules"
          - "response time targets"
          - "resolution expectations"
          - "escalation rules"
          - "bug reporting flow"
          - "known issue handling"
          - "incident handoff"
          - "refund and billing support"
          - "privacy and data requests"
          - "support macros and templates"
          - "unsupported requests"
          - "support feedback loop"
          - "support metrics"
          - "support risks"
          - "downstream handoff"
        generationMode: "regenerate_from_canonical"
    agentPacks:
      - id: "operations.customer_support_review_prompt"
        format: "markdown"
        path: "outcomes/agents/06-operations/customer-support-review-prompt.md"
        purpose: "Provide compact context for agents reviewing whether the support model is scoped, owner-aware, response-aware, escalation-ready, billing/privacy-safe, incident-aware, measurable, and aligned with Operations, Product, Engineering, GTM, and Risk Management."
        agentRole: "reviewer"
        includes:
          - "canonical customer support model"
          - "operations brief dependency"
          - "operating model dependency"
          - "team responsibilities dependency"
          - "product dependency"
          - "engineering dependency"
          - "pricing dependency"
          - "support formats"
          - "completion criteria"
          - "quality checks"
          - "review rules"
  dependsOn:
    - "01-foundation/04-principles"
    - "01-foundation/05-boundaries"
    - "01-foundation/06-success-definition"
    - "03-product/02-user-personas"
    - "03-product/03-user-journeys"
    - "03-product/08-product-scope"
    - "03-product/10-functional-requirements"
    - "03-product/11-non-functional-requirements"
    - "03-product/13-acceptance-criteria"
    - "04-engineering/08-security-and-privacy"
    - "04-engineering/10-testing-strategy"
    - "04-engineering/11-observability"
    - "04-engineering/12-deployment-and-environments"
    - "04-engineering/14-technical-risks"
    - "05-go-to-market/04-messaging"
    - "05-go-to-market/07-launch-plan"
    - "05-go-to-market/10-pricing-and-packaging"
    - "05-go-to-market/12-growth-metrics"
    - "05-go-to-market/13-go-to-market-risks"
    - "06-operations/01-operations-brief"
    - "06-operations/02-operating-model"
    - "06-operations/03-team-and-responsibilities"
  feeds:
    - "06-operations/05-maintenance-plan"
    - "06-operations/06-release-management"
    - "06-operations/07-incident-response"
    - "06-operations/08-data-and-privacy-operations"
    - "06-operations/09-financial-operations"
    - "06-operations/10-risk-management"
  inputs:
    - id: "operations-brief"
      type: "context"
      required: false
      description: "Operations objective, service expectations, support expectations, incident expectations, data/privacy operations, cost/capacity constraints, operational risks, and downstream handoffs."
    - id: "operating-model"
      type: "context"
      required: false
      description: "Operating scope, ownership model, roles, cadences, workflows, manual operations, automated operations, dependencies, decision rights, escalation paths, metrics, constraints, and risks."
    - id: "team-and-responsibilities"
      type: "context"
      required: false
      description: "Support owner, backup owner, escalation owner, decision authority, handoff rules, responsibility gaps, future hiring needs, and responsibility risks."
    - id: "product-context"
      type: "context"
      required: false
      description: "Personas, user journeys, product scope, functional requirements, NFRs, acceptance criteria, supported capabilities, known limitations, deferred features, and product-support feedback implications."
    - id: "engineering-context"
      type: "context"
      required: false
      description: "Security/privacy constraints, testing strategy, observability, deployment/environments, technical risks, bug handling constraints, diagnostic data, incident thresholds, and engineering escalation rules."
    - id: "gtm-context"
      type: "context"
      required: false
      description: "Messaging claim boundaries, launch cohorts, launch support readiness, pricing and packaging, billing/payment/refund rules, growth metrics, GTM risks, and customer-facing promises."
    - id: "support-notes"
      type: "manual_note"
      required: false
      description: "Support channel ideas, expected support load, known issue examples, ticket categories, response targets, macro drafts, refund/billing concerns, unsupported request types, escalation concerns, and unresolved support questions."
  completionCriteria:
    - "The central question is answered through a support model that defines intake, scope, triage, categories, priorities, response expectations, escalation, bug flow, billing/refunds, privacy/data requests, macros, unsupported requests, metrics, risks, and downstream handoff."
    - "Support objective defines what customer support protects: customer trust, issue resolution, product truth, safe expectations, feedback capture, operational capacity, and escalation discipline."
    - "Support principles define how support communicates, sets boundaries, avoids overpromising, preserves privacy, escalates risk, and routes product/engineering/financial/privacy issues."
    - "Support scope defines what is in scope, out of scope, self-service only, escalation-required, incident-triggering, privacy-sensitive, billing-sensitive, or product-feedback-only."
    - "Support channels define available channels, intended use, owner, operating hours or coverage assumption, response expectation, privacy suitability, escalation suitability, and launch/post-launch status."
    - "Support intake defines how requests are received, what information is required, what should not be collected, consent/privacy concerns, duplicate handling, acknowledgement behavior, and routing."
    - "Ticketing model defines ticket lifecycle, statuses, ownership, assignment, reassignment, duplicates, reopening, closure, evidence required, internal notes, customer-visible notes, and reporting."
    - "Ticket categories define issue taxonomy, examples, routing, owner, priority default, escalation path, required information, and downstream document."
    - "Priority levels define urgency/impact levels, customer impact, business impact, security/privacy impact, billing impact, incident threshold, first response target, resolution expectation, and escalation trigger."
    - "Triage rules define who triages, when triage happens, what information is checked, how priority/category are assigned, what gets escalated, and what becomes an incident candidate."
    - "Response time targets define first-response targets, update cadence, resolution expectations, caveats, operating hours, priority differences, and whether targets are internal or customer-facing."
    - "Resolution expectations define what resolution means by category: answer given, workaround provided, bug filed, bug fixed, refund processed, request denied, escalation completed, incident closed, or product feedback logged."
    - "Escalation rules define escalation triggers, target owner, backup owner, severity, required context, expected response, customer communication, and downstream procedure."
    - "Bug reporting flow defines how support-reported bugs are validated, reproduced, categorized, prioritized, linked to engineering backlog, tracked, communicated, and closed."
    - "Known issue handling defines how known issues are documented, exposed internally/externally, linked to tickets, updated, communicated, and retired."
    - "Incident handoff defines when support issues become incidents, what severity applies, who is notified, what customer communication is required, and what Incident Response must inherit."
    - "Refund and billing support defines billing question handling, failed payment handling, refund eligibility, exception authority, invoice/receipt handling, discount questions, subscription questions, escalation path, and Financial Operations handoff."
    - "Privacy and data requests define support handling for access, deletion, export, correction, privacy complaints, sensitive-data exposure, telemetry/logging questions, and Data/Privacy Operations escalation."
    - "Support macros/templates define reusable responses, allowed use, claim boundaries, personalization rules, review owner, update trigger, risk if stale, and maintenance cadence."
    - "Unsupported requests define unsupported issue types, reason unsupported, safe response, redirect path, escalation exception, and documentation/feature feedback capture where relevant."
    - "Support feedback loop defines how support signals are converted into product feedback, bug trends, documentation updates, macro updates, pricing/billing learnings, GTM claim corrections, risk signals, and maintenance/release work."
    - "Support metrics define volume, response, resolution, backlog, reopen rate, escalation rate, bug rate, billing/refund rate, support burden, satisfaction/quality, known issue volume, and incident handoff metrics."
    - "Support risks identify overload, slow response, poor triage, wrong priority, overpromising, privacy leak, billing/refund mishandling, stale macros, weak escalation, unresolved bugs, unsupported requests, and customer trust risks."
    - "Downstream handoff clarifies what Maintenance Plan, Release Management, Incident Response, Data/Privacy Operations, Financial Operations, and Risk Management must inherit."
  qualityChecks:
    - "Avoid vague claims."
    - "Avoid support theater: channels and SLAs without owner, scope, triage, categories, priority rules, escalation, response caveats, metrics, and risk handling."
    - "Avoid customer-facing response promises that exceed current team capacity, operating hours, support tooling, product readiness, or incident process."
    - "Avoid treating support as customer success; support handles reactive issues while customer success handles proactive adoption/retention where applicable."
    - "Avoid collecting unnecessary personal, financial, health, sensitive, or diagnostic data during support intake."
    - "Avoid macros that make unsupported claims, contradict pricing/refund policy, expose technical uncertainty, or become stale."
    - "Avoid support responses that overpromise fixes, timelines, refunds, data deletion, compliance, uptime, or engineering action."
    - "Avoid bug reporting flows that bypass triage, reproduction, priority, ownership, and customer communication."
    - "Avoid refund/billing procedures without authorization rules, escalation, customer communication, and Financial Operations handoff."
    - "Avoid privacy/data request handling without Data/Privacy Operations escalation and review."
    - "Prefer decision-useful statements."
    - "Make assumptions explicit."
    - "Do not invent support hours, support staffing, SLA guarantees, refund authority, legal/compliance status, billing capabilities, engineering response times, or support tooling readiness."
    - "Customer support must preserve Foundation boundaries, product truth, technical truth, pricing truth, privacy/security constraints, customer trust, support capacity, and operational sustainability."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
    - "Separate support scope, channel, intake rule, ticket category, priority, triage rule, response target, escalation, bug flow, billing/refund rule, macro, unsupported request, metric, risk, and handoff."
    - "Tie support rules to Operations Brief, Operating Model, Team and Responsibilities, Product Scope, Acceptance Criteria, Security/Privacy, Observability, Technical Risks, Messaging, Launch Plan, Pricing and Packaging, Growth Metrics, GTM Risks, or Decision Record where possible."
    - "Classify support items as current, required, deferred, internal-only, customer-facing, escalation-required, incident-triggering, privacy-sensitive, billing-sensitive, launch-critical, post-launch, blocked, or review-needed where useful."
    - "State whether response targets are internal targets or customer-facing commitments."
    - "Route detailed incident procedures, data/privacy procedures, financial procedures, maintenance work, release fixes, and risk ownership downstream."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with Operations Brief, Operating Model, Team and Responsibilities, Foundation, Product, Acceptance Criteria, NFRs, Security/Privacy, Observability, Deployment, Technical Risks, Messaging, Launch Plan, Pricing and Packaging, Growth Metrics, GTM Risks, or Decision Record."
    - "Flag support channels without owner, use case, operating coverage, response expectation, privacy suitability, and escalation suitability."
    - "Flag support scope that omits out-of-scope, unsupported, escalation-required, incident-triggering, privacy-sensitive, or billing-sensitive issues."
    - "Flag priority levels without impact definition, triage rule, response target, resolution expectation, and escalation trigger."
    - "Flag escalation rules without target owner, backup owner, required context, expected response, and customer communication rule."
    - "Flag bug flows without reproduction, backlog linkage, priority, engineering owner, customer update rule, and closure condition."
    - "Flag billing/refund flows without authorization, exception handling, financial handoff, and customer communication."
    - "Flag privacy/data request handling without downstream Data/Privacy Operations handoff."
    - "Flag support metrics without formula/source, owner, cadence, threshold, and decision implication."
    - "Verify that downstream Operations documents receive concrete support handoff inputs."
    - "Flag content that belongs better in Customer Success, Maintenance Plan, Release Management, Incident Response, Data/Privacy Operations, Financial Operations, or Risk Management."
  specializedFormats:
    supportChannelFormat:
      description: "Recommended format for support channels."
      fields:
        - channel
        - intendedUse
        - customerFacing
        - owner
        - backupOwner
        - operatingCoverage
        - responseExpectation
        - privacySuitability
        - escalationSuitability
        - tooling
        - status
    ticketCategoryFormat:
      description: "Recommended format for ticket categories."
      fields:
        - category
        - description
        - examples
        - defaultPriority
        - requiredInformation
        - routingOwner
        - escalationPath
        - downstreamDocument
        - customerVisibleLanguage
        - status
    priorityLevelFormat:
      description: "Recommended format for support priority levels."
      fields:
        - priority
        - definition
        - customerImpact
        - businessImpact
        - securityOrPrivacyImpact
        - billingImpact
        - incidentThreshold
        - firstResponseTarget
        - updateCadence
        - resolutionExpectation
        - escalationTrigger
        - status
    triageRuleFormat:
      description: "Recommended format for support triage rules."
      fields:
        - rule
        - trigger
        - checks
        - categoryAssignment
        - priorityAssignment
        - owner
        - escalationCondition
        - incidentCandidate
        - evidenceRequired
        - status
    escalationRuleFormat:
      description: "Recommended format for support escalation rules."
      fields:
