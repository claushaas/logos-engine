document:
  id: "07-ui-specification"
  title: "UI Specification"
  phase: "03-product"
  status: "not_started"
  purpose: "Specify all screens, components, and interface states for the product."
  centralQuestion: "What screens exist and how do they behave?"
  sections:
    - id: "screen-inventory"
      title: "Screen Inventory"
      questions:
        - "What screens and views exist in the product?"
        - "What is the purpose of each screen?"
        - "What is the hierarchy and navigation relationship between screens?"
        - "What are the entry and exit points for each screen?"
    - id: "layout-rules"
      title: "Layout Rules"
      questions:
        - "What layout system is used across screens?"
        - "What are the global layout rules?"
        - "How does layout adapt to different content types?"
        - "How does layout adapt to different viewport sizes?"
    - id: "component-usage"
      title: "Component Usage"
      questions:
        - "What reusable components are used across screens?"
        - "What are the usage rules for each component?"
        - "What components are context-sensitive?"
        - "What components must remain consistent globally?"
    - id: "screen-by-screen-specification"
      title: "Screen-by-Screen Specification"
      questions:
        - "For each screen, what is the exact layout and content?"
        - "What components appear on each screen?"
        - "What interactions are available on each screen?"
        - "What data drives each screen?"
    - id: "empty-states"
      title: "Empty States"
      questions:
        - "What does each screen look like with no data?"
        - "What is the empty-state call to action?"
        - "How does the product guide the user from empty to populated?"
        - "How are empty states visually distinct from loading states?"
    - id: "loading-states"
      title: "Loading States"
      questions:
        - "What loading patterns are used (skeleton, spinner, progress bar)?"
        - "What is the loading strategy for each screen?"
        - "How are partial loads handled?"
        - "What is the maximum acceptable perceived loading time?"
    - id: "error-states"
      title: "Error States"
      questions:
        - "What error states can each screen display?"
        - "How are errors surfaced to the user?"
        - "What recovery actions are offered in each error state?"
        - "How are background or non-blocking errors communicated?"
    - id: "success-states"
      title: "Success States"
      questions:
        - "What success states exist for each screen?"
        - "How is success communicated to the user?"
        - "What is the next action after success?"
        - "How are transient vs persistent success states handled?"
    - id: "responsive-behavior"
      title: "Responsive Behavior"
      questions:
        - "What viewport sizes are supported?"
        - "How does the UI adapt at each breakpoint?"
        - "What content or functionality is hidden at smaller sizes?"
        - "What content or functionality is unavailable on certain platforms?"
    - id: "microcopy-rules"
      title: "Microcopy Rules"
      questions:
        - "What tone and voice guide all microcopy?"
        - "What are the standard labels, button text, and messages?"
        - "How are errors phrased to be helpful rather than technical?"
        - "What terms are used consistently across all microcopy?"
    - id: "ui-risks"
      title: "UI Risks"
      questions:
        - "What UI decisions carry the highest risk?"
        - "Where is the UI most likely to break with scale or edge cases?"
        - "What UI patterns have not been tested with real users?"
        - "How will UI decisions be validated?"
