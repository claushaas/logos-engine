document:
  id: "10-functional-requirements"
  title: "Functional Requirements"
  phase: "03-product"
  status: "not_started"
  purpose: "Define all mandatory functionalities the product must provide."
  centralQuestion: "What functionalities are mandatory?"
  sections:
    - id: "requirement-format"
      title: "Requirement Format"
      questions:
        - "How are requirements structured (ID, description, value, priority)?"
        - "What is the taxonomy for requirement priority (Must, Should, Could, Won't)?"
        - "How are requirements traced to user journeys and product modules?"
        - "What constitutes a well-formed acceptance criterion?"
    - id: "core-requirements"
      title: "Core Requirements"
      questions:
        - "What are the must-have functional requirements?"
        - "Which requirements are essential to the core product promise?"
        - "What is the dependency chain among core requirements?"
        - "What requirements have the highest user impact?"
    - id: "user-requirements"
      title: "User Requirements"
      questions:
        - "What functions do end users need from the product?"
        - "What user actions must be supported?"
        - "What user-facing outputs must the product produce?"
        - "What user preferences and settings are required?"
    - id: "system-requirements"
      title: "System Requirements"
      questions:
        - "What background or automated functions are required?"
        - "What data processing, storage, and retrieval functions are needed?"
        - "What scheduling, queuing, or batch processing is required?"
        - "What system health and maintenance functions are required?"
    - id: "admin-requirements"
      title: "Admin Requirements"
      questions:
        - "What administrative functions are required?"
        - "Who needs admin access and for what purposes?"
        - "What configuration, monitoring, and management functions are needed?"
        - "What admin functions can be deferred post-MVP?"
    - id: "integration-requirements"
      title: "Integration Requirements"
      questions:
        - "What external integrations are required?"
        - "What data must flow in and out of the product?"
        - "What authentication and authorization integrations are needed?"
        - "What are the integration failure-handling requirements?"
    - id: "data-requirements"
      title: "Data Requirements"
      questions:
        - "What data must the product store, process, and retrieve?"
        - "What are the data retention and deletion requirements?"
        - "What data export and portability requirements exist?"
        - "What data accuracy and consistency requirements apply?"
    - id: "business-rules"
      title: "Business Rules"
      questions:
        - "What business rules must the product enforce?"
        - "What validation, constraint, and workflow rules apply?"
        - "What rules are configurable vs hard-coded?"
        - "How are rule conflicts resolved?"
    - id: "requirement-traceability"
      title: "Requirement Traceability"
      questions:
        - "How is each requirement traced to a user journey?"
        - "How is each requirement traced to a product module?"
        - "How is requirement completeness verified?"
        - "How are requirement changes tracked and propagated?"
