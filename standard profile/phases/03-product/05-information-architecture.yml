document:
  id: "05-information-architecture"
  title: "Information Architecture"
  phase: "03-product"
  status: "not_started"
  order: 5
  type: "information_architecture"
  purpose: "Define the core objects in the product and how they relate to each other."
  centralQuestion: "What objects exist in the product and how do they relate?"
  dependsOn: []
  feeds: []
  outputs:
    canonical:
      format: "markdown"
      path: "03-product/05-information-architecture.md"
      purpose: "Information architecture of core objects and relationships"
  completionCriteria:
    - "The central question is directly answered."
    - "All required sections contain substantive content."
  qualityChecks:
    - "Avoid vague claims."
    - "Prefer decision-useful statements."
    - "Remove content that belongs to another phase."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Identify content that should move to another document."
  sections:
    - id: "core-objects"
      title: "Core Objects"
      intent: "Identify and describe all primary objects users interact with"
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What are the primary objects users create, view, and manage?"
        - "What are the properties of each core object?"
        - "What is the lifecycle of each core object?"
        - "What are the secondary or supporting objects?"
    - id: "object-relationships"
      title: "Object Relationships"
      intent: "Define how core objects relate to each other"
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "How do core objects relate to each other?"
        - "What are the cardinality rules for each relationship?"
        - "What happens to related objects when a parent is deleted or archived?"
        - "What relationships are visible to the user vs implementation-only?"
    - id: "navigation-structure"
      title: "Navigation Structure"
      intent: "Define the top-level navigation model and movement patterns"
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What is the top-level navigation model?"
        - "How does the user move between objects and views?"
        - "What navigation patterns are used (hierarchy, search, related links)?"
        - "How is the user's current location communicated?"
    - id: "content-hierarchy"
      title: "Content Hierarchy"
      intent: "Define how content is organized and prioritized within each view"
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "How is content organized within each view?"
        - "What is the primary content and what is secondary?"
        - "How is content prioritized when space is limited?"
        - "How does the hierarchy adapt to different content volumes?"
    - id: "naming-rules"
      title: "Naming Rules"
      intent: "Establish consistent terminology across the product"
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What consistent terminology is used across the product?"
        - "How are objects, actions, and states named?"
        - "What terms are banned or avoided?"
        - "How are naming conflicts or ambiguities resolved?"
    - id: "search-and-retrieval"
      title: "Search and Retrieval"
      intent: "Define how users find objects and content"
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "How does the user find objects and content?"
        - "What search capabilities are provided?"
        - "What filtering, sorting, and browsing options exist?"
        - "How are search results presented?"
    - id: "empty-states"
      title: "Empty States"
      intent: "Define what every view looks like with no content and how to guide first action"
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What does each view look like when there is no content?"
        - "How does the product prompt useful first action in empty states?"
        - "What tone is used in empty states?"
        - "How do empty states differ from zero-results states?"
    - id: "information-density-rules"
      title: "Information Density Rules"
      intent: "Define how much information is shown at each level and when to use separate views"
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "How much information is shown at each level of the hierarchy?"
        - "When is detail shown inline vs on a separate view?"
        - "How does information density adapt to user expertise?"
        - "What is the max items per list, per view, per page?"
    - id: "ia-risks"
      title: "IA Risks"
      intent: "Identify the highest-risk information architecture decisions"
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What information architecture decisions carry the most risk?"
        - "Where is the IA most likely to fail with scale?"
        - "What naming or organizational choices could confuse users?"
        - "How will IA decisions be validated?"
