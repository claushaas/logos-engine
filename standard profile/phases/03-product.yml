phase:
  id: "03-product"
  title: "Product"
  description: "Defines what will be built, how users experience it, what belongs in scope, how the interface behaves, what product architecture supports it, and what criteria determine whether it is ready."
  purpose: "Answer: 'What exactly will be built, for whom, with what experience, scope, visual language, and product rules?'"
  documents:
    - id: "01-product-brief"
      title: "Product Brief"
      file: "03-product/03-product/01-product-brief.yml"
      purpose: "Executive synthesis of the product."
    - id: "02-scope"
      title: "Scope"
      file: "03-product/03-product/02-scope.yml"
      purpose: "What is in and out of the product."
    - id: "03-user-journeys"
      title: "User Journeys"
      file: "03-product/03-product/03-user-journeys.yml"
      purpose: "The human paths through the product."
    - id: "04-ux-model"
      title: "UX Model"
      file: "03-product/03-product/04-ux-model.yml"
      purpose: "The conceptual model of the experience."
    - id: "05-information-architecture"
      title: "Information Architecture"
      file: "03-product/03-product/05-information-architecture.yml"
      purpose: "How product concepts are organized."
    - id: "06-interaction-model"
      title: "Interaction Model"
      file: "03-product/03-product/06-interaction-model.yml"
      purpose: "How the user acts within the product."
    - id: "07-ui-specification"
      title: "UI Specification"
      file: "03-product/03-product/07-ui-specification.yml"
      purpose: "Screens, components, and interface states."
    - id: "08-design-system"
      title: "Design System"
      file: "03-product/03-product/08-design-system.yml"
      purpose: "Visual language and design standards."
    - id: "09-product-architecture"
      title: "Product Architecture"
      file: "03-product/03-product/09-product-architecture.yml"
      purpose: "Modules, areas, and capabilities that compose the product."
    - id: "10-functional-requirements"
      title: "Functional Requirements"
      file: "03-product/03-product/10-functional-requirements.yml"
      purpose: "What the product must do."
    - id: "11-non-functional-requirements"
      title: "Non-Functional Requirements"
      file: "03-product/03-product/11-non-functional-requirements.yml"
      purpose: "Qualities the product must have."
    - id: "12-product-stack"
      title: "Product Stack"
      file: "03-product/03-product/12-product-stack.yml"
      purpose: "Technology and platform choices at the product level."
    - id: "13-acceptance-criteria"
      title: "Acceptance Criteria"
      file: "03-product/03-product/13-acceptance-criteria.yml"
      purpose: "When a product, feature, or flow is ready."
