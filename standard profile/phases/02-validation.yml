phase:
  id: "02-validation"
  title: "Validation"
  description: "Defines how the project thesis, problem, audience, and solution direction are tested before deeper product and engineering commitments are made."
  purpose: "Answer: 'How will we know, with evidence, that the foundational thesis deserves to become a product?'"
  documents:
    - id: "01-validation-strategy"
      title: "Validation Strategy"
      file: "02-validation/02-validation/01-validation-strategy.yml"
      purpose: "The overall validation approach and what must be proven first."
    - id: "02-core-assumptions"
      title: "Core Assumptions"
      file: "02-validation/02-validation/02-core-assumptions.yml"
      purpose: "What the project assumes to be true, ranked by risk."
    - id: "03-hypotheses"
      title: "Hypotheses"
      file: "02-validation/02-validation/03-hypotheses.yml"
      purpose: "Assumptions converted into testable propositions."
    - id: "04-research-plan"
      title: "Research Plan"
      file: "02-validation/02-validation/04-research-plan.yml"
      purpose: "How qualitative and contextual evidence will be gathered."
    - id: "05-experiments"
      title: "Experiments"
      file: "02-validation/02-validation/05-experiments.yml"
      purpose: "Concrete behavioral tests (landing pages, MVPs, prototypes, etc.)."
    - id: "06-economic-model"
      title: "Economic Model"
      file: "02-validation/02-validation/06-economic-model.yml"
      purpose: "Whether the project can plausibly become financially sustainable."
    - id: "07-business-model"
      title: "Business Model"
      file: "02-validation/02-validation/07-business-model.yml"
      purpose: "The integrated logic of how the project creates, delivers, captures, and sustains value."
    - id: "08-evidence-log"
      title: "Evidence Log"
      file: "02-validation/02-validation/08-evidence-log.yml"
      purpose: "Centralized registry of observed evidence."
    - id: "09-decision-record"
      title: "Decision Record"
      file: "02-validation/02-validation/09-decision-record.yml"
      purpose: "Registry of decisions made from evidence."
    - id: "10-validation-report"
      title: "Validation Report"
      file: "02-validation/02-validation/10-validation-report.yml"
      purpose: "Synthesis: has the idea been validated enough to advance?"
