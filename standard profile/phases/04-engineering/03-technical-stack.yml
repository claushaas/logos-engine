  title: "Technical Stack"
  phase: "04-engineering"
  status: "not_started"
  order: 3
  type: "stack"
  purpose: "Defines the specific implementation technologies to be used across the system."
  centralQuestion: "What specific implementation technologies will be used?"
  outputs:
    canonical:
      format: "markdown"
      path: "04-engineering/technical-stack.md"
      purpose: "Definitive record of the specific implementation technologies selected for the system."
  dependsOn: []
  feeds: []
  completionCriteria:
    - "The central question is directly answered."
    - "All required sections contain substantive content."
  qualityChecks:
    - "Avoid vague claims."
    - "Prefer decision-useful statements."
    - "Remove content that belongs to another phase."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with upstream documents."
  sections:
    - id: "runtime"
      title: "Runtime"
      intent: "Specify the runtimes the system will execute on and required runtime versions."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What runtimes will the system execute on? Node.js, browser, native mobile?"
        - "What runtime versions are required?"
    - id: "languages"
      title: "Languages"
      intent: "Identify programming languages for each part of the system and any language-level constraints."
