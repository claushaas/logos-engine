        - "Who owns fixtures, mocks, CI gates, and release evidence?"
        - "Who triages failures?"
        - "Who approves accepted testing risk?"
        - "How are test assets maintained over time?"
    - id: "testing-risks"
      title: "Testing Risks"
      intent: "Identify risks of the testing strategy, hard-to-test areas, gaps, false confidence, tool limitations, environment drift, flakiness, and coverage blind spots."
      required: true
      outputGuidance:
        - "Describe risks as concrete testing failure modes."
