document:
  id: "10-testing-strategy"
  title: "Testing Strategy"
  phase: "04-engineering"
  status: "not_started"
  purpose: "Defines how to verify the system works, keeps working, and hasn't broken silently."
  centralQuestion: "How will we know the system works, keeps working, and hasn't broken silently?"
  sections:
    - id: "testing-objective"
      title: "Testing Objective"
      questions:
        - "What is the overall testing philosophy and quality bar?"
        - "What is the acceptable level of test coverage?"
    - id: "test-pyramid"
      title: "Test Pyramid"
      questions:
        - "What is the expected distribution across unit, integration, and E2E tests?"
        - "What is the rationale for the chosen distribution?"
    - id: "unit-tests"
      title: "Unit Tests"
      questions:
        - "What is considered a unit? Pure functions, modules, classes?"
        - "What mocking or stubbing conventions apply?"
    - id: "integration-tests"
      title: "Integration Tests"
      questions:
        - "Which integrations are tested and at what scope?"
        - "How are external dependencies handled in integration tests?"
    - id: "end-to-end-tests"
      title: "End-to-End Tests"
      questions:
        - "What end-to-end workflows are tested?"
        - "What test environment and data fixtures are required?"
    - id: "contract-tests"
      title: "Contract Tests"
      questions:
        - "How are API contracts tested between producers and consumers?"
        - "What contract testing framework is used?"
    - id: "domain-tests"
      title: "Domain Tests"
      questions:
        - "How are domain rules, invariants, and state machines tested?"
        - "What test patterns are used for business logic?"
    - id: "sync-tests"
      title: "Sync Tests"
      questions:
        - "How are sync, conflict resolution, and offline behaviour tested?"
        - "What simulation or replay tools are used for sync testing?"
    - id: "security-tests"
      title: "Security Tests"
      questions:
        - "What automated security tests are run in CI?"
        - "What manual security testing is performed and by whom?"
    - id: "performance-tests"
      title: "Performance Tests"
      questions:
        - "What performance benchmarks and load tests exist?"
        - "What are the performance acceptance criteria?"
    - id: "regression-strategy"
      title: "Regression Strategy"
      questions:
        - "How are regressions detected and prevented?"
        - "What is the process for adding regression tests for bugs?"
    - id: "ci-requirements"
      title: "CI Requirements"
      questions:
        - "What tests run on every commit, PR, and merge?"
        - "What is the CI pipeline structure and time budget?"
    - id: "release-gates"
      title: "Release Gates"
      questions:
        - "What tests must pass before a release can proceed?"
        - "What manual approval steps are required?"
    - id: "testing-risks"
      title: "Testing Risks"
      questions:
        - "What are the risks of the testing strategy?"
        - "What areas are hardest to test and may have gaps?"
