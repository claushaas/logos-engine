        - "What areas are hardest to test and may have gaps?"
        - "Where could tests create false confidence?"
        - "Where could mocks, fixtures, environments, or flaky tests hide real risk?"
        - "What testing gaps are release-blocking versus accepted risk?"
        - "What mitigations or downstream reviews are required?"
    - id: "downstream-handoff"
      title: "Downstream Handoff"
      intent: "Define what downstream Engineering and Operations documents must inherit from Testing Strategy and what they must not assume."
