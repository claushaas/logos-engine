document:
  id: "08-security-and-privacy"
  title: "Security and Privacy"
  phase: "04-engineering"
  status: "not_started"
  order: 8
  type: "security_privacy"
  purpose: "Defines how the system protects access, data, identity, and privacy."
  centralQuestion: "How does the system protect access, data, identity, and privacy?"
  outputs:
    canonical:
      format: "markdown"
      path: "04-engineering/security-and-privacy.md"
      purpose: "Security and privacy design covering access control, data protection, identity, and privacy."
  dependsOn: []
  feeds: []
  completionCriteria:
    - "The central question is directly answered."
    - "All required sections contain substantive content."
  qualityChecks:
    - "Avoid vague claims."
    - "Prefer decision-useful statements."
    - "Remove content that belongs to another phase."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with upstream documents."
  sections:
    - id: "security-objective"
      title: "Security Objective"
      intent: "Define the security posture, threat tolerance, and any compliance requirements that apply."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What is the security posture and threat tolerance of the system?"
        - "What compliance requirements apply? SOC2, GDPR, HIPAA?"
    - id: "threat-model"
      title: "Threat Model"
      intent: "Identify primary threat actors, attack vectors, and the most valuable and exposed assets."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What are the primary threat actors and attack vectors?"
        - "What assets are most valuable and most exposed?"
    - id: "authentication"
      title: "Authentication"
      intent: "Specify how users and services are authenticated and which authentication flows are supported."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "How are users and services authenticated?"
        - "What authentication flows are supported? OAuth, API keys, SSO?"
    - id: "authorization"
      title: "Authorization"
      intent: "Define the authorization model, permission levels, and how they are assigned."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "How is authorization enforced? RBAC, ABAC, ReBAC?"
        - "What are the permission levels and how are they assigned?"
    - id: "data-classification"
      title: "Data Classification"
      intent: "Classify data into levels and define handling rules per classification level."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "How is data classified? Public, internal, confidential, restricted?"
        - "What handling rules apply per classification level?"
    - id: "encryption"
      title: "Encryption"
      intent: "Specify encryption standards for data at rest and in transit, and how encryption keys are managed and rotated."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What encryption standards apply for data at rest and in transit?"
        - "How are encryption keys managed and rotated?"
    - id: "secrets-management"
      title: "Secrets Management"
      intent: "Define where secrets are stored, how they are accessed at runtime, and how they are rotated and revoked."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "Where are secrets stored and how are they accessed at runtime?"
        - "How are secrets rotated and revoked?"
    - id: "secure-logging"
      title: "Secure Logging"
      intent: "Specify how logs are scrubbed of sensitive data and what access controls apply to log storage."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "How are logs scrubbed of sensitive data?"
        - "What access controls apply to log storage?"
    - id: "backup-security"
      title: "Backup Security"
      intent: "Define how backups are encrypted and access-controlled, and the backup retention and destruction policy."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "How are backups encrypted and access-controlled?"
        - "What is the backup retention and destruction policy?"
    - id: "data-export"
      title: "Data Export"
      intent: "Specify how users can export their data and what format and completeness guarantees apply."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "How can users export their data?"
        - "What format and completeness guarantees apply?"
    - id: "data-deletion"
      title: "Data Deletion"
      intent: "Define how user data is permanently deleted upon request and the deletion timeline and verification process."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "How is user data permanently deleted upon request?"
        - "What is the deletion timeline and verification process?"
    - id: "abuse-prevention"
      title: "Abuse Prevention"
      intent: "Describe how abuse vectors are mitigated and what rate limiting, CAPTCHA, or other controls are in place."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "How are abuse vectors like spam, scraping, and DoS mitigated?"
        - "What rate limiting, CAPTCHA, or other controls are in place?"
    - id: "security-testing"
      title: "Security Testing"
      intent: "Define the security testing performed, cadence, and ownership."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What security testing is performed? SAST, DAST, penetration testing?"
        - "What is the cadence and ownership of security testing?"
    - id: "security-risks"
      title: "Security Risks"
      intent: "Identify top security risks, unresolved threats, and the risk acceptance process."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What are the top security risks and unresolved threats?"
        - "What is the risk acceptance process?"
