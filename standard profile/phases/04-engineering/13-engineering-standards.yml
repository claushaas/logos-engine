document:
  id: "13-engineering-standards"
  title: "Engineering Standards"
  phase: "04-engineering"
  status: "not_started"
  order: 13
  type: "standards"
  purpose: "Defines code and collaboration standards to maintain technical consistency as the system grows."
  centralQuestion: "How to maintain technical consistency as the system grows?"
  outputs:
    canonical:
      format: "markdown"
      path: "04-engineering/engineering-standards.md"
      purpose: "Engineering standards covering repository structure, code organisation, naming conventions, and collaboration rules."
  dependsOn: []
  feeds: []
  completionCriteria:
    - "The central question is directly answered."
    - "All required sections contain substantive content."
  qualityChecks:
    - "Avoid vague claims."
    - "Prefer decision-useful statements."
    - "Remove content that belongs to another phase."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with upstream documents."
  sections:
    - id: "repository-structure"
      title: "Repository Structure"
      intent: "Define the top-level directory layout and how packages, apps, and shared code are organised."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What is the top-level directory layout? Monorepo or polyrepo?"
        - "How are packages, apps, and shared code organised?"
    - id: "code-organization"
      title: "Code Organization"
      intent: "Specify module and file organisation conventions and how imports are grouped and ordered."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What are the module and file organisation conventions?"
        - "How are imports grouped and ordered?"
    - id: "naming-conventions"
      title: "Naming Conventions"
      intent: "Define naming conventions for files, folders, variables, functions, and types, including casing conventions."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What naming conventions apply to files, folders, variables, functions, and types?"
        - "What casing conventions are used? camelCase, PascalCase, kebab-case, snake_case?"
    - id: "type-safety"
      title: "Type Safety"
      intent: "Specify the type system used and how types are shared between modules."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What type system is used? TypeScript strict mode, Zod schemas?"
        - "How are types shared between modules? Generated, manual, imported?"
    - id: "error-handling"
      title: "Error Handling"
      intent: "Define the error handling pattern and how errors are propagated, logged, and surfaced to users."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What is the error handling pattern? Result types, exceptions, error codes?"
        - "How are errors propagated, logged, and surfaced to users?"
    - id: "logging-conventions"
      title: "Logging Conventions"
      intent: "Specify logging conventions in application code and what should and should not be logged."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What logging conventions apply in application code?"
        - "What should and should not be logged?"
    - id: "dependency-management"
      title: "Dependency Management"
      intent: "Define how dependencies are added, updated, and removed, and the policy on transitive dependency pinning and auditing."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "How are dependencies added, updated, and removed?"
        - "What is the policy on transitive dependency pinning and auditing?"
    - id: "migration-rules"
      title: "Migration Rules"
      intent: "Specify how data migration scripts are authored and reviewed and what backward-compatibility guarantees are required."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "How are data migration scripts authored and reviewed?"
        - "What backward-compatibility guarantees are required?"
    - id: "git-workflow"
      title: "Git Workflow"
      intent: "Define the branching strategy and commit message conventions."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What branching strategy is used? Trunk-based, GitFlow, feature branches?"
        - "What are the commit message conventions?"
    - id: "pull-request-rules"
      title: "Pull Request Rules"
      intent: "Specify PR requirements including approvals, CI checks, linked issues, PR size guidelines, and review SLA."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What are the PR requirements? Approvals, CI checks, linked issues?"
        - "What is the PR size guideline and review SLA?"
    - id: "documentation-rules"
      title: "Documentation Rules"
      intent: "Define documentation required alongside code and where it lives and how it is kept current."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What documentation is required alongside code? README, ADRs, API docs?"
        - "Where does documentation live and how is it kept current?"
    - id: "review-checklist"
      title: "Review Checklist"
      intent: "Specify what reviewers check for and the review checklist for different change types."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What do reviewers check for? Correctness, style, security, performance?"
        - "What is the review checklist for different change types?"
    - id: "standards-risks"
      title: "Standards Risks"
      intent: "Identify risks of the chosen standards and which standards are most likely to be inconsistently applied."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What are the risks of the chosen standards?"
        - "Which standards are most likely to be inconsistently applied?"
