        - "What is the mitigation or abstraction strategy?"
    - id: "mocking-strategy"
      title: "Mocking Strategy"
      intent: "Describe how external services are mocked for testing and development and what mocking tools or service virtualisation is used."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "How are external services mocked for testing and development?"
        - "What mocking tools or service virtualisation is used?"
    - id: "integration-risks"
      title: "Integration Risks"
      intent: "Identify top integration risks and what happens if a critical external service is deprecated or changes its API."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What are the top integration risks?"
        - "What happens if a critical external service is deprecated or changes its API?"
