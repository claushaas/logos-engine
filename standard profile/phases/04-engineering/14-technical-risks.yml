document:
  id: "14-technical-risks"
  title: "Technical Risks"
  phase: "04-engineering"
  status: "not_started"
  order: 14
  type: "risk_register"
  purpose: "Technical risk register tracking what could make the system difficult, expensive, unstable, or unviable."
  centralQuestion: "What could make the system difficult, expensive, unstable, or unviable?"
  outputs:
    canonical:
      format: "markdown"
      path: "04-engineering/technical-risks.md"
      purpose: "Technical risk register tracking architectural, data, sync, security, performance, integration, vendor, and maintenance risks."
  dependsOn: []
  feeds: []
  completionCriteria:
    - "The central question is directly answered."
    - "All required sections contain substantive content."
  qualityChecks:
    - "Avoid vague claims."
    - "Prefer decision-useful statements."
    - "Remove content that belongs to another phase."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with upstream documents."
  specializedFormats:
    riskFormat:
      fields:
        - id
        - category
        - description
        - likelihood
        - impact
        - detectionSignal
        - mitigation
        - owner
        - status
  sections:
    - id: "risk-register"
      title: "Risk Register"
      intent: "Define the format for risk entries and the process for adding and retiring risks."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What is the format for risk entries? TR-XXX, Category, Description, Likelihood, Impact, Detection Signal, Mitigation, Owner, Status."
        - "What is the process for adding and retiring risks?"
    - id: "architecture-risks"
      title: "Architecture Risks"
      intent: "Identify architecture decisions that carry the most risk and assumptions that are least validated."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What architecture decisions carry the most risk?"
        - "Which architectural assumptions are least validated?"
    - id: "data-risks"
      title: "Data Risks"
      intent: "Identify data modelling or storage decisions that could cause problems and data consistency or integrity risks."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What data modelling or storage decisions could cause problems?"
        - "What data consistency or integrity risks exist?"
    - id: "sync-risks"
      title: "Sync Risks"
      intent: "Identify sync-related risks such as data loss, divergence, and conflict storms, and how sync correctness is verified."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What sync-related risks exist? Data loss, divergence, conflict storms?"
        - "How is sync correctness verified under adverse conditions?"
    - id: "security-risks"
      title: "Security Risks"
      intent: "Identify unresolved security risks and the most exposed attack surfaces."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What unresolved security risks exist?"
        - "What attack surfaces are most exposed?"
    - id: "performance-risks"
      title: "Performance Risks"
      intent: "Identify performance risks including bottlenecks, scaling limits, resource exhaustion, and untested load profiles."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What are the performance risks? Bottlenecks, scaling limits, resource exhaustion?"
        - "What load profiles are untested?"
    - id: "integration-risks"
      title: "Integration Risks"
      intent: "Identify external integrations that carry the most risk and what happens if a critical integration fails permanently."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What external integrations carry the most risk?"
        - "What happens if a critical integration fails permanently?"
    - id: "vendor-risks"
      title: "Vendor Risks"
      intent: "Identify vendor-related risks and the vendor substitution plan."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What vendor-related risks exist? Pricing changes, deprecation, outages?"
        - "What is the vendor substitution plan?"
    - id: "maintenance-risks"
      title: "Maintenance Risks"
      intent: "Identify parts of the system that will be hardest to maintain and knowledge silos or single points of failure in the team."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What parts of the system will be hardest to maintain?"
        - "What knowledge silos or single points of failure exist in the team?"
    - id: "required-technical-spikes"
      title: "Required Technical Spikes"
      intent: "Identify unknowns requiring dedicated spikes and define spike scope and decision criteria for each."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What unknowns require dedicated spikes before committing to an approach?"
        - "What is the spike scope and decision criteria for each?"
    - id: "risk-mitigation-plan"
      title: "Risk Mitigation Plan"
      intent: "Define the overall risk mitigation approach and how risks are reviewed and escalated."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What is the overall risk mitigation approach? Avoid, transfer, mitigate, accept?"
        - "How are risks reviewed and escalated?"
