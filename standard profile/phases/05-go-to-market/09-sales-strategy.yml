document:
  id: "09-sales-strategy"
  title: "Sales Strategy"
  phase: "05-go-to-market"
  status: "not_started"
  order: 9
  type: "sales_strategy"
  purpose: "Define whether and how to sell actively, including motion type, qualification, process, and assets."
  centralQuestion: "Will the product be self-serve, sales-led, product-led, founder-led, or hybrid?"
  outputs:
    canonical:
      format: "markdown"
      path: "05-go-to-market/09-sales-strategy.md"
      purpose: "Sales strategy document with motion type, qualification, process, and assets."
  dependsOn: []
  feeds: []
  completionCriteria:
    - "The central question is directly answered."
    - "All required sections contain substantive content."
  qualityChecks:
    - "Avoid vague claims."
    - "Prefer decision-useful statements."
    - "Remove content that belongs to another phase."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with upstream documents."
  sections:
    - id: "sales-motion"
      title: "Sales Motion"
      intent: "Identify the primary sales motion and its justification."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What is the primary sales motion?"
        - "Options: Self-Serve, Product-Led, Founder-Led, Sales-Led, Hybrid?"
    - id: "selfserve-sales"
      title: "Self-Serve Sales"
      intent: "Define self-serve checkout flow and what requires no human interaction."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What parts of the purchase can be completed without human interaction?"
        - "What is the self-serve checkout flow?"
    - id: "founder-led-sales"
      title: "Founder-Led Sales"
      intent: "Define the founder's role in sales and hand-off timeline."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What role does the founder play in sales?"
        - "How long will founder-led sales continue before handing off?"
    - id: "sales-led-motion"
      title: "Sales-Led Motion"
      intent: "Define the sales process and target cycle length for a sales team."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "If a sales team is involved, what is the sales process?"
        - "What is the target sales cycle length?"
    - id: "lead-qualification"
      title: "Lead Qualification"
      intent: "Define lead qualification criteria and scoring model."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What criteria qualify a lead?"
        - "What is the lead scoring model?"
    - id: "sales-process"
      title: "Sales Process"
      intent: "Map stages from lead to close with movement triggers."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What are the stages from lead to close?"
        - "What triggers movement between stages?"
    - id: "objection-handling"
      title: "Objection Handling"
      intent: "List common sales objections and standard responses."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What are the most common sales objections?"
        - "What are the standard responses?"
    - id: "demo-strategy"
      title: "Demo Strategy"
      intent: "Define whether a demo is needed, and the standard flow and narrative."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "Is a demo required to close?"
        - "What is the standard demo flow and narrative?"
    - id: "sales-assets"
      title: "Sales Assets"
      intent: "List materials supporting the sales process."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What materials support the sales process?"
        - "Examples: One-pager, pitch deck, case studies, ROI calculator?"
    - id: "sales-risks"
      title: "Sales Risks"
      intent: "Identify what could prevent the sales motion from working and contingency plans."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What could prevent the sales motion from working?"
        - "What is the contingency if conversion is too low?"
