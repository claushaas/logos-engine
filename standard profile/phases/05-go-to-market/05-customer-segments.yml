document:
  id: "05-customer-segments"
  title: "Customer Segments"
  phase: "05-go-to-market"
  status: "not_started"
  order: 5
  type: "customer_segments"
  purpose: "Refine the audience for acquisition, distinguishing users, payers, buyers, decision makers, influencers, and blockers."
  centralQuestion: "Who uses, who pays, who decides, who influences, who blocks?"
  outputs:
    canonical:
      format: "markdown"
      path: "05-go-to-market/05-customer-segments.md"
      purpose: "Customer segments document with roles, prioritisation, and exclusions."
  dependsOn: []
  feeds: []
  completionCriteria:
    - "The central question is directly answered."
    - "All required sections contain substantive content."
  qualityChecks:
    - "Avoid vague claims."
    - "Prefer decision-useful statements."
    - "Remove content that belongs to another phase."
  generationRules:
    - "Use concise but complete prose."
    - "Surface unresolved questions explicitly."
  reviewRules:
    - "Check whether each section answers its intended question."
    - "Flag contradictions with upstream documents."
  sections:
    - id: "segment-overview"
      title: "Segment Overview"
      intent: "Map the total addressable audience structure and segment relationships."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What is the total addressable audience structure?"
        - "How do segments relate to each other?"
    - id: "primary-segment"
      title: "Primary Segment"
      intent: "Identify the highest-priority beachhead segment and its rationale."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "Who is the primary segment?"
        - "What makes them the highest-priority beachhead?"
    - id: "secondary-segments"
      title: "Secondary Segments"
      intent: "List segments targeted after the primary and expansion triggers."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What segments will be targeted after the primary?"
        - "What triggers expansion into each?"
    - id: "early-adopters"
      title: "Early Adopters"
      intent: "Profile likely early adopters and observable identification traits."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "Who are the likely early adopters?"
        - "What observable trait or behaviour identifies them?"
    - id: "buyers"
      title: "Buyers"
      intent: "Identify who pays and their procurement process."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "Who pays for the product?"
        - "What is their procurement process?"
    - id: "users"
      title: "Users"
      intent: "Identify day-to-day users and their primary job to be done."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "Who uses the product day to day?"
        - "What is their primary job to be done?"
    - id: "decision-makers"
      title: "Decision Makers"
      intent: "Identify who decides on adoption and their criteria."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "Who decides whether to adopt the product?"
        - "What criteria do they use?"
    - id: "influencers"
      title: "Influencers"
      intent: "Identify who influences the adoption decision and how to reach them."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "Who influences the adoption decision without authority?"
        - "What channels reach them?"
    - id: "segment-prioritization"
      title: "Segment Prioritization"
      intent: "Rank segments by priority with rationale."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What is the ranked order of segment priority?"
        - "What is the rationale for the ordering?"
    - id: "excluded-segments"
      title: "Excluded Segments"
      intent: "List segments explicitly out of scope and why."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "Which segments are explicitly out of scope?"
        - "Why exclude them at this stage?"
    - id: "segment-risks"
      title: "Segment Risks"
      intent: "Surface what could make the chosen segment unattractive."
      required: true
      outputGuidance: []
      qualityChecks: []
      questions:
        - "What could make the chosen segment unattractive?"
        - "What would signal the segment is wrong?"
